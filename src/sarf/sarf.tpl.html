<style>
@font-face{font-family:"DarsNaskh";src:url(naskh.woff) format("woff");font-display:swap}
:root{--ok:#15803d;--oks:rgba(21,128,61,.12);--bad:#b42318;--bads:rgba(180,35,24,.10)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.sw{max-width:560px;margin:0 auto;padding:12px 16px 90px}
.ar{font-family:"DarsNaskh","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;direction:rtl;unicode-bidi:isolate}
.top{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.top a.bk{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:var(--cd);border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-size:22px;flex-shrink:0}
.top .tt{flex:1;min-width:0}
.top h1{margin:0;font-size:20px;line-height:1.25}
.top p{margin:0;font-size:13px;color:var(--mu)}
.hero{background:linear-gradient(135deg,var(--em1,#13865a),var(--em2,#0c5e3f));color:#fff;border-radius:18px;padding:16px 16px 14px;margin-bottom:14px}
.hero .ar{font-size:30px;line-height:1.6;display:block}
.hero small{opacity:.85;font-size:13px}
.sec{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--ac);margin:18px 2px 8px;text-transform:uppercase}
.it{display:flex;align-items:center;gap:12px;background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:10px;text-decoration:none;color:inherit;box-shadow:var(--sh)}
.it .nb{width:46px;height:46px;border-radius:12px;background:var(--tint);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;text-align:center;line-height:1.1}
.it .md{flex:1;min-width:0}
.it .md .ar{font-size:22px;line-height:1.5;display:block;text-align:right}
.it .md small{color:var(--mu);font-size:13px;display:block}
.it.lk{opacity:.5;pointer-events:none}
.it .pg{font-size:12px;font-weight:700;color:var(--ac)}
/* tabs */
.tbs{display:flex;gap:6px;overflow-x:auto;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;margin:0 -2px;scrollbar-width:none}
.tbs::-webkit-scrollbar{display:none}
.tbs button{flex:0 0 auto;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600}
.tbs button.on{background:var(--ac);border-color:var(--ac);color:var(--ai,#fff)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh)}
.card h3{margin:0 0 6px;font-size:17px}
.card p{margin:6px 0}
.card .ar{font-size:1.25em}
.verse{background:var(--tint);border-radius:12px;padding:10px 14px;font-style:italic;text-align:center;margin:8px 0}
.ms{width:100%;border-collapse:collapse;margin:6px 0}
.ms td{padding:6px 4px;border-bottom:1px dashed var(--bd);font-size:15px}
.ms td.ar{font-size:21px;text-align:right}
.l12{counter-reset:n;list-style:none;padding:0;margin:4px 0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.l12 li{background:var(--tint);border-radius:10px;padding:6px 10px;font-size:14px;counter-increment:n}
.l12 li::before{content:counter(n) ". ";font-weight:700;color:var(--ac)}
/* model */
.mdl .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--tint);color:var(--ac);white-space:nowrap}
.mdl .big{font-size:28px;line-height:1.6;text-align:right}
.mdl .mn{color:var(--mu);font-size:14px;text-align:right}
.g12{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.g12 div{cursor:pointer;-webkit-tap-highlight-color:transparent;border:1px solid var(--bd);border-radius:10px;padding:5px 8px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.g12 small{color:var(--mu);font-size:11.5px;line-height:1.2}
.g12 .ar{font-size:19px;white-space:nowrap}.g12 div:active{background:var(--tint);border-color:var(--ac)}
.izoh{border-left:3px solid var(--ac);padding:2px 0 2px 10px;margin:8px 0;font-size:15px}
.izoh p{margin:4px 0}
.izoh .ar{font-size:1.2em}
.sbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;background:var(--ac);color:var(--ai,#fff);font:inherit;font-weight:700;padding:10px 16px;font-size:15px;cursor:pointer}
.sbtn.ln{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.sbtn.full{width:100%}
/* verbs */
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fl button{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px}
.fl button.on{background:var(--tint);border-color:var(--ac);color:var(--ac);font-weight:700}
.vb{display:flex;align-items:center;gap:10px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:9px 12px;margin-bottom:8px;cursor:pointer}
.vb .ar{font-size:21px;line-height:1.5}
.vb .fm{flex:1;text-align:right}
.vb .mn{font-size:13.5px;color:var(--mu);flex:0 0 38%}
.vb .tg{font-size:11px;color:var(--ac);font-weight:700;display:block}
/* sheet */
.sh{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center}
.sh.on{display:flex}
.sh .bx{background:var(--bg);width:100%;max-width:560px;max-height:88vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sh .bh{padding:14px 16px 6px;display:flex;align-items:flex-start;gap:10px}
.sh .bh .ar{font-size:26px;line-height:1.5}
.sh .bh .tt{flex:1}
.sh .bh small{color:var(--mu);font-size:13px;display:block}
.sh .x{border:0;background:var(--cd);border:1px solid var(--bd);width:36px;height:36px;border-radius:10px;font-size:18px;color:var(--tx)}
.cats{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:0 0 auto;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px}
.cats button.on{background:var(--ac);color:var(--ai,#fff);border-color:var(--ac)}
.sh .bd{overflow-y:auto;padding:0 16px 24px}
.tb{width:100%;border-collapse:collapse;background:var(--cd);border-radius:14px;overflow:hidden;border:1px solid var(--bd)}
.tb td{padding:7px 10px;border-bottom:1px solid var(--bd)}
.tb tr:last-child td{border-bottom:0}
.tb td.f{font-size:23px;text-align:right;font-family:"DarsNaskh","Noto Naskh Arabic",serif;direction:rtl;white-space:nowrap}
.tb td.p{font-size:15px;color:var(--ac);font-family:"DarsNaskh","Noto Naskh Arabic",serif;direction:rtl;text-align:center;width:64px}
.tb td.s{font-size:12.5px;color:var(--mu);width:34%}
.tb tr.gp td{background:var(--tint);font-size:12px;font-weight:700;color:var(--ac);padding:4px 10px}
.note{font-size:13.5px;color:var(--mu);margin:8px 2px}
/* quiz */
.q .pr{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:12px}
.q .pr i{display:block;height:100%;background:var(--ac);transition:width .3s}
.q .qt{font-size:14px;color:var(--mu);margin-bottom:4px}
.q .qa{font-size:30px;text-align:center;line-height:1.7;margin:4px 0 2px}
.q .qs{text-align:center;font-size:14px;color:var(--mu);margin-bottom:12px}
.q .op{display:grid;gap:8px}
.q .op button{border:1.5px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:14px;padding:11px 12px;font:inherit;font-size:16px;text-align:center}
.q .op button .ar{font-size:23px}
.q .op button.ok{border-color:var(--ok);background:var(--oks)}
.q .op button.no{border-color:var(--bad);background:var(--bads)}
.q .ex{margin-top:10px;font-size:14.5px;padding:8px 12px;border-radius:12px;background:var(--tint)}
.q .ex .ar{font-size:1.2em}
.res{text-align:center}
.res .sc{font-size:46px;font-weight:800;color:var(--ac)}
i.r{font-style:normal;color:#c2410c}
.srch input{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);margin-bottom:10px}
.it.rv{border-color:#c2410c}.it.rv .nb{background:rgba(194,65,12,.12);color:#c2410c;font-size:22px}
.acts,.cats,.bh{flex-shrink:0}
.acts{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none}
.acts button{flex:0 0 auto;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;font-weight:600}
.acts button.on{background:var(--tint);border-color:var(--ac);color:var(--ac)}
.tb tr[data-i]{cursor:pointer;-webkit-tap-highlight-color:transparent}
.tb tr.sel td,.tb tr.pl td{background:var(--tint)}
.tb td.hid{color:transparent;text-shadow:0 0 14px rgba(120,120,120,.55)}.tb td.hid i.r{color:transparent}
.tb tr.dt td{background:var(--tint);padding:8px 10px 10px}
.prt{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.prt span{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:2px 10px;text-align:center}
.prt span.m{border-color:#c2410c}
.prt small{display:block;font-size:10.5px;color:var(--mu);line-height:1.2}
.prt .ar{font-size:21px}
.oth small{display:block;font-size:12px;color:var(--mu);margin:2px 0 4px}
.oth div{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--bd);padding:3px 2px;font-size:12.5px;color:var(--mu)}
.oth .ar{font-size:19px;color:var(--tx)}
.tb.cmp td.f{font-size:20px}.tb td.df{background:rgba(234,179,8,.18)}
.tb tr.cmh td{font-size:13px;background:var(--tint)}

/* --- fe'llar (turlar bilan birga) --- */
.jmp{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 6px;padding:2px 16px 8px}
.jmp::-webkit-scrollbar{display:none}
.jmp button{flex:0 0 auto;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:999px;padding:6px 12px;font:inherit;font-size:13.5px;font-weight:600}
.jmp button small{color:var(--mu);font-weight:500;margin-left:2px}
.grp{background:var(--cd);border:1px solid var(--bd);border-radius:18px;margin:0 0 14px;overflow:hidden;box-shadow:var(--sh);scroll-margin-top:70px}
.gh{padding:14px 16px 10px;background:linear-gradient(180deg,var(--tint),transparent)}
.gt{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px}
.gn{font-size:18px;font-weight:800;color:var(--ac);letter-spacing:.01em}
.gc{font-size:12px;color:var(--mu);font-weight:600}
.gi{font-size:14.5px;line-height:1.6;color:var(--tx)}
.gi p{margin:4px 0}
.gi .ar{font-size:1.2em}
.more{border:0;background:none;color:var(--ac);font:inherit;font-size:13.5px;font-weight:700;padding:2px 0;cursor:pointer}
.vls{border-top:1px solid var(--bd)}
.vr{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--bd);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s}
.vr:first-child{border-top:0}
.vr:active{background:var(--tint)}
.vr .vm{flex:1;min-width:0;font-size:14.5px;line-height:1.35;color:var(--mu)}
.vr .vm b{font-weight:600;color:var(--tx)}
.vr .va{font-size:23px;line-height:1.5;white-space:nowrap}
.vr .va span{color:var(--mu);font-size:.82em}
.vr.nm{background:linear-gradient(90deg,rgba(201,148,52,.12),rgba(201,148,52,.03))}
.nb2,.lz{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:800;letter-spacing:.04em;border-radius:6px;padding:1px 6px;vertical-align:1px}
.nb2{background:rgba(201,148,52,.18);color:var(--au,#8a6418)}
.lz{background:var(--tint);color:var(--mu);font-weight:700}
.note.c{text-align:center}
/* jadval oynasi sarlavhasi */
.grab{width:42px;height:5px;border-radius:5px;background:var(--bd);margin:8px auto 0;flex-shrink:0}
.sh .bh{padding:8px 16px 8px}
.hv{font-size:27px;line-height:1.55;text-align:right}
.hm{font-size:14px;color:var(--tx);text-align:right;margin-top:-2px}
.hb{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.hb span{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--tint);color:var(--ac)}
.hb span.o{background:rgba(201,148,52,.18);color:var(--au,#8a6418)}
.sh .x{flex-shrink:0}
</style>
</head>
<body>
<div class="sw" id="app"></div>
<div class="sh" id="sh"><div class="bx" id="sbx"></div></div>
<script>
var DATA=__DATA__;
var SIGA=DATA.siga,LS=DATA.lessons;
var CAT=[['mm','1 · Мозий'],['rm','2 · Музореъ'],['foil','3 · Исми фоил'],['maful','4 · Исми мафъул'],['jahd','5 · Жаҳд'],['nafy','6 · Нафий'],
 ['amr','7 · Амри ҳозир'],['ag','8 · Амри ғоиб'],['nahy','9 · Наҳий'],['zm','10 · Замон, макон'],['ol','11 · Исми олат'],['tf','12 · Исми тафзил'],
 ['mj','Мозий мажҳул'],['rj','Музореъ мажҳул'],['agj','Амри ғоиб мажҳул'],['nahyj','Наҳий мажҳул']];
var CFULL={mm:'Феъли мозий',rm:'Феъли музореъ',foil:'Исми фоил',maful:'Исми мафъул',jahd:'Феъли жаҳд',nafy:'Феъли нафий',amr:'Амри ҳозир',ag:'Амри ғоиб',nahy:'Наҳий',zm:'Исми замон ва макон',ol:'Исми олат',tf:'Исми тафзил',mj:'Мозий мажҳул',rj:'Музореъ мажҳул',agj:'Амри ғоиб мажҳул',nahyj:'Наҳий мажҳул'};
var CN=CFULL;
var K12=['mm','rm','foil','maful','jahd','nafy','amr','ag','nahy','zm','ol','tf'];
var MAJ={mj:1,rj:1,maful:1,agj:1,nahyj:1};
var ISMS=['муз. вохид','муз. тасния','муз. жамъ','муан. вохида','муан. тасния','муан. жамъ'],ZL=['вохид','тасния','жамъ'];
var ROWS={amr:[6,7,8,9,10,11],ag:[0,1,2,3,4,5,12,13]};
var L12=['Феъли мозий','Феъли музореъ','Исми фоил','Исми мафъул','Феъли жаҳд','Феъли нафий','Амри ҳозир','Амри ғоиб','Наҳий','Исми замон ва макон','Исми олат','Исми тафзил'];
var ST={};try{ST=JSON.parse(localStorage.getItem('sarf-holat')||'{}')||{}}catch(e){}
function save(){try{localStorage.setItem('sarf-holat',JSON.stringify(ST))}catch(e){}}
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function A(s){return '<span class="ar">'+s+'</span>'}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
/* o'zak harflari: shakllarda 1,2,3 raqamlari bilan belgilangan */
function P(f,r){return f.replace(/[123]/g,function(d){return r[d-1]})}
function C(f,r){return P(f,r)}
function bare(s){return String(s).replace(/[ً-ْٰـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').trim()}
function allV(){var a=[];LS.forEach(function(L){L.models.forEach(function(m,i){a.push({L:L,v:m,id:L.id+'/m'+i})});L.verbs.forEach(function(v,i){a.push({L:L,v:v,id:L.id+'/v'+i})})});return a}

/* ---------- ovoz ---------- */
var AU=null,AUt=0,TTS=null;
try{if(window.speechSynthesis&&typeof SpeechSynthesisUtterance!='undefined')TTS=speechSynthesis}catch(e){}
function arVoice(){if(!TTS)return null;var vs=TTS.getVoices()||[];for(var i=0;i<vs.length;i++)if(/^ar/i.test(vs[i].lang))return vs[i];return null}
if(TTS)try{TTS.getVoices();TTS.onvoiceschanged=function(){}}catch(e){}
function audioOf(v,cat,i){var a=v.au&&v.au.s[cat];return a&&a[i]?a[i]:null}
function canSay(v,cat){var a=v.au&&v.au.s[cat];return (a&&a.length==v.T[cat].length&&a.every(Boolean))||!!arVoice()}
var AUF='';
function say(v,cat,i,done){
  stopSay();var seg=audioOf(v,cat,i),f=P(v.T[cat][i],v.r||'');
  if(seg){if(!AU||AUF!=v.au.f){if(AU)AU.pause();AU=new Audio(v.au.f);AUF=v.au.f}
    AU.currentTime=seg[0];var p=AU.play();if(p&&p.catch)p.catch(function(){});
    clearTimeout(AUt);AUt=setTimeout(function(){AU.pause();done&&done()},Math.max(250,(seg[1]-seg[0])*1000+120));return}
  var vo=arVoice();if(!vo){done&&setTimeout(done,600);return}
  var u=new SpeechSynthesisUtterance(f);u.voice=vo;u.lang=vo.lang;u.rate=.8;u.onend=function(){done&&done()};TTS.speak(u);
}
function stopSay(){clearTimeout(AUt);if(AU)AU.pause();try{TTS&&TTS.cancel()}catch(e){}}

/* ---------- bosh sahifa ---------- */
function home(){
  var h='<div class="top"><a class="bk" href="./">‹</a><div class="tt"><h1>Сарф</h1><p>Феъл боблари · тусланиш · машқ</p></div></div>';
  h+='<div class="srch"><input id="q" type="search" placeholder="Феъл қидириш: باع، يضرب، сотмоқ…" autocomplete="off"></div><div id="qr"></div>';
  h+='<div class="hero"><small>Феъллар 4 босқич</small><span class="ar">ثُلَاثِيٌّ مُجَرَّدٌ · ثُلَاثِيٌّ مَزِيدٌ · رُبَاعِيٌّ مُجَرَّدٌ · رُبَاعِيٌّ مَزِيدٌ</span></div>';
  var due=(ST.err||[]).length;
  if(due)h+='<a class="it rv" href="#'+LS[0].id+'/m"><div class="nb">↻</div><div class="md"><b>Такрор</b><small>Хато қилинган '+due+' та шакл сизни кутяпти</small></div></a>';
  DATA.plan.forEach(function(g,gi){
    h+='<div class="sec">'+g[0]+'</div>';
    if(gi==0)LS.forEach(function(L){var p=ST[L.id]||{};
      h+='<a class="it" href="#'+L.id+'"><div class="nb">'+L.n.replace('-','-<br>')+'</div><div class="md">'+A(L.ar)+'<small>'+A(L.m)+'</small>'+
        (p.best!=null?'<span class="pg">Машқ: '+p.best+'%</span>':'')+'</div></a>'});
    g[1].forEach(function(x){h+='<div class="it lk"><div class="nb">'+x[0].replace('-','-<br>')+'</div><div class="md">'+A(x[1])+'<small>'+(x[2]?A(x[2])+' · ':'')+'тез орада</small></div></div>'});
  });
  $('#app').innerHTML=h;
  $('#q').oninput=function(){search(this.value,$('#qr'))};
}
function search(q,el){
  q=q.trim();if(!q){el.innerHTML='';return}
  var b=bare(q),lo=q.toLowerCase(),res=[];
  allV().forEach(function(x){var v=x.v,r=v.r,hit=0;
    if(/[؀-ۿ]/.test(q)){for(var c in v.T){if(v.T[c].some(function(f){return bare(P(f,r))==b})){hit=2;break}}
      if(!hit&&(bare(P(v.T.mm[0],r)).indexOf(b)==0||bare(v.ms||'').indexOf(b)==0))hit=1}

var Q=null;

function qBuild(vi,cat,k){
  var v=CUR.verbs[vi],F=v.T[cat],c=F[k],d=shuffle(F.filter(function(x,i,a){return x!=c&&a.indexOf(x)==i})).slice(0,3);if(d.length<3)return null;

          x:A(SIGA[sk][0])+' → '+A(P(c,v.r)),e:[vi,cat,k]};
}
function mkQ(){
  var V=CUR.verbs,out=[],E=errs().slice(0,4);
  E.forEach(function(e){var q=qBuild(e[0],e[1],e[2]);if(q){q.rv=1;out.push(q)}});
  var types=shuffle(['siga','build','tur','mu','siga','build','amr','siga','build','tur']).slice(0,10-out.length);
  types.forEach(function(ty){
    for(var tries=0;tries<30;tries++){
      var vi=Math.floor(Math.random()*V.length),v=V[vi],q=null;
      if(ty=='siga'){var cat=pick(['mm','rm']),k=Math.floor(Math.random()*14);if(!uniq(v.T[cat],k))continue;
        var o=shuffle(SIGA.map(function(s,i){return i}).filter(function(i){return i!=k&&SIGA[i][0]!=SIGA[k][0]})).slice(0,3).concat([k]);
        q={t:'Бу қайси сийға? ('+(cat=='mm'?'мозий':'музореъ')+')',a:P(v.T[cat][k],v.r),s:P(v.T.mm[0],v.r)+' – '+v.mn,o:shuffle(o).map(function(i){return {h:A(SIGA[i][0])+' · '+SIGA[i][1],ok:i==k}}),
           x:A(P(v.T[cat][k],v.r))+' — '+SIGA[k][1]+' ('+A(SIGA[k][0])+')',e:[vi,cat,k]}}
      else if(ty=='build'){var cat=pick(['mm','rm','jahd','amr']),n=v.T[cat].length,k=Math.floor(Math.random()*n);if(v.l&&MAJ[cat])continue;q=qBuild(vi,cat,k)}
      else if(ty=='tur'){var ts=[];CUR.models.forEach(function(m){if(m.tn!=v.tn)ts.push(m.tn)});
        q={t:'Бу феъл қайси турдан?',a:P(v.T.mm[0],v.r)+' – '+P(v.T.rm[0],v.r),s:v.mn,o:shuffle(shuffle(ts).slice(0,3).concat([v.tn])).map(function(x){return {h:x,ok:x==v.tn}}),x:A(P(v.T.mm[0],v.r))+' — '+v.tn}}
      else if(ty=='mu'){if(!v.alt)continue;var c=P(v.T.rm[0],v.r);
        q={t:'Музореъи қайси? (1-боб)',a:P(v.T.mm[0],v.r),s:v.mn,o:shuffle([v.T.rm[0]].concat(v.alt)).map(function(x){return {h:A(P(x,v.r)),ok:x==v.T.rm[0]}}),x:'1-бобда музореънинг «айн»и касрали: '+A(c)}}
      else if(ty=='amr'){if(!v.alta)continue;var c=v.T.amr[0];
        q={t:'Амри ҳозир (мухотаб) қайси?',a:P(v.T.mm[0],v.r)+' – '+P(v.T.rm[0],v.r),s:v.mn,o:shuffle([c].concat(v.alta)).map(function(x){return {h:A(P(x,v.r)),ok:x==c}}),x:'Музореъда «айн» касрали бўлгани учун амрнинг ҳамзаси ҳам касрали: '+A(P(c,v.r))}}
      if(q){out.push(q);break}

}

  if(p.best==null||pc>p.best)p.best=pc;save();
  el.innerHTML='<div class="card res"><div class="sc">'+pc+'%</div><p>'+Q.ok+' / '+Q.qs.length+' тўғри</p>'+
    (Q.mis.length?'<div style="text-align:left">'+Q.mis.map(function(q){return '<div class="izoh"><p>'+q.x+'</p></div>'}).join('')+'<p class="note">Хато қилинганлари кейинги машқларда яна сўралади.</p></div>':'<p>Барака топинг! Ҳаммаси тўғри.</p>')+
    '<button class="sbtn full" id="qa">Яна бир марта</button></div>';
  $('#qa').onclick=function(){Q={qs:mkQ(),i:0,ok:0,mis:[]};qshow(el)};
}

function route(){closeSh();var h=decodeURIComponent(location.hash.slice(1));if(/tgWebApp/.test(h))h='';var p=h.split('/');if(p[0])lesson(p[0],p[1]);else home();window.scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script>
