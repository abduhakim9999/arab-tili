лагол в раф'", "насб ёки жазм қилувчи йўқлиги учун": "потому что нет слова, ставящего в насб или джазм", "савол ҳарфидан кейин келгани учун": "потому что стоит после вопросительной частицы", "феъл доим раф бўлгани учун": "потому что глагол всегда в раф'", "зарф бўлгани учун": "потому что это зарф", "тамйиз бўлгани учун": "потому что это тамйиз", "мубтадо ва хабар": "мубтада и хабар", "исмий гап икки қисмдан иборат: мубтадо (кимдан/нимадан гап кетяпти) ва хабар (у ҳақида нима дейиляпти). Иккаласи ҳам раф қилинади: ◌": "именное предложение состоит из двух частей: мубтада (о ком или о чём идёт речь) и хабар (что о нём сообщается). Оба стоят в раф' (у имён это именительный падеж): ◌", "мубтадо одатда маърифа бўлади (◌ билан, алам, замир ёки изофада), хабар кўпинча накра бўлади": "мубтада обычно определённое — ма'рифа (с ◌, имя собственное, местоимение или в идафе), а хабар чаще неопределённый — накира", "хабар уч хил бўлади: муфрад (◌), жумла (◌) ва шибҳи жумла, яъни жар ҳарфи ва мажрур ёки зарф (◌)": "хабар бывает трёх видов: муфрад — одно слово (◌), джумля — предложение (◌) и шибх джумля, то есть частица джарр с маджруром или зарф (◌)", "шибҳи жумла хабар олдинга ўтиши мумкин; бу «фақат» маъносини беради: ◌ — «қайта тирилиш фақат Унинг ҳузурига». Мубтадо накра бўлса, хабарни олдинга ўтказиш вожиб: ◌": "хабар — шибх джумля может выйти вперёд; это даёт значение «только»: ◌ — «воскресение — только к Нему». Если мубтада — накира, хабар обязательно ставится впереди: ◌", "кўпчилик наҳвчилар фикрича мубтадони ибтидо (маънавий омил), хабарни эса мубтадо раф қилади": "по мнению большинства грамматистов, мубтада ставит в раф' ибтида (смысловой фактор), а хабар ставит в раф' само мубтада", "сарлавҳалардаги исмлар хабари ёки мубтадоси маҳзуф деб таркиб қилинади: (◌) ◌": "имена в заголовках разбирают так, будто их хабар или мубтада опущены (махзуф): (◌) ◌", "жар ҳарфлари": "частицы джарр (предлоги)", "ўзидан кейинги исмни жар қилади: ◌": "ставят следующее за ними имя в джарр (родительный падеж): ◌", "◌ ва ◌ замирга уланганда алиф ◌ га айланади: ◌": "Когда ◌ и ◌ присоединяются к местоимению, алиф превращается в ◌: ◌", "◌ замир билан фатҳа олади: ◌ (фақат ◌ билан: ◌)": "◌ с местоимением получает фатху: ◌ (только с ◌ остаётся касра: ◌)", "◌ + ◌: алиф ёзилмайди — ◌": "◌ + ◌: алиф не пишется — ◌", "жар ҳарфи ва мажрур бирор феълга ёки феълга ўхшаш сўзга боғланади (мутааллиқ); бундай сўз бўлмаса — маҳзуф (ҳазф қилинган) сўзга (хабар, сифат ёки ҳол бўлиб)": "частица джарр с маджруром связаны (мута'аллик) с глаголом или со словом, подобным глаголу; если такого слова нет — с опущенным (махзуф) словом (в роли хабара, сыфа или халя)", "муттасил замирлар": "слитные местоимения", "замирлар доим мабний; ўрни қаерга уланганига қараб": "местоимения всегда мабни; их место в и'рабе зависит от того, к чему они присоединены", "исмга — музофун илайҳ, жар ўринда: ◌": "к имени — мудаф илейхи, на месте джарра: ◌", "феълга — мафъулун биҳ, насб ўринда: ◌ (ёки бориз фоил замири: ◌)": "к глаголу — маф'уль бихи, на месте насба: ◌ (или явное местоимение-фа'иль: ◌)", "жар ҳарфига — мажрур, жар ўринда: ◌": "к частице джарр — маджрур, на месте джарра: ◌", "◌ синглисига — унинг исми, насб ўринда: ◌": "к «сестре» ◌ — её исм, на месте насба: ◌", "◌ — касра ёки ◌ дан кейин касра олади: ◌": "◌ — после касры или ◌ получают касру: ◌", "музоф танвин ва ◌ олмайди: ◌": "мудаф не принимает ни танвин, ни ◌: ◌", "музофун илайҳ доим жар қилинади": "мудаф илейхи всегда стоит в джарре (родительный падеж)", "музофнинг ўз эъроби гапдаги ўрнига қараб (мубтадо, фоил, зарф…)": "и'раб самого мудафа зависит от его места в предложении (мубтада, фа'иль, зарф…)", "савол сўзлари": "вопросительные слова", "ҳарфлар: ◌ ва ҳамза (◌). ◌ нинг жавоби — ◌ ёки ◌": "частицы: ◌ и хамза (◌). Ответ на ◌ — ◌ или ◌", "исмлар: ◌ — гапда ўрни бор (мубтадо, хабар, ҳол, мафъулун биҳ…)": "имена: ◌ — у них есть место в предложении (мубтада, хабар, халь, маф'уль бихи…)", "савол исмлари мабний, фақат ◌ мўъроб": "вопросител var QT={"MUBXAB": ["⁣Мубтада и хабар⁣", ["⁣Именное предложение состоит из двух частей: мубтада (о ком или о чём идёт речь) и хабар (что о нём сообщается). Оба стоят в раф': ⁣الْمَالُ كَثِيرٌ⁣.⁣", "⁣⁣**⁣1. Виды хабара.⁣**⁣ Муфрад (одно слово): ⁣كَثِيرٌ⁣; джумля (предложение): ⁣بِلَادُنَا تَحْتَاجُ إِلَيْنَا⁣; шибх джумля (джарр с маджруром или зарф): ⁣فِي الْفَصْلِ⁣. Шибх джумля по сути — мута'аллик к опущенному хабару ⁣كَائِنٌ⁣.⁣", "⁣⁣**⁣2. Условие.⁣**⁣ Мубтада обычно ма'рифа (с ⁣اَلْ⁣, имя собственное, местоимение или в идафе), хабар чаще накира. В вопросе хабар может быть ма'рифой: ⁣مَنْ هَذَا؟⁣⁣", "⁣⁣**⁣3. Согласование.⁣**⁣ Хабар-муфрад согласуется с мубтадой в числе и роде: ⁣الطَّالِبُ مُجْتَهِدٌ، الطَّالِبَةُ مُجْتَهِدَةٌ⁣. В хабаре-джумле есть местоимение, возвращающееся к мубтаде: ⁣بِلَادُنَا تَحْتَاجُ⁣ — скрытое ⁣هِيَ⁣.⁣", "⁣⁣**⁣4. Порядок.⁣**⁣ Хабар — шибх джумля может выйти вперёд (хабар мукаддам), это даёт значение «только»: ⁣وَإِلَيْهِ النُّشُورُ⁣. Если мубтада — накира, выдвижение хабара обязательно: ⁣فِي الْبَيْتِ رَجُلٌ⁣.⁣", "⁣⁣**⁣5. Опущение.⁣**⁣ Мубтада или хабар могут быть опущены; так разбираются заголовки: ⁣(هَذَا) الدَّرْسُ الثَّانِي⁣.⁣", "⁣⁣**⁣6. Второй хабар.⁣**⁣ У одной мубтады может быть два хабара: ⁣سَعْدٌ فِي الْحَمَّامِ يَتَوَضَّأُ⁣ — предложение — второй хабар, на месте раф'.⁣"]], "LAYSA": ["لَيْسَ — كَانَ нинг синглиси", ["لَيْسَ — كَانَ нинг синглиси, «эмас» маъносида: мубтадо унинг исми бўлиб раф, хабар унинг хабари бўлиб насб қилинади: السَّفَرُ حَرَامٌ → لَيْسَ السَّفَرُ حَرَامًا.", "**1. Маъноси.** Инкор; кўпинча ҳозирги замонни инкор қилади.", "**2. Жомид феъл.** Фақат мозий шакли бор — музорий ва амри йўқ.", "**3. Хабарида зоида بِ.** لَيْسَ السَّفَرُ بِحَرَامٍ — حَرَامٍ лафзан мажрур, насб ўринда."]], "LAKINNA": ["لَكِنَّ — إِنَّ нинг синглиси", ["لَكِنَّ — إِنَّ нинг синглиси, истидрок учун («лекин»: олдинги гапдан келиб чиқадиган фикрни тўғрилайди): исмини насб, хабарини раф қилади: الْبَيْتُ صَغِيرٌ لَكِنَّهُ جَمِيلٌ.", "**1. Исми замир бўлса.** Ҳарфга уланади: لَكِنَّكَ، لَكِنَّهُ.", "**2. Ташдидсиз لَكِنْ.** Амал қилмайди, ундан кейин оддий гап келади: وَلَكِنْ هَلْ فَكَّرْتَ…", "**3. Синглилари.** إِنَّ، أَنَّ (таъкид)، كَأَنَّ (ўхшатиш)، لَيْتَ (орзу)، لَعَلَّ (умид)."]], "NASB": ["Музорийни насб қилувчи ҳарфлар", ["Музорийни насб қилувчи ҳарфлар: أَنْ، لَنْ، كَيْ، إِذَنْ; насб аломати — фатҳа: لَنْ أَذْهَبَ.", "**1. لَنْ.** Келаси замонни инкор қилади: لَنْ أَذْهَبَ «бормайман».", "**2. أَنْ.** Масдарий ҳарф — феъл билан бирга масдар ҳосил қилади: أَرْجُو أَنْ تَعُودَ = أَرْجُو عَوْدَتَكَ.", "**3. Афъоли хамса.** Насб аломати — ن нинг ҳазфи: لَنْ تَذْهَبُوا.", "**4. Маҳзуф أَنْ.** لِ (сабаб)، حَتَّى ва сабабият فَ сидан кейин ҳам насб қилинади: جِئْتُ لِأَتَعَلَّمَ."]], "MUDRAF": ["⁣Раф' мудари'⁣", ["⁣Глагол мудари' стоит в раф', если нет слова, ставящего его в насб или джазм; признак — дамма: ⁣أَعُودُ، تَعْمَلُ⁣.⁣", "⁣⁣**⁣1. Амсилату-ль-хамса.⁣**⁣ Признак раф' — сохранение нуна: ⁣تَعْمَلُونَ، تَعْمَلِينَ⁣.⁣", "⁣⁣**⁣2. Подразумеваемая дамма.⁣**⁣ Если на конце ⁣و⁣ или ⁣ي⁣, дамма не произносится из-за тяжести (сикль): ⁣أَرْجُو، أَمْشِي⁣; если на конце алиф — произнести невозможно (та'аззур): ⁣يَسْعَى⁣. В насб на ⁣و⁣ и ⁣ي⁣ фатха видна: ⁣لَنْ أَرْجُوَ⁣.⁣", "⁣⁣**⁣3. Тонкость.⁣**⁣ С нуном женского рода — мабни, в раф' не ставится: ⁣يَكْتُبْنَ⁣.⁣"]], "SIN": ["سَ ва سَوْفَ", ["سَ ва سَوْفَ — истиқбол ҳарфлари: музорийни келаси замонга хослайди; амал қилмайди — феъл раф қилинганича қолади: سَأَغْتَرِبُ.", "**1. Фарқи.** سَ — яқин келажак, سَوْفَ — узоқроқ келажак учун: سَأُسَافِرُ، سَوْفَ أُسَافِرُ."]], "AMR": ["⁣Мабни повелительного глагола⁣", ["⁣Повелительный глагол всегда мабни — на то, чем мудари' показывает джазм:⁣\n⁣• если конец правильный — на сукун: ⁣اُكْتُبْ⁣⁣\n⁣• если конец — слабая буква (харф ил-ля) — на её выпадение: ⁣اِمْشِ، اُدْعُ، اِسْعَ⁣⁣\n⁣• если из «пяти глаголов» (амсилату-ль-хамса) — на выпадение ⁣ن⁣: ⁣اِمْشُوا، اُكْتُبِي⁣⁣", "⁣⁣**⁣1. Фа'иль.⁣**⁣ Всегда местоимение. Одному мужчине — скрытое (мустатир) ⁣أَنْتَ⁣, обязательно скрытое: ⁣اُكْتُبْ⁣. В остальных — явное местоимение: ⁣اُكْتُبِي، اُكْتُبَا، اُكْتُبُوا، اُكْتُبْنَ⁣.⁣", "⁣⁣**⁣2. Амсилату-ль-хамса.⁣**⁣ ⁣يَفْعَلَانِ، تَفْعَلَانِ، يَفْعَلُونَ، تَفْعَلُونَ، تَفْعَلِينَ⁣ — в раф' ⁣ن⁣ сохраняется, в насб и джазм выпадает; выпадает и в повелительном: ⁣تَكْتُبُونَ⁣ → ⁣اُكْتُبُوا⁣.⁣", "⁣⁣**⁣3. Нун женского рода.⁣**⁣ Если присоединён — мабни на сукун: ⁣اُكْتُبْنَ (ن⁣ — фа'иль).⁣", "⁣⁣**⁣4. Алиф различения.⁣**⁣ ⁣ا⁣, который пишется после вава множественного числа, не читается и места в и'рабе не имеет: ⁣اِمْشُوا⁣.⁣"]], "FASIHA": ["Фасиҳа фа си", ["Фасиҳа фа си — яширин шартга далолат қилади: «шундай экан»; олдинги гапдан келиб чиқадиган натижани билдиради: فَامْشُوا فِي مَنَاكِبِهَا.", "**1. Тақдири.** إِذَا كَانَ الْأَمْرُ كَذَلِكَ فَامْشُوا — шарт ҳазф қилинган, فَ унинг жавобига киради.", "**2. Эъроби.** Ҳарф, фатҳага мабний, эъробдан унга ўрин йўқ."]], "MOZI": ["Мозий феълнинг биноси", ["Мозий феъл доим мабний; асли — фатҳага: فَكَّرَ، قَالَ.", "**1. Сукунга.** Ҳаракатли фоил замири (تُ، تَ، تِ، نَا، نَ) уланса: فَكَّرْتُ، فَكَّرْنَا.", "**2. Заммага.** Жам вови уланса: اِغْتَرَبُوا.", "**3. Тақдирий фатҳа.** Охири алиф бўлса: تَعَالَى، سَعَى."]], "TAALA": ["تَعَالَى", ["تَعَالَى — мозий феъл, фатҳага мабний; фатҳа алиф устида кўринмайди (тақдирий), сабаби — таъаззур (талаффуз имконсиз).", "**1. Сақл.** Охири و ёки ي бўлса, сабаби — оғирлик (сақл): أَرْجُو، الثَّانِي.", "**2. Ҳурмат сўзлари.** Аллоҳ номидан кейин ҳурмат учун айтилади: تَعَالَى، عَزَّ وَجَلَّ، سُبْحَانَهُ."]], "MANQUS": ["Исм манқус", ["Охири ي бўлиб, олдидаги ҳарф касрали исм: الثَّانِي، الْقَاضِي. Раф ва жарда ҳаракат тақдирий (сақл — оғирлик учун), насбда фатҳа кўринади: رَأَيْتُ الْقَاضِيَ.", "**1. Накра бўлса.** Раф ва жарда ي тушиб, танвин олади: ثَانٍ، قَاضٍ; насбда ي қолади: قَاضِيًا."]], "SIFAT": ["⁣Сыфа (на'т)⁣", ["⁣Сыфа следует за определяемым (маусуф) в четырёх вещах: и'раб, ма'рифа/накира, род и число: ⁣الدَّرْسُ الثَّانِي، اللَّهُ الْعَظِيمُ⁣.⁣", "⁣⁣**⁣1. Множественное неразумных.⁣**⁣ Сыфа стоит в единственном числе женского рода: ⁣بِلَادٍ غَرِيبَةٍ⁣.⁣", "⁣⁣**⁣2. Сыфа-предложение.⁣**⁣ Предложение после маусуфа-накиры — его сыфа: ⁣رَجُلٌ يَقْرَأُ⁣.⁣"]], "MULHAQ": ["Жам музаккар солимга мулҳақ сўзлар", ["Жамъ музаккар солимдек турланадиган сўзлар: ўнликлар (عِشْرُونَ … تِسْعُونَ)، أُولُو، أَهْلُونَ، سِنُونَ، بَنُونَ — рафда و، насб ва жарда ي: جَاءَ عِشْرُونَ، رَأَيْتُ عِشْرِينَ.", "**1. Тартиб сонлари.** الْحَادِي وَالْعِشْرُونَ … الثَّانِي وَالتِّسْعُونَ — бирлик فَاعِلٍ вазнида, ўнлик و билан атф қилинади."]], "ATF": ["⁣Частицы атфа⁣", ["⁣Ма'туф следует за предшествующим словом (ма'туф 'аляйхи) в и'рабе: ⁣عَلَى دِينِهِمْ وَثَقَافَتِهِمْ⁣.⁣", "⁣⁣**⁣1. Частицы и значения.⁣**⁣ ⁣وَ⁣ — соединение («и»); ⁣فَ⁣ — последовательность, сразу; ⁣ثُمَّ⁣ — последовательность с промежутком времени; ⁣أَوْ⁣ — «или» (выбор); ⁣أَمْ⁣ — «или» (в вопросе); ⁣بَلْ⁣ — «напротив, а»; ⁣لَا⁣ — «не».⁣", "⁣⁣**⁣2. Что присоединяется.⁣**⁣ Имя к имени, глагол к глаголу, предложение к предложению: ⁣يَأْكُلُ وَيَشْرَبُ⁣.⁣", "⁣⁣**⁣3. И'раб.⁣**⁣ Если присоединено к слову-мабни — следует за его местом. Если присоединено предложение, оно занимает место предыдущего предложения (например, ма'туф к хабару — на месте раф'); если у предыдущего предложения места нет, то нет и у него.⁣", "⁣⁣**⁣4. Тонкость.⁣**⁣ Не всякое ⁣وَ⁣ — частица атфа: ⁣وَ⁣ в начале речи — частица исти'нафа (начала), перед предложением-халем — вав халя.⁣"]], "MUTANNA": ["Тасния", ["Иккилик (тасния): рафда ا، насб ва жарда ي: مَرَّتَانِ — مَرَّتَيْنِ.", "**1. Нуни.** Охиридаги ن касрали, эъроб аломати эмас; изофада тушади: كِتَابَا الطَّالِبِ.", "**2. Мулҳақлари.** اِثْنَانِ، اِثْنَتَانِ; كِلَا ва كِلْتَا замирга музоф бўлса: كِلَاهُمَا، كِلَيْهِمَا."]], "MUTLAQ": ["Мафъулун мутлақ", ["Феълнинг ўз масдари: феълни таъкидлайди, турини ёки сонини билдиради; насб қилинади: شَكَرْتُهُ شُكْرًا.", "**1. Турлари.** Таъкид: شَكَرْتُهُ شُكْرًا; тур (сифати ёки изофаси билан): شَكَرْتُهُ شُكْرًا كَثِيرًا; сон: ضَرَبْتُهُ ضَرْبَتَيْنِ.", "**2. Ўрнига ўтадиганлар (наиб).** Сон (مَرَّتَيْنِ), كُلٌّ ва بَعْضٌ (كُلَّ الشُّكْرِ), сифати.", "**3. Ҳазф.** Феъли кўпинча ҳазф қилинади: شُكْرًا، عَفْوًا، صَبْرًا، حَمْدًا; гап феълийя бўлади: (اُعْفُ عَنِّي) عَفْوًا."]], "GHAYR": ["⁣Имя гайру мунсариф⁣", ["⁣Не принимает танвин и в джарр получает фатху вместо касры («признак — фатха вместо касры»): ⁣مَرَرْتُ بِمَسَاجِدَ⁣.⁣", "⁣⁣**⁣1. Причины.⁣**⁣ Вес «предельного множественного» (сыгат мунтаха ль-джуму': ⁣مَفَاعِلُ، مَفَاعِيلُ)⁣, прилагательное на ⁣أَفْعَلُ⁣, алиф женского рода ⁣(صَحْرَاءُ، أَشْيَاءُ)⁣, прилагательное на ⁣فَعْلَانُ (عَطْشَانُ)⁣ и многие имена собственные ⁣(فَاطِمَةُ، إِبْرَاهِيمُ)⁣.⁣", "⁣⁣**⁣2. Признак и'раба.⁣**⁣ В раф' — дамма, в насб и джарр — фатха, без танвина: ⁣جَاءَتْ زَيْنَبُ، رَأَيْتُ زَيْنَبَ، مَعَ زَيْنَبَ⁣.⁣", "⁣⁣**⁣3. Когда получает касру.⁣**⁣ С ⁣اَلْ (فِي الْمَسَاجِدِ)⁣ или если является мудафом ⁣(فِي مَنَاكِبِهَا)⁣.⁣", "⁣⁣**⁣4. Тонкость.⁣**⁣ Составное (мазджи) имя собственное тоже гайру мунсариф: ⁣إِسْلَامَ آبَادَ⁣.⁣"]], "YA": ["Мутакаллим ي си", ["ي — «менинг» маъносидаги муттасил замир: وَطَنِي «ватаним».", "Ундан олдинги ҳарф доим касра олади (мослик учун), шунинг учун сўзнинг эъроб ҳаракати кўринмайди — тақдирий:", "هَذَا وَطَنِي (раф)، أُحِبُّ وَطَنِي (насб)، مِنْ وَطَنِي (жар) — учаласи бир хил ўқилади.", "ي нинг ўзи сукунга (баъзан фатҳага: وَطَنِيَ) мабний, жар ўринда — музофун илайҳ."]], "PRON": ["⁣Слитные местоимения⁣", ["⁣Местоимения всегда мабни; место зависит от того, к чему присоединено:⁣\n⁣• к имени — мудаф илейхи, на месте джарр: ⁣رَاتِبُكَ⁣⁣\n⁣• к глаголу — маф'уль бихи, на месте насб: ⁣أَزُورُهُمْ⁣⁣\n⁣• к частице джарр — маджрур, на месте джарр: ⁣إِلَيْنَا، فِيكَ⁣⁣\n⁣• к «сестре» ⁣إِنَّ⁣ — её исм, на месте насб: ⁣لَكِنَّكَ⁣⁣", "⁣⁣**⁣1. Местоимения фа'иля.⁣**⁣ Присоединённые к глаголу ⁣تُ، تَ، تِ، نَا، و، ا، ي، نَ⁣ — фа'иль, на месте раф': ⁣فَكَّرْتُ، اغْتَرَبُوا⁣.⁣", "⁣⁣**⁣2. Нун защиты (нуну-ль-викая).⁣**⁣ Если к глаголу присоединяется ⁣ي⁣, между ними вставляется ⁣ن⁣: ⁣يُعْجِبُنِي⁣.⁣", "⁣⁣**⁣3. Произношение.⁣**⁣ ⁣هُ، هُمْ، هُمَا، هُنَّ⁣ после касры или ⁣ي⁣ получают касру: ⁣رِزْقِهِ، دِينِهِمْ، فِيهِمْ⁣.⁣"]], "IDAFA": ["⁣Идафа⁣", ["⁣Два имени связываются: первое — мудаф, второе — мудаф илейхи. Мудаф илейхи всегда в джарр; мудаф не принимает танвин и ⁣اَلْ⁣: ⁣خَارِجَ وَطَنِي، خَمْسَ سَنَوَاتٍ⁣.⁣", "⁣⁣**⁣1. И'раб мудафа.⁣**⁣ По месту в предложении: мубтада, фа'иль, зарф…: ⁣خَارِجَ وَطَنِي⁣ — зарф, насб.⁣", "⁣⁣**⁣2. Мудаф илейхи.⁣**⁣ Бывает именем, местоимением ⁣(رَاتِبُكَ⁣ — на месте джарр) или предложением; ⁣حَيْثُ⁣ и условное ⁣إِذَا⁣ всегда мудаф к следующему предложению.⁣", "⁣⁣**⁣3. В таснии и множественном.⁣**⁣ Если мудаф — тасния или джам' музаккар салим, ⁣ن⁣ выпадает: ⁣كِتَابَا الطَّالِبِ، مُعَلِّمُو الْمَدْرَسَةِ⁣.⁣", "⁣⁣**⁣4. Определённость.⁣**⁣ Мудаф к ма'рифе становится ма'рифой, мудаф к накире — накирой.⁣", "⁣⁣**⁣5. Тонкость.⁣**⁣ Между мудафом и мудаф илейхи слово не вставляется; сыфа мудафа ставится после мудаф илейхи: ⁣كِتَابُ الطَّالِبِ الْجَدِيدُ⁣.⁣"]], "ZARF": ["⁣Зарф (маф'уль фихи)⁣", ["⁣Обозначает время или место действия, отвечает на «когда? где?»; стоит в насб: ⁣خَارِجَ وَطَنِي⁣.⁣", "⁣⁣**⁣1. Виды.⁣**⁣ Зарф времени: ⁣يَوْمَ، لَيْلَةَ، صَبَاحًا⁣; зарф места: ⁣خَارِجَ، أَمَامَ، فَوْقَ، عِنْدَ، مَعَ⁣.⁣", "⁣⁣**⁣2. Зарфы-мабни.⁣**⁣ ⁣هُنَا، هُنَاكَ، إِذَا، حَيْثُ⁣ — на месте насб.⁣", "⁣⁣**⁣3. Мута'аллик.⁣**⁣ Зарф относится к глаголу или к слову, действующему как глагол; если такого слова нет — к опущенному хабару ⁣(كَائِنٌ)⁣: ⁣الْكِتَابُ هُنَا⁣.⁣", "⁣⁣**⁣4. Что заменяет зарф.⁣**⁣ Число ⁣(خَمْسَ سَنَوَاتٍ)⁣, сыфа зарфа ⁣(طَوِيلًا⁣ — изначально ⁣زَمَنًا طَوِيلًا)⁣, ⁣كُلٌّ⁣ и ⁣بَعْضٌ⁣.⁣", "⁣⁣**⁣5. Тонкость.⁣**⁣ Условное ⁣إِذَا⁣ — зарф времени, мута'аллик к глаголу ответа; ⁣حَيْثُ⁣ всегда мудаф к следующему предложению.⁣", "⁣⁣**⁣6. Другое мнение.⁣**⁣ ⁣اَلْآنَ⁣ наш учебник (урок 65) даёт в насб с признаком фатха; во многих книгах по нахву оно мабни на фатху.⁣"]], "ISHARA": ["⁣Указательные имена⁣", ["⁣Имя, указывающее на предмет. Для близкого: ⁣هَذَا، هَذِهِ، هَذَانِ، هَاتَانِ، هَؤُلَاءِ⁣; для далёкого: ⁣ذَلِكَ، تِلْكَ، أُولَئِكَ⁣.⁣", "⁣⁣**⁣1. Для места.⁣**⁣ ⁣هُنَا⁣ (здесь), ⁣هُنَاكَ⁣ / ⁣هُنَالِكَ⁣ (там) — зарф места.⁣", "⁣⁣**⁣2. И'раб.⁣**⁣ Мабни — говорится «на месте …»; только ⁣هَذَانِ⁣ и ⁣هَاتَانِ⁣ изменяются как тасния: в раф' ⁣ا⁣, в насб и джарр ⁣ي (هَذَيْنِ)⁣.⁣", "⁣⁣**⁣3. Состав.⁣**⁣ ⁣ذَلِكَ⁣ = ⁣ذَا⁣ + ⁣لِ⁣ (лям удалённости) + ⁣كَ⁣ (частица обращения); ⁣هَا⁣ в ⁣هَذَا⁣ — частица привлечения внимания (танбих).⁣"]], "FAIL": ["⁣Фа'иль⁣", ["⁣Совершающий действие; всегда стоит в раф' и идёт после глагола: ⁣جَاءَ الطُّلَّابُ⁣.⁣", "⁣⁣**⁣1. Виды.⁣**⁣ Явное имя, явное слитное местоимение ⁣(فَكَّرْتُ)⁣ или скрытое местоимение ⁣(هُوَ، أَنَا)⁣.⁣", "⁣⁣**⁣2. Скрытое — джаиз и ваджиб.⁣**⁣ Джаиз (допустимо скрытое) — формы 3-го лица, после которых может прийти и явный фа'иль: ⁣ضَرَبَ (هُوَ)⁣. Ваджиб (обязательно скрытое) — где явный фа'иль не приходит: мудари' 2-го лица ед. ч. м. р. и формы 1-го лица, повелительный: ⁣أَجْتَهِدُ (أَنَا)⁣.⁣", "⁣⁣**⁣3. Признак и'раба.⁣**⁣ Дамма; в таснии — ⁣ا⁣, в джам' музаккар салим — ⁣و⁣. Если мабни — на месте раф'.⁣", "⁣⁣**⁣4. Согласование глагола.⁣**⁣ Даже если фа'иль во множественном числе, глагол остаётся в единственном: ⁣جَاءَ الطُّلَّابُ⁣. Если фа'иль женского рода, к глаголу добавляется ⁣ت⁣: ⁣جَاءَتْ زَيْنَبُ⁣.⁣", "⁣⁣**⁣5. Порядок.⁣**⁣ Фа'иль не стоит перед глаголом; если слово стоит впереди — оно мубтада, а фа'иль — местоимение в глаголе: ⁣زَيْنَبُ جَاءَتْ⁣ (фа'иль — скрытое ⁣هِيَ)⁣.⁣", "⁣⁣**⁣6. Тонкость.⁣**⁣ Слово ⁣اللَّهُ⁣ при разборе из почтения называют «лафз аль-джаляля» ⁣(لَفْظُ الْجَلَالَةِ)⁣.⁣"]], "MAFUL": ["⁣Маф'уль бихи⁣", ["⁣То, на что переходит действие; стоит в насб: ⁣تَصْحَبَ أَوْلَادَكَ⁣.⁣", "⁣⁣**⁣1. Вопрос.⁣**⁣ Чаще отвечает на вопрос «кого? что?», иногда «кому? чему?», реже «от кого? от чего?».⁣", "⁣⁣**⁣2. Виды.⁣**⁣ Явное имя, слитное местоимение ⁣(أَزُورُهُمْ⁣ — на месте насб), раздельное местоимение ⁣(إِيَّاكَ)⁣ или масдар, истолкованный из ⁣أَنْ⁣ с глаголом: ⁣أَرْجُو أَنْ تَعُودَ⁣.⁣", "⁣⁣**⁣3. Признак и'раба.⁣**⁣ Фатха; в таснии и джам' музаккар салим — ⁣ي⁣; в джам' муаннас салим — касра вместо фатхи.⁣", "⁣⁣**⁣4. Глаголы с двумя маф'улями.⁣**⁣ Со значением «давать» — ⁣أَعْطَى، مَنَحَ⁣; «полагать» — ⁣ظَنَّ، حَسِبَ⁣; «делать чем-то» — ⁣جَعَلَ، صَيَّرَ، اتَّخَذَ⁣ — их маф'ули изначально мубтада и хабар: ⁣الْأَرْضُ ذَلُولٌ⁣ → ⁣جَعَلَ الْأَرْضَ ذَلُولًا⁣.⁣", "⁣⁣**⁣5. Порядок.⁣**⁣ Может стоять и перед глаголом (для усиления или значения «только»): ⁣إِيَّاكَ نَعْبُدُ⁣.⁣"]], "JARR": ["⁣Частицы джарра⁣", ["⁣Ставит следующее за ней имя в джарр: ⁣مِنْ، إِلَى، عَنْ، عَلَى، فِي، بِ، لِ، كَ، حَتَّى، رُبَّ، مُنْذُ⁣. Частица джарр с маджруром — шибх джумля.⁣", "⁣⁣**⁣1. Признак и'раба.⁣**⁣ У маджрура — касра; у гайру мунсариф — фатха вместо касры; в таснии и джам' музаккар салим — ⁣ي⁣. Слово-мабни (местоимение, указательное, относительное) — на месте джарр: ⁣إِلَيْنَا⁣.⁣", "⁣⁣**⁣2. Мута'аллик.⁣**⁣ Джарр с маджруром относится к глаголу или к слову, действующему как глагол (исм фа'иль, масдар). Если такого слова нет — к опущенному слову, будучи хабаром ⁣(كَائِنٌ)⁣, сыфой или халем.⁣", "⁣⁣**⁣3. Порядок.⁣**⁣ Шибх джумля может стоять перед своим мута'алликом: ⁣إِلَى أَيْنَ أَنْتَ مُسَافِرٌ؟⁣⁣", "⁣⁣**⁣4. С местоимением.⁣**⁣ Алиф в ⁣إِلَى⁣ и ⁣عَلَى⁣ переходит в ⁣ي⁣: ⁣إِلَيْهِ، عَلَيْكَ⁣. ⁣لِ⁣ получает фатху: ⁣لَكَ، لَهُ، لَكُمْ⁣; только с ⁣ي⁣ — ⁣لِي⁣.⁣", "⁣⁣**⁣5. ⁣لِ⁣ и ⁣اَلْ⁣.⁣**⁣ Алиф не пишется: ⁣لِلْعَمَلِ⁣.⁣"]], "MIM": ["Жам мими", ["كُمْ ва هُمْ даги жам мими сукунли; кейинги сўз ال билан бошланса, икки сукун учрашмаслиги учун замма олади: لَكُمُ الْأَرْضَ، عَلَيْهِمُ الْقِتَالُ.", "**1. Эъроби.** Бу замма эъроб аломати эмас — замир сукунга мабнийлигича қолади."]], "HAL": ["Ҳол", ["Иш пайтидаги ҳолатни билдиради, «қандай ҳолда?» саволига жавоб беради; насб қилинади: تَعُودَ سَالِمًا.", "**1. Турлари.** Муфрад: سَالِمًا; жумла: جَاءَ وَهُوَ يَضْحَكُ — насб ўринда.", "**2. Шарти.** Ҳол кўпинча накра, зул ҳол эса маърифа бўлади.", "**3. Ҳол жумласи.** Олдида ҳол вови келиши мумкин: جَاءَ وَهُوَ يَضْحَكُ.", "**4. Бир нечта ҳол.** Битта зул ҳолга бир нечта ҳол келиши мумкин: تَعُودَ سَالِمًا غَانِمًا.", "**5. Нозик жой.** كَيْفَ — тўлиқ феълдан олдин келса ҳол (كَيْفَ تُحَافِظُ؟), мубтадодан олдин келса хабар (كَيْفَ حَالُكَ؟)."]], "SHART": ["Шарт гапи", ["Шарт гапи уч қисмдан иборат: шарт сўзи + шарт феъли + жавоб: إِنْ تَدْرُسْ تَنْجَحْ — жазм қилувчи шарт сўзи иккала феълни ҳам жазм қилади.", "**1. Турлари.** Жазм қилувчилар: إِنْ، مَنْ، مَا، مَهْمَا، مَتَى، أَيْنَ، حَيْثُمَا; жазм қилмайдиганлар: إِذَا، لَوْ، لَوْلَا.", "**2. Эъроби.** Шарт феъли мозий бўлса, жазм ўринда бўлади: إِنْ شَاءَ اللَّهُ.", "**3. إِذَا.** Келаси замон зарфи: шартига музоф, жавобига мутааллиқ.", "**4. Жавобга فَ.** Вожиб бўлади: исмий гап, амр, наҳй, савол, жомид феъл ёки قَدْ، مَا، لَنْ، سَ، سَوْفَ билан келса.", "**5. Ҳазф.** Жавоб олдинги гапдан тушунилса, ҳазф қилинади: أَعُودُ إِنْ شَاءَ اللَّهُ.", "**6. Нозик жой.** إِلَّا = إِنْ + لَا: «акс ҳолда»."]], "ISTIF": ["⁣Вопросительные слова⁣", ["⁣Вопросительные слова двух видов: частицы ⁣(هَلْ⁣ и хамза ⁣أَ)⁣ и имена ⁣(مَنْ، مَا، مَتَى، أَيْنَ، كَيْفَ، كَمْ، أَيُّ)⁣.⁣", "⁣⁣**⁣1. Частицы.⁣**⁣ ⁣هَلْ⁣ и ⁣أَ⁣ — места в и'рабе не имеют. Ответ на ⁣هَلْ⁣ — ⁣نَعَمْ⁣ или ⁣لَا⁣.⁣", "⁣⁣**⁣2. Имена.⁣**⁣ Имеют место в предложении: мубтада ⁣(مَنْ ضَرَبَ الطَّالِبَ؟)⁣, хабар, зарф ⁣(أَيْنَ، مَتَى)⁣, халь ⁣(كَيْفَ)⁣, маф'уль бихи, маджрур ⁣(إِلَى أَيْنَ)⁣.⁣", "⁣⁣**⁣3. И'раб.⁣**⁣ Все мабни — говорится «на месте …»; только ⁣أَيُّ⁣ му'раб (изменяемое).⁣", "⁣⁣**⁣4. Порядок.⁣**⁣ Вопросительное слово стоит в начале предложения; если есть частица джарр — после неё: ⁣إِلَى أَيْنَ؟⁣⁣", "⁣⁣**⁣5. Тонкость.⁣**⁣ В ⁣أَيْنَ⁣ X⁣؟⁣ слово ⁣أَيْنَ⁣ — мута'аллик к опущенному выдвинутому хабару ⁣(كَائِنٌ)⁣, X — отодвинутая мубтада (мубтада му'аххар).⁣"]], "MAWSUL": ["⁣Относительное имя (исм маусуль)⁣", ["⁣Имя, дающее смысл вместе со следующим за ним предложением (сыля): ⁣الَّذِي، الَّتِي، اللَّذَانِ، اللَّتَانِ، الَّذِينَ، اللَّاتِي⁣; общие: ⁣مَنْ، مَا⁣.⁣", "⁣⁣**⁣1. Виды.⁣**⁣ Особые — по числу и роду ⁣(الَّذِي، الَّتِي…)⁣; общие — ⁣مَنْ⁣ (для разумных), ⁣مَا⁣ (для неразумных).⁣", "⁣⁣**⁣2. И'раб.⁣**⁣ Мабни — говорится «на месте …»; только ⁣اللَّذَانِ⁣ и ⁣اللَّتَانِ⁣ изменяются как тасния (му'раб).⁣", "⁣⁣**⁣3. Сыля.⁣**⁣ Следующее предложение — сыля, места в и'рабе не имеет. В сыле есть местоимение, возвращающееся к маусулю (а'ид): ⁣هُوَ الَّذِي جَعَلَ⁣ — скрытое ⁣هُوَ⁣ в ⁣جَعَلَ⁣.⁣", "⁣⁣**⁣4. Как сыфа.⁣**⁣ После ма'рифы чаще всего является её сыфой: ⁣لُغَةَ تِلْكَ الْحَضَارَةِ الَّتِي تُرْجِمَتْ إِلَيْهَا⁣.⁣"]], "DAMIR": ["⁣Раздельные местоимения⁣", ["⁣Местоимения, пишущиеся отдельно: ⁣أَنَا، نَحْنُ، أَنْتَ، أَنْتِ، أَنْتُمَا، أَنْتُمْ، أَنْتُنَّ، هُوَ، هِيَ، هُمَا، هُمْ، هُنَّ⁣.⁣", "⁣⁣**⁣1. И'раб.⁣**⁣ Все мабни; в предложении стоят на месте раф' (мубтада, хабар…).⁣", "⁣⁣**⁣2. Местоимения насба.⁣**⁣ С ⁣إِيَّا⁣: ⁣إِيَّاكَ نَعْبُدُ⁣ — маф'уль бихи, на месте насб.⁣", "⁣⁣**⁣3. Местоимение-разделитель.⁣**⁣ Если стоит между мубтадой и хабаром — местоимение-разделитель (замир фасль), места в и'рабе не имеет: ⁣هَذَا هُوَ الْمِعْطَفُ⁣.⁣"]], "QAT": ["فَقَطْ", ["فَقَطْ — «фақат»: قَطْ — «етарли, бас» маъносидаги исм (حَسْبُ каби), فَ — зоида.", "**1. Нозик жой.** Ташдидли قَطُّ — бошқа сўз: «ҳеч қачон», ўтган замон инкори билан келади: مَا رَأَيْتُهُ قَطُّ."]], "DUA": ["⁣Мади в значении пожелания (ду'а)⁣", ["⁣Глагол мади употребляется в значении пожелания — выражает не прошлое, а пожелание: ⁣بَارَكَ اللَّهُ فِيكَ⁣ — «да благословит тебя Аллах».⁣", "⁣⁣**⁣1. И'раб.⁣**⁣ Такое предложение — джумля ду'аийя, места в и'рабе не имеет: ⁣رَحِمَهُ اللَّهُ⁣.⁣", "⁣⁣**⁣2. Частые выражения.⁣**⁣ ⁣رَضِيَ اللَّهُ عَنْهُ، جَزَاكَ اللَّهُ خَيْرًا⁣.⁣"]], "JMS": ["Жам муаннас солим", ["ـَاتٌ қўшимчали кўплик: рафда замма, насб ва жарда касра: سَنَوَاتٌ — رَأَيْتُ السَّنَوَاتِ.", "**1. Насб аломати.** Касра фатҳа ўрнига келади: رَأَيْتُ مُعَلِّمَاتٍ.", "**2. Нозик жой.** ت си ўзакдан бўлган кўплик (أَمْوَاتٌ، أَبْيَاتٌ) жам муаннас солим эмас — насбда фатҳа олади: رَأَيْتُ أَمْوَاتًا."]], "AF5": ["Афъоли хамса", ["Музорий феълнинг охирига ا، و ёки ي фоил замири уланган 5 шакли: يَفْعَلَانِ، تَفْعَلَانِ، يَفْعَلُونَ، تَفْعَلُونَ، تَفْعَلِينَ. Рафда охиридаги ن сақланади, насб ва жазмда тушади.", "**1. Фоили.** ا (икки киши), و (кўпчилик), ي (бир аёл) — фоил бўлган муттасил замир, раф ўринда: تَدْرُسَانِ.", "**2. Раф аломати.** ن нинг сақланиши: تَسْكُنَانِ، تَخْتَلِفُونَ.", "**3. Насб аломати.** ن нинг ҳазфи: لَنْ تَسْكُنَا، أَنْ تَذْهَبُوا.", "**4. Жазм аломати.** ن нинг ҳазфи: لَمْ تَدْرُسَا، لَا تُسْرِفُوا.", "**5. Нозик жой.** ن тушгандан кейин жамъ вовидан сўнг ёзувда алиф қўшилади (алифи фориқа): لَمْ يَذْهَبُوا."]], "KANA": ["كَانَ ва синглилари", ["كَانَ ва синглилари мубтадо ва хабарга киради: мубтадо раф қилинган ҳолда унинг исми, хабар эса насб қилиниб унинг хабари бўлади: زَيْنَبُ نَحِيفَةٌ — ظَلَّتْ زَيْنَبُ نَحِيفَةً.", "**1. Синглилари.** كَانَ، أَصْبَحَ، أَضْحَى، أَمْسَى، ظَلَّ، بَاتَ، صَارَ، لَيْسَ، مَا زَالَ، مَا بَرِحَ، مَا فَتِئَ، مَا انْفَكَّ، مَا دَامَ. Маънолари: ظَلَّ — «…лигича қолди», صَارَ — «бўлиб қолди», لَيْسَ — «эмас».", "**2. Нима учун ноқис.** Фоил билан тугамайди — исм ва хабар талаб қилади.", "**3. Хабари турлари.** Муфрад (نَحِيفَةً), жумла (насб ўринда) ёки шибҳи жумла — маҳзуф хабар бўлмиш كَائِنًا га мутааллиқ.", "**4. Шакллари.** Музорий ва амри ҳам шундай амал қилади: أَنْ تَكُونَ سَمِينَةً — исми яширин هِيَ, хабари سَمِينَةً; كُنْ.", "**5. Тартиб.** Хабари исмидан олдин келиши мумкин (хабари муқаддам, исми муаххар): فَكَانَتْ هُنَاكَ لَهْجَةٌ.", "**6. Нозик жой.** كَانَ баъзан том феъл бўлади («бор бўлди, юз берди») — унда фоил олади."]], "SHURU": ["Бошлаш феъллари", ["أَخَذَ، بَدَأَ، شَرَعَ، جَعَلَ «… а бошлади» маъносида келса, бошлаш феъли (афъолуш шуруъ) бўлиб, كَانَ каби амал қилади: исмини раф қилади, хабари насб ўринда: أَخَذَتْ زَيْنَبُ تَتَنَاوَلُ…", "**1. Хабари.** Фақат музорий феъл билан бошланадиган жумла (أَنْ сиз), насб ўринда; феълнинг ўзи раф ҳолида қолади: تَتَنَاوَلُ.", "**2. Нозик жой.** أَخَذَ «олди» маъносида бўлса — оддий феъл: أَخَذَهُ «уни олди»."]], "JAZM": ["لَمْ ва жазм", ["لَمْ музорий феълни жазм қилади ва маъносини ўтган замон инкорига айлантиради: لَمْ تَنْجَحْ — «муваффақ бўлмади».", "**1. Соғлом феълда.** Жазм аломати — сукун: تَنْجَحْ، يَنْقُصْ، تُمَارِسْ.", "**2. Ўртаси иллатли феъл.** Икки сукун йўлиқмаслиги учун иллат ҳарфи тушади: تَسْتَطِيعُ → لَمْ تَسْتَطِعْ.", "**3. Охири иллатли феъл.** Иллат ҳарфи тушади: يَمْشِي → لَمْ يَمْشِ.", "**4. Афъоли хамса.** Жазм аломати — ن нинг тушиши: لَمْ تَدْرُسَا.", "**5. Нозик жой.** Нафий لَا музорийни ўзгартирмайди: لَا تَسْتَطِيعُ — раф."]], "ADAD": ["⁣Числительные (21–99)⁣", ["⁣Числа от 21 до 99 составляются из единиц и десятков: единицы впереди, десятки после, между ними ⁣وَ⁣ — десятки ма'туф к единицам: ⁣خَمْسَةٌ وَخَمْسُونَ⁣.⁣", "⁣⁣**⁣1. Десятки.⁣**⁣ ⁣عِشْرُونَ … تِسْعُونَ⁣ приравнены к джам' музаккар салим (мульхак): в раф' — ⁣و⁣, в насб и джарр — ⁣ي⁣: ⁣وَزْنُهَا تِسْعُونَ، إِلَى سَبْعِينَ⁣.⁣", "⁣⁣**⁣2. Род единиц.⁣**⁣ 3–9 противоположны по роду исчисляемому: ⁣خَمْسَةُ كُتُبٍ، خَمْسُ سَنَوَاتٍ⁣; а 1 и 2 согласуются: ⁣إِحْدَى وَعِشْرُونَ سَنَةً⁣.⁣", "⁣⁣**⁣3. Тамйиз.⁣**⁣ После 11–99 исчисляемое стоит в единственном числе и в насб: ⁣خَمْسَةٌ وَخَمْسُونَ كَيْلًا⁣.⁣", "⁣⁣**⁣4. И'раб.⁣**⁣ Единицы изменяются по своему месту в предложении, десятки следуют за ними через атф: ⁣رَأَيْتُ خَمْسَةً وَخَمْسِينَ⁣.⁣"]], "TAMYIZ": ["⁣Тамйиз⁣", ["⁣Имя-накира в насб, уточняющее, что имеется в виду под неясным словом: ⁣خَمْسَةٌ وَخَمْسُونَ كَيْلًا⁣ — «55 (чего?) кило».⁣", "⁣⁣**⁣1. Виды.⁣**⁣ Тамйиз сущности — после числа, меры, веса: ⁣خَمْسُونَ كَيْلًا⁣; тамйиз отношения — уточняет смысл предложения: ⁣طَابَ زَيْدٌ نَفْسًا⁣.⁣", "⁣⁣**⁣2. После числа.⁣**⁣ После 3–10 — множественное в джарр (мудаф илейхи): ⁣ثَلَاثَةُ كُتُبٍ⁣; после 11–99 — единственное в насб: ⁣خَمْسُونَ كَيْلًا⁣; после 100 и 1000 — единственное в джарр: ⁣مِئَةُ كِتَابٍ⁣.⁣"]], "MASDARM": ["أَنْ + феъл = масдар", ["أَنْ ва ундан кейинги музорий бирга масдар маъносини беради: أَنْ تَكُونَ = اَلْكَوْنُ «бўлиш», أَنْ يَصِلَ = اَلْوُصُولُ «етиш».", "**1. Эъроби.** Масдар гапда исм каби ўрин олади: تُرِيدُ أَنْ تَكُونَ … — мафъулун биҳ; يَجِبُ أَنْ يَصِلَ … — фоил.", "**2. Феълнинг ўзи.** أَنْ музорийни насб қилади: أَنْ يَصِلَ."]], "FA": ["فَ ҳарфи", ["Кетма-кетлик ва сабаб-натижани билдиради: فَزَادَ وَزْنُهَا — «натижада вазни ошди».", "Олдинги гапнинг сабабини тушунтириш учун ҳам келади: فَهُمَا تَسْكُنَانِ … — «чунки иккови … яшайди»."]], "WAWHAL": ["Ҳол вови", ["Ҳол жумласи олдидан келадиган وَ — «… ҳолда»: فَزَادَ وَزْنُهَا وَلَمْ يَنْقُصْ — «камаймаган ҳолда ошди».", "**1. Эъроби.** وَ — ҳарф, эъробдан ўрни йўқ; кейинги жумла ҳол бўлиб, насб ўринда."]], "BADAL": ["⁣Бадаль⁣", ["⁣Бадаль стоит вместо предыдущего слова (мубдаль минху) — суждение по сути относится к нему; в и'рабе следует за ним: ⁣جَاءَ زَيْدٌ أَخُوكَ⁣.⁣", "⁣⁣**⁣1. Виды.⁣**⁣ Целое вместо целого: ⁣جَاءَ زَيْدٌ أَخُوكَ⁣; часть вместо целого: ⁣أَكَلْتُ الرَّغِيفَ ثُلُثَهُ⁣; бадаль иштималь (по включению): ⁣نَفَعَنِي زَيْدٌ عِلْمُهُ⁣.⁣", "⁣⁣**⁣2. Перечисление (тафсиль).⁣**⁣ Если сначала идёт число или общее слово, а затем всё перечисляется по одному, — первое бадаль, остальные ма'туф к нему: ⁣ثَلَاثِ فِرَقٍ⁣: ⁣فَرِيقٍ … وَفَرِيقٍ⁣ … — все в джарр.⁣", "⁣⁣**⁣3. Согласование.⁣**⁣ Бадаль следует за мубдаль минху в и'рабе; согласование в ма'рифе-накире и в роде не обязательно.⁣", "⁣⁣**⁣4. Тонкость.⁣**⁣ В бадале части и бадале иштималь есть местоимение, возвращающееся к мубдаль минху: ⁣ثُلُثَهُ، عِلْمُهُ⁣.⁣"]], "LANAFI": ["Зотни инкор қилувчи لَا", ["لَا النَّافِيَةُ لِلْجِنْسِ — бир турдаги нарсанинг умуман йўқлигини билдиради ва إِنَّ каби амал қилади: исмини насб, хабарини раф: لَا بُدَّ — «чора йўқ».", "**1. Шарти.** Исми ва хабари накра бўлади, исми ундан кейин дарҳол келади.", "**2. Исмининг эъроби.** Музоф бўлмаса — фатҳага мабний, насб ўринда: لَا بُدَّ; музоф бўлса — насб: لَا طَالِبَ عِلْمٍ مَحْرُومٌ.", "**3. Хабари ҳазфи.** Кўпинча ҳазф қилинади: لَا بُدَّ مِنَ الْحِمْيَةِ — مِنَ الْحِمْيَةِ маҳзуф хабарга (مَوْجُودٌ) мутааллиқ.", "**4. Нозик жой.** لَا بُدَّ مِنْ … — «… зарур, … шарт»."]], "ANNA": ["أَنَّ ва масдар", ["أَنَّ — إِنَّ нинг синглиси: исмини насб, хабарини раф қилади ва исми, хабари билан бирга масдар ўрнида туради: أَعْتَقِدُ أَنَّكَ لَمْ تَتَّبِعِ الْحِمْيَةَ = أَعْتَقِدُ عَدَمَ اتِّبَاعِكَ الْحِمْيَةَ.", "**1. Ўрни.** Гап ўртасида келади; гап бошида ва قَالَ дан кейин — إِنَّ: قَالَ: إِنَّ…", "**2. Масдарнинг эъроби.** Масдар гапда исм каби ўрин олади: يَرَى أَنَّ الْعَمَلَ حَقٌّ — мафъулун биҳ ўрнида.", "**3. Хабари.** Муфрад ёки жумла бўлади: أَنَّكَ لَمْ تَتَّبِعْ … — жумла раф ўринда.", "**4. Исми замир бўлса.** Ҳарфга уланади: أَنَّكَ، أَنَّهُ."]], "JAZMK": ["Жазм ва 2 сукун", ["Мажзум феълдан кейин ال билан бошланган сўз келса, икки сукун йўлиқмаслиги учун сукун касрага алмашади: لَمْ تَتَّبِعِ الْحِمْيَةَ، لَمْ تُمَارِسِ الرِّيَاضَةَ.", "**1. Эъроби.** Бу касра эъроб аломати эмас — феъл барибир мажзум, жазм аломати сукун.", "**2. Ўртаси иллатли феъл.** Иллат ҳарфи тушади: أَسْتَطِيعُ → لَمْ أَسْتَطِعْ.", "**3. Амр феълида ҳам.** اِتَّبِعْ → اِتَّبِعِ الْحِمْيَةَ."]], "MUQ": ["Муқаддар замма", ["Охири ي бўлган музорий феълда (يَكْفِي، يَمْشِي) раф аломати — муқаддар (кўринмас) замма, чунки ي да замма оғир (сақл).", "**1. Насбда.** Фатҳа кўринади: لَنْ يَكْفِيَ.", "**2. Жазмда.** ي тушади: لَمْ يَكْفِ.", "**3. Охири و ёки ا бўлса.** و да ҳам замма тақдирий (сақл): يَدْعُو; ا да — таъаззур (талаффуз имконсиз): يَسْعَى."]], "WAHD": ["وَحْدَ", ["وَحْدَ — «ёлғиз, бир ўзи» маъносидаги исм; доим насб қилинади ва замирга музоф бўлади: وَحْدَهُ، وَحْدَكَ، وَحْدِي.", "**1. Эъроби.** Гапда ҳол бўлади: اَلدَّوَاءُ وَحْدَهُ لَا يَكْفِي — «дорининг ўзи (ёлғиз) кифоя қилмайди»."]], "NIDA": ["⁣Обращение (нида, мунада)⁣", ["⁣⁣يَا⁣ — частица обращения («о!»); имя после неё — мунада.⁣", "⁣⁣**⁣1. Мунада-мабни.⁣**⁣ Если это имя собственное или накира, обращённая к определённому лицу, — мабни на дамму без танвина, на месте насб: ⁣يَا مُحَمَّدُ، يَا دُكْتُورُ⁣.⁣", "⁣⁣**⁣2. Мунада в насб.⁣**⁣ Если это мудаф — стоит в насб: ⁣يَا طَالِبَ الْعِلْمِ⁣.⁣", "⁣⁣**⁣3. Тонкость.⁣**⁣ К имени с ⁣ال⁣ частица ⁣يَا⁣ прямо не присоединяется — между ними ставится ⁣أَيُّهَا⁣: ⁣يَا أَيُّهَا النَّاسُ⁣.⁣"]], "WIQ": ["Виқоя нуни", ["Мутакаллим ي си феълга уланганда, феъл охирини касрадан сақлаш учун орага نِ қўшилади: قَابِلْنِي، يُقَابِلُنِي.", "**1. Эъроби.** نِ — виқоя нуни, ҳарф, эъробдан ўрни йўқ; ي — мафъулун биҳ, насб ўринда."]], "FASL": ["⁣Местоимение-разделитель (замир фасль)⁣", ["⁣Раздельное местоимение ⁣(هُوَ، هِيَ، هُمْ …)⁣ между мубтадой и хабаром-ма'рифой отделяет хабар от сыфы и усиливает его: ⁣الْإِنْسَانُ السَّمِينُ هُوَ الصَّحِيحُ⁣.⁣", "⁣⁣**⁣1. Условие.⁣**⁣ Стоит между двумя ма'рифами и согласуется с предыдущим в роде и числе.⁣", "⁣⁣**⁣2. И'раб.⁣**⁣ Места в и'рабе не имеет; в переводе даёт значение «именно …».⁣", "⁣⁣**⁣3. Другое мнение.⁣**⁣ Некоторые считают его второй мубтадой, а следующее слово — её хабаром; это предложение — хабар первой мубтады.⁣"]], "NAHY": ["Наҳий لَا си", ["لَا النَّاهِيَةُ — тақиқ ҳарфи, музорий феълни жазм қилади: لَا تَأْكُلْ «ема».", "**1. Нафий لَا дан фарқи.** لَا تَأْكُلُ (раф) — «емайсан»; لَا تَأْكُلْ (жазм) — «ема!».", "**2. Икки сукун.** Кейинги сўз ال билан бошланса, сукун касрага алмашади: لَا تَأْكُلِ الْخُبْزَ.", "**3. Афъоли хамса.** Жазм аломати — ن нинг тушиши: تُسْرِفُونَ → لَا تُسْرِفُوا."]], "ZAID": ["⁣Избыточное (за'ида) ⁣بِ⁣⁣", ["⁣⁣بِ⁣ иногда приходит как избыточная (за'ида) для усиления: ⁣بِحَسْبِ ابْنِ آدَمَ⁣ = ⁣حَسْبُ ابْنِ آدَمَ⁣.⁣", "⁣⁣**⁣1. И'раб.⁣**⁣ Следующее слово по форме (лафзан) в джарр, а по месту в предложении (махаллян) — в раф' или насб.⁣", "⁣⁣**⁣2. Где часто встречается.⁣**⁣ В хабаре ⁣لَيْسَ⁣: ⁣لَيْسَ السَّفَرُ بِحَرَامٍ⁣ — ⁣حَرَامٍ⁣ на месте насб.⁣"]], "JMSM": ["Жамъ музаккар солим", ["ـُونَ / ـِينَ қўшимчали кўплик: рафда و، насб ва жарда ي: الْمُسْرِفُونَ — الْمُسْرِفِينَ.", "**1. Нуни.** Охиридаги ن фатҳали, бирликдаги танвин ўрнига келади; изофада тушади: مُعَلِّمُو الْمَدْرَسَةِ.", "**2. Мулҳақлари.** عِشْرُونَ … تِسْعُونَ، أُولُو، أَهْلُونَ ҳам шундай турланади."]]};

function catOf(o){
  var ty=o.ty||"",r=o.role||"";
  if(/[Фф]еъл/.test(ty))return "f";
  if(/[Мм]афъул мутлақ/.test(r))return "-";
  if(/^Ҳарф \(жарр ҳарфи\)/.test(ty))return ">";
  if(/^(Сифат|Мудоф илайҳ|Атф|Бадал|Ишоранинг)/.test(r))return "^";
  if(/^Ҳарф/.test(ty))return "";
  if(/^Хабар|нинг хабари/.test(r))return "x";
  if(/^Мубтадо|^Сарлавҳа: мубтадо|мубтадо$|нинг исми/.test(r))return "m";
  if(/^Фоил/.test(r))return "o";

  if(/^Жар-мажрур/.test(ty)||/жарр ҳарфидан кейин/i.test(r))return "j";
  if(/^Зарф|^Ҳол|[Ҳҳ]ол ўрнида/.test(r)||/зарф/.test(ty))return "h";
  return "";
}

}
