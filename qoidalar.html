  var jami = 0; B.forEach(function (b) { jami += b[1].length; });
  var CHV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
  function kor(x) { var v = V[x[0]]; return v ? 0 : 0; }   /* ko'rilgan videolar — videolar qo'shilganda */
  function qator(x, b) {
    var v = ochiq(x[0]);
    return '<' + (v ? 'a href="#d' + x[0] + '"' : 'div') + ' class="g-r' + (v ? '' : ' tz') + '"><span class="no">' + x[0] + '</span><span class="nm">' + arb(x[1]) +
      (b != null ? '<small>' + bobN(b) + '</small>' : '') + '</span>' + (v ? '<span class="g-bl">' + (oq()[x[0]] ? '<i>✓</i>' : '') + belgi(x[0]) + '</span>' : '<span class="q-tzb">Тез орада</span>') + (v ? '</a>' : '</div>');
  }
  var app = document.getElementById('app'), h1 = document.getElementById('gh1'), bk = document.getElementById('gbk');

  function bosh() {
    var h = (RU ? '' : '<div class="g-sr">' + SR + '<input id="gq" type="search" placeholder="Мавзу қидириш" autocomplete="off" aria-label="Мавзу қидириш"></div>') +
      '<div class="g-tl">' + karta(SARF, '') + karta(NAHV, '') + '</div>' + karta(ESH, 'g-es');
    if (RU) h += '<a class="q-rw" id="gru" style="margin-top:20px"><span class="t"><span class="n">Татбиқ</span></span>' + CH + '</a>';
    else h += '<div id="gnt" hidden></div><a class="g-vk" id="gvk" href="#v"><span class="kt" style="background-image:url(' + KV + ')"></span>' +
      '<span class="t"><b>Татбиқ</b><span class="ar" lang="ar">اَلتَّطْبِيقُ</span><small>Араб тили грамматикаси</small><small>' + YI + ' боб · ' + jami + ' дарс</small></span>' + CHV + '</a>';
    app.innerHTML = h;
    if (RU) { [].forEach.call(app.querySelectorAll('.k-c, #gru'), function (a) { if (!/nahv\.html$/.test(a.getAttribute('href') || '')) Qobiq.tez(a); }); return; }
    /* qidiruv: mavzu nomi yoki dars raqami bo'yicha; natija — ro'yxat, video kartasi o'rnida */
    var q = document.getElementById('gq'), nt = document.getElementById('gnt'), vk = document.getElementById('gvk');
    q.oninput = function () {
      var t = q.value.trim().toLowerCase(), r = [];
      if (t) B.forEach(function (b, i) { b[1].forEach(function (x) { if ((x[1] + ' ' + (x[2] || '')).toLowerCase().indexOf(t) >= 0 || String(x[0]) === t) r.push(qator(x, i)); }); });
      nt.hidden = !t; vk.hidden = !!t;
      nt.innerHTML = t ? (r.length ? '<div class="g-nt">' + r.join('') + '</div>' : '<p class="g-yo">Ҳеч нарса топилмади</p>') : '';
    };
  }
  function javon() {
    var o = oq(), jk = 0; for (var n in o) if (o[n]) jk++;
    var y = B[YI][1][0], yo = ochiq(y[0]);
    app.innerHTML = '<div class="g-kh"><img src="' + KV + '" alt="Татбиқ — араб тили грамматикаси" width="600" height="900"><small>' + YI + ' боб · ' + jami + ' дарс · ' + jk + ' таси ўқилди</small></div>' +
      '<div class="g-h"><span>Мундарижа</span><span>' + YI + ' боб</span></div><div class="g-sh">' + B.slice(0, YI).map(function (b, i) {
      var n = b[1].length, k = sana(b[1]);
      return '<a class="g-cv" href="#v' + (i + 1) + '" style="background-color:' + M[i][1] + ';background-image:url(' + rsm(i) + ')"><span class="nb"><span>' + (i + 1) + '-боб</span><span>' + k + ' / ' + n + '</span></span>' +
        '<span class="bt"><span class="ar" lang="ar">' + M[i][0] + '</span><span class="uz">' + arb(b[0]) + '</span><span class="g-pr"><i style="width:' + Math.round(k / n * 100) + '%"></i></span></span></a>';
    }).join('') + '</div>' +
      '<' + (yo ? 'a href="#d' + y[0] + '"' : 'div') + ' class="g-yk' + (yo ? '' : ' tz') + '"><span class="ar" lang="ar">' + M[YI][0] + '</span><span class="t"><b>Якуний дарс · ' + y[0] + '</b><small>' + arb(y[1]) + '</small></span>' +
      (yo ? CHV : '<span class="q-tzb">Тез орада</span>') + (yo ? '</a>' : '</div>');
  }
  function bob(i) {
    var b = B[i], d = b[1], k = sana(d);
    app.innerHTML = '<div class="g-bb" style="background-color:' + M[i][1] + ';background-image:url(' + rsm(i) + ')"><span class="nb"><span>' + (i + 1) + '-боб · ' + d[0][0] + '–' + d[d.length - 1][0] + '-дарслар</span></span>' +
      '<div class="ar" lang="ar">' + M[i][0] + '</div><b>' + arb(b[0]) + '</b><small>' + k + ' / ' + d.length + ' ўқилди</small><span class="g-pr"><i style="width:' + Math.round(k / d.length * 100) + '%"></i></span></div>' +
      '<div class="g-nt">' + d.map(function (x) { return qator(x); }).join('') + '</div>';
  }
  /* #dN — dars sahifasi: «Татбиқ» kitobi matni + video (tatbiq.js; 21.11.2026) */
  var ROY = []; B.forEach(function (b, i) { b[1].forEach(function (x) { ROY.push([x[0], x[1], i]); }); });
  function topD(n) { for (var k = 0; k < ROY.length; k++) if (ROY[k][0] === n) return k; return -1; }
  function dars(n) {
    var k = topD(n), x = ROY[k], i = x[2], old = null, keyin = null;
    for (var a = k - 1; a >= 0; a--) if (ochiq(ROY[a][0])) { old = ROY[a]; break; }
    for (var b = k + 1; b < ROY.length; b++) if (ochiq(ROY[b][0])) { keyin = ROY[b]; break; }
    var o = { nom: x[1], bob: bobN(i), v: V[n], old: old, keyin: keyin };
    try { var q = oq(); if (!q[n]) { q[n] = 1; localStorage.setItem('tb-oqildi', JSON.stringify(q)); } } catch (e) {}
    function chiz() { if (!window.Tatbiq || !Tatbiq.chiz(n, app, o)) app.innerHTML = '<p class="g-yo">Тез орада</p>'; }
    if (window.Tatbiq) return chiz();
    app.innerHTML = '<p class="g-yo">…</p>';
    var s = document.createElement('script'); s.src = 'tatbiq.js'; s.onload = chiz;
    s.onerror = function () { app.innerHTML = '<p class="g-yo">Юкланмади. Интернетни текширинг.</p>'; };
    document.head.appendChild(s);
  }
  /* ko'rinishlar: «» — bosh, #v — boblar javoni, #vN — bob ichi, #dN — dars sahifasi */
  var ichki = false;
  function korsat() {
    var dm = /^#d(\d+)$/.exec(location.hash);
    if (!RU && dm && topD(+dm[1]) >= 0 && ochiq(+dm[1])) { h1.textContent = dm[1] + '-дарс'; bk.hidden = false; dars(+dm[1]); window.scrollTo(0, 0); return; }
    var m = /^#v(\d*)$/.exec(location.hash), i = m && m[1] ? +m[1] - 1 : -1;
    if (RU || !m || (m[1] && (!B[i] || i === YI))) { h1.textContent = 'Грамматика'; bk.hidden = true; bosh(); }
    else if (i < 0) { h1.textContent = 'Татбиқ'; bk.hidden = false; javon(); }
    else { h1.textContent = (i + 1) + '-боб'; bk.hidden = false; bob(i); }
    window.scrollTo(0, 0);
  }
  bk.onclick = function () {
    var dm = /^#d(\d+)$/.exec(location.hash), k = dm ? topD(+dm[1]) : -1;
    if (ichki) history.back();
    else location.replace(k >= 0 ? (ROY[k][2] === YI ? '#v' : '#v' + (ROY[k][2] + 1)) : /^#v\d+$/.test(location.hash) ? '#v' : '#');
  };
  window.addEventListener('hashchange', function () { ichki = true; korsat(); });
  korsat();
  if (window.Qobiq) Qobiq.nav('qoida');
})();
</script>
