<style>
@font-face{font-family:"DarsNaskh";src:url(naskh.woff)}
:root{--tq-qy:#e8b4ae;--tq-ok:#17794a;--tq-okb:rgba(23,121,74,.12);--tq-no:#b3261e;--tq-nob:rgba(179,38,30,.10);--tq-act:#fff;--tq-an:#2f6fc0;--tq-ph:#8a5a00;--tq-phb:rgba(214,160,60,.22)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tq-qy:#a8605a;--tq-ok:#7ad9a8;--tq-okb:rgba(122,217,168,.16);--tq-no:#ff9b91;--tq-nob:rgba(255,155,145,.14);--tq-act:#06281d;--tq-an:#8ab8f5;--tq-ph:#f0c870;--tq-phb:rgba(232,192,106,.18)}}
:root[data-theme="dark"]{--tq-qy:#a8605a;--tq-ok:#7ad9a8;--tq-okb:rgba(122,217,168,.16);--tq-no:#ff9b91;--tq-nob:rgba(255,155,145,.14);--tq-act:#06281d;--tq-an:#8ab8f5;--tq-ph:#f0c870;--tq-phb:rgba(232,192,106,.18)}
body{margin:0;background-color:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.w{max-width:560px;margin:0 auto;padding:12px 16px calc(104px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
body.tq-ses .w{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:12px;min-height:48px;margin:-12px -16px 14px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--em2,#0c5e3f);color:#fff}
.top a{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.14);border:0;color:#fff;text-decoration:none;font-size:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.top small{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;color:#f6dc94;text-transform:uppercase}
.top h1{font-size:24px;line-height:1.15;margin:0}
.ar{font-family:"DarsNaskh","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;font-weight:400;font-size:inherit;line-height:inherit}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

.tq-c{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:18px 16px;margin:0 0 12px;box-shadow:var(--sh)}
.tq-h{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mu);text-transform:uppercase;margin:0 0 6px}
.tq-mu{font-size:13.5px;color:var(--mu)}
.tq-b{display:block;width:100%;height:54px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);font-size:17px;font-weight:650}
.tq-b1{background:var(--ac);border-color:var(--ac);color:var(--tq-act)}
.tq-b:active{transform:scale(.985)}

/* бош кўриниш */
.tq-dn{text-align:center;padding:28px 16px}
.tq-dn h2{font-size:22px;margin:0 0 2px}
.tq-dn p{margin:0;color:var(--mu)}
.tq-big{display:flex;align-items:baseline;gap:6px;margin:0 0 10px;font-variant-numeric:tabular-nums}
.tq-big b{font-size:34px;line-height:1.1;font-weight:700;color:var(--ac)}
.tq-big span{font-size:17px;color:var(--mu)}
.tq-pr{height:6px;border-radius:3px;background:var(--tint);overflow:hidden}
.tq-pr i{display:block;height:100%;border-radius:3px;background:var(--ac);transition:width .35s ease}
.tq-st .tq-pr{height:10px;border-radius:5px}
.tq-st .tq-pr i{border-radius:5px}
.tq-c .tq-pr{margin:0 0 10px}
.tq-k.tq-bo:not(.och){cursor:pointer;-webkit-tap-highlight-color:transparent}
.tq-sn{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:8px 10px 8px 12px;border:1px dashed var(--bd);border-radius:12px;font-size:13.5px;color:var(--mu)}
.tq-sn span{flex:1}
.tq-sn button{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);font-size:13.5px;font-weight:600}

/* машғулот */
.tq-st{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.tq-st button{width:44px;height:44px;border-radius:12px;background:var(--cd);border:1px solid var(--bd);font-size:18px;flex-shrink:0}
.tq-st .tq-pr{flex:1}
.tq-st span{min-width:28px;text-align:right;font-size:14px;font-weight:600;color:var(--mu);font-variant-numeric:tabular-nums}
.tq-st button:disabled{opacity:.35}
.tq-st #orq svg{width:20px;height:20px;display:block;margin:auto}
.tq-bh{display:flex;align-items:center;justify-content:center;gap:7px;height:54px;border-radius:14px;font-size:17px;font-weight:650}
.tq-bh.ok{background:var(--tq-okb);color:var(--tq-ok)}
.tq-bh.no{background:var(--tq-nob);color:var(--tq-no)}
.tq-k{min-height:46vh;display:flex;flex-direction:column;padding-top:14px}
.tq-l{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mu);text-transform:uppercase}
.tq-l em{font-style:normal;letter-spacing:.04em;color:var(--ac);background:var(--tint);border-radius:6px;padding:1px 7px}
.tq-f{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px 0 14px}
.tq-w{font-size:46px;line-height:1.7}
.tq-m{font-size:21px;line-height:1.4;font-weight:600}
.tq-m div+div{margin-top:2px}
/* 23.11.2026: bitta ma'noning variantlari — har biri o'z qatorida, orasida qisqa chiziq (bitta gapga o'xshamasin); misol tarjimasi ham */
.tq-mv>div+div::before,.tq-tv>span+span::before{content:'';display:block;width:26px;height:2px;border-radius:1px;background:currentColor;opacity:.22;margin:7px auto 6px}
.tq-tv>span{display:block}
.tq-tv>span+span::before{width:20px;margin:5px auto 4px}
.tq-r{margin:0 -4px;padding:16px 14px 16px;border-radius:16px;background:var(--tint);text-align:center}
@media (prefers-reduced-motion:no-preference){.tq-r{animation:tqo .28s cubic-bezier(.2,.9,.25,1.05)}}
@keyframes tqo{from{opacity:0;transform:translateY(10px)}}
.tq-r .tq-w{font-size:40px;line-height:1.6}
.tq-r .tq-m{font-size:24px;line-height:1.35;font-weight:700}
/* so'z va yonida muannasi */
/* 21.11.2026: so'z qatori — hamma shakllar bir xil kattalikda, chiziqcha bilan (lug'atdagidek); sig'masa kichrayadi (sigdir()) */
.tq-wq{width:100%;display:flex;flex-wrap:nowrap;align-items:baseline;justify-content:center;row-gap:2px;font-size:36px;line-height:1.6;color:var(--tx)}
.tq-wq.tq-ws{flex-wrap:wrap}
.tq-sf{flex:none;white-space:nowrap}
.tq-sf i{font-style:normal;color:var(--mu);margin:0 .3em;font-size:.6em}
.tq-sf small{font-size:.55em;color:var(--mu);margin-left:.25em}
.tq-r .tq-wq{font-size:32px}
/* fe'l bilan keladigan harf (sila) va unga mos joylar — bitta rangda */
.tq-pp{display:inline-block;font-size:24px;line-height:1.5;padding:0 12px 3px;border-radius:10px;background:var(--tq-phb);color:var(--tq-ph)}
.tq-ph{background:var(--tq-phb);color:var(--tq-ph);border-radius:6px;padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.tq-pa{margin:2px 0 4px}
.tq-gp .tq-ph.tq-pq{padding:0}
.tq-th{color:var(--ac);background:var(--tint);border-radius:5px;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
/* boshqa shakllar — kichik yorliqlar */
.tq-fm{margin-top:12px;font-size:14px;color:var(--mu);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}
.tq-fm span{display:inline-flex;align-items:center;gap:6px;padding:2px 12px 4px;border-radius:12px;background:var(--cd);border:1px solid var(--bd)}
.tq-fm small{font-size:12px;font-weight:700;color:var(--mu)}
.tq-fm bdi,.tq-fm.ar{font-size:23px;line-height:1.6;color:var(--tx)}
.tq-fm.ar{display:block;padding:0;border:0;background:none}
.tq-gp{margin-top:6px;font-size:25px;line-height:1.9;color:var(--tx);max-width:100%}
.tq-gp .tq-gh{color:var(--ac);background:var(--tint);border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.tq-gd{margin-top:2px;font-size:12px;font-weight:600;color:var(--mu)}
.tq-r .tq-gp{font-size:23px}
.tq-gt{margin-top:10px;font-size:15.5px;line-height:1.45;color:var(--mu)}
/* 21.11.2026: «Маъноси?» — tarjima o'z qatori tagida, joyi oldindan ajratilgan (karta sakramaydi) */
.tq-fy{justify-content:flex-start;padding-top:10px}
.tq-oc{visibility:hidden}
.tq-k.och .tq-oc{visibility:visible}
@media (prefers-reduced-motion:no-preference){.tq-k.och .tq-oc{animation:tqo .28s cubic-bezier(.2,.9,.25,1.05)}}
.tq-ma{margin-top:8px}
.tq-ma .tq-m{font-size:23px;line-height:1.35;font-weight:700}
.tq-gb{width:100%;margin-top:16px;padding-top:10px;border-top:1px solid var(--bd)}
.tq-gb .tq-gt{margin-top:0}
.tq-gb .tq-gd{margin-top:6px}
.tq-r:empty{display:none}
/* 23.11.2026: «Маъноси?» — gap tepada, so'z o'rtada, javob qutisi eng tagida */
.tq-yq{width:100%}
.tq-yq:empty{display:none}
.tq-yq .tq-gb{margin:0 0 12px;padding:0 0 12px;border-top:0;border-bottom:1px solid var(--bd)}
.tq-yq .tq-gp{margin-top:0}
.tq-jq{box-sizing:border-box;width:100%;margin-top:14px;display:grid;place-items:center;min-height:92px;padding:12px 14px;border-radius:16px;border:1.5px dashed var(--bd);border-color:color-mix(in srgb,var(--mu) 42%,transparent);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .2s,border-color .2s}
.tq-jq>*{grid-area:1/1}
.tq-jb{font-size:34px;font-weight:600;line-height:1;color:var(--mu);opacity:.55}
.tq-k.och .tq-jq{border-style:solid;border-color:transparent;background:var(--tint);cursor:default}
.tq-k.och .tq-jb{visibility:hidden}
.tq-jo{width:100%;margin-top:0}
.tq-jo .tq-gt{margin-top:9px;padding-top:9px;border-top:1px solid var(--bd)}
.tq-ex{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--cd);font-size:14.5px;color:var(--mu)}
.tq-ex .ar{display:block;font-size:22px;line-height:1.8;color:var(--tx)}
.tq-au{margin-left:auto;width:42px;height:42px;border-radius:50%;border:0;background:var(--tint);color:var(--ac);display:flex;align-items:center;justify-content:center;padding:0}
.tq-au[hidden]{visibility:hidden}   /* 21.11.2026: joyi turadi — ochilganda karta sakramaydi */
.tq-hn{margin-top:14px;font-size:13.5px;color:var(--mu);padding:5px 12px;border-radius:10px;background:var(--tint)}
.tq-fl{display:flex;flex-direction:column;gap:6px;text-align:left}
.tq-fl div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 12px;border-radius:12px;background:var(--cd)}
.tq-fl span{font-size:13.5px;font-weight:600;color:var(--mu)}
.tq-fl b{font-size:26px;line-height:1.5;font-weight:400}
.tq-ht{font-size:22px;font-weight:700}
.tq-au svg{width:22px;height:22px}
.tq-au:active{transform:scale(.92)}
.tq-pl{width:96px;height:96px;border-radius:50%;border:0;background:var(--ac);color:var(--tq-act);font-size:36px;padding-left:6px}
@media (prefers-reduced-motion:no-preference){.tq-r{animation:tqin .18s ease-out}}
@keyframes tqin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* сўз охири (машқ саволи) */
.tq-g{font-size:30px;line-height:1.9;text-align:center;margin:14px 0 2px}
.tq-g.tq-og{font-size:22px;color:var(--mu);margin:10px 0 -8px}
.tq-g .tq-t{background:var(--tint);color:var(--ac);border-radius:8px;padding:0 6px}
.tq-g .tq-hk{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:10px;text-decoration-thickness:2px}
.tq-tr{text-align:center;font-size:14.5px;color:var(--mu);margin:0 0 14px}
.tq-o{display:grid;gap:8px}
.tq-o button{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:4px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);text-align:left}
.tq-o button b{font-weight:400;font-size:27px;line-height:1.7}
.tq-o button span{font-size:14px;color:var(--mu)}
.tq-o button.ok{border-color:var(--tq-ok);background:var(--tq-okb)}
.tq-o button.ok span{color:var(--tq-ok);font-weight:700}
.tq-o button.no{border-color:var(--tq-no);background:var(--tq-nob)}
.tq-o button.no span{color:var(--tq-no);font-weight:700}
.tq-s{margin-top:12px;font-size:15px;line-height:2}
.tq-ai{font-size:1.5em;line-height:1}

/* ёрлиқлар: Такрор / Луғат */
/* луғат: сўз базаси */
.tq-big.sm span{font-size:15px}
.lg-br{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;background:var(--tint);margin:0 0 10px}
.lg-br i{display:block;min-width:3px}
.lg-lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mu)}
.lg-lg span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.lg-lg i{width:9px;height:9px;border-radius:50%;background:var(--bd)}
.lg-lg b{color:var(--tx);font-variant-numeric:tabular-nums}
.lg-br .m,.lg-lg .m{background:#0c5e3f}.lg-br .g,.lg-lg .g{background:#2fa36f}.lg-br .o,.lg-lg .o{background:#d9a23a}.lg-br .b,.lg-lg .b{background:var(--tq-no)}
.lg-br .a,.lg-lg .a,.lg-r.a .lg-p i{background:var(--tq-an)}.lg-br .t,.lg-lg .t{background:#8fa3b8}
.lg-q{display:block;width:100%;height:48px;box-sizing:border-box;margin:0 0 8px;padding:0 14px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit;font-size:16px}
.lg-ch{display:flex;gap:6px;margin:0 -16px 10px;padding:0 16px 2px;overflow-x:auto;scrollbar-width:none}
.lg-ch::-webkit-scrollbar{display:none}
.lg-ch button{flex-shrink:0;height:38px;padding:0 13px;border-radius:19px;border:1px solid var(--bd);background:var(--cd);color:var(--mu);font-size:14px;font-weight:600;white-space:nowrap}
.lg-ch button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--tq-act)}
.lg-d{display:flex;align-items:baseline;gap:8px;margin:16px 4px 6px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--ac)}
.lg-d span{margin-left:auto;font-weight:500;letter-spacing:0;color:var(--mu)}
.lg-l{background:var(--cd);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.lg-r{display:flex;align-items:center;gap:8px;min-height:60px;padding:4px 4px 4px 14px;border-top:1px solid var(--bd)}
.lg-r:first-child{border-top:0}
.lg-w{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:4px 0;border:0;background:none;text-align:left}
.lg-w b{font-size:24px;line-height:1.55;font-weight:400}
.lg-w span{font-size:14px;line-height:1.3;color:var(--mu)}
.lg-w b span{font-size:18px;line-height:1.5;color:var(--tx)}
.lg-w b{text-align:start}
.lg-w small,.mq-x small,.tq-s small{display:block;font-size:12.5px;line-height:1.5;color:var(--mu)}
.lg-w small .ar,.mq-x small .ar,.tq-s small .ar{font-size:19px;line-height:1.5;color:var(--tx)}
.lg-s{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:11.5px;color:var(--mu);white-space:nowrap}
.lg-p{display:flex;gap:2px}
.lg-p i{width:7px;height:14px;border-radius:2px;background:var(--bd)}
/* 23.11.2026: «қийин» so'zi o'rniga — kamida QIYIN marta xato qilingan, hali bilinmagan so'zda bo'sh chiziqlar qizg'ish */
.lg-r.qy .lg-p i{background:var(--tq-qy)}
.lg-p.d1 i:nth-child(-n+1),.lg-p.d2 i:nth-child(-n+2){background:#d9a23a}
.lg-p.d3 i:nth-child(-n+3){background:#2fa36f}
.lg-p.d4 i{background:#0c5e3f}
.lg-r.b .lg-p.d1 i:nth-child(-n+1),.lg-r.b .lg-p.d2 i:nth-child(-n+2){background:var(--tq-no)}
.lg-bm,.lg-ab{width:40px;height:44px;flex-shrink:0;border:0;border-radius:12px;background:none;color:var(--bd);display:flex;align-items:center;justify-content:center}
.lg-sp{width:40px;flex-shrink:0}
.lg-mh{margin:-4px 4px 12px;padding:10px 12px;border-radius:12px;background:rgba(58,115,204,.09);font-size:13.5px;line-height:1.45;color:var(--tx)}
.lg-mh{display:flex;gap:8px;align-items:flex-start}.lg-mh svg{width:17px;height:17px;flex-shrink:0;margin-top:1px;color:var(--tq-no)}
.lg-w .lg-kq{color:#1f8f5c;font-weight:600}
.lg-ts{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;max-width:calc(100% - 40px);padding:11px 16px;border-radius:14px;background:#0c5e3f;color:#fff;font-size:14.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);text-align:center}
.lg-bm svg,.lg-ab svg{width:22px;height:22px}
.lg-ab[aria-pressed="true"]{color:var(--tq-an)}
.lg-ab[aria-pressed="true"] circle{fill:currentColor}
.lg-ab[aria-pressed="true"] path{stroke:var(--cd)}
.lg-hn{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0 4px 10px;font-size:13px;color:var(--mu)}
.lg-hn span{display:inline-flex;align-items:center;gap:5px}
.lg-hn svg{width:16px;height:16px}
.lg-hn span:first-child svg{color:var(--tq-an)}
.lg-hn span:last-child svg{color:var(--tq-no)}
.lg-bm[aria-pressed="true"]{color:var(--tq-no)}
.lg-bm[aria-pressed="true"] svg{fill:currentColor}
.lg-e{padding:28px 16px;text-align:center;color:var(--mu)}
/* Луғат kartasidagi takror tugmasi va «bugunga tamom» (13.11.2026: Такрор + Луғат bitta) */
/* «Машқ» bosh ko'rinishi (14.11.2026, 2-variant): takror yashil tasma ichida, statistika (reyting qatori 19.11.2026 da olib tashlandi) */
.top.mq-top{flex-direction:column;align-items:stretch;gap:12px;padding-bottom:16px}
.mq-h{display:flex;align-items:center;gap:14px;padding:14px 14px 14px 16px;border-radius:18px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16)}

    /* 23.11.2026 (foydalanuvchi: «harfini ham ko'rsatish kerak — qaysi ma'no so'ralayotganini bilib olish oson»): fe'lning harfi «Маъноси?»da
       savol tomonida ham — shakllar tagidagi belgi va gapdagi harf boshidanoq o'z rangida; ma'no va tarjima — ochilganda */
    /* 23.11.2026 (foydalanuvchi: «avval matn, keyin so'zning o'zi, eng tagida ma'nosi topiladigan joy», «qil»): «Маъноси?» tartibi —
       tepada dars gapi (so'z ajratilgan) va «N-дарс», chiziq, so'z + harfi, eng tagida javob qutisi (punktir, ichida «?»).
       «Кўрсатиш» yoki qutining o'zini bossa — ma'no va gap tarjimasi shu quti ichida ochiladi. Ikkalasi bitta grid katakda —
       quti balandligi boshidanoq javobniki, hech narsa surilmaydi. */
    if (t === 'a') {
      var gs = gapS(r), gtr = gs && gs.tr ? '<div class="tq-gt">' + trHtml(r, gs.tr, p) + '</div>' : '';
      old = '<div class="tq-yq">' + gapAr(r, 0, p) + '</div>' + sozQator(r) + silaB(p) +
        '<div class="tq-jq" id="jq"><div class="tq-jb" aria-hidden="true">?</div><div class="tq-oc tq-ma tq-jo">' + ma + gtr + '</div></div>';
      orqa = '';
    }   /* boshqa misol yo'q — gap bitta (21.11.2026, foydalanuvchi: «qil»); misollar «Луғат» ro'yxatida */   /* gap old tomonda — «Арабчаси?»da javobni ochib qo'ymasin */
    else if (t === 'u') { old = manolar(n); orqa = sozQator(r) + silaB(p) + gapAr(r, 1, p); }   /* qo'shimcha misol yo'q — gap bitta (23.11.2026, foydalanuvchi: «Арабчаси?»da ham ikki misol tushunarsiz) */
    else { old = '<button class="tq-pl" id="pl" aria-label="Тинглаш">▶</button>'; orqa = sozQator(r) + silaB(p) + ma + gapAr(r, 1, p); }
    /* tinglash: ochilganda o'zi o'qiladi; qayta eshitish — burchakdagi kichik tugma (katta 🔊 o'rniga) */
    var sp = n.au && t !== 'o' ? '<button class="tq-au" id="sp" aria-label="Қайта эшитиш" hidden>' + KARNAY + '</button>' : '';
    app.innerHTML = bosh_ + '<section class="tq-c tq-k" id="kk"><div class="tq-l"><span>' + sorov + '</span>' + (x.yangi ? '<em>янги</em>' : '') + sp +
      '</div><div class="tq-f' + (t === 'a' ? ' tq-fy' : '') + '">' + old + '</div><div class="tq-r" id="rv" hidden>' + orqa + '</div></section>';
    tugma('<button class="tq-b tq-b1" id="ko">Кўрсатиш</button>');
    sigdir(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(sigdir);
    if (t === 'o') { document.getElementById('pl').onclick = function () { ovoz(n.au); }; ovoz(n.au); }
    var kk = document.getElementById('kk'), ochildi = false;
    var och = function () {
      if (ochildi || kk.classList.contains('och')) return;
      ochildi = true;
      aylan(kk, function () {
        document.getElementById('rv').hidden = false; kk.classList.add('och'); sigdir();
        tugma('<button class="tq-b" id="j0">Билмадим</button><button class="tq-b tq-b1" id="j1">Билдим</button>', true);
        document.getElementById('j0').onclick = function () { javob(false); };
        document.getElementById('j1').onclick = function () { javob(true); };
        var sp = document.getElementById('sp');
        if (sp) { sp.hidden = false; sp.onclick = function () { ovoz(n.au); }; ovoz(n.au); }
      }, sigdir);
    };
    document.getElementById('ko').onclick = och;
    kartaBos(kk, och);                                   /* kartaning istalgan joyini bosish ham ochadi (javob qutisi ham shu ichida) */
  }

  /* 24.11.2026 (foydalanuvchi: «faqat tagidagi tugma emas, kartaning o'zini bosib ham ochsa — motion qo'sh, kartalar aylanadi»):
     karta bosilsa ochiladi (ichidagi tugmalar — ovoz va h.k. — o'z ishini qiladi); baho faqat pastdagi «Билмадим / Билдим» bilan.
     Ochilishda karta Y o'qi atrofida aylanadi: 0 → 90° (yonboshdan — ko'rinmay qoladi), shu lahzada javob ochiladi, −90° → 0.
     «Ҳаракатни камайтириш» yoqilgan telefonda yoki Web Animations yo'q bo'lsa — aylanmasdan darhol ochiladi. */
  function kartaBos(k, och) {
    if (!k) return;
    k.classList.add('tq-bo');
    k.addEventListener('click', function (e) { if (!e.target.closest('button,a,input')) och(); });
  }
  function aylan(k, f, keyin) {
    var kam = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!k || !k.animate || kam) { f(); if (keyin) keyin(); return; }
    var P = 'perspective(1400px) ';
    var a = k.animate([{ transform: P + 'rotateY(0deg)' }, { transform: P + 'rotateY(90deg)' }], { duration: 170, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' });
    a.onfinish = function () {
      f();
      var b = k.animate([{ transform: P + 'rotateY(-90deg)' }, { transform: P + 'rotateY(0deg)' }], { duration: 240, easing: 'cubic-bezier(0,0,.2,1)' });
      a.cancel();
      b.onfinish = function () { if (keyin) keyin(); };
    };
  }

  /* shakl kartasi (takror.js `w…s`): ko'pligi / fe'l shakllari — eslab ko'rib o'zini baholash; harf turi — 4 variant */
  function shaklK(bosh_, x) {
    var n = cur.n, r = n.r, t = cur.sh, soz_ = '<div class="ar tq-w" lang="ar">' + esc(r.ar) + '</div>';
    var lbl = '<div class="tq-l"><span>' + SHS[t] + '</span>' + (x.yangi ? '<em>янги</em>' : '') + '</div>';
    if (t !== 't' || harfTuri(r)) {
      app.innerHTML = bosh_ + '<section class="tq-c tq-k">' + lbl + '<div class="tq-f">' + soz_ + '<div class="mq-s">' + esc(t === 't' ? manoT(r) : mano1(r)) + '</div><div class="tq-hn">' + shaklSorov(r, t) + '</div></div><div class="tq-r" id="rv" hidden>' + shaklMatn(r, t) + '</div></section>';
      tugma('<button class="tq-b tq-b1" id="ko">Кўрсатиш</button>');
      var sk = app.querySelector('section.tq-c'), ochildi = false;
      var och = function () {
        if (ochildi) return;
        ochildi = true;
        aylan(sk, function () {
          document.getElementById('rv').hidden = false; sk.classList.add('och');
          tugma('<button class="tq-b" id="j0">Билмадим</button><button class="tq-b tq-b1" id="j1">Билдим</button>', true);
          document.getElementById('j0').onclick = function () { javob(false); };
          document.getElementById('j1').onclick = function () { javob(true); };
        });
      };
      document.getElementById('ko').onclick = och;
      kartaBos(sk, och);                                 /* kartaning o'zini bosish ham ochadi (24.11.2026) */
      return;
    }
    var ops = harfVar(r), ht = harfTuri(r), bajarildi = false;
    app.innerHTML = bosh_ + '<section class="tq-c tq-k">' + lbl + '<div class="tq-f" style="flex:none;padding-bottom:6px">' + soz_ + '<div class="mq-s">' + esc(manoT(r)) + '</div></div>' +
      '<div class="tq-o">' + ops.map(function (o, i) { return '<button data-n="' + i + '"><span class="uz">' + esc(o) + '</span></button>'; }).join('') + '</div></section>';
    bar.hidden = true; bar.innerHTML = '';
    [].forEach.call(app.querySelectorAll('.tq-o button'), function (b) {
      b.onclick = function () {
        if (bajarildi) return;
        bajarildi = true;
        var k = +b.getAttribute('data-n'), ok = ops[k] === ht;
        [].forEach.call(app.querySelectorAll('.tq-o button'), function (y) {
          var m = +y.getAttribute('data-n');
          if (ops[m] === ht) y.classList.add('ok'); else if (m === k) y.classList.add('no');
          y.disabled = true;
        });
        bYoz(cur.id, ok); if (ok) tozala(); else belgiXato(r.id); saqla(); tarixga(ok, 't');
        tugma('<button class="tq-b tq-b1" id="kn">Кейинги</button>');
        document.getElementById('kn').onclick = keyingi;
        if (ok) tmq = setTimeout(keyingi, 1000);
      };
    });
  }

  /* so'z oxiri harakati — dars «Машқ»idagi savol: gap harakatsiz, uch variant; to'g'rida 1 s dan keyin o'zi o'tadi */
  function qator(ws, ti, hk, ochiq) {
    return ws.map(function (w, j) {
      var c = j === ti ? 'tq-t' : (j === hk ? 'tq-hk' : '');
      return '<span' + (c ? ' class="' + c + '"' : '') + '>' + esc(j === ti && ochiq ? w[0] : plain(w[0])) + '</span>' + esc(w[1].replace('?', '؟'));
    }).join(' ');
  }
  function savol(bosh_, x) {
    var q = cur.s, ql = +q.k.split('-')[0], togri = q.gap[q.w][0], ops = q['var'].slice(), i, j, tmp, bajarildi = false;
    for (i = ops.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); tmp = ops[i]; ops[i] = ops[j]; ops[j] = tmp; }
    function chiz(ochiq) {
      var hk = q.hk || [-1, -1], h = '';
      if (q.oldgap) h += '<div class="tq-g tq-og ar" lang="ar">' + qator(q.oldgap, -1, ochiq ? hk[1] : -1, false) + '</div>';
      h += '<div class="tq-g ar" lang="ar">' + qator(q.gap, q.w, ochiq && hk[0] === ql && hk[1] !== q.w ? hk[1] : -1, ochiq) + '</div>';
      return h;
    }
    app.innerHTML = bosh_ + '<section class="tq-c tq-k"><div class="tq-l"><span>Сўз охири?</span>' + (x.yangi ? '<em>янги</em>' : '') + '</div>' +
      '<div id="qg">' + chiz(false) + '</div>' + (q.tr ? '<div class="tq-tr">' + esc(q.tr) + '</div>' : '') +
      '<div class="tq-o">' + ops.map(function (o, n) { return '<button data-n="' + n + '">' + '<b class="ar" lang="ar">' + esc(o[0]) + '</b><span>' + esc(o[2]) + '</span></button>'; }).join('') +
      '</div><div class="tq-s" id="qs" aria-live="polite"></div></section>';
    bar.hidden = true; bar.innerHTML = '';
    [].forEach.call(app.querySelectorAll('.tq-o button'), function (b) {
      b.onclick = function () {
        if (bajarildi) return;
        bajarildi = true;
        var n = +b.getAttribute('data-n'), ok = ops[n][0] === togri;
        [].forEach.call(app.querySelectorAll('.tq-o button'), function (y) {
          var m = +y.getAttribute('data-n');
          if (ops[m][0] === togri) y.classList.add('ok'); else if (m === n) y.classList.add('no');
          y.disabled = true;
        });
        document.getElementById('qg').innerHTML = chiz(true);
        if (q.sabab) document.getElementById('qs').innerHTML = mix(q.sabab);
        bYoz(cur.id, ok); saqla(); tarixga(ok, 't');
        tugma('<button class="tq-b tq-b1" id="kn">Кейинги</button>');
        document.getElementById('kn').onclick = keyingi;
        if (ok) tmq = setTimeout(keyingi, 1000);
      };
    });
  }

  yukla();
})();
</script>
