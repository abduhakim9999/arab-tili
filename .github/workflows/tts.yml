name: tts
on:
  push:
    paths: ['align/tts/**']
permissions:
  contents: write
concurrency: tts
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q edge-tts
      - run: python align/tts.py
      - run: |
          git config user.name "tts-bot"; git config user.email "tts-bot@users.noreply.github.com"
          git add align/out; git commit -m "tts natija" || exit 0
          git pull --rebase && git push
