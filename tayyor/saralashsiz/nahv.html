<script>
/* Эъроб аломатлари жадвали (11.11.2026). Маълумот битта жойда (W) — иккала ёрлиқ шундан чизилади.
   Ҳолат ранглари Таркиб палитрасидан (shell.css): раф = --co (фоил), насб = --cb (мафъул), жар = --cj (мажрур), жазм = --cf (феъл).
   Ҳавола: nahv.html#R | #N | #J | #Z (ихтиёрий :zamma, :vov …) — «Ҳолат бўйича» ёрлиғи очилиб, ўша қатор белгиланади. */
var K={R:['Раф','фоил ранги','اَلرَّفْعُ','var(--co)','исмда ва музорий феълда'],
       N:['Насб','мафъул ранги','اَلنَّصْبُ','var(--cb)','исмда ва музорий феълда'],
       J:['Жар','мажрур ранги','اَلْجَرُّ','var(--cj)','фақат исмда'],
       Z:['Жазм','феъл ранги','اَلْجَزْمُ','var(--cf)','фақат музорий феълда']};
/* аломат: [номи, белгиси, тури] */
var S={zamma:['замма','ـُ','ҳаракат'],fatha:['фатҳа','ـَ','ҳаракат'],kasra:['касра','ـِ','ҳаракат'],sukun:['сукун','ـْ','ҳаракат йўқ'],
       vov:['вов','و','ҳарф'],alif:['алиф','ا','ҳарф'],yo:['йо','ي','ҳарф'],nun:['нун','ن','ҳарф · охиридаги нун сақланади'],
       hazf:['ҳазф','∅','ҳарф ёки нун тушади']};
var ASL={R:'zamma',N:'fatha',J:'kasra',Z:'sukun'};
var ORD={R:['zamma','vov','alif','nun'],N:['fatha','alif','kasra','yo','hazf'],J:['kasra','yo','fatha'],Z:['sukun','hazf']};
/* сўз турлари. c: [ҳолат, аломат, катакдаги ёзув, олд ҳарф, мисол ([..] — аломат ҳарфи), «Ҳолат бўйича»да кўрсатилмасин] */
var W=[
 {g:'Ҳаракат билан эъробланади'},
 {uz:'Муфрад исм',ar:'الْمُفْرَدُ',c:[['R','zamma','замма','','الْمُعَلِّ[مُ]'],['N','fatha','фатҳа','','الْمُعَلِّ[مَ]'],['J','kasra','касра','','الْمُعَلِّ[مِ]']]},
 {uz:'Жам таксир',ar:'جَمْعُ التَّكْسِيرِ',c:[['R','zamma','замма','','الرِّجَا[لُ]'],['N','fatha','фатҳа','','الرِّجَا[لَ]'],['J','kasra','касра','','الرِّجَا[لِ]']]},
 {uz:'Жам муаннас солим',ar:'جَمْعُ الْمُؤَنَّثِ السَّالِمُ',c:[['R','zamma','замма','','الْمُسْلِمَا[تُ]'],['N','kasra','касра','','الْمُسْلِمَا[تِ]'],['J','kasra','касра','','الْمُسْلِمَا[تِ]']]},
 {uz:'Ғайри мунсариф исм',ar:'الْمَمْنُوعُ مِنَ الصَّرْفِ',c:[['R','zamma','замма','','أَحْمَ[دُ]',1],['N','fatha','фатҳа','','أَحْمَ[دَ]',1],['J','fatha','фатҳа','','أَحْمَ[دَ]']],
  n:'Танвин олмайди. <span class="ar">ال</span> билан келса ёки музоф бўлса, жарда касра олади: <span class="ar">فِي الْمَسَاجِدِ</span>.'},
 {uz:'Музорий феъл · охири соғлом',ar:'الْمُضَارِعُ الصَّحِيحُ الْآخِرِ',c:[['R','zamma','замма','','يَكْتُ[بُ]'],['N','fatha','фатҳа','لَنْ','يَكْتُ[بَ]'],['Z','sukun','сукун','لَمْ','يَكْتُ[بْ]']],
  n:'Охирига ҳеч нарса уланмаган музорий феъл.'},
 {uz:'Музорий феъл · охири иллатли',ar:'الْمُضَارِعُ الْمُعْتَلُّ الْآخِرِ',c:[['R','zamma','тақдирий замма','','يَدْعُو',1],['N','fatha','фатҳа','لَنْ','يَدْعُ[وَ]',1],['Z','hazf','ҳарф тушади','لَمْ','يَدْعُ']],
  n:'Жазмда иллат ҳарфи тушади: <span class="ar">لَمْ يَرْمِ، لَمْ يَسْعَ</span>. Охири алиф бўлса, насбда ҳам фатҳа тақдирий: <span class="ar">لَنْ يَسْعَى</span>.'},
 {g:'Ҳарф билан эъробланади'},
 {uz:'Тасния',ar:'الْمُثَنَّى',c:[['R','alif','алиф','','الْمُسْلِمَ[ا]نِ'],['N','yo','йо','','الْمُسْلِمَ[يْ]نِ'],['J','yo','йо','','الْمُسْلِمَ[يْ]نِ']]},
 {uz:'Жам музаккар солим',ar:'جَمْعُ الْمُذَكَّرِ السَّالِمُ',c:[['R','vov','вов','','الْمُسْلِمُ[و]نَ'],['N','yo','йо','','الْمُسْلِمِ[ي]نَ'],['J','yo','йо','','الْمُسْلِمِ[ي]نَ']]},
 {uz:'Беш исм',ar:'الْأَسْمَاءُ الْخَمْسَةُ',c:[['R','vov','вов','','أَبُ[و]كَ'],['N','alif','алиф','','أَبَ[ا]كَ'],['J','yo','йо','','أَبِ[ي]كَ']],
  n:'<span class="ar">أَبٌ، أَخٌ، حَمٌ، فُو، ذُو</span> — музоф бўлганда.'},
 {uz:'Афъоли хамса',ar:'الْأَفْعَالُ الْخَمْسَةُ',c:[['R','nun','нун сақланади','','يَكْتُبُو[نَ]'],['N','hazf','нун тушади','لَنْ','يَكْتُبُوا'],['Z','hazf','нун тушади','لَمْ','يَكْتُبُوا']],
  n:'<span class="ar">يَفْعَلَانِ، تَفْعَلَانِ، يَفْعَلُونَ، تَفْعَلُونَ، تَفْعَلِينَ</span>'}
];
function wd(t){return t.replace(/\[([^\]]+)\]/g,'<b>$1</b>')}
function lo(t){return t.charAt(0).toLowerCase()+t.slice(1)}
function drawLg(){
  var h='';['R','N','J','Z'].forEach(function(c){h+='<span style="--k:'+K[c][3]+'"><i></i><b>'+lo(K[c][0])+'</b></span>'});
  document.getElementById('lg').innerHTML=h;
}
function drawA(){
  var h='';
  W.forEach(function(w){
    if(w.g){h+='<div class="nv-g">'+w.g+'</div>';return}
    var vp=w.c.some(function(x){return x[3]});
    h+='<section class="nv-c"><div class="nv-h"><h2>'+w.uz+'</h2><span class="ar" lang="ar">'+w.ar+'</span></div><div class="nv-r">';
    w.c.forEach(function(x){
      h+='<div class="nv-k" style="--k:'+K[x[0]][3]+'"><span class="l">'+K[x[0]][0]+'</span>'+(vp?'<span class="p ar" lang="ar">'+(x[3]||'')+'</span>':'')+
        '<span class="a ar" lang="ar">'+wd(x[4])+'</span><span class="s">'+x[2]+'</span></div>';
    });
    h+='</div>'+(w.n?'<p class="nv-n">'+w.n+'</p>':'')+'</section>';
  });
  document.getElementById('pA').innerHTML=h;
}
function drawB(){
  var h='';
  ['R','N','J','Z'].forEach(function(c){
    h+='<section class="nv-c" id="'+c+'" style="--k:'+K[c][3]+'"><div class="nv-ch"><div><h2><i></i>'+K[c][0]+'</h2><small>'+K[c][4]+'</small></div><span class="ar" lang="ar">'+K[c][2]+'</span></div>';
    ORD[c].forEach(function(s){
      var asl=ASL[c]===s,it='';
      W.forEach(function(w){if(w.g)return;w.c.forEach(function(x){
        if(x[0]!==c||x[1]!==s||x[5])return;
        it+='<div class="nv-i"><span>'+lo(w.uz)+(x[2]!==S[s][0]?'<small>'+x[2]+'</small>':'')+'</span><span class="ar" lang="ar">'+(x[3]?'<i>'+x[3]+'</i> ':'')+wd(x[4])+'</span></div>';
      })});
      h+='<div class="nv-s" id="'+c+'-'+s+'"><div class="nv-sh"><span class="nv-gl'+(s==='hazf'?'':' ar')+(S[s][2].indexOf('ҳаракат')===0?' hr':'')+'" aria-hidden="true">'+S[s][1]+'</span><span class="nv-sn"><b>'+S[s][0]+'</b><small>'+S[s][2]+(asl?'':' · '+S[ASL[c]][0]+' ўрнида')+'</small></span>'+
        (asl?'<span class="nv-asl">асл аломат</span>':'')+'</div>'+it+'</div>';
    });
    h+='</section>';
  });
  document.getElementById('pB').innerHTML=h;
}
function tab(n,keep){
  var a=n==='A';
  document.getElementById('pA').hidden=!a;document.getElementById('pB').hidden=a;
  var tA=document.getElementById('tA'),tB=document.getElementById('tB');
  tA.className=a?'on':'';tB.className=a?'':'on';tA.setAttribute('aria-pressed',a);tB.setAttribute('aria-pressed',!a);
  if(!keep){try{sessionStorage.setItem('nahv-tab',n)}catch(e){}window.scrollTo(0,0)}
}
function go(){
  var m=location.hash.match(/^#([RNJZ])(?::([a-z]+))?$/);
  [].forEach.call(document.querySelectorAll('.nv-s.on,.nv-c.hit'),function(e){e.classList.remove('on','hit')});
  if(!m){var t=null;try{t=sessionStorage.getItem('nahv-tab')}catch(e){}tab(t==='B'?'B':'A',1);return}
  tab('B',1);
  var card=document.getElementById(m[1]),row=m[2]?document.getElementById(m[1]+'-'+m[2]):null;
  if(row)row.classList.add('on');
  if(card){card.classList.add('hit');setTimeout(function(){var y=(row||card).getBoundingClientRect().top+window.pageYOffset-76;window.scrollTo(0,Math.max(0,y))},60)}
}
drawLg();drawA();drawB();go();
document.getElementById('tA').onclick=function(){tab('A')};
document.getElementById('tB').onclick=function(){tab('B')};
window.addEventListener('hashchange',go);
/* «Орқага»: дарсдан келинган бўлса — ўша дарсга (жойи сақланади), акс ҳолда бош саҳифага */
document.getElementById('bk').addEventListener('click',function(e){
  var r=document.referrer,same=false;try{same=r&&new URL(r).origin===location.origin}catch(x){}
  if(same&&history.length>1){e.preventDefault();history.back()}
});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
