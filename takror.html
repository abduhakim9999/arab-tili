  function harfVar(r) { var ht = harfTuri(r); return aralash([ht].concat(aralash(HT.filter(function (y) { return y !== ht; })).slice(0, 3))); }
  function belgiXato(id) { if (!W.b[id]) { W.b[id] = 1; delete W.k[id]; if (W.a[id]) { delete W.a[id]; QAYTA = true; } wYoz(); } }   /* xato qilingan so'z — «билмайман»ga */

  function mqBoshla(m) {                               /* m: '' — hamma turdan, i / f / h — bitta turdan */
    var tart = { b: 0, t: 1, o: 2, y: 3, g: 4, m: 5, a: 6 }, lv = {}, fa = {};
    D.d.forEach(function (d) { if (d.lv) lv[d.n] = d.lv; });
    FAOL.forEach(function (d) { fa[d] = 1; });
    var hovuz = menHisob(sozlar()).men.filter(function (x) { return !m || turi(x.r) === m; });
    var p = aralash(hovuz).sort(function (a, b) { return tart[a.st] - tart[b.st]; }).slice(0, 10);   /* avval bilmaganlar, keyin tekshirilmaganlar */
    if (!p.length) return;
    MQ = { m: m, i: 0, tog: 0, xato: [], lv: lv, s: aralash(p).map(function (x) {
      var r = x.r, tur = ['a', 'u'], max = shaklTuri(r);
      if (r.au && lv[r.d]) tur.push('o');
      var t = max && Math.random() < 0.45 ? max : tur[Math.floor(Math.random() * tur.length)], ops = null;
      if (t === 't') ops = harfVar(r);
      else if (t === 'a' || t === 'u' || t === 'o') {
        var ch = [], hov = D.l.filter(function (y) { return y.tk && turi(y) === turi(r); });           /* chalg'ituvchi variantlar — o'sha turdan */
        [function (y) { return fa[y.d]; }, function () { return true; }].forEach(function (shart) {       /* avval boshlangan darslardan, yetmasa — qolganlardan */
          aralash(hov.slice()).forEach(function (y) { if (ch.length < 3 && shart(y) && !oxshash(y, r) && !ch.some(function (z) { return oxshash(y, z); })) ch.push(y); });
        });
        ops = aralash([r].concat(ch));
      }
      return { r: r, t: t, ops: ops };
    }) };
    mash(0); document.body.classList.add('tq-ses');
    mqSavol();
  }
  function mqYoz(q, ok) {                              /* javob bazaga: jurnal + xato so'z «bilmayman»ga */
    var r = q.r;
    E.javob('w' + r.id + (q.t === 'a' || q.t === 'u' || q.t === 'o' ? q.t : 's'), ok, Date.now() - t0, hozir());
    if (!ok) { MQ.xato.push(q); belgiXato(r.id); } else { MQ.tog++; tozala(); }
    saqla(); MQ.i++;
  }
  function mqSavol() {
    clearTimeout(tmq); toxta();
    if (MQ.i >= MQ.s.length) { mqNatija(); return; }
    var q = MQ.s[MQ.i], r = q.r, t = q.t, bajarildi = false, soz_ = '<div class="ar tq-w" lang="ar">' + esc(r.ar) + '</div>';
    var bosh_ = '<div class="tq-st"><button id="yop" aria-label="Ёпиш">✕</button><div class="tq-pr"><i style="width:' + Math.round(MQ.i * 100 / MQ.s.length) + '%"></i></div><span>' + (MQ.i + 1) + '/' + MQ.s.length + '</span></div>';
    var sorov = { a: 'Маъносини топинг', u: 'Арабчасини топинг', o: 'Эшитинг ва маъносини топинг', t: 'Бу қандай ҳарф?', j: 'Кўплиги қандай?', k: 'Музореъ, амр ва масдари қандай?' }[t];
    var old;
    t0 = Date.now();
    if (t === 'j' || t === 'k') {                      /* eslab ko'rish → ko'rsatish → o'zini baholash */
      app.innerHTML = bosh_ + '<section class="tq-c tq-k"><div class="tq-l"><span>' + NOM[turi(r)] + '</span><em>' + r.d + '-дарс</em></div><div class="tq-f">' + soz_ + '<div class="mq-s">' + esc(mano1(r)) + '</div><div class="tq-tr" style="margin-top:14px">' + sorov + '</div></div>' +
        '<div class="tq-r" id="rv" hidden>' + shaklMatn(r, t) + '</div></section>';
      tugma('<button class="tq-b tq-b1" id="ko">Кўрсатиш</button>');
      document.getElementById('ko').onclick = function () {
        document.getElementById('rv').hidden = false;
        tugma('<button class="tq-b" id="j0">Билмадим</button><button class="tq-b tq-b1" id="j1">Билдим</button>', true);
        document.getElementById('j0').onclick = function () { mqYoz(q, false); mqSavol(); };
        document.getElementById('j1').onclick = function () { mqYoz(q, true); mqSavol(); };
      };
    } else {
      if (t === 'a') old = soz_;
      else if (t === 'u') old = '<div class="tq-m">' + esc(mano1(r)) + '</div>';
      else if (t === 'o') old = '<button class="tq-pl" id="pl" aria-label="Қайта тинглаш">▶</button>';
      else old = soz_ + '<div class="mq-s">' + esc(manoT(r)) + '</div>';
      app.innerHTML = bosh_ + '<section class="tq-c tq-k"><div class="tq-l"><span>' + NOM[turi(r)] + '</span><em>' + r.d + '-дарс</em></div><div class="tq-f" style="flex:none;padding-bottom:6px">' + old + '</div><div class="tq-tr">' + sorov + '</div>' +
        '<div class="tq-o">' + q.ops.map(function (o, n) { return '<button data-n="' + n + '">' + (t === 't' ? '<span class="uz">' + esc(o) + '</span>' : t === 'u' ? '<b class="ar" lang="ar">' + esc(o.ar) + '</b>' : '<span class="uz">' + esc(mano1(o)) + '</span>') + '</button>'; }).join('') +
        '</div><div class="tq-s" id="qs" aria-live="polite"></div></section>';
      bar.hidden = true; bar.innerHTML = '';
      if (t === 'o') { var a = { f: MQ.lv[r.d], s: r.au[0], e: r.au[1] }; document.getElementById('pl').onclick = function () { ovoz(a); }; ovoz(a); }
      var togri = function (o) { return t === 't' ? o === harfTuri(r) : o.id === r.id; };
      [].forEach.call(app.querySelectorAll('.tq-o button'), function (b) {
        b.onclick = function () {
          if (bajarildi) return;
          bajarildi = true;
          var n = +b.getAttribute('data-n'), ok = togri(q.ops[n]);
          [].forEach.call(app.querySelectorAll('.tq-o button'), function (y) {
            var k = +y.getAttribute('data-n');
            if (togri(q.ops[k])) y.classList.add('ok'); else if (k === n) y.classList.add('no');
            y.disabled = true;
          });
          document.getElementById('qs').innerHTML = '<bdi class="ar tq-ai" lang="ar">' + esc(r.ar) + '</bdi> — ' + esc(mano1(r)) + (shakllar(r) ? '<small>' + shakllar(r) + '</small>' : '');
          mqYoz(q, ok);
          tugma('<button class="tq-b tq-b1" id="kn">' + (MQ.i >= MQ.s.length ? 'Натижа' : 'Кейинги') + '</button>');
          document.getElementById('kn').onclick = mqSavol;
          if (ok) tmq = setTimeout(mqSavol, 1000);
        };
      });
    }
    document.getElementById('yop').onclick = function () { qur(); bosh(); };
    window.scrollTo(0, 0);
  }
  function mqNatija() {
    var m = MQ.m, h = '<div class="top"><a href="#" id="mq0" aria-label="Луғатга қайтиш">‹</a><div><small>Қўшимча машқ' + (m ? ' · ' + NOM[m] : '') + '</small><h1>Натижа</h1></div></div>' +
      '<section class="tq-c mq-n"><div class="bg"' + (MQ.tog * 100 >= MQ.s.length * 80 ? '' : ' style="color:var(--tx)"') + '>' + MQ.tog + ' / ' + MQ.s.length + '</div><p class="tq-mu">' + (MQ.xato.length ? 'Хато қилинганлари «Билмаганларим»га қўшилди.' : 'Ҳаммаси тўғри.') + '</p></section>';
    if (MQ.xato.length) {
      h += '<section class="tq-c"><div class="tq-h">Хато қилинган сўзлар</div>';
      MQ.xato.forEach(function (q) { h += '<div class="mq-x"><span>' + esc(mano1(q.r)) + (shakllar(q.r) ? '<small>' + shakllar(q.r) + '</small>' : '') + '</span><b class="ar" lang="ar">' + esc(q.r.ar) + '</b></div>'; });
      h += '</section>';
    }
    app.innerHTML = h;
    tugma('<button class="tq-b" id="mq1">Тайёр</button><button class="tq-b tq-b1" id="mq2">Яна 10 та</button>', true);
    var qayt = function (e) { if (e) e.preventDefault(); qur(); bosh(); };
    document.getElementById('mq0').onclick = qayt; document.getElementById('mq1').onclick = qayt;
    document.getElementById('mq2').onclick = function () { qur(); mqBoshla(m); };
    window.scrollTo(0, 0);
  }
  /* 13.11.2026 (foydalanuvchi qarori): «Такрор» va «Луғат» — bitta joy. Bilmagan so'zlar lug'atga tushadi, takror ham shu yerdan boshlanadi. */
  function bosh() {
    clearTimeout(tmq); toxta(); cur = null; qD = 0; qT = 0; qW = 0; mash(0);
    document.body.classList.remove('tq-ses');
    if (QAYTA) qur();                                   /* «аниқ биламан» belgisi o'zgargan — kartalar qayta yig'iladi */
    lugat();
    window.scrollTo(0, 0);
  }

  /* ---- mashg'ulot ---- */
  function keyingi() {
    clearTimeout(tmq); toxta();
    var x = E.keyingi(hozir());
    if (!x) { bosh(); return; }
    cur = x.k; t0 = Date.now();
    /* Chiziq har to'g'ri javobda siljiydi (13.11.2026): qadamlar sanaladi, kartalar emas. Yangi karta — ikki qadam (birinchi ko'rish va
       mustahkamlash: «билдим»dan keyin ham shu mashg'ulotda yana bir marta so'raladi), takrordagi — bir qadam. Noto'g'ri javobda joyida qoladi;
       qo'shimcha qadam kerak bo'lsa jami (qT) o'sadi — chiziq orqaga qaytmaydi. O'ngdagi son — qolgan qadamlar. */
    var bg = E.bugun(hozir()), qol = bg.takror + 2 * bg.yangi, eski = qW;
    if (qD + qol > qT) qT = qD + qol;
    qW = qT ? Math.round(qD * 100 / qT) : 0;
    var bosh_ = '<div class="tq-st"><button id="yop" aria-label="Ёпиш">✕</button><div class="tq-pr" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + qW +
      '"><i id="qpi" style="width:' + eski + '%"></i></div><span aria-label="Қолган қадамлар">' + (qT - qD) + '</span></div>';
    if (cur.tur === 'q') savol(bosh_, x); else if (cur.tur === 's') shaklK(bosh_, x); else soz(bosh_, x);
    document.getElementById('yop').onclick = bosh;
    var qi = document.getElementById('qpi');             /* oldingi kenglikdan yangisiga — silliq siljiydi */
    if (qi && qW !== eski) requestAnimationFrame(function () { requestAnimationFrame(function () { qi.style.width = qW + '%'; }); });
    window.scrollTo(0, 0);
  }
  function tugma(h, two) { bar.innerHTML = '<div' + (two ? ' class="two"' : '') + '>' + h + '</div>'; bar.hidden = false; }
  function javob(bildi) {
    if (!cur) return;
    E.javob(cur.id, bildi, Date.now() - t0, hozir());
    if (bildi) qD++;
    if (cur.n) {                                        /* so'z kartasi: bilmadi → «bilmayman»ga; bildi → yod bo'lgan bo'lsa undan chiqadi */
      if (!bildi) belgiXato(cur.n.id); else tozala();
    }
    saqla(); keyingi();
  }

  function manolar(n) {
    var a = [];
    n.m.forEach(function (r) { r.uz.forEach(function (u) { u.split(/\s(?=\d\.\s)/).forEach(function (p) { a.push(p); }); }); });
    if (a.length === 1) a[0] = a[0].replace(/^\d+\.\s*/, '');
    return '<div class="tq-m">' + a.map(function (p) { return '<div>' + esc(p.replace(/^(\d+)\.\s*/, '$1. ')) + '</div>'; }).join('') + '</div>';
  }
  function shakl(r) {
    if (r.fel) return '<div class="tq-fm ar" lang="ar">' + r.fel.map(esc).join(' – ') + '</div>';
    var p = [];
    if (r.al) p.push(ar('(' + r.al + ')'));
    if (r.jam) p.push('<span>жам ' + ar(r.jam.join('، ')) + '</span>');
    if (r.mn) p.push('<span>муаннас ' + ar(r.mn) + '</span>');
    return p.length ? '<div class="tq-fm">' + p.join('') + '</div>' : '';
  }
  function misol(n) {
    var x = [];
    n.m.forEach(function (r) { (r.x || []).forEach(function (e) { x.push(e); }); });
    return x.slice(0, 2).map(function (e) { return '<div class="tq-ex">' + ar(e[0]) + esc(e[1]) + '</div>'; }).join('');
  }
  function soz(bosh_, x) {
    var n = cur.n, r = n.r, t = cur.tur, old, orqa;
    var sorov = { a: 'Маъноси?', u: 'Арабчаси?', o: 'Эшитинг' }[t];
    var soz_ = '<div class="ar tq-w" lang="ar">' + esc(r.ar) + '</div>';
    if (t === 'a') { old = soz_; orqa = manolar(n) + shakl(r) + misol(n); }
    else if (t === 'u') { old = manolar(n); orqa = soz_ + shakl(r) + misol(n); }
    else { old = '<button class="tq-pl" id="pl" aria-label="Тинглаш">▶</button>'; orqa = soz_ + manolar(n) + shakl(r); }
    if (n.au && t !== 'o') orqa += '<button class="tq-au" id="sp" aria-label="Тинглаш">🔊</button>';
    app.innerHTML = bosh_ + '<section class="tq-c tq-k"><div class="tq-l"><span>' + sorov + '</span>' + (x.yangi ? '<em>янги</em>' : '') +
      '</div><div class="tq-f">' + old + '</div><div class="tq-r" id="rv" hidden>' + orqa + '</div></section>';
    tugma('<button class="tq-b tq-b1" id="ko">Кўрсатиш</button>');
    if (t === 'o') { document.getElementById('pl').onclick = function () { ovoz(n.au); }; ovoz(n.au); }
    document.getElementById('ko').onclick = function () {
      document.getElementById('rv').hidden = false;
      tugma('<button class="tq-b" id="j0">Билмадим</button><button class="tq-b tq-b1" id="j1">Билдим</button>', true);
      document.getElementById('j0').onclick = function () { javob(false); };
      document.getElementById('j1').onclick = function () { javob(true); };
      var sp = document.getElementById('sp');
      if (sp) { sp.onclick = function () { ovoz(n.au); }; ovoz(n.au); }
    };
  }

  /* shakl kartasi (takror.js `w…s`): ko'pligi / fe'l shakllari — eslab ko'rib o'zini baholash; harf turi — 4 variant */
  function shaklK(bosh_, x) {
    var n = cur.n, r = n.r, t = cur.sh, soz_ = '<div class="ar tq-w" lang="ar">' + esc(r.ar) + '</div>';
    var lbl = '<div class="tq-l"><span>' + SHS[t] + '</span>' + (x.yangi ? '<em>янги</em>' : '') + '</div>';
    if (t !== 't') {
      app.innerHTML = bosh_ + '<section class="tq-c tq-k">' + lbl + '<div class="tq-f">' + soz_ + '<div class="mq-s">' + esc(mano1(r)) + '</div></div><div class="tq-r" id="rv" hidden>' + shaklMatn(r, t) + '</div></section>';
      tugma('<button class="tq-b tq-b1" id="ko">Кўрсатиш</button>');
      document.getElementById('ko').onclick = function () {
        document.getElementById('rv').hidden = false;
        tugma('<button class="tq-b" id="j0">Билмадим</button><button class="tq-b tq-b1" id="j1">Билдим</button>', true);
        document.getElementById('j0').onclick = function () { javob(false); };
        document.getElementById('j1').onclick = function () { javob(true); };
      };
      return;
    }
    var ops = harfVar(r), ht = harfTuri(r), bajarildi = false;
    app.innerHTML = bosh_ + '<section class="tq-c tq-k">' + lbl + '<div class="tq-f" style="flex:none;padding-bottom:6px">' + soz_ + '<div class="mq-s">' + esc(manoT(r)) + '</div></div>' +
      '<div class="tq-o">' + ops.map(function (o, i) { return '<button data-n="' + i + '"><span class="uz">' + esc(o) + '</span></button>'; }).join('') + '</div></section>';
    bar.hidden = true; bar.innerHTML = '';
    [].forEach.call(app.querySelectorAll('.tq-o button'), function (b) {
      b.onclick = function () {
        if (bajarildi) return;
        bajarildi = true;
        var k = +b.getAttribute('data-n'), ok = ops[k] === ht;
        [].forEach.call(app.querySelectorAll('.tq-o button'), function (y) {
          var m = +y.getAttribute('data-n');
          if (ops[m] === ht) y.classList.add('ok'); else if (m === k) y.classList.add('no');
          y.disabled = true;
        });
        E.javob(cur.id, ok, Date.now() - t0, hozir()); if (ok) { qD++; tozala(); } else belgiXato(r.id); saqla();
        tugma('<button class="tq-b tq-b1" id="kn">Кейинги</button>');
        document.getElementById('kn').onclick = keyingi;
        if (ok) tmq = setTimeout(keyingi, 1000);
      };
    });
  }

  /* so'z oxiri harakati — dars «Машқ»idagi savol: gap harakatsiz, uch variant; to'g'rida 1 s dan keyin o'zi o'tadi */
  function qator(ws, ti, hk, ochiq) {
    return ws.map(function (w, j) {
      var c = j === ti ? 'tq-t' : (j === hk ? 'tq-hk' : '');
      return '<span' + (c ? ' class="' + c + '"' : '') + '>' + esc(j === ti && ochiq ? w[0] : plain(w[0])) + '</span>' + esc(w[1].replace('?', '؟'));
    }).join(' ');
  }
  function savol(bosh_, x) {
    var q = cur.s, ql = +q.k.split('-')[0], togri = q.gap[q.w][0], ops = q['var'].slice(), i, j, tmp, bajarildi = false;
    for (i = ops.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); tmp = ops[i]; ops[i] = ops[j]; ops[j] = tmp; }
    function chiz(ochiq) {
      var hk = q.hk || [-1, -1], h = '';
      if (q.oldgap) h += '<div class="tq-g tq-og ar" lang="ar">' + qator(q.oldgap, -1, ochiq ? hk[1] : -1, false) + '</div>';
      h += '<div class="tq-g ar" lang="ar">' + qator(q.gap, q.w, ochiq && hk[0] === ql && hk[1] !== q.w ? hk[1] : -1, ochiq) + '</div>';
      return h;
    }
    app.innerHTML = bosh_ + '<section class="tq-c tq-k"><div class="tq-l"><span>Сўз охири?</span>' + (x.yangi ? '<em>янги</em>' : '') + '</div>' +
      '<div id="qg">' + chiz(false) + '</div>' + (q.tr ? '<div class="tq-tr">' + esc(q.tr) + '</div>' : '') +
      '<div class="tq-o">' + ops.map(function (o, n) { return '<button data-n="' + n + '">' + '<b class="ar" lang="ar">' + esc(o[0]) + '</b><span>' + esc(o[2]) + '</span></button>'; }).join('') +
      '</div><div class="tq-s" id="qs" aria-live="polite"></div></section>';
    bar.hidden = true; bar.innerHTML = '';
    [].forEach.call(app.querySelectorAll('.tq-o button'), function (b) {
      b.onclick = function () {
        if (bajarildi) return;
        bajarildi = true;
        var n = +b.getAttribute('data-n'), ok = ops[n][0] === togri;
        [].forEach.call(app.querySelectorAll('.tq-o button'), function (y) {
          var m = +y.getAttribute('data-n');
          if (ops[m][0] === togri) y.classList.add('ok'); else if (m === n) y.classList.add('no');
          y.disabled = true;
        });
        document.getElementById('qg').innerHTML = chiz(true);
        if (q.sabab) document.getElementById('qs').innerHTML = mix(q.sabab);
        E.javob(cur.id, ok, Date.now() - t0, hozir()); if (ok) qD++; saqla();
        tugma('<button class="tq-b tq-b1" id="kn">Кейинги</button>');
        document.getElementById('kn').onclick = keyingi;
        if (ok) tmq = setTimeout(keyingi, 1000);
      };
    });
  }

  yukla();
})();
</script>
</body>
