<!DOCTYPE html>
<!-- «Татбиқ» kitobi muqovasi (21.11.2026): bob rasmlaridan (fon/gN.jpg) medalyonlar, arabcha va kirilcha nom.
     Yasash: python3 src/build/muqova.py → fon/tatbiq.jpg (750×1125). Bob tartibi o'ngdan chapga (arabcha), qoidalar.html M bilan bir xil. -->
<html lang="uz"><head><meta charset="utf-8">
<style>
@font-face{font-family:"DarsNaskh";src:url(../../naskh.woff)}
html,body{margin:0;width:600px;height:900px;overflow:hidden}
body{position:relative;background:radial-gradient(circle at 50% 32%,#17845A 0%,#0F5E3E 46%,#093F2B 100%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#F5E7C0}
.nq{position:absolute;inset:0;opacity:.11}
.r1{position:absolute;inset:20px;border:2px solid #D8B56A;border-radius:6px}
.r2{position:absolute;inset:29px;border:1px solid rgba(216,181,106,.55);border-radius:3px}
.bc{position:absolute;width:26px;height:26px;fill:#D8B56A}
.yu{position:absolute;left:0;right:0;text-align:center}
.t1{top:66px;font-size:15px;font-weight:600;letter-spacing:.3em;color:#E9D39A}
.ch{top:96px;display:flex;justify-content:center;align-items:center;gap:10px}
.ch i{display:block;width:70px;height:1.5px;background:linear-gradient(90deg,transparent,#D8B56A)}.ch i:last-child{transform:scaleX(-1)}
.ch svg{width:16px;height:16px;fill:#D8B56A}
.ar{top:118px;font-family:"DarsNaskh",serif;font-size:118px;line-height:1.5;direction:rtl;
  background:linear-gradient(180deg,#FBE7A6 0%,#E3BE67 55%,#B98A34 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.uz{top:328px;font-size:44px;font-weight:800;letter-spacing:.36em;padding-left:.36em;color:#F7EBC8;text-shadow:0 2px 3px rgba(0,0,0,.35)}
.t2{top:394px;font-size:16px;letter-spacing:.08em;color:#E9D39A;opacity:.95}
.md{position:absolute;left:0;right:0;display:flex;flex-direction:row-reverse;justify-content:center;gap:14px}
.md span{width:84px;height:84px;border-radius:50%;background-repeat:no-repeat;box-shadow:0 0 0 3px #D8B56A,0 0 0 5px rgba(0,0,0,.25),0 6px 10px rgba(0,0,0,.35)}
.m1{top:486px}.m2{top:596px}
.t3{top:742px;font-size:14px;letter-spacing:.2em;color:#E9D39A;opacity:.9}
.ast{top:782px;display:flex;justify-content:center}.ast svg{width:34px;height:34px;fill:#D8B56A;opacity:.85}
</style></head>
<body>
<svg class="nq" width="600" height="900" aria-hidden="true"><defs><pattern id="p" width="60" height="60" patternUnits="userSpaceOnUse">
<g fill="none" stroke="#E9D39A" stroke-width="1.2" transform="translate(30 30)"><rect x="-14" y="-14" width="28" height="28"/><rect x="-14" y="-14" width="28" height="28" transform="rotate(45)"/></g></pattern></defs>
<rect width="600" height="900" fill="url(#p)"/></svg>
<div class="r1"></div><div class="r2"></div>
<svg class="bc" style="left:16px;top:16px" viewBox="-13 -13 26 26"><path id="y" d="M0-12L3.5-8.5H8.5V-3.5L12 0L8.5 3.5V8.5H3.5L0 12L-3.5 8.5H-8.5V3.5L-12 0L-8.5-3.5V-8.5H-3.5Z"/></svg>
<svg class="bc" style="right:16px;top:16px" viewBox="-13 -13 26 26"><use href="#y"/></svg>
<svg class="bc" style="left:16px;bottom:16px" viewBox="-13 -13 26 26"><use href="#y"/></svg>
<svg class="bc" style="right:16px;bottom:16px" viewBox="-13 -13 26 26"><use href="#y"/></svg>
<div class="yu t1">АРАБ ТИЛИ ГРАММАТИКАСИ</div>
<div class="yu ch"><i></i><svg viewBox="-13 -13 26 26"><use href="#y"/></svg><i></i></div>
<div class="yu ar">اَلتَّطْبِيقُ</div>
<div class="yu uz">ТАТБИҚ</div>
<div class="yu t2">53 дарс · 10 боб</div>
<div class="md m1" id="m1"></div>
<div class="md m2" id="m2"></div>
<div class="yu t3">ҚОИДА · МИСОЛ · МАШҚ</div>
<div class="yu ast"><svg viewBox="-13 -13 26 26"><use href="#y"/></svg></div>
<script>
/* bob tartibida rasmlar; har rasmdan (200, 195) markazli, 155 radiusli doira kesiladi */
var G = ['g1', 'g2', 'g3', 'g4', 'g10', 'g5', 'g6', 'g7', 'g8', 'g9'], D = 84, R = 155, cx = 200, cy = 195, k = D / (2 * R);
G.forEach(function (g, i) {
  var s = document.createElement('span');
  s.style.backgroundImage = 'url(../../fon/' + g + '.jpg)';
  s.style.backgroundSize = (400 * k) + 'px ' + (600 * k) + 'px';
  s.style.backgroundPosition = (-(cx - R) * k) + 'px ' + (-(cy - R) * k) + 'px';
  document.getElementById(i < 5 ? 'm1' : 'm2').appendChild(s);
});
</script>
</body></html>
