<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Қоидалар</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c5e3f">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="shell.css">
<script>
/* «Қоидалар» (13.11.2026; docs/texnik.md 18) — qobiqning uchinchi bo'limi: Сарф, Феъллар, Наҳв, Эшитиш kartalari.
   Holat faqat o'qiladi: «sarf-holat» (Сарф mashqi), «fl200_best» (Феъллар qismlari). */
var SN = /\/sinov-[^\/]*$/.test(location.pathname) ? 'sinov-' : '';
document.write('<script src="tg.js" data-key="" data-home="' + SN + 'yol.html"><\/script><script src="' + SN + 'qobiq.js"><\/script>');
</script>
<style>
@font-face{font-family:"DarsNaskh";src:url(naskh.woff)}
body{margin:0;background-color:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ar{font-family:"DarsNaskh","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;font-weight:400}
.k-c{min-height:104px;padding:12px 14px 15px;gap:16px}
.k-cv{width:72px;height:80px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.k-cv svg{width:64px;height:64px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.22))}
.k-c .n{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:19px;line-height:1.3}
.k-c .n .ar{font-size:23px;line-height:1.3;color:var(--mu)}
.k-br{height:6px;border-radius:3px;background:var(--bd);margin-top:8px;overflow:hidden}
.k-br i{display:block;height:100%;border-radius:3px;background:var(--ac)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .k-cv{background:rgba(255,255,255,.07)!important}}
:root[data-theme="dark"] .k-cv{background:rgba(255,255,255,.07)!important}
</style>
</head>
<body>
<header class="q-hd"><div class="q-hr"><div><h1>Қоидалар</h1></div></div></header>
<main class="q-w" id="app"></main>
<script>
(function () {
  function J(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  /* muqova: bosh sahifadagi kitobcha (harf bilan) */
  function cov(ch, c1, c2, m) {
    return '<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="12" y="6" width="40" height="52" rx="5" fill="' + c1 + '"/><rect x="12" y="6" width="7" height="52" rx="3" fill="' + c2 + '"/>' +
      '<rect x="24" y="12" width="22" height="24" rx="4" fill="none" stroke="#F3D58C" stroke-width="2.2"/><text x="35" y="29" text-anchor="middle" font-size="21" fill="#F3D58C" font-family="DarsNaskh,serif">' + ch + '</text>' + m + '</svg>';
  }
  var QT = '<path d="M26 44h18M26 49h18M26 54h11" stroke="#F3D58C" stroke-width="2" stroke-linecap="round" opacity=".75"/>';
  var CH = '<svg class="ch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';

  var sr = (J('sarf-holat') || {}).b1;
  var K = [
    { h: 'sarf.html', n: 'Сарф', a: 'الصَّرْفُ', l: '#E6EEF8', s: cov('ص', '#2E5E9A', '#1F4673', QT),
      t: sr && sr.best != null ? '1-боб · машқ ' + sr.best + '%' : 'Боблар · тусланиш · машқ', p: sr && sr.best != null ? sr.best : null },
    /* «Феъллар» (200 fe'l) — 14.11.2026 ilovadan olib tashlandi (foydalanuvchi qarori); fe'llar va ovozlari saqlangan: fq/ (docs/texnik.md 7) */
    { h: 'nahv.html', n: 'Наҳв', a: 'النَّحْوُ', l: '#E3F2EA', s: cov('ن', '#0F7A4F', '#0A5236', QT), t: 'Эъроб аломатлари жадвали', p: null },
    { h: 'tinglash.html', n: 'Эшитиш', a: 'الِاسْتِمَاعُ', l: '#EEE8F7',
      s: cov('س', '#6B4FA0', '#4C3577', '<path d="M27 51v-3a7 7 0 0 1 14 0v3" stroke="#F3D58C" stroke-width="2.2" fill="none" stroke-linecap="round"/><rect x="25" y="48" width="4" height="6" rx="1.5" fill="#F3D58C"/><rect x="39" y="48" width="4" height="6" rx="1.5" fill="#F3D58C"/>'),
      t: 'Дарсларни тинглаб ўрганиш: матн, луғат, таркиб', p: null }
  ];
  document.getElementById('app').innerHTML = K.map(function (k) {
    return '<a class="q-rw k-c" href="' + k.h + '"><span class="k-cv" style="background:' + k.l + '">' + k.s + '</span>' +
      '<span class="t"><span class="n">' + k.n + '<span class="ar" lang="ar">' + k.a + '</span></span><small>' + k.t + '</small>' +
      (k.p != null ? '<span class="k-br" aria-hidden="true"><i style="width:' + k.p + '%"></i></span>' : '') + '</span>' + CH + '</a>';
  }).join('');
  /* ruscha rejimda tarjimasi hali yo'q bo'limlar — «Тез орада» (Наҳв ruschada bor) */
  if (window.Qobiq && Qobiq.ru) [].forEach.call(document.querySelectorAll('#app .k-c'), function (a) { if (!/nahv\.html$/.test(a.getAttribute('href'))) Qobiq.tez(a); });
  if (window.Qobiq) Qobiq.nav('qoida');
})();
</script>
</body>
</html>
