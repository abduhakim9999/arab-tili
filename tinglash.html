<style>
@font-face{font-family:"DarsNaskh";src:url(naskh.woff)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);min-height:100vh}
.lw{max-width:520px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.lh{display:flex;align-items:center;gap:6px;margin:0 -6px 10px}
.lh a{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ac);text-decoration:none;font-size:26px}
.lh b{font-size:19px}
.ls{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.ls::-webkit-scrollbar{display:none}
.lc{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font-size:14px;font-weight:600;cursor:pointer}
.lc.on{background:var(--ac);border-color:var(--ac);color:#fff}
.stage{background:var(--cd);border:1px solid var(--bd);border-radius:22px;padding:18px 16px;box-shadow:var(--sh,0 4px 16px rgba(0,0,0,.06));min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.st-t{font-size:13px;color:var(--mu);font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}.st-t i{font-style:normal;font-variant-numeric:tabular-nums;flex:none}
.md{display:flex;width:max-content;margin:0 auto 12px}.md button{padding:7px 20px;font-size:14px}
.st-ar{direction:rtl;font-family:"DarsNaskh","Noto Naskh Arabic",serif;font-size:27px;line-height:1.85;color:var(--tx);transition:color .2s,opacity .2s}
.st-uz{margin-top:12px;font-size:17px;line-height:1.5;color:var(--mu);white-space:pre-line;transition:color .2s,opacity .2s}
.stage.k-ar .st-ar{color:var(--ac)}
.stage.tk .st-ar{font-size:21px;line-height:1.9}.stage.tk .st-uz{font-size:15px}
.stage.k-uz .st-uz{color:var(--tx);font-weight:600}
.stage.k-uz .st-ar{opacity:.55}
.sp{font-size:13px;color:var(--au2,#c99434);font-weight:700;margin-bottom:4px;direction:rtl;font-family:"DarsNaskh",serif}
.pg{display:flex;align-items:center;gap:10px;margin:16px 2px 4px;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.pg input{flex:1;accent-color:var(--ac)}
.ctl{display:flex;align-items:center;justify-content:center;gap:22px;margin:8px 0 18px}
.cb{width:52px;height:52px;border-radius:26px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer}
.cb.big{width:76px;height:76px;border-radius:38px;background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 6px 18px rgba(15,122,79,.3)}
.gear{margin-left:auto;width:44px;height:44px;border-radius:22px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer}
.shb{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.shb.on{opacity:1;pointer-events:auto}
.opts{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:520px;margin:0 auto;background:var(--cd);border-radius:22px 22px 0 0;padding:6px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.2);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.opts.on{transform:none}
.oh{display:flex;align-items:center;justify-content:space-between;padding:12px 0 6px}.oh b{font-size:17px}
.oh button{width:36px;height:36px;border-radius:18px;border:none;background:var(--bg);color:var(--mu);font-size:16px;cursor:pointer}
.op{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}
.op:last-child{border-bottom:none}
.op span{font-size:15px;font-weight:600}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:3px;gap:2px}
.seg button{border:none;background:none;color:var(--mu);font-weight:700;font-size:13px;padding:6px 11px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--cd);color:var(--ac);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sw{position:relative;width:48px;height:28px;border-radius:14px;background:var(--bd);border:none;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--ac)}.sw.on::after{transform:translateX(20px)}
.lw{display:flex;flex-direction:column;height:100vh;height:100dvh;box-sizing:border-box}
.lw>*{flex:none}
.lw>.stage{flex:1 1 auto;min-height:0;overflow-y:auto;justify-content:flex-start;-webkit-overflow-scrolling:touch}
.stage>*{flex:none}.stage::before,.stage::after{content:"";flex:1 1 0}.stage>.st-t{order:-1}
</style>
</head>

-"], "8": ["اَلْعَمَلُ نِعْمَةٌ مِنْ نِعَمِ اللَّهِ، وَلَا يَعْرِفُ هَذِهِ النِّعْمَةَ إِلَّا مَنْ فَقَدَهَا بِسَبَبِ الْمَرَضِ أَوْ غَيْرِهِ؛", "Ишлаш Аллоҳнинг неъматларидан биридир. Бу неъматни эса касаллиги ё бошқа сабаб билан уни йўқотган одам -гина билади;", ""], "9": ["وَمَعَ ذَلِكَ فَبَعْضُ النَّاسِ لَا يُحِبُّونَ الْعَمَلَ، وَيَعْتَمِدُونَ عَلَى غَيْرِهِمْ، أَوْ يَتَسَوَّلُونَ فِي الطُّرُقِ.", "Шу билан бирга (шунга қарамасдан) негадир баъзи одамлар ишлашни ёқтирмай, бошқаларга суяниб қоладилар ёки йўлларда тиланчилик қиладилар.", ""], "10": ["قَالَ الرَّسُولُ ﷺ: مَا أَكَلَ أَحَدٌ طَعَامًا قَطُّ خَيْرًا مِنْ أَنْ يَأْكُلَ مِنْ عَمَلِ يَدِهِ،", "Пайғамбаримиз (ﷺ) шундай деганлар: “Ҳеч бир одам қўл меҳнати орқали таом ейишидан кўра яхшироқ таом (ҳеч қачон) емаган.", ""], "11": ["وَإِنَّ نَبِيَّ اللَّهِ دَاوُدَ كَانَ يَأْكُلُ مِنْ عَمَلِ يَدِهِ.", "Албатта Аллоҳнинг пайғамбари Довуд (а.с.) қўл меҳнати орқали таом ер эди”.", ""], "12": ["وَقَالَ: لَأَنْ يَأْخُذَ أَحَدُكُمْ حَبْلَهُ، ثُمَّ يَغْدُوَ إِلَى الْجَبَلِ، فَيَحْتَطِبَ، فَيَبِيعَ، فَيَأْكُلَ، وَيَتَصَدَّقَ خَيْرٌ مِنْ أَنْ يَسْأَلَ النَّاسَ.", "У зот (ﷺ) яна шундай дедилар: “Аллоҳга қасамки, бирингиз арқонини олиши, кейин эса тоққа тонгда йўлга тушиб, ўтин олиб келиши, сўнг (уни) сотиб, (у орқали) таом ейиши ёки садақа қилиши одамлардан (эҳтиёжини) сўрашдан кўра яхшироқдир”.", ""], "14": ["جَاءَ رَجُلٌ فَقِيرٌ إِلَى رَسُولِ اللَّهِ ﷺ وَسَأَلَهُ شَيْئًا،", "Камбағал бир киши Аллоҳнинг пайғамбари (ﷺ) олдига келиб, у зотдан бир нарса сўради.", ""], "15": ["فَقَالَ لَهُ الرَّسُولُ ﷺ: هَلْ فِي بَيْتِكَ شَيْءٌ؟", "Шунда пайғамбар (ﷺ) унга шундай деди: “Уйингда бирон нарса борми?”", ""], "16": ["قَالَ: نَعَمْ، قَصْعَةٌ ( إِنَاءٌ) نَأْكُلُ فِيهَا، وَنَشْرَبُ مِنْهَا وَنَتَطَهَّرُ،", "У ... деди: “Ҳа, бир идиш (коса) бор бўлиб, биз унинг ёрдамида еймиз, ундан ичамиз ва покланамиз,", ""], "17": ["وَحِلْسٌ ( فِرَاشٌ) نَجْلِسُ عَلَيْهَا، وَلَا شَيْءَ غَيْرُ هَذَا.", "ва яна бир тўшак (фарш) бор бўлиб, биз унинг устида ўтирамиз, аммо бундан бошқа ҳеч нарса йўқ”.", ""], "18": ["فَقَالَ لَهُ الرَّسُولُ ﷺ: اِئْتِنِي بِهِمَا. فَأَتَاهُ بِهِمَا،", "Шунда пайғамбар (ﷺ) унга дедилар: “Иккаловини менга олиб кел”. Сўнг у зотга иккаловини олиб келди.", ""], "19": ["فَأَمْسَكَهُمَا بَيْنَ يَدَيْهِ، وَقَالَ لِأَصْحَابِهِ: مَنْ يَشْتَرِي هَذَيْنِ؟", "Шунда у зот иккаловини 2 қўли орасида ушлади ва саҳобаларига қарата дедилар: “Ким бу иккисини сотиб олади?”", ""], "20": ["فَقَامَ رَجُلٌ، فَقَالَ: أَنَا أَشْتَرِيهِمَا بِدِرْهَمٍ،", "Шунда бир киши туриб деди: “Мен 1 дирҳамга иккисини сотиб оламан”.", ""], "21": ["فَقَالَ: مَنْ يَزِيدُ عَلَى دِرْهَمٍ؟", "Шунда у зот дедилар: “Ким 1 дирҳамдан кўпроқ беради?”", ""], "22": ["فَقَامَ رَجُلٌ آخَرُ، وَقَالَ: أَنَا أَشْتَرِيهِمَا بِدِرْهَمَيْنِ،", "Шунда бошқа бир киши ўрнидан туриб деди: “Мен 2 дирҳамга икковини сотиб оламан”,", ""], "23": ["فَدَفَعَهُمَا إِلَى الرَّسُولِ ﷺ الَّذِي سَلَّمَهُمَا إِلَى الْأَعْرَابِيِّ قَائِلًا:", "Пайғамбарга (ﷺ) иккала дирҳамни берди, у зот эса ҳалиги аъробийга уларни бериб, дедилар:", ""], "24": ["اِشْتَرِ بِأَحَدِهِمَا طَعَامًا، وَاذْهَبْ بِهِ إِلَى أَهْلِكَ،", "“Иккаловидан бирига таом сотиб ол ва уни оилангга олиб бор,", ""], "25": ["وَاشْتَرِ بِالْآخَرِ قَدُومًا وَائْتِنِي بِهِ.", "наригисига теша темирини сотиб ол ва уни менга олиб кел”.", ""], "26": ["فَأَتَاهُ بِالْقَدُومِ، فَوَضَعَ فِيهِ عُودًا بِيَدِهِ،", "Сўнг у тешани у зотга олиб келди. Шунда у зот ўз қўллари билан унга новда (даста) қўйиб бердилар", ""], "27": ["وَقَالَ لِلْأَعْرَابِيِّ: اِذْهَبْ وَاحْتَطِبْ وَبِعْ، وَلَا أَرَاكَ خَمْسَةَ عَشَرَ يَوْمًا.", "ва ҳалиги аъробийга дедилар: “Бор, ўтин (чопиб) олиб кел ва (уни) сот. Мен сени 15 кун кўрмайин”.", ""], "28": ["وَبَعْدَ انْتِهَاءِ هَذِهِ الْمُدَّةِ، رَجَعَ إِلَيْهِ الْأَعْرَابِيُّ، وَقَدِ اشْتَرَى ثِيَابًا وَطَعَامًا،", "Бу муддат тугаганидан кейин ҳалиги аъробий кийимлар ва таом сотиб олган ҳолда у зотнинг ҳузурларига қайтиб келди.", ""], "29": ["فَقَالَ لَهُ الرَّسُولُ ﷺ: أَلَيْسَ هَذَا خَيْرً ا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ. وَشِبْهُ الْجُمْلَةِ مُتَعَلِّقٌ بِالْفِعْلِ «تَدْرُسِينَ».", "зоида ҳарф, сукунга мабний, эъробдан унга ўрин йўқ\n↳ жар ва мажрур шибҳи жумла бўлиб, تَدْرُسِينَ га мутааллиқ", ""], "7-1.0": ["تَدْرُسِينَ: فِعْلٌ مُضَارِعٌ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ ثُبُوتُ النُّونِ لِأَنَّهُ مِنَ الْأَفْعَالِ الْخَمْسَةِ، وَيَاءُ الْمُخَاطَبَةِ ضَمِيرٌ مُتَّصِلٌ مَبْنِيٌّ عَلَى السُّكُونِ فِي مَحَلِّ رَفْعٍ فَاعِلٌ.", "музорий феъли, раф қилинган, аломати нуннинг жойида туриши, ي бориз муттасил замир бўлиб, у фоил, сукунга мабний, раф ўринда", ""], "7-1.1": ["الْهَاءُ: ضَمِيرٌ مُتَّصِلٌ مَبْنِيٌّ عَلَى السُّكُونِ فِي مَحَلِّ نَصْبٍ مَفْعُولٌ بِهِ.", "муттасил замир бўлиб мафъулун биҳ, сукунга мабний, насб ўринда", ""], "7-2.0": ["مَرَّةً: مَفْعُولٌ مُطْلَقٌ (نَائِبٌ عَنِ الْمَصْدَرِ لِأَنَّهُ عَدَدُهُ) مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ الْفَتْحَةُ الظَّاهِرَةُ.", "мафъулун мутлақ, насб қилинган, аломати зоҳирий фатҳа, ўзи мавсуф", ""], "7-3.0": ["ثَانِيَةً: صِفَةٌ مَنْصُوبَةٌ وَعَلَامَةُ نَصْبِهَا الْفَتْحَةُ الظَّاهِرَةُ.", "сифат, насб қилинган, аломати зоҳирий фатҳа", ""], "7-4.0": ["إِذَنْ: حَرْفُ جَوَابٍ وَجَزَاءٍ مَبْنِيٌّ عَلَى السُّكُونِ، لَا عَمَلَ لَهُ، لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ.", "жавоб ва жазо ҳарфи, сукунга мабний, эъробдан унга ўрин йўқ\n↳ бу ерда феълдан олдин келмагани учун ҳеч нарсани насб қилмайди", ""], "7j4.0": ["وَجُمْلَةُ «لِمَاذَا تَدْرُسِينَهَا …» ابْتِدَائِيَّةٌ (اسْتِئْنَافِيَّةٌ) لَا مَحَلَّ لَهَا مِنَ الْإِعْرَابِ.", "«لِمَاذَا تَدْرُسِينَهَا …» — ибтидоий (истиънофий) жумла, янги гап бошланади, эъробдан унга ўрин йўқ.", ""], "8s": ["فِي بَلَدِي نَتَعَلَّمُ الْقِرَاءَةَ، وَالْقَوَاعِدَ وَالتَّرْجَمَةَ، وَلَا نَتَعَلَّمُ الْحَدِيثَ بِاللُّغَةِ الْعَرَبِيَّةِ.", "Юртимда ўқишни, қоидаларни ва таржима қилишни ўрганамиз, аммо араб тилида сўзлашишни ўрганмаймиз.", ""], "8-0.0": ["فِي: حَرْفُ جَرٍّ مَبْنِيٌّ عَلَى السُّكُونِ لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ.", "жар ҳарфи, сукунга мабний, эъробдан унга ўрин йўқ", ""], "8-1.0": ["بَلَدِ: اسْمٌ مَجْرُورٌ بِـ«فِي» وَعَلَامَةُ جَرِّهِ الْكَسْرَةُ الْمُقَدَّرَةُ عَلَى مَا قَبْلَ يَاءِ الْمُتَكَلِّمِ، مَنَعَ مِنْ ظُهُورِهَا اشْتِغَالُ الْمَحَلِّ بِالْحَرَكَةِ الْمُنَاسِبَةِ، وَهُوَ مُضَافٌ.", "музоф бўлиб мажрур, فِي сабаб жар қилинган, аломати тақдирий (яъни фаразан) касра, аломат ўрнининг ي га мос ҳаракат билан банд бўлиши унинг зоҳир бўлишига тўсқинлик қилган", ""], "8-1.1": ["ي: ضَمِيرٌ مُتَّصِلٌ مَبْنِيٌّ عَلَى السُّكُونِ فِي مَحَلِّ جَرٍّ مُضَافٌ إِلَيْهِ. وَشِبْهُ الْجُمْلَةِ مُتَعَلِّقٌ بِالْفِعْلِ «نَتَعَلَّمُ».", "муттасил замир бўлиб музофун илайҳ, сукунга мабний, жар ўринда\n↳ жар ва мажрур шибҳи жумла бўлиб, نَتَعَلَّمُ га мутааллиқ", ""], "8-2.0": ["نَتَعَلَّمُ: فِعْلٌ مُضَارِعٌ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ الظَّاهِرَةُ، وَالْفَاعِلُ ضَمِيرٌ مُسْتَتِرٌ وُجُوباً تَقْدِيرُهُ: نَحْنُ.", "музорий феъли, раф қилинган, аломати зоҳирий замма, тагида вожиб ҳолдаги نَحْنُ мустатир замир бор бўлиб, у фоил", ""], "8-3.0": ["الْقِرَاءَةَ: مَفْعُولٌ بِهِ مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ الْفَتْحَةُ الظَّاهِرَةُ.", "мафъулун биҳ, насб қилинган, аломати зоҳирий фатҳа", ""], "8-4.0": ["الْوَاوُ: حَرْفُ عَطْفٍ مَبْنِيٌّ عَلَى الْفَتْحِ لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ.", "атф ҳарфи («ва»), фатҳага мабний, эъробдан унга ўрин йўқ", ""], "8-4.1": ["الْقَوَاعِدَ: اسْمٌ مَعْطُوفٌ عَلَى «الْقِرَاءَةَ» مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ الْفَتْحَةُ الظَّاهِرَةُ.", "الْقِرَاءَةَ га маътуф, насб қилинган, аломати зоҳирий фатҳа", ""], "8-5.0": ["الْوَاوُ: حَرْفُ عَطْفٍ مَبْنِيٌّ عَلَى الْفَتْحِ لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ.", "атф ҳарфи («ва»), фатҳага мабний, эъробдан унга ўрин йўқ", ""], "8-5.1": ["التَّرْجَمَةَ: اسْمٌ مَعْطُوفٌ عَلَى «الْقِرَاءَةَ» مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ الْفَتْحَةُ الظَّاهِرَةُ.", "الْقِرَاءَةَ га маътуф, насб қилинган, аломати зоҳирий фатҳа", ""], "8-6.0": ["الْوَاوُ: حَرْفُ عَطْفٍ مَبْنِيٌّ عَلَى الْفَتْحِ لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ.", "атф ҳарфи («ва»), фатҳага мабний, эъробдан унга ўрин йўқ", ""], "8-6.1": ["لَا: حَرْفُ نَفْيٍ مَبْنِيٌّ عَلَى السُّكُونِ لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ.", "нафий ҳарфи, сукунга мабний, эъробдан унга ўрин йўқ", ""], "8-7.0": ["نَتَعَلَّمُ: فِعْلٌ مُضَارِعٌ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ الظَّاهِرَةُ، وَالْفَاعِلُ ضَمِيرٌ مُسْتَتِرٌ وُجُوباً تَقْدِيرُهُ: نَحْنُ.", "музорий феъли, раф қилинган, аломати зоҳирий замма, тагида вожиб ҳолдаги نَحْنُ мустатир замир бор бўлиб, у фоил", ""], "8-8.0": ["الْحَدِيثَ: مَفْعُولٌ بِهِ مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ الْفَتْحَةُ الظَّاهِرَةُ.", "мафъулун биҳ, насб қилинган, аломати зоҳирий фатҳа", ""], "8-9.0": ["الْبَاءُ: حَرْفُ جَرٍّ مَبْنِيٌّ عَلَى الْكَسْرِ لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ.", "жар ҳарфи, касрага мабний, эъробдан унга ўрин йўқ", ""], "8-9.1": ["اللُّغَةِ: اسْمٌ مَجْرُورٌ وَعَلَامَةُ جَرِّهِ الْكَسْرَةُ الظَّاهِرَةُ. وَشِبْهُ الْجُمْلَةِ مُتَعَلِّقٌ بِـ«الْحَدِيثَ».", "мажрур, بِ сабаб жар қилинган, аломати зоҳирий касра\n↳ ўзи мавсуф\n↳ жар ва мажрур шибҳи жумла бўлиб, الْحَدِيثَ га мутааллиқ", ""], "8-10.0": ["الْعَرَبِيَّةِ: صِفَةٌ مَجْرُورَةٌ وَعَلَامَةُ جَرِّهَا الْكَسْرَةُ الظَّاهِرَةُ.", "сифат, жар қилинган, аломати зоҳирий касра", ""], "8j10.0": ["وَجُمْلَةُ «فِي بَلَدِي نَتَعَلَّمُ …» ابْتِدَائِيَّةٌ (اسْتِئْنَافِيَّةٌ) لَا مَحَلَّ لَهَا مِنَ الْإِعْرَابِ.", "«فِي بَلَدِي نَتَعَلَّمُ …» — ибтидоий (истиънофий) жумла, янги гап бошланади, эъробдан унга ўрин йўқ.", ""], "8j10.1": ["وَجُمْلَةُ «لَا نَتَعَلَّمُ الْحَدِيثَ …» مَعْطُوفَةٌ عَلَى جُمْلَةِ «نَتَعَلَّمُ الْقِرَاءَةَ …» لَا مَحَلَّ لَهَا مِنَ الْإِعْرَابِ.", "«لَا نَتَعَلَّمُ الْحَدِيثَ …» жумласи «نَتَعَلَّمُ الْقِرَاءَةَ …» жумласига маътуф, эъробдан унга ўрин йўқ.", ""], "9s": ["وَلَكِنَّكِ تَتَحَدَّثِينَ الْعَرَبِيَّةَ الْآنَ جَيِّدًا!", "Лекин сиз ҳозир арабчада яхши гапиряпсиз.", ""], "9-0.0": ["الْوَاوُ: حَرْفُ اسْتِئْنَافٍ مَبْنِيٌّ عَلَى الْفَتْحِ لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ.", "ибтидо (истиъноф) ҳарфи, фатҳага мабний, эъробдан унга ўрин йўқ", ""], "9-0.1": ["لَكِنَّ: حَرْفُ اسْتِدْرَاكٍ وَنَصْبٍ مَبْنِيٌّ عَلَى الْفَتْحِ لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ.", "истидрок ва насб ҳарфи, фатҳага мабний, эъробдан унга ўрин йўқ", ""], "9-0.2": ["الْكَافُ: ضَمِيرٌ مُتَّصِلٌ مَبْنِيٌّ عَلَى الْكَسْرِ فِي مَحَلِّ نَصْبٍ اسْمُ «لَكِنَّ».", "муттасил замир бўлиб لَكِنَّ нинг исми, касрага мабний, насб ўринда", ""], "9-1.0": ["تَتَحَدَّثِينَ: فِعْلٌ مُضَارِعٌ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ ثُبُوتُ النُّونِ لِأَنَّهُ مِنَ الْأَفْعَالِ الْخَمْسَةِ، وَيَاءُ الْمُخَاطَبَةِ ضَمِيرٌ مُتَّصِلٌ مَبْنِيٌّ عَلَى السُّكُونِ فِي مَحَلِّ رَفْعٍ فَاعِلٌ.", "музорий феъли, раф қилинган, аломати нуннинг жойида туриши, ي бориз муттасил замир бўлиб, у фоил, сукунга мабний, раф ўринда", ""], "9-2.0": ["الْعَرَبِيَّةَ: مَفْعُولٌ بِهِ مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ الْفَتْحَةُ الظَّاهِرَةُ.", "мафъулун биҳ, насб қилинган, аломати зоҳирий фатҳа", ""], "9-3.0": ["الْآنَ: ظَرْفُ زَمَانٍ مَبْنِيٌّ عَلَى الْفَتْحِ فِي مَحَلِّ نَصْبٍ، مُتَعَلِّقٌ بِـ«تَتَحَدَّثِينَ».", "зарф замон, фатҳага мабний, насб ўринда, ўзи шибҳи жумла бўлиб, تَتَحَدَّثِينَ га мутааллиқ", ""], "9-4.0": ["جَيِّداً: صِفَةٌ لِمَفْعُولٍ مُطْلَقٍ مَحْذُوفٍ تَقْدِيرُهُ: «تَحَدُّثاً جَيِّداً»، مَنْصُوبَةٌ وَعَلَامَةُ نَصْبِهَا الْفَتْحَةُ الظَّاهِرَةُ.", "сифат, насб қилинган, аломати зоҳирий фатҳа\n↳ олдидан маҳзуф (ҳазф қилинган) мафъулун мутлақ бор, ўзи мавсуф: تَحَدُّثاً جَيِّداً", ""], "9j4.0": ["وَجُمْلَةُ «لَكِنَّكِ تَتَحَدَّثِينَ …» ابْتِدَائِيَّةٌ (اسْتِئْنَافِيَّةٌ) لَا مَحَلَّ لَهَا مِنَ الْإِعْرَابِ.", "«لَكِنَّكِ تَتَحَدَّثِينَ …» — ибтидоий (истиънофий) жумла, янги гап бошланади, эъробдан унга ўрин йўқ.", ""], "9j4.1": ["وَجُمْلَةُ «تَتَحَدَّثِينَ …» فِي مَحَلِّ رَفْعٍ خَبَرُ «لَكِنَّ».", "«تَتَحَدَّثِينَ الْعَرَبِيَّةَ …» жумласи لَكِنَّ нинг хабари бўлиб, раф ўринда.", ""], "10s": ["تَعَلَّمْتُ الْحَدِيثَ بِاللُّغَةِ الْعَرَبِيَّةِ هُنَا. فِي الْمَعْهَدِ مُخْتَبَرٌ وَحَاسُوبٌ وَإِذَاعَةٌ وَمَكْتَبَةٌ.", "Мен араб тилида гапиришни шу ерда ўргандим. Институтда лингафон хонаси (луғ.лаборатори لتَّفْسِيرِ وَالْحَدِيثِ وَالْفِقْهِ وَغَيْرِهَا.", "Қуръон наҳв, сарф, балоғат каби араб тили фанларининг ҳамда тафсир, ҳадис, фиқҳ ва бошқа фанлар каби ислом динига оид фанларнинг вужудга келишига сабабчи бўлган.", ""], "18": ["أَثَّرَتِ اللُّغَةُ الْعَرَبِيَّةُ فِي لُغَاتِ الشُّعُوبِ الْإِسْلَامِيَّةِ، كَالْفَارِسِيَّةِ وَالْأُرْدِيَّةِ وَالسَّوَاحِلِيَّةِ،", "Араб тили форсча, урдуча ва суахили тили каби исломий халқлар тилларига таъсир кўрсатди.", ""], "19": ["فَأَقْرَضَتْهَا كَثِيرًا مِنَ الْأَلْفَاظِ،", "Натижада уларга ўзидан кўп сўзларни киритди (луғ. уларга кўп сўзларни қарз қилиб берди).", ""], "20": ["وَكُتِبَ كَثِيرٌ مِنْ تِلْكَ اللُّغَاتِ بِالْحَرْفِ الْعَرَبِيِّ.", "Шу сабаб ушбу тилларнинг кўпчилиги арабча ҳарфда (ёки шрифтда) ёзилган.", ""], "21": ["وَاقْتَرَضَتْ لُغَاتٌ أُخْرَى بَعْضَ الْأَلْفَاظِ الْعَرَبِيَّةِ، مِثْلُ: الْإِنْجِلِيزِيَّةِ وَالْفَرَنْسِيَّةِ وَالْإِسْبَانِيَّةِ.", "Инглизча, французча ва испан тили каби бошқа тиллар ҳам айрим арабча сўзларни ўзлаштириб олган.", ""]}, "t": {"f": "t95-24c845bd.mp3", "m": [[0, "h", 0.0, 7.69], ["1s", "ar", 8.49, 11.01], ["1-0.0", "ar", 12.01, 21.69], ["1-1.0", "ar", 22.39, 27.54], ["1-2.0", "ar", 28.24, 33.25], ["1-2.1", "ar", 33.95, 41.28], ["1-2.2", "ar", 41.98, 47.34], ["8s", "ar", 48.74, 52.87], ["8-0.0", "ar", 53.87, 57.04], ["8-0.1", "ar", 57.74, 67.67], ["8-1.0", "ar", 68.37, 74.45], ["8-2.0", "ar", 75.15, 80.24], ["8-3.0", "ar", 80.94, 85.81], ["8-4.0", "ar", 86.51, 92.86], ["8-5.0", "ar", 93.56, 98.85], ["8-6.0", "ar", 99.55, 107.87], ["8-7.0", "ar", 108.57, 114.05], ["8j7.0", "ar", 114.75, 121.1], ["9s", "ar", 122.5, 125.09], ["9-0.0", "ar", 126.09, 131.09], ["9-0.1", "ar", 131.79, 135.62], ["9-1.0", "ar", 136.32, 141.11], ["9-2.0", "ar", 141.81, 154.06], ["9-3.0", "ar", 154.76, 160.27], ["9j3.0", "ar", 160.97, 168.45], ["10s", "ar", 169.85, 173.5], ["10-0.0", "ar", 174.5, 179.5], ["10-0.1", "ar", 180.2, 184.03], ["10-0.2", "ar", 184.73, 190.88], ["10-1.0", "ar", 191.58, 196.61], ["10-1.1",  раф ўринда.", ""], "12j15.2": ["وَجُمْلَةُ «كَانَ الْعَرَبُ يَتَحَدَّثُونَ بِهَا» صِلَةُ الْمَوْصُولِ لَا مَحَلَّ لَهَا مِنَ الْإِعْرَابِ.", "«كَانَ الْعَرَبُ يَتَحَدَّثُونَ بِهَا» — силатул мавсул, эъробдан унга ўрин йўқ.", ""], "13s": ["ثُمَّ جَاءَ الْإِسْلَامُ، وَأَنْزَلَ اللَّهُ الْقُرْآنَ الْكَرِيمَ بِاللُّغَةِ الْعَرَبِيَّةِ الْفَصِيحَةِ.", "Кейин эса Ислом дини келди ва Аллоҳ Қуръони Каримни адабий араб тилида нозил қилди.", ""], "13-0.0": ["ثُمَّ: حَرْفُ عَطْفٍ مَبْنِيٌّ عَلَى الْفَتْحِ لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ.", "атф ҳарфи («кейин»), фатҳага мабний, эъробдан унга ўрин йўқ", ""], "13-1.0": ["جَاءَ: فِعْلٌ مَاضٍ مَبْنِيٌّ عَلَى الْفَتْحِ.", "мозий феъли, фатҳага мабний", ""], "13-2.0": ["الْإِسْلَامُ: فَاعِلٌ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ الظَّاهِرَةُ.", "фоил, раф қилинган, аломати зоҳирий замма", ""], "13j2.0": ["وَجُمْلَةُ «جَاءَ الْإِسْلَامُ» مَعْطُوفَةٌ عَلَى جُمْلَةِ «كَانَتْ لِلْعَرَبِ لُغَةٌ …» لَا مَحَلَّ لَهَا مِنَ الْإِعْرَابِ.", "«جَاءَ الْإِسْلَامُ» жумласи «كَانَتْ لِلْعَرَبِ لُغَةٌ …» жумласига маътуф, эъробдан унга ўрин йўқ.", ""], "13-3.0": ["الْوَاوُ: حَرْفُ عَطْفٍ مَبْنِيٌّ عَلَى الْفَتْحِ لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ.", "атф ҳарфи («ва»), фатҳага мабний, эъробдан унга ўрин йўқ", ""], "13-3.1": ["أَنْزَلَ: فِعْلٌ مَاضٍ مَبْنِيٌّ عَلَى الْفَتْحِ.", "мозий феъли, фатҳага мабний", ""], "13-4.0": ["اللَّهُ: لَفْظُ الْجَلَالَةِ فَاعِلٌ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ الظَّاهِرَةُ.", "лафзи жалола бўлиб фоил, раф қилинган, аломати зоҳирий замма", ""], "13-5.0": ["الْقُرْآنَ: مَفْعُولٌ بِهِ مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ الْفَتْحَةُ الظَّاهِرَةُ. وَهُوَ مَوْصُوفٌ.", "мафъулун биҳ, насб қилинган, аломати зоҳирий фатҳа\n↳ ўзи мавсуф", ""], "13-6.0": ["الْكَرِيمَ: صِفَةٌ مَنْصُوبَةٌ وَعَلَامَةُ نَصْبِهَا الْفَتْحَةُ الظَّاهِرَةُ.", "сифат, насб қилинган, аломати зоҳирий фатҳа", ""], "13-7.0": ["الْبَاءُ: حَرْفُ جَرٍّ مَبْنِيٌّ عَلَى الْكَسْرِ لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ.", "жар ҳарфи, касрага мабний, эъробдан унга ўрин йўқ", ""], "13-7.1": ["اللُّغَةِ: اسْمٌ مَجْرُورٌ وَعَلَامَةُ جَرِّهِ الْكَسْرَةُ الظَّاهِرَةُ. وَهُوَ مَوْصُوفٌ.", "мажрур, بِ сабаб жар қилинган, аломати зоҳирий касра\n↳ ўзи мавсуф\n↳ жар ва мажрур шибҳи жумла бўлиб, أَنْزَلَ феълига мутааллиқ", ""], "13-8.0": ["الْعَرَبِيَّةِ: صِفَةٌ مَجْرُورَةٌ وَعَلَامَةُ جَرِّهَا الْكَسْرَةُ الظَّاهِرَةُ.", "сифат, жар қилинган, аломати зоҳирий касра\n↳ 1чи сифат", ""], "13-9.0": ["الْفَصِيحَةِ: صِفَةٌ مَجْرُورَةٌ وَعَلَامَةُ جَرِّهَا الْكَسْرَةُ الظَّاهِرَةُ.", "сифат, жар қилинган, аломати зоҳирий касра\n↳ 2чи сифат", ""], "13j9.0": ["وَجُمْلَةُ «أَنْزَلَ اللَّهُ الْقُرْآنَ …» مَعْطُوفَةٌ عَلَى جُمْلَةِ «جَاءَ الْإِسْلَامُ» لَا مَحَلَّ لَهَا مِنَ الْإِعْرَابِ.", "«أَنْزَلَ اللَّهُ الْقُرْآنَ …» жумласи «جَاءَ الْإِسْلَامُ» жумласига маътуф, эъробдан унга ўрин йўқ.", ""], "14s": ["قَالَ اللَّهُ تَعَالَى: إِنَّا أَنْزَلْنَاهُ قُرْآنًا عَرَبِيًّا لَعَلَّكُمْ تَعْقِلُونَ.", "Аллоҳ таоло шундай деган: “Албатта Биз уни, англаб етишингиз учун, арабча ўқилмиш қилиб нозил қилдик”. (Юсуф-2)", ""], "14-0.0": ["قَالَ: فِعْلٌ مَاضٍ مَبْنِيٌّ عَلَى الْفَتْحِ.", "мозий феъли, фатҳага мабний", ""], "14-1.0": ["اللَّهُ: لَفْظُ الْجَلَالَةِ فَاعِلٌ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ الظَّاهِرَةُ.", "лафзи жалола бўлиб фоил, раф қилинган, аломати зоҳирий замма", ""], "14-2.0": ["تَعَالَى: فِعْلٌ مَاضٍ مَبْنِيٌّ عَلَى الْفَتْحِ الْمُقَدَّرِ عَلَى الْأَلِفِ لِلتَّعَذُّرِ، وَالْفَاعِلُ ضَمِيرٌ مُسْتَتِرٌ جَوَازاً تَقْدِيرُهُ: هُوَ. وَالْفِعْلُ وَالْفَاعِلُ جُمْلَةٌ فِي مَحَلِّ نَصْبٍ حَالٌ مِنْ لَفْظِ الْجَلَالَةِ.", "мозий феъли, тақдирий (яъни фаразан) фатҳага мабний, аломатнинг зоҳир бўлишига алифнинг ҳаракат қабул қилмаслиги тўсқинлик қилган, тагида жоиз ҳолдаги هُوَ мустатир замир бор бўлиб, у фоил\n↳ феъл ва фоилдан иборат жумла اللَّهُ дан ҳол бўлиб, насб ўринда", ""], "14-3.0": ["إِنَّ: حَرْفُ تَوْكِيدٍ وَنَصْبٍ مَبْنِيٌّ عَلَى الْفَتْحِ لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ.", "енгилаштирилган таъкид ва насб ҳарфи, сукунга мабний, эъробдан унга ўрин йўқ", ""], "14-3.1": ["نَا: ضَمِيرٌ مُتَّصِلٌ مَبْنِيٌّ عَلَى السُّكُونِ فِي مَحَلِّ نَصْبٍ اسْمُ «إِنَّ».", "муттасил замир бўлиб إِنَّ нинг исми, сукунга мабний, насб ўринда\n↳ إِنَّ + نَا — бир нун тушиб, إِنَّا бўлган", ""], "14-4.0": ["أَنْزَلْ: فِعْلٌ مَاضٍ مَبْنِيٌّ عَلَى السُّكُونِ لِاتِّصَالِهِ بِضَمِيرِ الرَّفْعِ الْمُتَحَرِّكِ.", "мозий феъли, сукунга мабний", ""], "14-4.1": ["نَا: ضَمِيرٌ مُتَّصِلٌ مَبْنِيٌّ عَلَى السُّكُونِ فِي مَحَلِّ رَفْعٍ فَاعِلٌ.", "муттасил замир бўлиб фоил, сукунга мабний, раф ўринда", ""], "14-4.2": ["الْهَاءُ: ضَمِيرٌ مُتَّصِلٌ مَبْنِيٌّ عَلَى الضَّمِّ فِي مَحَلِّ نَصْبٍ مَفْعُولٌ بِهِ. وَالْفِعْلُ وَالْفَاعِلُ جُمْلَةٌ فِي مَحَلِّ رَفْعٍ خَبَرُ «إِنَّ».", "муттасил замир бўлиб мафъулун биҳ, заммага мабний, насб ўринда\n↳ феъл ва фоилдан иборат жумла إِنَّ нинг хабари бўлиб, раф ўринда", ""], "14-5.0": ["قُرْآناً: حَالٌ مِنَ الْهَاءِ مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ الْفَتْحَةُ الظَّاهِرَةُ. وَهُوَ مَوْصُوفٌ.", "ҳол, насб қилинган, аломати зоҳирий фатҳа, ўзи мавсуф\n↳ هُ замиридан ҳол", ""], "14-6.0": ["عَرَبِيًّا: صِفَةٌ مَنْصُوبَةٌ وَعَلَامَةُ نَصْبِهَا الْفَتْحَةُ الظَّاهِرَةُ.", "сифат, насб қилинган, аломати зоҳирий фатҳа", ""], "14-7.0": ["لَعَلَّ: حَرْفُ تَرَجٍّ وَنَصْبٍ مَبْنِيٌّ عَلَى الْفَتْحِ لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ.", "таражжий (умид) ва насб ҳарфи (إِنَّ нинг синглиси), фатҳага мабний, эъробдан унга ўрин йўқ", ""], "14-7.1": ["كُمْ: ضَمِيرٌ مُتَّصِلٌ مَبْنِيٌّ عَلَى السُّكُونِ فِي مَحَلِّ نَصْبٍ اسْمُ «لَعَلَّ».", "муттасил замир бўлиб لَعَلَّ нинг исми, сукунга мабний, насб ўринда", ""], "14-8.0": ["تَعْقِلُو: فِعْلٌ مُضَارِعٌ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ ثُبُوتُ النُّونِ لِأَنَّهُ مِنَ الْأَفْعَالِ الْخَمْسَةِ، وَالْوَاوُ ضَمِيرٌ مُتَّصِلٌ مَبْنِيٌّ عَلَى السُّكُونِ فِي مَحَلِّ رَفْعٍ فَاعِلٌ. وَالْفِعْلُ وَالْفَاعِلُ جُمْلَةٌ فِي مَحَلِّ رَفْعٍ خَبَرُ «لَعَلَّ».", "музорий феъли, раф қилинган, аломати нуннинг жойида туриши, و бориз муттасил замир бўлиб, у фоил, сукунга мабний, раф ўринда\n↳ феъл ва фоилдан иборат жумла لَعَلَّ нинг хабари бўлиб, раф ўринда", ""], "14j8.0": ["وَجُمْلَةُ «قَالَ اللَّهُ تَعَالَى …» ابْتِدَائِيَّةٌ (اسْتِئْنَافِيَّةٌ) لَا مَحَلَّ لَهَا مِنَ الْإِعْرَابِ.", "«قَالَ اللَّهُ تَعَالَى …» — ибтидоий (истиънофий) жумла, янги гап бошланади, эъробдан унга ўрин йўқ.", ""], "14j8.1": ["وَجُمْلَةُ «إِنَّا أَنْزَلْنَاهُ …» فِي مَحَلِّ نَصْبٍ مَقُولُ الْقَوْلِ.", "«إِنَّا أَنْزَلْنَاهُ …» — мақули қавл (айтилган сўз) бўлиб, насб ўринда.", ""], "14j8.2": ["وَجُمْلَةُ «لَعَلَّكُمْ تَعْقِلُونَ» تَعْلِيلِيَّةٌ لَا مَحَلَّ لَهَا مِنَ الْإِعْرَابِ.", "«لَعَلَّكُمْ تَعْقِلُونَ» — таълилий (сабабни билдирувчи) жумла, эъробдан унга ўрин йўқ.", ""], "15s": ["أَعْطَى الْقُرْآنُ الْكَرِيمُ بَعْضَ الْأَلْفَاظِ الْعَرَبِيَّةِ الْقَدِيمَةِ مَعَانِيَ جَدِيدَةً،", "Қуръони Карим айрим қадимий арабча сўзларга янги маънолар олиб кирди", ""], "15-0.0": ["أَعْطَى: فِعْلٌ مَاضٍ مَبْنِيٌّ عَلَى الْفَتْحِ الْمُقَدَّرِ عَلَى الْأَلِفِ لِلتَّعَذُّرِ.", "мозий феъли, тақдирий (яъни фаразан) фатҳага мабний, аломатнинг зоҳир бўлишига алифнинг ҳаракат қабул қилмаслиги тўсқинлик қилган\n↳ أَعْطَى — икки мафъулли феъл: кимга (1-мафъул) ва нимани (2-мафъул)", ""], "15-1.0": ["الْقُرْآنُ: فَاعِلٌ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ الظَّاهِرَةُ. وَهُوَ مَوْصُوفٌ.", "фоил, раф қилинган, аломати зоҳирий замма\n↳ ўзи мавсуф", ""], "15-2.0": ["الْكَرِيمُ: صِفَةٌ مَرْفُوعَةٌ وَعَلَامَةُ رَفْعِهَا الضَّمَّةُ الظَّاهِرَةُ.", "сифат, раф қилинган, аломати зоҳирий замма", ""], "15-3.0": ["بَعْضَ: مَفْعُولٌ بِهِ أَوَّلُ مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ الْفَتْحَةُ الظَّاهِرَةُ، وَهُوَ مُضَافٌ.", "музоф бўлиб биринчи мафъулун биҳ, насб қилинган, аломати зоҳирий фатҳа", ""], "15-4.0": ["الْأَلْفَاظِ: مُضَافٌ إِلَيْهِ مَجْرُورٌ وَعَلَامَةُ جَرِّهِ الْكَسْرَةُ الظَّاهِرَةُ. وَهُوَ مَوْصُوفٌ.", "музофун илайҳ, жар қилинган, аломати зоҳирий касра\n↳ ўзи мавсуф", ""], "15-5.0": ["الْعَرَبِيَّةِ: صِفَةٌ مَجْرُورَةٌ وَعَلَامَةُ جَرِّهَا الْكَسْرَةُ الظَّاهِرَةُ.", "сифат, жар қилинган, аломати зоҳирий касра\n↳ 1чи сифат", ""], "15-6.0": ["الْقَدِيمَةِ: صِفَةٌ مَجْرُورَةٌ وَعَلَامَةُ جَرِّهَا الْكَسْرَةُ الظَّاهِرَةُ.", "сифат, жар қилинган, аломати зоҳирий касра\n↳ 2чи сифат", ""], "15-7.0": ["مَعَانِيَ: مَفْعُولٌ بِهِ ثَانٍ مَنْصُوبٌ وَعَلَامَةُ نَصْبِهِ الْفَتْحَةُ الظَّاهِرَةُ، وَلَمْ يُنَوَّنْ لِأَنَّهُ مَمْنُوعٌ مِنَ الصَّرْفِ لِأَنَّهُ عَلَى صِيغَةِ مُنْتَهَى الْجُمُوعِ. وَهُوَ مَوْصُوفٌ.", "иккинчи мафъулун биҳ, насб қилинган, аломати зоҳирий фатҳа, ўзи мавсуф\n↳ ғайри мунсариф (энг охирги кўплик вазни — صِيغَةُ مُنْتَهَى الْجُمُوعِ): танвин олмайди", ""], "15-8.0": ["جَدِيدَةً: صِفَةٌ مَنْصُوبَةٌ وَعَلَامَةُ نَصْبِهَا الْفَتْحَةُ الظَّاهِرَةُ.", "сифат, насб қилинган, аломати зоҳирий фатҳа", ""], "15j8.0": ["وَجُمْلَةُ «أَعْطَى الْقُرْآنُ الْكَرِيمُ …» ابْتِدَائِيَّةٌ (اسْتِئْنَافِيَّةٌ) لَا مَحَلَّ لَهَا مِنَ الْإِعْرَابِ.", "«أَعْطَى الْقُرْآنُ الْكَرِيمُ …» — ибтидоий (истиънофий) жумла, янги гап бошланади, эъробдан унга ўрин йўқ.", ""], "16s": ["وَجَاءَ بِأَسَالِيبَ جَدِيدَةٍ، لَمْ تَعْرِفْهَا الْعَرَبِيَّةُ مِنْ قَبْلُ.", "ва илгари араб тили билмаган янги услубларни олиб келди.", ""], "16-0.0": ["الْوَاوُ: حَرْفُ عَطْفٍ مَبْنِيٌّ عَلَى الْفَتْحِ لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ.", "атф ҳарфи («ва»), фатҳага мабний, эъробдан унга ўрин йўқ", ""], "16-0.1": ["جَاءَ: فِعْلٌ مَاضٍ مَبْنِيٌّ عَلَى الْفَتْحِ، وَالْفَاعِلُ ضَمِيرٌ مُسْتَتِرٌ جَوَازاً تَقْدِيرُهُ: هُوَ.", "мозий феъли, фатҳага мабний, тагида жоиз ҳолдаги هُوَ мустатир замир бор бўлиб, у фоил\n↳ هُوَ — الْقُرْآنُ га қайтади", ""], "16-1.0": ["الْبَاءُ: حَرْفُ جَرٍّ مَبْنِيٌّ عَلَى الْكَسْرِ لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ.", "жар ҳарфи, касрага мабний, эъробдан унга ўрин йўқ", ""], "16-1.1": ["أَسَالِيبَ: اسْمٌ مَجْرُورٌ بِالْبَاءِ وَعَلَامَةُ جَرِّهِ الْفَتْحَةُ نِيَابَةً عَنِ الْكَسْرَةِ لِأَنَّهُ مَمْنُوعٌ مِنَ الصَّرْفِ لِأَنَّهُ عَلَى صِيغَةِ مُنْتَهَى الْجُمُوعِ، وَالْجَارُّ وَالْمَجْرُورُ مُتَعَلِّقَانِ بِـ«جَاءَ». وَهُوَ مَوْصُوفٌ.", "мажрур, بِ сабаб жар қилинган, аломати касрага ўринбосар фатҳа, ўзи мавсуф\n↳ ғайри мунсариф (энг охирги кўплик вазни — صِيغَةُ مُنْتَهَى الْجُمُوعِ): танвин олмайди\n↳ жар ҳарфи ва мажрур шибҳи жумла бўлиб, جَاءَ феълига мутааллиқ", ""], "16-2.0": ["جَدِيدَةٍ: صِفَةٌ مَجْرُورَةٌ وَعَلَامَةُ جَرِّهَا الْكَسْرَةُ الظَّاهِرَةُ.", "сифат, жар қилинган, аломати зоҳирий касра", ""], "16-3.0": ["لَمْ: حَرْفُ نَفْيٍ وَجَزْمٍ وَقَلْبٍ مَبْنِيٌّ عَلَى السُّكُونِ لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ.", "жазм ҳарфи, сукунга мабний, эъробдан унга ўрин йўқ", ""], "16-4.0": ["تَعْرِفْ: فِعْلٌ مُضَارِعٌ مَجْزُومٌ بِـ«لَمْ» وَعَلَامَةُ جَزْمِهِ السُّكُونُ الظَّاهِرُ.", "музорий феъли, لَمْ сабаб жазм қилинган, аломати зоҳирий сукун", ""], "16-4.1": ["الْهَاءُ: ضَمِيرٌ مُتَّصِلٌ مَبْنِيٌّ عَلَى السُّكُونِ فِي مَحَلِّ نَصْبٍ مَفْعُولٌ بِهِ.", "муттасил замир бўлиб мафъулун биҳ, сукунга мабний, насб ўринда\n↳ هَا — أَسَالِيبَ га қайтади", ""], "16-5.0": ["الْعَرَبِيَّةُ: فَاعِلٌ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ الظَّاهِرَةُ.", "фоил, раф қилинган, аломати зоҳирий замма", ""], "16-6.0": ["مِنْ: حَرْفُ جَرٍّ مَبْنِيٌّ عَلَى السُّكُونِ لَا مَحَلَّ لَهُ مِنَ الْإِعْرَابِ.", "жар ҳарфи, сукунга мабний, эъробдан унга ўрин йўқ", ""], "16-7.0": ["قَبْلُ: ظَرْفُ زَمَانٍ مَبْنِيٌّ عَلَى الضَّمِّ فِي مَحَلِّ جَرٍّ بِـ«مِنْ»، وَالْجَارُّ وَالْمَجْرُورُ مُتَعَلِّقَانِ بِـ«تَعْرِفْ».", "зарф замон, заммага мабний, жар ўринда\n↳ музофун илайҳи ҳазф қилиниб, маъноси ниятда қолгани учун заммага мабний: مِنْ قَبْلِ ذَلِكَ\n↳ жар ҳарфи ва мажрур шибҳи жумла бўлиб, تَعْرِفْ феълига мутааллиқ", ""], "16j7.0": ["وَجُمْلَةُ «جَاءَ بِأَسَالِيبَ جَدِيدَةٍ» مَعْطُوفَةٌ عَلَى جُمْلَةِ «أَعْطَى الْقُرْآنُ …» لَا مَحَلَّ لَهَا مِنَ الْإِعْرَابِ.", "«جَاءَ بِأَسَالِيبَ جَدِيدَةٍ» жумласи «أَعْطَى الْقُرْآنُ …» жумласига маътуф, эъробдан унга ўрин йўқ.", ""], "16j7.1": ["وَجُمْلَةُ «لَمْ تَعْرِفْهَا الْعَرَبِيَّةُ مِنْ قَبْلُ» فِي مَحَلِّ جَرٍّ صِفَةٌ لِـ«أَسَالِيبَ».", "«لَمْ تَعْرِفْهَا الْعَرَبِيَّةُ مِنْ ق function trk(L){return MODE==='v'&&L.v?L.v:MODE==='t'&&L.t?L.t:L}
function cm(){var L=LIST[li];return TR===L?'l':TR===L.v?'v':'t'}
var MN={v:'Луғат',t:'Таркиб'};
var q=(location.search.match(/d=(\d+)/)||[])[1];
if(!q){try{q=localStorage.getItem('tinglash-dars')}catch(e){}}
LIST.forEach(function(x,i){if(String(x.n)===String(q))li=i});
function fmt(t){t=Math.max(0,t|0);return (t/60|0)+':'+('0'+t%60).slice(-2)}
function chips(){$('ls').innerHTML=LIST.map(function(x,i){return '<button class="lc'+(i===li?' on':'')+'" data-i="'+i+'">'+x.n+'-дарс</button>'}).join('')}
$('ls').onclick=function(e){var b=e.target.closest('.lc');if(!b)return;load(+b.dataset.i,true)};
function load(i,play){li=i;var L=LIST[i];TR=trk(L);M=TR.m;reps=0;curAr=-1;shown=-2;A.src=TR.f;A.playbackRate=O.sp;chips();
  NI=M.filter(function(s){return s[1]==='ar'}).length;$('md').style.display=L.v||L.t?'':'none';
  [].forEach.call($('md').children,function(b){b.style.display=b.dataset.v==='l'||L[b.dataset.v]?'':'none';b.classList.toggle('on',b.dataset.v===cm())});
  try{localStorage.setItem('tinglash-dars',L.n)}catch(e){}
  $('stt').textContent=L.n+'-дарс · '+(TR===L?L.uz:MN[cm()]);show(-1);
  if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:L.n+'-дарс: '+(TR===L?L.uz:MN[cm()]),artist:'نور الطالب',artwork:[{src:'icon-512.png',sizes:'512x512',type:'image/png'}]})}catch(e){}}
  if(play)A.play().catch(function(){});}
function segAt(t){for(var i=M.length-1;i>=0;i--)if(t>=M[i][2]-0.05)return i;return -1}
function show(i){if(i===shown)return;shown=i;var L=LIST[li],st=$('st');st.scrollTop=0;
  var k=0;if(i>=0)for(var j=0;j<=i;j++)if(M[j][1]==='ar')k++;$('stn').textContent=i>=0&&M[i][1]!=='h'?k+' / '+NI:'';
  if(i<0||M[i][1]==='h'){$('sp').textContent='';$('sa').textContent=i<0?L.ar:(M[i][4]||'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ');$('su').textContent=i<0?'':(M[i][5]||'');st.className='stage';return}
  var s=M[i],ln=TR.l[s[0]];$('sp').textContent=/^[\d\s.-]+$/.test(ln[2]||'')?'\u2066'+ln[2]+'\u2069':(ln[2]||'');$('sa').textContent=ln[0];$('su').textContent=O.tr?ln[1]:'';st.className='stage k-'+(s[1]==='ar2'?'ar':s[1])+(TR===L.t?' tk':'')}
function nextArFrom(i){for(var j=i+1;j<M.length;j++)if(M[j][1]==='ar')return j;return -1}
function prevArFrom(i){for(var j=i-1;j>=0;j--)if(M[j][1]==='ar')return j;return -1}
A.addEventListener('timeupdate',function(){var t=A.currentTime,i=segAt(t);
  if(i>=0&&M[i][1]==='ar'&&i!==curAr){curAr=i;reps=0}
  // gapni takrorlash: arabcha gap tugagach boshiga qaytish
  if(curAr>=0&&O.rep>1&&t>=M[curAr][3]&&t<M[curAr][3]+0.9&&reps<O.rep-1){reps++;A.currentTime=M[curAr][2];return}
  // tarjima o'chiq: o'zbekcha bo'lakni sakrab o'tish
  if(!O.tr&&i>=0&&(M[i][1]==='uz'||M[i][1]==='ar2')){var n=nextArFrom(i);A.currentTime=n>=0?M[n][2]:A.duration;return}
  show(i);
  if(A.duration){$('rg').value=Math.round(t*1000/A.duration);$('tc').textContent=fmt(t);$('td').textContent=fmt(A.duration)}
});
A.addEventListener('ended',function(){
  if(O.loop){A.currentTime=0;A.play();return}
  if(O.next&&li+1<LIST.length){load(li+1,true);return}
  show(-1);
});
A.addEventListener('loadedmetadata',function(){A.playbackRate=O.sp});
A.addEventListener('play',function(){$('ipl').innerHTML='<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>'});
A.addEventListener('pause',function(){$('ipl').innerHTML='<path d="M8 5v14l11-7z"/>'});
$('bpl').onclick=function(){if(A.paused)A.play().catch(function(){});else A.pause()};
function goSeg(dir){var i=segAt(A.currentTime),j=dir>0?nextArFrom(i):prevArFrom(i>=0&&M[i][1]==='ar'&&A.currentTime-M[i][2]<1.2?i:i+1);
  if(dir<0&&j<0)j=nextArFrom(-1);if(j>=0){curAr=j;reps=0;A.currentTime=M[j][2]}else if(dir>0&&O.next&&li+1<LIST.length)load(li+1,!A.paused)}
$('bn').onclick=function(){goSeg(1)};$('bp').onclick=function(){goSeg(-1)};
$('rg').oninput=function(){if(A.duration)A.currentTime=this.value*A.duration/1000};
if('mediaSession' in navigator){try{
  navigator.mediaSession.setActionHandler('play',function(){A.play()});navigator.mediaSession.setActionHandler('pause',function(){A.pause()});
  navigator.mediaSession.setActionHandler('nexttrack',function(){goSeg(1)});navigator.mediaSession.setActionHandler('previoustrack',function(){goSeg(-1)});
}catch(e){}}
function ui(){$('oTr').classList.toggle('on',!!O.tr);$('oLoop').classList.toggle('on',!!O.loop);$('oNext').classList.toggle('on',!!O.next);
  [].forEach.call($('oRep').children,function(b){b.classList.toggle('on',+b.dataset.v===O.rep)});
  [].forEach.call($('oSp').children,function(b){b.classList.toggle('on',+b.dataset.v===O.sp)})}
$('oTr').onclick=function(){O.tr=O.tr?0:1;save();ui();shown=-2;show(segAt(A.currentTime))};
$('oLoop').onclick=function(){O.loop=O.loop?0:1;if(O.loop)O.next=0;save();ui()};
$('oNext').onclick=function(){O.next=O.next?0:1;if(O.next)O.loop=0;save();ui()};
$('oRep').onclick=function(e){var b=e.target.closest('button');if(!b)return;O.rep=+b.dataset.v;save();ui()};
$('oSp').onclick=function(e){var b=e.target.closest('button');if(!b)return;O.sp=+b.dataset.v;A.playbackRate=O.sp;save();ui()};
$('md').onclick=function(e){var b=e.target.closest('button');if(!b||cm()===b.dataset.v)return;MODE=b.dataset.v;try{localStorage.setItem('tinglash-mode',MODE)}catch(e){}load(li,!A.paused)};
function sheet(on){$('opts').classList.toggle('on',on);$('shb').classList.toggle('on',on)}
$('bg').onclick=function(){sheet(true)};$('oc').onclick=$('shb').onclick=function(){sheet(false)};
ui();load(li,false);
(function(){var s=(location.search.match(/[?&]s=(\d+)/)||[])[1];if(s==null||cm()!=='l')return;var j=-1;M.forEach(function(x,i){if(j<0&&x[1]==='ar'&&String(x[0])===s)j=i});if(j<0)return;
  var go=function(){A.currentTime=M[j][2];curAr=j;show(j);A.play().catch(function(){})};if(A.readyState>=1)go();else A.addEventListener('loadedmetadata',go,{once:true})})();if(q)$('bk').href=q+'.html';if(LIST.length<2)$('ls').style.display='none';
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
