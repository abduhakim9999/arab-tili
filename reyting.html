<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Рейтинг</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c5e3f">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="shell.css">
<script>
/* «Рейтинг» (14.11.2026, foydalanuvchi qarori; dizayn — 2-variant «шоҳсупа»; docs/texnik.md 19) — qobiqning beshinchi bo'limi.
   Ikki ro'yxat: «Ҳафта» — shu hafta bali (dushanba 00:00, Toshkent vaqti, 0 dan; takror.js Takror.ball) va «Сўзлар» — jami biladigan so'z
   (Машқ dagi «N сўзни биламан», takror-xulosa.bilgan). Ism — o'quvchi o'zi yozgani («Яна» → Аккаунт, localStorage «ism»).
   Boshqalar ro'yxati — server (/api/reyting, keyingi bosqich). Server javob bermasa: ko'rish/sinov manzilida — namuna ro'yxat (belgisi bilan),
   asosiy saytda — faqat o'quvchining o'zi va «тез орада» yozuvi. */
var SN = /\/sinov-[^\/]*$/.test(location.pathname) ? 'sinov-' : '';
document.write('<script src="tg.js" data-key="" data-home="' + SN + 'yol.html"><\/script>' + (SN ? '' : '<script src="baza.js"><\/script>') +
  '<script src="fsrs.js"><\/script><script src="' + SN + 'takror.js"><\/script><script src="' + SN + 'qobiq.js"><\/script>');
</script>
<style>
body{margin:0;background-color:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.r-hd{background:var(--em2,#0c5e3f);color:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 0}
.r-in{max-width:528px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.r-tt{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;min-height:48px}
.r-tt small{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;color:#f6dc94;text-transform:uppercase}
.r-tt h1{margin:0;font-size:24px;line-height:1.15;font-weight:700}
.r-tt span{padding-bottom:3px;font-size:12.5px;color:#cfe3d8;text-align:right}
.r-sg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:rgba(0,0,0,.18)}
.r-sg button{height:40px;border:0;border-radius:11px;background:none;color:#e3efe8;font-size:15px;font-weight:600}
.r-sg button[aria-pressed="true"]{background:#f6dc94;color:#0c3d29;font-weight:800}
.r-pd{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;padding-top:4px}
.r-pd>div{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.r-pd .av{width:52px;height:52px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.r-pd .p1 .av{width:64px;height:64px;font-size:24px;background:#f6dc94;color:#6b4a0c}
.r-pd .p2 .av{background:#dfe6e2;color:#0c5e3f}
.r-pd .p3 .av{background:#e9c29a;color:#6b3d12}
.r-pd .men .av{box-shadow:0 0 0 3px #f6dc94}
.r-pd b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.r-pd em{font-style:normal;font-size:13px;color:#cfe3d8;font-variant-numeric:tabular-nums}
.r-pd .p1 em{color:#f6dc94;font-weight:700}
.r-pd i{width:100%;display:flex;align-items:center;justify-content:center;border-radius:12px 12px 0 0;font-style:normal;font-weight:800}
.r-pd .p1 i{height:92px;background:rgba(246,220,148,.28);color:#f6dc94;font-size:30px}
.r-pd .p2 i{height:64px;background:rgba(255,255,255,.16);color:#dfe6e2;font-size:26px}
.r-pd .p3 i{height:48px;background:rgba(255,255,255,.12);color:#e9c29a;font-size:24px}
.r-pd .bo .av{background:rgba(255,255,255,.14);color:rgba(255,255,255,.6)}
.r-tj{width:26px;height:20px;color:#f6dc94}
.r-w{max-width:560px;margin:0 auto;padding:14px 16px calc(176px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.r-nm{margin:0 0 10px;padding:9px 12px;border-radius:12px;background:var(--tint);font-size:13.5px;line-height:1.45;color:var(--tx)}
.r-ls{background:var(--cd);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.r-r{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 14px;border-top:1px solid var(--bd)}
.r-r:first-child{border-top:0}
.r-r .o{width:28px;flex-shrink:0;text-align:center;font-size:15px;font-weight:700;color:var(--mu);font-variant-numeric:tabular-nums}
.r-r .av{width:36px;height:36px;flex-shrink:0;border-radius:50%;background:var(--tint);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.r-r .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px;font-weight:600}
.r-r .s{flex-shrink:0;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.r-r .s small,.r-me .s small{font-size:12.5px;font-weight:500;color:var(--mu)}
.r-r.men{background:color-mix(in srgb,var(--ac) 9%,transparent)}
.r-bs{padding:22px 16px;text-align:center;color:var(--mu);font-size:14.5px}
.r-me{position:fixed;z-index:19;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:536px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;background:var(--cd);border:2px solid var(--ac);box-shadow:0 6px 20px rgba(10,30,20,.16)}
.r-me .o{width:28px;flex-shrink:0;text-align:center;font-size:15px;font-weight:800;color:var(--ac);font-variant-numeric:tabular-nums}
.r-me .av{width:36px;height:36px;flex-shrink:0;border-radius:50%;background:var(--ac);color:var(--cd);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.r-me .t{flex:1;min-width:0;display:flex;flex-direction:column}
.r-me .t b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-me .t small{font-size:12.5px;line-height:1.3;color:var(--mu)}
.r-me .s{flex-shrink:0;font-size:16px;font-weight:800;color:var(--ac);font-variant-numeric:tabular-nums}
.r-me a{color:var(--ac);font-weight:700}
</style>
</head>
<body>
<header class="r-hd"><div class="r-in">
  <div class="r-tt"><div><small id="sub">Бу ҳафта</small><h1>Рейтинг</h1></div><span id="vq"></span></div>
  <div class="r-sg" role="group" aria-label="Рўйхат"><button data-t="h" aria-pressed="true">Ҳафта</button><button data-t="s" aria-pressed="false">Сўзлар</button></div>
  <div class="r-pd" id="pd" aria-label="Биринчи уч ўрин"></div>
</div></header>
<main class="r-w"><div id="nm"></div><div class="r-ls" id="ls"></div></main>
<div class="r-me" id="me"></div>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  function J(k, d) { try { return JSON.parse(localStorage.getItem(k) || 'null') || d; } catch (e) { return d; } }
  function L(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function bosh(n) { var m = /[A-Za-zА-Яа-яЁёЎўҚқҒғҲҳ؀-ۿ]/.exec(n || ''); return m ? m[0].toUpperCase() + '\u2063' : '•'; }   /* \u2063 — tarjima qilinmaydi (ru.js) */
  var KUBOK = '<svg class="r-tj" viewBox="0 0 26 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 17L1.5 5l6.5 5L13 2l5 8 6.5-5L23 17H3z"/></svg>';
  /* ko'rish (github.io), sinov va kompyuterdagi nusxa — server yo'q: namuna ro'yxat bilan ko'rsatiladi */
  var NAMUNA = !!SN || window.KORISH || /github\.io$|^(localhost|127\.)/.test(location.hostname);
  var NR = {
    h: [['Муҳаммадали', 412], ['Зайнаб', 388], ['Абдуллоҳ', 351], ['Мадина', 297], ['Ҳасан', 276], ['Ўғилой', 241], ['Беҳруз', 228], ['Солиҳа', 205], ['Жавоҳир', 190], ['Нигора', 182]],
    s: [['Зайнаб', 318], ['Абдуллоҳ', 301], ['Муҳаммадали', 287], ['Ҳасан', 254], ['Солиҳа', 233], ['Мадина', 219], ['Нигора', 196], ['Беҳруз', 181], ['Ўғилой', 170], ['Жавоҳир', 162]]
  };
  var T = 'h'; try { T = sessionStorage.getItem('reyting-t') === 's' ? 's' : 'h'; } catch (e) {}
  var SERV = {};                                       /* serverdan kelgan ro'yxat (keyingi bosqich) */
  var kirgan = !!(L('baza-tg') || (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData));

  /* o'quvchining o'z natijasi — telefondagi ma'lumotdan (server ham aynan shu qoida bilan hisoblaydi) */
  function men() {
    var j = (J(SN ? 'takror-sinov-j' : 'takror-j', {}) || {}).j || [], x = J(SN ? 'takror-sinov-xulosa' : 'takror-xulosa', null);
    var hb = window.Takror && Takror.haftaBoshi ? Takror.haftaBoshi(Date.now()) : 0;
    var ism = (J('ism', null) || {}).n || '';
    return { n: ism, h: window.Takror && Takror.ball ? Takror.ball(j, hb) : 0, s: (x && x.bilgan) || 0, hb: hb };
  }
  function vaqt(hb) {                                  /* «Янгиланишига N кун» — keyingi dushanba 00:00 gacha */
    var q = hb + 7 * 864e5 - Date.now(); if (q <= 0) return '';
    return q >= 864e5 ? 'Янгиланишига ' + Math.ceil(q / 864e5) + ' кун' : 'Янгиланишига ' + Math.max(1, Math.ceil(q / 36e5)) + ' соат';
  }
  function chiz() {
    var m = men(), bir = T === 'h' ? 'балл' : 'сўз', rows, nm = '';
    $('sub').textContent = T === 'h' ? 'Бу ҳафта' : 'Жами сўзлар';
    $('vq').textContent = T === 'h' ? vaqt(m.hb) : 'Ким нечта сўз билади';
    [].forEach.call(document.querySelectorAll('.r-sg button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-t') === T)); });
    var me = { n: m.n || 'Сиз', b: m[T], men: true };
    if (SERV[T]) rows = SERV[T];                       /* server: [{n, b, men?}] — tartiblangan */
    else if (NAMUNA) {
      rows = NR[T].map(function (r) { return { n: r[0], b: r[1] }; });
      if (kirgan || SN || window.KORISH) rows.push(me);
      rows.sort(function (a, b) { return b.b - a.b; });
      nm = 'Намуна: бошқа ўқувчилар исмлари ва баллари мисол учун. Рейтинг сервери улангач, ҳақиқий рўйхат чиқади.';
    } else {
      rows = kirgan ? [me] : [];
      nm = 'Бошқа ўқувчилар натижаси тез орада кўринади.';
    }
    var oz = -1; rows.forEach(function (r, i) { if (r.men) oz = i; });
    $('nm').innerHTML = nm ? '<p class="r-nm">' + esc(nm) + '</p>' : '';
    /* shohsupa: 2 · 1 · 3 */
    $('pd').innerHTML = [1, 0, 2].map(function (i) {
      var r = rows[i], c = 'p' + (i + 1) + (r ? '' : ' bo') + (r && r.men ? ' men' : '');
      return '<div class="' + c + '">' + (i === 0 ? KUBOK : '') + '<span class="av" aria-hidden="true">' + (r ? esc(bosh(r.n)) : '') + '</span>' +
        '<b>' + (r ? esc(r.n) + '⁣' : '—') + '</b><em>' + (r ? r.b + ' ' + bir : '') + '</em><i>' + (i + 1) + '</i></div>';
    }).join('');
    var h = rows.slice(3, 50).map(function (r, k) {
      return '<div class="r-r' + (r.men ? ' men' : '') + '"><span class="o">' + (k + 4) + '</span><span class="av" aria-hidden="true">' + esc(bosh(r.n)) + '</span>' +
        '<span class="n">' + esc(r.n) + '⁣</span><span class="s">' + r.b + ' <small>' + bir + '</small></span></div>';
    }).join('');
    $('ls').innerHTML = h || '<div class="r-bs">' + (rows.length ? 'Ҳозирча шулар' : 'Ҳали ҳеч ким йўқ') + '</div>';
    /* o'z qatori — pastda doim ko'rinadi */
    var izoh;
    if (!kirgan && !SN && !window.KORISH) izoh = '<a href="' + SN + 'yana.html">Telegram орқали киринг</a> — рейтингга қўшиласиз';
    else if (oz > 0) { var ol = rows[oz - 1]; izoh = (oz) + '-ўринга ' + (ol.b - me.b + 1) + ' ' + bir + ' қолди'; }
    else if (oz === 0) izoh = 'Биринчи ўриндасиз!';
    else izoh = T === 'h' ? 'Тўғри жавоб — балл' : 'Билган сўзларингиз';
    $('me').innerHTML = '<span class="o">' + (oz > -1 ? oz + 1 : '–') + '</span><span class="av" aria-hidden="true">' + esc(bosh(me.n)) + '</span>' +
      '<span class="t"><b>' + (m.n ? esc(m.n) + '⁣' : 'Сиз') + '</b><small>' + izoh + '</small></span><span class="s">' + me.b + ' <small>' + bir + '</small></span>';
  }
  [].forEach.call(document.querySelectorAll('.r-sg button'), function (b) {
    b.onclick = function () { T = b.getAttribute('data-t'); try { sessionStorage.setItem('reyting-t', T); } catch (e) {} chiz(); };
  });
  chiz();
  if (window.Qobiq) Qobiq.nav('reyting');
})();
</script>
</body>
</html>
