<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Яна</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c5e3f">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="shell.css">
<script>
/* «Яна» (13.11.2026; docs/texnik.md 18) — qobiqning to'rtinchi bo'limi: hisob, sozlamalar, yo'riqnoma, fikr, ilova haqida. */
var SN = /\/sinov-[^\/]*$/.test(location.pathname) ? 'sinov-' : '';
document.write('<script src="tg.js" data-key="" data-home="' + SN + 'yol.html"><\/script>' + (SN ? '' : '<script src="baza.js"><\/script>') + '<script src="' + SN + 'qobiq.js"><\/script>');
</script>
<style>
@font-face{font-family:"DarsNaskh";src:url(naskh.woff)}
body{margin:0;background-color:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ar{font-family:"DarsNaskh","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;font-weight:400}
/* hisob kartasi */
.n-h{background:var(--cd);border:1.5px solid var(--bd);border-radius:20px;box-shadow:var(--sh);padding:16px;margin:0 0 18px}
.n-hr{display:flex;align-items:center;gap:14px}
.n-av{width:56px;height:56px;border-radius:50%;background:var(--tint);color:var(--ac);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:24px;font-weight:700}
.n-av svg{width:28px;height:28px}
.n-hr b{display:block;font-size:18px;line-height:1.3}
.n-hr small{display:block;font-size:13.5px;line-height:1.4;color:var(--mu)}
.n-tg{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;box-sizing:border-box;margin-top:14px;padding:6px 16px 10px;border:0;border-radius:16px;background:#229ED9;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);font-size:16.5px;font-weight:700;transition:transform .06s,box-shadow .06s}
.n-tg:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.n-tg svg{width:22px;height:22px;flex-shrink:0}
.n-tg[hidden]{display:none}
.n-tip{margin:-2px 4px 10px;font-size:13.5px;line-height:1.45;color:var(--mu)}
.n-xb{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--tint);font-size:14px;line-height:1.45}
/* ilova haqida */
.n-inf{background:var(--cd);border:1.5px solid var(--bd);border-radius:18px;overflow:hidden}
.n-inf div{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:6px 16px;border-top:1px solid var(--bd);font-size:15.5px}
.n-inf div:first-child{border-top:0}
.n-inf span{color:var(--mu)}
.n-inf b{font-weight:600;text-align:right}
.n-inf b.ar{font-size:23px;line-height:1.4;font-weight:400}
.n-inf em{font-style:normal;color:var(--mu);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header class="q-hd"><div class="q-hr"><div><h1>Яна</h1></div></div></header>
<main class="q-w">
  <section class="n-h" aria-label="Ҳисоб">
    <div class="n-hr"><span class="n-av" id="av"></span><div><b id="hn">Ҳисоб</b><small id="hs"></small></div></div>
    <button class="n-tg" id="tgk" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.4 3.6 2.9 10.7c-1 .4-1 1.1-.2 1.4l4.7 1.5 1.8 5.6c.2.6.4.8.9.8s.6-.2.9-.5l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3.1-14.6c.3-1.3-.5-1.9-1.4-1.8zM9.8 14.3l8.2-5.2c.4-.2.7-.1.4.2l-6.9 6.3-.3 3.2z"/></svg>Telegram орқали кириш</button>
    <p class="n-xb" id="xb" hidden></p>
  </section>

  <a class="q-rw" id="soz" href="sozlamalar.html"><span class="q-ib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-2.6-1.5L14.1 2.5H9.9L9.5 5a7.6 7.6 0 0 0-2.6 1.5l-2.3-.9-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.4 2.3-.9a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4.2l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.3.9 2-3.4z"/></svg></span>
    <span class="t">Созламалар<small>Ёзув, овоз, такрор, кўриниш</small></span><svg class="ch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
  <a class="q-rw" id="yor" href="yoriqnoma.html"><span class="q-ib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6c-2-1.5-4.5-2-8-2v14c3.5 0 6 .5 8 2 2-1.5 4.5-2 8-2V4c-3.5 0-6 .5-8 2zM12 6v14"/></svg></span>
    <span class="t">Йўриқнома<small>Иловадан фойдаланиш</small></span><svg class="ch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
  <a class="q-rw" href="https://t.me/Arabtilihivar_bot" target="_blank" rel="noopener"><span class="q-ib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h3v3.5L11.5 17H20a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1z"/><path d="M8 9h8M8 12.5h5"/></svg></span>
    <span class="t">Фикр юбориш<small>Хато ёки таклиф — Telegram орқали</small></span><svg class="ch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>

  <button class="q-rw" id="add" hidden><span class="q-ib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M12 8.5v6M9 11.5h6"/></svg></span>
    <span class="t">Бош экранга қўшиш<small>Илова каби очилади</small></span></button>
  <p class="n-tip" id="tip" hidden>iPhone'да: пастдаги «Улашиш» тугмаси → «На экран Домой / Add to Home Screen»</p>

  <h2 class="q-h">ИЛОВА ҲАҚИДА</h2>
  <div class="n-inf">
    <div><span>Китоб</span><b class="ar" lang="ar">نُورُ الطَّالِبِ</b></div>
    <div><span>Версия</span><em id="ver">—</em></div>
  </div>
</main>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); };
  var ODAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>';
  $('soz').href = SN + 'sozlamalar.html'; $('yor').href = SN + 'yoriqnoma.html';

  /* hisob: Telegram ichida — foydalanuvchi nomi (natija Telegram hisobiga bog'langan kod bilan saqlanadi, baza.js);
     saytda — «Telegram орқали кириш»: Telegram ilovasi ochiladi, u yerda tasdiqlangach sayt o'sha hisob kodiga ulanadi (docs/texnik.md 18).
     Kirish majburiy emas — ilova kirmasdan ham ishlaydi. */
  function hisob() {
    var u = null, B = window.Baza;
    try { u = window.Telegram.WebApp.initDataUnsafe.user || null; } catch (e) {}
    var t = B && B.vaqt ? B.vaqt() : 0, d = t ? new Date(t) : null, ik = function (n) { return ('0' + n).slice(-2); };
    var saq = d ? 'Сақланган: ' + ik(d.getDate()) + '.' + ik(d.getMonth() + 1) + ', ' + ik(d.getHours()) + ':' + ik(d.getMinutes()) : '';
    if (u) {
      var nom = [u.first_name, u.last_name].filter(Boolean).join(' ') || 'Telegram ҳисоби';
      $('av').textContent = nom.charAt(0).toUpperCase();
      $('hn').textContent = nom;
      $('hs').textContent = 'Натижалар Telegram ҳисобингизда сақланади' + (saq ? ' · ' + saq.toLowerCase() : '');
      $('tgk').hidden = true;
    } else if (B && B.tgUlangan && B.tgUlangan()) {
      $('av').innerHTML = ODAM;
      $('hn').textContent = 'Ҳисоб';
      $('hs').textContent = 'Telegram ҳисобига уланган' + (saq ? ' · ' + saq.toLowerCase() : '');
      $('tgk').hidden = true;
    } else {
      $('av').innerHTML = ODAM;
      $('hn').textContent = 'Ҳисоб';
      $('hs').textContent = saq || 'Натижаларни сақлаш ва бошқа телефонда давом эттириш учун киринг';
      $('tgk').hidden = false;
    }
  }
  hisob();
  document.addEventListener('tgready', hisob);
  if (window.Baza && Baza.tinglash) Baza.tinglash(hisob);
  var kt = null, BZ = window.Baza;
  function xb(t) { var x = $('xb'); x.textContent = t; x.hidden = !t; }
  function tek() {
    if (document.hidden) return;
    BZ.ulashTekshir(function (ok, tugadi) {
      if (ok) { clearInterval(kt); xb('Уланди — натижалар Telegram ҳисобингиз билан бирлашди.'); hisob(); }
      else if (tugadi) { clearInterval(kt); xb('Вақт тугади. Қайта уриниб кўринг.'); }
    });
  }
  function kut() { clearInterval(kt); kt = setInterval(tek, 3000); }
  $('tgk').onclick = function () {
    if (!BZ || !BZ.ulashBoshla) { xb('Синов саҳифасида уланмайди — асосий сайтда ишлайди.'); return; }
    var tok = BZ.ulashBoshla();
    try { window.open('https://t.me/Arabtilihivar_bot/darslar?startapp=kir_' + tok, '_blank'); } catch (e) {}
    xb('Telegram очилди. У ерда тасдиқланг ва шу саҳифага қайтинг.');
    kut();
  };
  if (BZ && BZ.ulashKutmoqda && BZ.ulashKutmoqda()) { xb('Telegram\'да тасдиқлашингиз кутилмоқда…'); kut(); }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && BZ && BZ.ulashKutmoqda && BZ.ulashKutmoqda()) tek(); });

  /* «Бош экранга қўшиш» (oldin bosh sahifada edi): Telegram ichida — Telegram o'zi qo'shadi; Android Chrome — o'rnatish taklifi; iPhone — yo'l-yo'riq */
  var add = $('add'), dp = null;
  function tgAdd() {
    try {
      var w = Telegram.WebApp;
      if (!(w.isVersionAtLeast('8.0') && w.addToHomeScreen)) return;
      var kor = function () { add.hidden = false; add.onclick = function () { w.addToHomeScreen(); }; };
      if (w.checkHomeScreenStatus) w.checkHomeScreenStatus(function (s) { if (s !== 'added' && s !== 'unsupported') kor(); }); else kor();
      if (w.onEvent) w.onEvent('homeScreenAdded', function () { add.hidden = true; });
    } catch (e) {}
  }
  if (document.documentElement.classList.contains('in-tg')) tgAdd(); else document.addEventListener('tgready', tgAdd);
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); dp = e; add.hidden = false; add.onclick = function () { dp.prompt(); dp.userChoice.then(function () { add.hidden = true; }); }; });
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent), yakka = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  setTimeout(function () { if (ios && !yakka && !document.documentElement.classList.contains('in-tg')) $('tip').hidden = false; }, 800);

  /* versiya — sw.js dagi «var C» */
  fetch('sw.js', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
    var m = t.match(/var\s+C\s*=\s*['"]([^'"]+)['"]/); if (m) $('ver').textContent = (m[1].match(/v\d+/) || [m[1]])[0];
  }).catch(function () {});

  if (window.Qobiq) Qobiq.nav('yana');
})();
</script>
</body>
</html>
