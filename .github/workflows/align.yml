name: align
on:
  push:
    paths: ['align/in/**']
permissions:
  contents: write
concurrency: align
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: sudo apt-get install -y -qq --no-install-recommends ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
        timeout-minutes: 8
      - run: pip install -q faster-whisper torch torchaudio --extra-index-url https://download.pytorch.org/whl/cpu "git+https://github.com/MahmoudAshraf97/ctc-forced-aligner.git"
      - run: python align/run.py
      - run: |
          git config user.name "align-bot"; git config user.email "align-bot@users.noreply.github.com"
          git add align/out; git commit -m "align natija" || exit 0
          git pull --rebase && git push
