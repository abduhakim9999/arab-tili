var QT={"MUBXAB": ["Мубтадо ва хабар", ["Исмий гап икки қисмдан иборат: мубтадо (кимдан/нимадан гап кетяпти) ва хабар (у ҳақида нима дейиляпти). Иккаласи ҳам раф қилинади: الْمَالُ كَثِيرٌ.", "Мубтадо одатда маърифа бўлади (ال билан, алам, замир ёки изофада), хабар кўпинча накра бўлади.", "Хабар уч хил бўлади: муфрад (كَثِيرٌ), жумла (بِلَادُنَا تَحْتَاجُ إِلَيْنَا) ва шибҳи жумла, яъни жар ҳарфи ва мажрур ёки зарф (وَإِلَيْهِ النُّشُورُ).", "Шибҳи жумла хабар олдинга ўтиши мумкин; бу «фақат» маъносини беради: وَإِلَيْهِ النُّشُورُ — «қайта тирилиш фақат Унинг ҳузурига». Мубтадо накра бўлса, хабарни олдинга ўтказиш вожиб: فِي الْبَيْتِ رَجُلٌ.", "Кўпчилик наҳвчилар фикрича мубтадони ибтидо (маънавий омил), хабарни эса мубтадо раф қилади.", "Сарлавҳалардаги исмлар хабари ёки мубтадоси маҳзуф деб таркиб қилинади: (هَذَا) الدَّرْسُ الثَّانِي."]], "LAYSA": ["لَيْسَ — كَانَ нинг синглиси", ["Кана синглилари мубтадо ва хабарга киради: мубтадо уларнинг исми бўлиб раф қилинади, хабар уларнинг хабари бўлиб насб қилинади: السَّفَرُ حَرَامٌ → لَيْسَ السَّفَرُ حَرَاماً.", "لَيْسَ нинг маъноси «эмас» — инкор; кўпинча ҳозирги замонни инкор қилади.", "لَيْسَ — жомид феъл: фақат мозий шакли бор, музорий ва амри йўқ.", "Хабарига зоида بِ қўшилиши мумкин: لَيْسَ السَّفَرُ بِحَرَامٍ — бунда حَرَامٍ лафзан жар қилинган, насб ўринда.", "Кана синглилари: كَانَ، أَصْبَحَ، أَضْحَى، أَمْسَى، ظَلَّ، بَاتَ، صَارَ، لَيْسَ، مَا زَالَ، مَا بَرِحَ، مَا فَتِئَ، مَا انْفَكَّ، مَا دَامَ."]], "LAKINNA": ["لَكِنَّ — إِنَّ нинг синглиси", ["Инна синглилари кана синглиларининг тескариси: мубтадони насб қилади (исми бўлади), хабарни раф қилади (хабари бўлади): إِنَّ الْمَالَ كَثِيرٌ.", "Исми замир бўлса, ҳарфга уланади: لَكِنَّكَ، إِنَّهُ، لَعَلَّنَا.", "لَكِنَّ маъноси — истидрок: олдинги гапдан келиб чиқадиган фикрни тўғрилаш («лекин»).", "Инна синглилари: إِنَّ، أَنَّ (таъкид)، كَأَنَّ (ўхшатиш)، لَكِنَّ (истидрок)، لَيْتَ (орзу)، لَعَلَّ (умид).", "Ташдидсиз لَكِنْ амал қилмайди, ундан кейин оддий гап келади: وَلَكِنْ هَلْ فَكَّرْتَ…"]], "NASB": ["Музорийни насб қилувчи ҳарфлар", ["Музорийни насб қилувчи ҳарфлар: أَنْ، لَنْ، كَيْ، إِذَنْ.", "لَنْ — келаси замонни инкор қилади: لَنْ أَذْهَبَ «бормайман».", "أَنْ — масдарий ҳарф: феъл билан бирга масдар ҳосил қилади: أَرْجُو أَنْ تَعُودَ = أَرْجُو عَوْدَتَكَ.", "Насб аломати — фатҳа; амсилатул хомсада — нуннинг ҳазф бўлиши: لَنْ تَذْهَبُوا.", "Маҳзуф أَنْ билан ҳам насб қилинади: لِ (сабаб), حَتَّى, сабабият фа си ва бошқалардан кейин: جِئْتُ لِأَتَعَلَّمَ."]], "MUDRAF": ["Музорийнинг рафи", ["Музорий феъли уни насб ёки жазм қилувчи сўз бўлмаса раф қилинади.", "Раф аломати — замма: أَعُودُ، تَعْمَلُ.", "Охири و ёки ي бўлса, замма оғир бўлгани учун айтилмайди (тақдирий): أَرْجُو، أَمْشِي; лекин фатҳа кўринади: لَنْ أَرْجُوَ.", "Амсилатул хомсада раф аломати — нуннинг жойида туриши: تَعْمَلُونَ، تَعْمَلِينَ.", "Жазм қилувчилар: لَمْ، لَمَّا، амр ломи، наҳй لَا си ва шарт сўзлари (إِنْ، مَنْ، مَا…)."]], "SIN": ["سَ ва سَوْفَ", ["سَ ва سَوْفَ — истиқбол ҳарфлари: музорийни келаси замонга хослайди.", "سَ — яқин келажак, سَوْفَ — узоқроқ келажак учун: سَأُسَافِرُ، سَوْفَ أُسَافِرُ.", "Улар амал қилмайди — феъл раф қилинганича қолади: سَأَغْتَرِبُ."]], "AMR": ["Амр феълининг биноси", ["Амр феъли доим мабний бўлади; музорийсининг жазмдаги аломатига мабний:", "• охири саҳиҳ бўлса — сукунга: اكْتُبْ", "• охири иллат ҳарфи бўлса — иллат ҳарфининг ҳазфига: امْشِ، ادْعُ، اسْعَ", "• амсилатул хомсадан бўлса — ن нинг ҳазф бўлишига: امْشُوا، كُلُوا، اكْتُبِي", "Амсилатул хомса: يَفْعَلَانِ، تَفْعَلَانِ، يَفْعَلُونَ، تَفْعَلُونَ، تَفْعَلِينَ — рафда ن билан, насб ва жазмда ن тушади.", "Жам вовидан кейин ёзиладиган алиф (фарқлаш ҳарфи) ўқилмайди: امْشُوا.", "أَكَلَ дан амр қисқа: كُلْ، كُلُوا (худди шундай: أَخَذَ → خُذْ)."]], "FASIHA": ["Фасиҳа фа си", ["Яширин шартга далолат қилади: إِذَا كَانَ الْأَمْرُ كَذَلِكَ فَامْشُوا — «шундай экан, юринглар».", "Олдинги гапдан келиб чиқадиган натижани билдиради."]], "MOZI": ["Мозий феълнинг биноси", ["Мозий феъл доим мабний; асли — фатҳага: فَكَّرَ، قَالَ.", "Ҳаракатли бориз фоил замири (تُ، تَ، تِ، نَا، نَ) уланса — сукунга: فَكَّرْتُ، فَكَّرْتَ.", "Жам вови уланса — заммага: اغْتَرَبُوا.", "Охири алиф бўлса, фатҳа тақдирий: تَعَالَى، سَعَى."]], "TAALA": ["تَعَالَى", ["Охири алиф бўлган сўзда ҳаракат айтилмайди — тақдирий (сабаби: таъаззур, яъни талаффуз имконсиз).", "Охири و ёки ي бўлганда эса сабаби — сақал (оғирлик): أَرْجُو، الثَّانِي.", "Аллоҳ номидан кейин ҳурмат учун айтилади: تَعَالَى، عَزَّ وَجَلَّ، سُبْحَانَهُ."]], "MANQUS": ["Исм манқус", ["Охири ي бўлиб, олдидаги ҳарф касрали исм: الثَّانِي، الْقَاضِي.", "Раф ва жарда ҳаракат тақдирий (оғирлик учун), насбда фатҳа кўринади: رَأَيْتُ الْقَاضِيَ.", "Накра бўлса, раф ва жарда ي тушиб, танвин олади: ثَانٍ، قَاضٍ."]], "SIFAT": ["Сифат (наът)", ["Сифат мавсуфига тўрт нарсада эргашади: эъроб, маърифа/накра, жинс (музаккар/муаннас), сон.", "Мисол: الدَّرْسُ الثَّانِي، اللَّهُ الْعَظِيمُ.", "Ақлсиз нарсаларнинг кўплигига сифат муаннас бирликда келади: بِلَادٍ غَرِيبَةٍ."]], "MULHAQ": ["Жам музаккар солимга мулҳақ сўзлар", ["Ўнликлар (عِشْرُونَ … تِسْعُونَ), шунингдек أُولُو، أَهْلُونَ، سِنُونَ، بَنُونَ жам музаккар солимдек турланади.", "Рафда و, насб ва жарда ي: جَاءَ عِشْرُونَ، رَأَيْتُ عِشْرِينَ.", "Тартиб сонлари: الْحَادِي وَالْعِشْرُونَ … الثَّانِي وَالتِّسْعُونَ — бирлик فَاعِلٍ вазнида, ўнлик و билан атф қилинади."]], "ATF": ["Атф ҳарфлари", ["Маътуф ўзидан олдингисига эъробда эргашади: عَلَى دِينِهِمْ وَثَقَافَتِهِمْ.", "وَ — жамлаш («ва»)؛ فَ — кетма-кет, тез؛ ثُمَّ — кетма-кет, орада вақт бор؛ أَوْ — «ёки» (танлаш)؛ أَمْ — «ёки» (саволда)؛ بَلْ — «балки»؛ لَا — «эмас»."]], "MUTANNA": ["Тасния", ["Рафда ا, насб ва жарда ي: مَرَّتَانِ، مَرَّتَيْنِ.", "Охиридаги ن касрали бўлади ва эъроб аломати эмас; изофада тушади: كِتَابَا الطَّالِبِ."]], "MUTLAQ": ["Мафъулун мутлақ", ["Феълнинг ўз масдари: феълни таъкидлайди, турини ёки сонини билдиради: شَكَرْتُهُ شُكْراً.", "Феъли кўпинча ҳазф қилинади: شُكْراً، عَفْواً، صَبْراً، حَمْداً.", "Унинг ўрнига ўтадиганлар (наиб): сон (مَرَّتَيْنِ), كُلٌّ ва بَعْضٌ (كُلَّ الشُّكْرِ), сифати."]], "GHAYR": ["Ғайри мунсариф исм", ["Танвин олмайди ва жарда касра ўрнига фатҳа олади: مَرَرْتُ بِمَسَاجِدَ.", "Икки ҳолатда касра олади: ال билан келса (فِي الْمَسَاجِدِ) ёки музоф бўлса (فِي مَنَاكِبِهَا).", "Баъзи сабаблари: мунтаҳал жумуъ вазни (مَفَاعِلُ، مَفَاعِيلُ)، أَفْعَلُ вазнидаги сифат، муаннас алифи (صَحْرَاءُ)، فَعْلَانُ сифат (عَطْشَانُ) ва кўп атоқли отлар (فَاطِمَةُ، إِبْرَاهِيمُ).", "Бу дарсда: زَيْنَبُ، مَرْيَمُ (муаннас атоқли от), أَشْيَاءُ (муаннас алифи), آخَرُ (أَفْعَلُ вазнидаги сифат), فَوَاكِهُ (мунтаҳал жумуъ): مُشْكِلَةُ مَرْيَمَ، فِي أَشْيَاءَ، فِي أَمْرٍ آخَرَ — лекин عَصِيرَ الْفَوَاكِهِ (ال билан — касра)."]], "YA": ["Мутакаллим ي си", ["ي — «менинг» маъносидаги муттасил замир: وَطَنِي «ватаним».", "Ундан олдинги ҳарф доим касра олади (мослик учун), шунинг учун сўзнинг эъроб ҳаракати кўринмайди — тақдирий:", "هَذَا وَطَنِي (раф)، أُحِبُّ وَطَنِي (насб)، مِنْ وَطَنِي (жар) — учаласи бир хил ўқилади.", "ي нинг ўзи сукунга (баъзан фатҳага: وَطَنِيَ) мабний, жар ўринда — музофун илайҳ."]], "PRON": ["Муттасил замирлар", ["Замирлар доим мабний; ўрни қаерга уланганига қараб:", "• исмга — музофун илайҳ, жар ўринда: رَاتِبُكَ", "• феълга — мафъулун биҳ, насб ўринда: أَزُورُهُمْ (ёки бориз фоил замири: فَكَّرْتُ، اغْتَرَبُوا)", "• жар ҳарфига — мажрур, жар ўринда: إِلَيْنَا، فِيكَ", "• إِنَّ синглисига — унинг исми, насб ўринда: لَكِنَّكَ", "هُ، هُمْ، هُمَا، هُنَّ — касра ёки ي дан кейин касра олади: رِزْقِهِ، دِينِهِمْ، فِيهِمْ."]], "IDAFA": ["Изофа", ["Музоф танвин ва ال олмайди: خَارِجَ وَطَنِي، خَمْسَ سَنَوَاتٍ.", "Музофун илайҳ доим жар қилинади.", "Музофнинг ўз эъроби гапдаги ўрнига қараб (мубтадо, фоил, зарф…)."]], "ZARF": ["Зарф (мафъулун фийҳ)", ["Иш-ҳаракатнинг вақти ёки жойини билдиради, «-да» маъносини беради; насб қилинади.", "Зарф замон: يَوْمَ، لَيْلَةَ، صَبَاحاً; зарф макон: خَارِجَ، أَمَامَ، فَوْقَ، عِنْدَ، مَعَ.", "Баъзи зарфлар мабний: هُنَا، هُنَاكَ، إِذَا، حَيْثُ — насб ўринда. اَلْآنَ ни китобимиз (65-дарс) насб қилинган, аломати фатҳа деб беради; кўп наҳв китобларида у фатҳага мабний.", "Зарф ўрнига ўтадиганлар: сон (خَمْسَ سَنَوَاتٍ), зарфнинг сифати (طَوِيلاً — асли زَمَناً طَوِيلاً), كُلٌّ ва بَعْضٌ.", "Зарф ҳамда жар ҳарфи ва мажрур бирор феълга ёки феълдек амал қиладиган сўзга боғланади (мутааллиқ)."]], "ISHARA": ["Исм ишоралар", ["Яқин учун: هَذَا، هَذِهِ، هَذَانِ، هَاتَانِ، هَؤُلَاءِ.", "Узоқ учун: ذَلِكَ، تِلْكَ، أُولَئِكَ.", "ذَلِكَ = ذَا + لِ (узоқлик ломи) + كَ (хитоб ҳарфи).", "Жой учун: هُنَا (бу ерда)، هُنَاكَ / هُنَالِكَ (у ерда).", "هَذَانِ ва هَاتَانِ тасниядек турланади, қолганлари мабний."]], "FAIL": ["Фоил", ["Ишни бажарувчи; доим раф қилинади ва феълдан кейин келади.", "Феъл олдин келса, фоил кўплик бўлса ҳам феъл бирликда қолади: جَاءَ الطُّلَّابُ.", "Фоил зоҳир (алоҳида исм), бориз муттасил замир (فَكَّرْتُ) ёки мустатир замир (هُوَ، أَنَا) бўлади.", "اللَّهُ сўзи таркибда ҳурмат учун «лафзи жалола» (لَفْظُ الْجَلَالَةِ) деб аталади."]], "MAFUL": ["Мафъулун биҳ", ["Иш ўтадиган нарса; насб қилинади: تَصْحَبَ أَوْلَادَكَ.", "Баъзи феъллар икки мафъулун биҳ олади:", "• «айлантирмоқ» маъносидаги جَعَلَ، صَيَّرَ، اتَّخَذَ — мафъуллари асли мубтадо ва хабар: الْأَرْضُ ذَلُولٌ → جَعَلَ الْأَرْضَ ذَلُولاً", "• «бермоқ» маъносидаги أَعْطَى، مَنَحَ ва «гумон қилмоқ» маъносидаги ظَنَّ، حَسِبَ."]], "JARR": ["Жар ҳарфлари", ["Ўзидан кейинги исмни жар қилади: مِنْ، إِلَى، عَنْ، عَلَى، فِي، بِ، لِ، كَ، حَتَّى، رُبَّ، مُنْذُ.", "إِلَى ва عَلَى замирга уланганда алиф ي га айланади: إِلَيْهِ، عَلَيْكَ.", "لِ замир билан фатҳа олади: لَكَ، لَهُ، لَكُمْ (фақат ي билан: لِي).", "لِ + ال: алиф ёзилмайди — لِلْعَمَلِ.", "Жар ҳарфи ва мажрур бирор феълга ёки феълга ўхшаш сўзга боғланади (мутааллиқ); бундай сўз бўлмаса — маҳзуф (ҳазф қилинган) сўзга (хабар, сифат ёки ҳол бўлиб)."]], "MIM": ["Жам мими", ["كُمْ ва هُمْ даги م сукунли; кейинги сўз ال билан бошланса, икки сукун учрашмаслиги учун замма олади: لَكُمُ الْأَرْضَ، عَلَيْهِمُ الْقِتَالُ."]], "HAL": ["Ҳол", ["Иш пайтидаги ҳолатни билдиради, «қандай?» саволига жавоб беради; насб қилинади.", "Ҳол кўпинча накра, зул ҳол эса маърифа бўлади.", "Битта зул ҳолга бир нечта ҳол келиши мумкин: تَعُودَ سَالِماً غَانِماً.", "Ҳол жумла ҳам бўлади: جَاءَ وَهُوَ يَضْحَكُ.", "كَيْفَ — тўлиқ феълдан олдин келса ҳол (كَيْفَ تُحَافِظُ؟), мубтадодан олдин келса хабар (كَيْفَ حَالُكَ؟)."]], "SHART": ["Шарт гапи", ["Уч қисм: шарт сўзи + шарт феъли + жавоб: إِنْ تَدْرُسْ تَنْجَحْ.", "Жазм қилувчи шарт сўзлари: إِنْ، مَنْ، مَا، مَهْمَا، مَتَى، أَيْنَ، حَيْثُمَا. Жазм қилмайдиганлар: إِذَا، لَوْ، لَوْلَا.", "Шарт феъли мозий бўлса, жазм ўринда бўлади: إِنْ شَاءَ اللَّهُ.", "Жавоб олдинги гапдан тушунилса, ҳазф қилинади: أَعُودُ إِنْ شَاءَ اللَّهُ.", "إِذَا — келаси замон зарфи: шартига музоф, жавоби билан насб қилинади.", "إِلَّا = إِنْ + لَا: «акс ҳолда».", "Жавобга ف қўшилиши вожиб ҳоллар: исмий гап, амр/наҳй/савол, жомид феъл, ёки قَدْ، مَا، لَنْ، سَ، سَوْفَ билан келса."]], "ISTIF": ["Савол сўзлари", ["Ҳарфлар: هَلْ ва ҳамза (أَ). هَلْ нинг жавоби — نَعَمْ ёки لَا.", "Исмлар: مَنْ، مَا، مَتَى، أَيْنَ، كَيْفَ، كَمْ، أَيُّ — гапда ўрни бор (мубтадо, хабар, ҳол, мафъулун биҳ…).", "Савол исмлари мабний, фақат أَيُّ мўъроб."]], "MAWSUL": ["Исм мавсул", ["الَّذِي، الَّتِي، اللَّذَانِ، اللَّتَانِ، الَّذِينَ، اللَّاتِي; умумий: مَنْ، مَا.", "Ўзидан кейинги жумла — сила, эъробдан унга ўрин йўқ.", "Силада мавсулга қайтувчи замир бўлади: هُوَ الَّذِي جَعَلَ — جَعَلَ даги мустатир هُوَ.", "اللَّذَانِ ва اللَّتَانِ тасниядек мўъроб, қолганлари мабний."]], "DAMIR": ["Мунфасил замирлар", ["أَنَا، نَحْنُ، أَنْتَ، أَنْتِ، أَنْتُمَا، أَنْتُمْ، أَنْتُنَّ، هُوَ، هِيَ، هُمَا، هُمْ، هُنَّ.", "Ҳаммаси мабний; гапда раф ўринда келади (мубтадо, хабар…).", "Насб ўрни учун إِيَّا билан: إِيَّاكَ نَعْبُدُ."]], "QAT": ["فَقَطْ", ["قَطْ — «етарли, бас» маъносидаги исм (حَسْبُ каби); فَ — зоида. Бирга: «фақат».", "Ташдидли قَطُّ — бошқа сўз: «ҳеч қачон», ўтган замонни инкор билан келади: مَا رَأَيْتُهُ قَطُّ."]], "DUA": ["Дуо маъносидаги мозий", ["Мозий феъл дуо маъносида келади: بَارَكَ اللَّهُ فِيكَ، رَحِمَهُ اللَّهُ، رَضِيَ اللَّهُ عَنْهُ.", "Бундай жумла жумлатун дуоийя дейилади (7-дарс), эъробдан унга ўрин йўқ."]], "JMS": ["Жам муаннас солим", ["ـَاتٌ қўшимчали кўплик: سَنَوَاتٌ، مُعَلِّمَاتٌ.", "Рафда замма, насб ва жарда касра: رَأَيْتُ السَّنَوَاتِ."]], "AF5": ["Афъоли хамса", ["Музорий феълнинг 5 шакли: يَفْعَلَانِ، تَفْعَلَانِ، يَفْعَلُونَ، تَفْعَلُونَ، تَفْعَلِينَ.", "Рафда охиридаги ن сақланади — бу раф аломати: تَسْكُنَانِ، تَدْرُسَانِ، تَخْتَلِفَانِ.", "Насб ва жазмда ن тушиб қолади: لَنْ تَسْكُنَا، لَمْ تَدْرُسَا.", "ا (икки киши), و (кўпчилик), ي (бир аёл) — фоил бўлган муттасил замир."]], "KANA": ["كَانَ ва синглилари", ["كَانَ ва синглилари (ظَلَّ، أَصْبَحَ، صَارَ، لَيْسَ …) мубтадо ва хабарга киради: мубтадо раф қилинган ҳолда унинг исми, хабар эса насб қилиниб унинг хабари бўлади.", "زَيْنَبُ نَحِيفَةٌ (хабар — раф) → ظَلَّتْ زَيْنَبُ نَحِيفَةً (хабар — насб).", "تَكُونَ — كَانَ нинг музориси: أَنْ تَكُونَ سَمِينَةً — исми яширин (هِيَ), хабари سَمِينَةً.", "ظَلَّ — «…лигича қолди, … давом этди» маъносида."]], "SHURU": ["Бошлаш феъллари", ["أَخَذَ، بَدَأَ، شَرَعَ، جَعَلَ «… а бошлади» маъносида келса, бошлаш феъли (афъолуш шуруъ) бўлади.", "Исмини раф қилади: أَخَذَتْ زَيْنَبُ … — زَيْنَبُ унинг исми.", "Хабари фақат мудори феъл билан бошланадиган жумла бўлади ва насб ўринда туради: تَتَنَاوَلُ … ; лекин феълнинг ўзи раф ҳолида қолади.", "أَخَذَ «олди» маъносида бўлса оддий феъл: أَخَذَهُ — уни олди."]], "JAZM": ["لَمْ ва жазм", ["لَمْ мудори феълни жазм қилади ва маъносини ўтган замон инкорига айлантиради: لَمْ تَنْجَحْ — «муваффақ бўлмади».", "Охири соғлом феълда жазм аломати — сукун: تَنْجَحْ، يَنْقُصْ، تُمَارِسْ.", "Ўртаси иллатли феълда сукун келганда 2 сукун йўлиқмаслиги учун иллат ҳарфи тушади: تَسْتَطِيعُ → لَمْ تَسْتَطِعْ.", "Афъоли хамсада жазм аломати — ن нинг тушиши: لَمْ تَدْرُسَا.", "Нафий لَا си мудорийни ўзгартирмайди: لَا تَسْتَطِيعُ — раф."]], "ADAD": ["Сонлар (21–99)", ["Ўнликлар (عِشْرُونَ … تِسْعُونَ) жамъ музаккар солимга мулҳақ: рафда و, насб ва жарда ي: وَزْنُهَا تِسْعُونَ / إِلَى سَبْعِينَ.", "Мураккаб сонда бирлик олдин, ўнлик кейин келади ва و билан боғланади: خَمْسَةٌ وَخَمْسُونَ — ўнлик бирликка маътуф.", "3–9 сонлари санаб ўтилган нарсага жинсда тескари бўлади: خَمْسَةُ كُتُبٍ، خَمْسُ سَنَوَاتٍ.", "11–99 дан кейинги санаб ўтилган нарса (тамйиз) бирлик ва насб бўлади: خَمْسَةٌ وَخَمْسُونَ كَيْلاً."]], "TAMYIZ": ["Тамйиз", ["Тамйиз — ноаниқ қолган сўзнинг нимани назарда тутганини аниқлаб берадиган накра, мансуб исм.", "Сондан кейин: خَمْسَةٌ وَخَمْسُونَ كَيْلاً — «55 (нима?) кило»."]], "MASDARM": ["أَنْ + феъл = масдар", ["أَنْ ва ундан кейинги мудори масдар маъносини беради: أَنْ تَكُونَ = اَلْكَوْنُ «бўлиш», أَنْ يَصِلَ = اَلْوُصُولُ «етиш».", "Бу масдар гапда исм каби ўрин олади: تُرِيدُ أَنْ تَكُونَ … — мафъулун биҳ; يَجِبُ أَنْ يَصِلَ … — фоил."]], "FA": ["فَ ҳарфи", ["Кетма-кетлик ва сабаб-натижани билдиради: فَزَادَ وَزْنُهَا — «натижада вазни ошди».", "Олдинги гапнинг сабабини тушунтириш учун ҳам келади: فَهُمَا تَسْكُنَانِ … — «чунки иккови … яшайди»."]], "WAWHAL": ["Ҳол вови", ["Ҳол жумласи олдидан келадиган وَ «… ҳолда» маъносини беради: فَزَادَ وَزْنُهَا وَلَمْ يَنْقُصْ — «камаймаган ҳолда ошди».", "Ундан кейинги жумла ҳол бўлиб, насб ўринда бўлади."]], "BADAL": ["Бадал", ["Исм ишорадан кейин келган ال ли исм кўпинча бадал (ёки атфи баён) бўлади ва эъробда унга эргашади: فِي هَذِهِ الْمُشْكِلَةِ — هَذِهِ жар ўринда, الْمُشْكِلَةِ ҳам жар қилинган."]], "LANAFI": ["Зотни инкор қилувчи لَا", ["لَا النَّافِيَةُ لِلْجِنْسِ — бир турдаги нарсанинг умуман йўқлигини билдиради: لَا بُدَّ — «чора йўқ».", "إِنَّ каби амал қилади: исмини насб, хабарини раф қилади.", "Исми мудоф бўлмаса, фатҳага мабний бўлиб, насб ўринда туради: لَا بُدَّ.", "Хабари кўпинча ҳазф қилинади: لَا بُدَّ مِنَ الْحِمْيَةِ — مِنَ الْحِمْيَةِ маҳзуф хабарга (مَوْجُودٌ) мутааллиқ.", "لَا بُدَّ مِنْ … — «… зарур, … шарт»."]], "ANNA": ["أَنَّ ва масдар", ["أَنَّ — إِنَّ нинг синглиси: исмини насб, хабарини раф қилади.", "أَنَّ ўз исми ва хабари билан бирга масдар ўрнида туради: أَعْتَقِدُ أَنَّكَ لَمْ تَتَّبِعِ الْحِمْيَةَ = أَعْتَقِدُ عَدَمَ اتِّبَاعِكَ الْحِمْيَةَ.", "Гап ўртасида келади (أَنَّ), гап бошида ва قَالَ дан кейин — إِنَّ.", "Хабари жумла бўлиши мумкин: لَمْ تَتَّبِعْ … — раф ўринда."]], "JAZMK": ["Жазм ва 2 сукун", ["لَمْ мудори феълни жазм қилади; жазм аломати — сукун: لَمْ تَتَّبِعْ.", "Кейинги сўз ال билан бошланса, 2 сукун йўлиқмаслиги учун сукун касрага алмашади: لَمْ تَتَّبِعِ الْحِمْيَةَ، لَمْ تُمَارِسِ الرِّيَاضَةَ.", "Бу касра эъроб аломати эмас — феъл барибир мажзум.", "Ўртаси иллатли феълда иллат ҳарфи тушади: أَسْتَطِيعُ → لَمْ أَسْتَطِعْ.", "Амр феълида ҳам шундай: اتَّبِعْ → اتَّبِعِ الْحِمْيَةَ."]], "MUQ": ["Муқаддар замма", ["Охири ي бўлган мудори феълда (يَكْفِي، يَمْشِي) раф аломати — ي даги муқаддар (кўринмас) замма, чунки ي да замма оғир.", "Насбда фатҳа кўринади: لَنْ يَكْفِيَ.", "Жазмда ي тушади: لَمْ يَكْفِ."]], "WAHD": ["وَحْدَ", ["وَحْدَ — «ёлғиз, бир ўзи» маъносидаги исм; доим насб қилинади ва олмошга музоф бўлади: وَحْدَهُ، وَحْدَكَ، وَحْدِي.", "Гапда ҳол бўлади: اَلدَّوَاءُ وَحْدَهُ لَا يَكْفِي — «дорининг ўзи (ёлғиз) кифоя қилмайди»."]], "NIDA": ["Нидо (мунодо)", ["يَا — нидо ҳарфи («эй»).", "Мунодо алам ёки аниқ шахсга қаратилган накра бўлса, танвинсиз заммага мабний, насб ўринда: يَا دُكْتُورُ، يَا مُحَمَّدُ.", "Мунодо мудоф бўлса, насб қилинади: يَا طَالِبَ الْعِلْمِ."]], "WIQ": ["Виқоя нуни", ["Мутакаллим ي си феълга уланганда, феъл охири касрадан сақланиши учун орага نِ қўшилади: قَابِلْنِي، يُقَابِلُنِي.", "Бу نِ — ҳарф, эъробдан ўрни йўқ; ي — мафъулун биҳ, насб ўринда."]], "FASL": ["Фасл замири", ["Мубтадо ва ال ли хабар орасида келган мунфасил замир (هُوَ، هِيَ، هُمْ …) хабарни сифатдан ажратади ва таъкидлайди: الْإِنْسَانُ السَّمِينُ هُوَ الصَّحِيحُ.", "Эъробдан ўрни йўқ; таржимада «… саналади, айнан …» маъносини беради."]], "NAHY": ["Наҳий لَا си", ["لَا النَّاهِيَةُ — тақиқ ҳарфи, мудори феълни жазм қилади: لَا تَأْكُلْ «ема».", "Нафий لَا сидан фарқи: لَا تَأْكُلُ (раф) — «емайсан»; لَا تَأْكُلْ (жазм) — «ема!».", "Кейинги сўз ال билан бошланса, сукун касрага алмашади: لَا تَأْكُلِ الْخُبْزَ.", "Афъоли хамсада жазм аломати — ن нинг тушиши: تُسْرِفُونَ → لَا تُسْرِفُوا."]], "ZAID": ["Зоида بِ", ["بِ баъзан таъкид учун ортиқча (зоида) келади: بِحَسْبِ ابْنِ آدَمَ = حَسْبُ ابْنِ آدَمَ.", "Ундан кейинги сўз лафзан мажрур бўлади, лекин гапдаги ўрни бўйича (маҳаллан) марфуъ ёки мансуб."]], "JMSM": ["Жамъ музаккар солим", ["Рафда و: الْمُسْرِفُونَ؛ насб ва жарда ي: الْمُسْرِفِينَ، قَائِلِينَ.", "Охиридаги ن фатҳали бўлиб, бирликдаги танвин ўрнига келади."]]};

function catOf(o){
  var ty=o.ty||"",r=o.role||"";
  if(/[Фф]еъл/.test(ty))return "f";
  if(/[Мм]афъул мутлақ/.test(r))return "-";
  if(/^Ҳарф \(жарр ҳарфи\)/.test(ty))return ">";
  if(/^(Сифат|Мудоф илайҳ|Атф|Бадал|Ишоранинг)/.test(r))return "^";
  if(/^Ҳарф/.test(ty))return "";
  if(/^Хабар|нинг хабари/.test(r))return "x";
  if(/^Мубтадо|^Сарлавҳа: мубтадо|мубтадо$|нинг исми/.test(r))return "m";
  if(/^Фоил/.test(r))return "o";
  if(/^Мафъул биҳ/.test(r))return "b";
  if(/^Жар-мажрур/.test(ty)||/жарр ҳарфидан кейин/i.test(r))return "j";
  if(/^Зарф|^Ҳол|[Ҳҳ]ол ўрнида/.test(r)||/зарф/.test(ty))return "h";
  return "";
}
