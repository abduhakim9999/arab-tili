<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Созламалар</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f7a4f">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="shell.css">
<script>
/* Sozlamalar (13.11.2026; docs/texnik.md 16). Saqlanadigan joylar:
   «sozlama» — {yangi, tovush, erkin, kor} (Telegram bulutiga ham, tg.js); «dars-tezlik», «dars-uz», «til» — darslar ishlatadigan mavjud kalitlar. */
var SN = /\/sinov-[^\/]*$/.test(location.pathname) ? 'sinov-' : '';
function korQoy() { try { var k = JSON.parse(localStorage.getItem('sozlama') || '{}').kor, e = document.documentElement; if (k === 'yorug' || k === 'tungi') e.setAttribute('data-theme', k === 'tungi' ? 'dark' : 'light'); else e.removeAttribute('data-theme'); } catch (x) {} }
korQoy();
document.write('<script src="tg.js" data-key="sozlama" data-home="' + SN + 'yol.html"><\/script>');
</script>
<style>
body{margin:0;background-color:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.s-w{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.s-top{display:flex;align-items:center;gap:12px;height:52px;margin-bottom:4px}
.s-top a{width:44px;height:44px;border-radius:12px;background:var(--cd);border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-size:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.s-top h1{margin:0;font-size:22px;line-height:1.2}
h2{margin:20px 4px 8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ac)}
.s-c{background:var(--cd);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);overflow:hidden}
.s-r{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;box-sizing:border-box;padding:8px 16px;border:0;border-top:1px solid var(--bd);background:none;color:var(--tx);text-align:left;text-decoration:none;font-size:16px}
.s-c>.s-r:first-child{border-top:0}
.s-r .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-weight:600}
.s-r small{font-size:13px;font-weight:400;line-height:1.35;color:var(--mu)}
.s-r.sg{padding-right:10px}
.s-r.col{flex-direction:column;align-items:stretch;gap:10px;padding:14px 16px 16px}
.s-r em{font-style:normal;font-size:14px;color:var(--mu);font-variant-numeric:tabular-nums}
.s-r .ch{width:18px;height:18px;flex-shrink:0;color:var(--mu)}
.s-sg{display:flex;padding:3px;gap:2px;border-radius:14px;background:var(--tint);flex-shrink:0}
.s-sg button{min-width:44px;height:44px;padding:0 11px;border-radius:11px;border:0;background:none;color:var(--mu);font-size:14px;font-weight:600}
.s-sg button[aria-pressed="true"]{background:var(--cd);box-shadow:0 1px 3px rgba(20,30,25,.2);color:var(--ac);font-weight:700}
.s-r.col .s-sg button{flex:1}
.s-sw{position:relative;width:52px;height:32px;flex-shrink:0;border-radius:16px;background:var(--bd);transition:background .15s}
.s-sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
[aria-checked="true"] .s-sw{background:var(--em1,#13865a)}
[aria-checked="true"] .s-sw::after{transform:translateX(20px)}
.s-r.dis{opacity:.55;cursor:default}
.s-tz{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:8px;background:var(--tint);color:var(--ac);font-size:11.5px;font-weight:700;letter-spacing:.02em;vertical-align:1px;white-space:nowrap}
.s-ar{font-family:"DarsNaskh","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;font-size:24px;line-height:1.4;font-weight:400;color:var(--mu)}
@font-face{font-family:"DarsNaskh";src:url(naskh.woff)}
.s-del{display:block;width:100%;height:56px;margin-top:20px;border-radius:20px;border:1px solid var(--bd);background:var(--cd);color:#B3261E;font-size:16px;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .s-del{color:#ff9b91}}
:root[data-theme="dark"] .s-del{color:#ff9b91}
.s-ok{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 16px;border-radius:14px;background:var(--tx);color:var(--bg);font-size:14.5px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:9}
.s-ok[hidden]{display:none}
@media (max-width:350px){.s-sg button{padding:0 8px;font-size:13px}.s-r{font-size:15px}}
</style>
</head>
<body>
<div class="s-w">
  <div class="s-top"><a id="orqa" href="yol.html" aria-label="Орқага">‹</a><h1>Созламалар</h1></div>

  <h2>ЎҚИШ</h2>
  <div class="s-c">
    <div class="s-r col dis">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px"><span class="t" style="flex-direction:row;align-items:center">Арабча ёзув катталиги<span class="s-tz">тез орада</span></span><span class="s-ar" lang="ar">اَلسَّلَامُ عَلَيْكُمْ</span></div>
      <div class="s-sg"><button disabled aria-pressed="false">Кичик</button><button disabled aria-pressed="true">Ўрта</button><button disabled aria-pressed="false">Катта</button></div>
    </div>
    <button class="s-r dis" role="switch" aria-checked="true" disabled><span class="t"><span>Ҳаракатлар<span class="s-tz">тез орада</span></span><small>Арабча матнда ҳаракат белгилари</small></span><span class="s-sw" aria-hidden="true"></span></button>
    <button class="s-r dis" role="switch" aria-checked="true" disabled><span class="t"><span>Таржима<span class="s-tz">тез орада</span></span><small>Матн остида таржимаси кўринади</small></span><span class="s-sw" aria-hidden="true"></span></button>
  </div>

  <h2>ЭШИТИШ</h2>
  <div class="s-c">
    <div class="s-r sg"><span class="t">Ўқиш тезлиги</span><div class="s-sg" data-k="tezlik" role="group" aria-label="Ўқиш тезлиги"><button data-v="0.75">Секин</button><button data-v="1">Оддий</button><button data-v="1.25">Тез</button></div></div>
    <button class="s-r" role="switch" data-k="uz"><span class="t">Ўзбекча таржима овози<small>Арабчадан кейин таржимаси ўқилади</small></span><span class="s-sw" aria-hidden="true"></span></button>
    <button class="s-r dis" role="switch" aria-checked="true" disabled><span class="t"><span>Офлайн сақлаш<span class="s-tz">тез орада</span></span><small>Очилган дарс овози телефонда қолади</small></span><span class="s-sw" aria-hidden="true"></span></button>
    <button class="s-r dis" disabled><span class="t"><span>Сақланган овозларни тозалаш<span class="s-tz">тез орада</span></span></span></button>
  </div>

  <h2>МАШҚ ВА ТАКРОР</h2>
  <div class="s-c">
    <div class="s-r sg"><span class="t">Кунлик янги сўзлар</span><div class="s-sg" data-k="yangi" role="group" aria-label="Кунлик янги сўзлар"><button data-v="10">10</button><button data-v="15">15</button><button data-v="20">20</button></div></div>
    <button class="s-r" role="switch" data-k="tovush"><span class="t">Товуш ва тебраниш<small>Имтиҳонда тўғри ва хато жавобда</small></span><span class="s-sw" aria-hidden="true"></span></button>
    <button class="s-r" role="switch" data-k="erkin" style="min-height:76px"><span class="t">Эркин режим<small>Ҳамма дарслар қулфсиз очилади. Устоз билан ўқийдиганлар учун</small></span><span class="s-sw" aria-hidden="true"></span></button>
  </div>

  <h2>УМУМИЙ</h2>
  <div class="s-c">
    <div class="s-r sg"><span class="t">Тил</span><div class="s-sg" data-k="til" role="group" aria-label="Тил"><button data-v="uz">Ўзбекча</button><button data-v="ru" lang="ru">Русский</button></div></div>
    <div class="s-r sg"><span class="t">Кўриниш</span><div class="s-sg" data-k="kor" role="group" aria-label="Кўриниш"><button data-v="yorug">Ёруғ</button><button data-v="tungi">Тунги</button><button data-v="avto">Авто</button></div></div>
    <a class="s-r" href="https://t.me/Arabtilihivar_bot" target="_blank" rel="noopener"><span class="t">Фикр юбориш<small>Telegram орқали</small></span><svg class="ch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
    <a class="s-r" href="yoriqnoma.html"><span class="t">Йўриқнома</span><svg class="ch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
    <div class="s-r"><span class="t">Илова версияси</span><em id="ver">—</em></div>
  </div>

  <button class="s-del" id="del">Натижаларни тозалаш</button>
</div>
<div class="s-ok" id="ok" role="status" hidden></div>
<script>
(function () {
  'use strict';
  function L(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function LS(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  var SZ; try { SZ = JSON.parse(L('sozlama') || '{}') || {}; } catch (e) { SZ = {}; }
  function saqla() { LS('sozlama', JSON.stringify(SZ)); }
  var okEl = document.getElementById('ok'), okT;
  function xabar(t) { okEl.textContent = t; okEl.hidden = false; clearTimeout(okT); okT = setTimeout(function () { okEl.hidden = true; }, 1800); }
  document.getElementById('orqa').href = SN + 'yol.html';

  /* qiymatni o'qish / yozish: sozlama ichidagilar va darslar ishlatadigan alohida kalitlar */
  function ol(k) {
    if (k === 'tezlik') return String(parseFloat(L('dars-tezlik')) || 1);
    if (k === 'uz') return L('dars-uz') === '1';
    if (k === 'til') return L('til') === 'ru' ? 'ru' : 'uz';
    if (k === 'yangi') return String(SZ.yangi || 10);
    if (k === 'kor') return SZ.kor || 'avto';
    if (k === 'tovush') return SZ.tovush !== false;
    return !!SZ[k];
  }
  function yoz(k, v) {
    if (k === 'tezlik') LS('dars-tezlik', v);
    else if (k === 'uz') LS('dars-uz', v ? '1' : '0');
    else if (k === 'til') LS('til', v);
    else { SZ[k] = k === 'yangi' ? +v : v; saqla(); if (k === 'kor') korQoy(); }
  }
  [].forEach.call(document.querySelectorAll('.s-sg[data-k]'), function (g) {
    var k = g.getAttribute('data-k');
    function boya() { var c = ol(k); [].forEach.call(g.children, function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-v') === c ? 'true' : 'false'); }); }
    [].forEach.call(g.children, function (b) { b.onclick = function () { yoz(k, b.getAttribute('data-v')); boya(); xabar('Сақланди'); }; });
    boya();
  });
  [].forEach.call(document.querySelectorAll('button[role="switch"][data-k]'), function (b) {
    var k = b.getAttribute('data-k');
    function boya() { b.setAttribute('aria-checked', ol(k) ? 'true' : 'false'); }
    b.onclick = function () { yoz(k, !ol(k)); boya(); };
    boya();
  });

  /* versiya — sw.js dagi «var C» */
  fetch('sw.js', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
    var m = t.match(/var\s+C\s*=\s*['"]([^'"]+)['"]/); if (m) document.getElementById('ver').textContent = m[1];
  }).catch(function () {});

  /* natijalarni tozalash: yo'l natijalari, xatolar ro'yxati, takror jurnali va darslardagi mashq javoblari */
  document.getElementById('del').onclick = function () {
    if (!confirm('Йўл натижалари, такрорлаш журнали ва дарслардаги машқ жавоблари ўчирилади. Давом этилсинми?')) return;
    var p = SN ? 'yol-sinov' : 'yol', hz = String(Date.now());
    /* bo'sh holat + yangi vaqt belgisi yoziladi (o'chirilmaydi): aks holda Telegram bulutidagi eski nusxa qaytib keladi (tg.js pull) */
    LS(p, '{"v":1,"d":{},"e":{}}'); LS(p + '-t', hz);
    [p + '-xato', p + '-xato-soz', p + '-kitob', SN ? 'takror-sinov-j' : 'takror-j', SN ? 'takror-sinov-xulosa' : 'takror-xulosa', 'takror-sinov-kun'].forEach(function (k) { LS(k, null); });
    try { sessionStorage.removeItem('takror-mashgulot'); } catch (e) {}
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!/^dars\d+-holat$/.test(k)) continue;
        var S = JSON.parse(localStorage.getItem(k) || 'null');
        if (S && (S.q || S.qr)) { delete S.q; delete S.qr; localStorage.setItem(k, JSON.stringify(S)); localStorage.setItem(k + '-t', hz); }
      }
    } catch (e) {}
    xabar('Натижалар тозаланди');
  };
})();
</script>
</body>
</html>
