<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Такрорлаш</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="shell.css">
<script>try{var _k=JSON.parse(localStorage.getItem('sozlama')||'{}').kor;if(_k==='yorug'||_k==='tungi')document.documentElement.setAttribute('data-theme',_k==='tungi'?'dark':'light')}catch(e){}</script>
<script src="tg.js" data-key="takror" data-home="./"></script>
<style>
@font-face{font-family:"DarsNaskh";src:url(naskh.woff)}
:root{--tq-ok:#17794a;--tq-okb:rgba(23,121,74,.12);--tq-no:#b3261e;--tq-nob:rgba(179,38,30,.10);--tq-act:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tq-ok:#7ad9a8;--tq-okb:rgba(122,217,168,.16);--tq-no:#ff9b91;--tq-nob:rgba(255,155,145,.14);--tq-act:#06281d}}
:root[data-theme="dark"]{--tq-ok:#7ad9a8;--tq-okb:rgba(122,217,168,.16);--tq-no:#ff9b91;--tq-nob:rgba(255,155,145,.14);--tq-act:#06281d}
body{margin:0;background-color:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.w{max-width:560px;margin:0 auto;padding:12px 16px 48px;box-sizing:border-box}
body.tq-ses .w{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.top a{width:44px;height:44px;border-radius:12px;background:var(--cd);border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-size:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.top small{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ac);text-transform:uppercase}
.top h1{font-size:22px;line-height:1.25;margin:0}
.ar{font-family:"DarsNaskh","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;font-weight:400;font-size:inherit;line-height:inherit}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

.tq-c{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:18px 16px;margin:0 0 12px;box-shadow:var(--sh)}
.tq-h{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mu);text-transform:uppercase;margin:0 0 6px}
.tq-mu{font-size:13.5px;color:var(--mu)}
.tq-b{display:block;width:100%;height:54px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);font-size:17px;font-weight:650}
.tq-b1{background:var(--ac);border-color:var(--ac);color:var(--tq-act)}
.tq-b:active{transform:scale(.985)}

/* бош кўриниш */
.tq-ns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px;text-align:center}
.tq-ns b{display:block;font-size:44px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.tq-ns span{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mu);text-transform:uppercase}
.tq-dn{text-align:center;padding:28px 16px}
.tq-dn h2{font-size:22px;margin:0 0 2px}
.tq-dn p{margin:0;color:var(--mu)}
.tq-big{display:flex;align-items:baseline;gap:6px;margin:0 0 10px;font-variant-numeric:tabular-nums}
.tq-big b{font-size:34px;line-height:1.1;font-weight:700;color:var(--ac)}
.tq-big span{font-size:17px;color:var(--mu)}
.tq-pr{height:6px;border-radius:3px;background:var(--tint);overflow:hidden}
.tq-pr i{display:block;height:100%;border-radius:3px;background:var(--ac);transition:width .25s}
.tq-c .tq-pr{margin:0 0 10px}
.tq-sn{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:8px 10px 8px 12px;border:1px dashed var(--bd);border-radius:12px;font-size:13.5px;color:var(--mu)}
.tq-sn span{flex:1}
.tq-sn button{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);font-size:13.5px;font-weight:600}

/* машғулот */
.tq-st{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.tq-st button{width:44px;height:44px;border-radius:12px;background:var(--cd);border:1px solid var(--bd);font-size:18px;flex-shrink:0}
.tq-st .tq-pr{flex:1}
.tq-st span{min-width:28px;text-align:right;font-size:14px;font-weight:600;color:var(--mu);font-variant-numeric:tabular-nums}
.tq-k{min-height:46vh;display:flex;flex-direction:column;padding-top:14px}
.tq-l{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mu);text-transform:uppercase}
.tq-l em{font-style:normal;letter-spacing:.04em;color:var(--ac);background:var(--tint);border-radius:6px;padding:1px 7px}
.tq-f{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px 0 14px}
.tq-w{font-size:46px;line-height:1.7}
.tq-m{font-size:21px;line-height:1.4;font-weight:600}
.tq-m div+div{margin-top:2px}
.tq-r{border-top:1px solid var(--bd);padding-top:14px;text-align:center}
.tq-r .tq-w{font-size:40px;line-height:1.6}
.tq-fm{margin-top:8px;font-size:14px;color:var(--mu);display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:2px 16px}
.tq-fm bdi,.tq-fm.ar{font-size:23px;line-height:1.7;color:var(--tx)}
.tq-fm.ar{display:block}
.tq-ex{margin-top:12px;padding-top:10px;border-top:1px dashed var(--bd);font-size:14.5px;color:var(--mu)}
.tq-ex .ar{display:block;font-size:22px;line-height:1.8;color:var(--tx)}
.tq-au{width:56px;height:56px;border-radius:50%;border:1px solid var(--bd);background:var(--cd);font-size:22px;margin-top:12px}
.tq-pl{width:96px;height:96px;border-radius:50%;border:0;background:var(--ac);color:var(--tq-act);font-size:36px;padding-left:6px}
@media (prefers-reduced-motion:no-preference){.tq-r{animation:tqin .18s ease-out}}
@keyframes tqin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* сўз охири (машқ саволи) */
.tq-g{font-size:30px;line-height:1.9;text-align:center;margin:14px 0 2px}
.tq-g.tq-og{font-size:22px;color:var(--mu);margin:10px 0 -8px}
.tq-g .tq-t{background:var(--tint);color:var(--ac);border-radius:8px;padding:0 6px}
.tq-g .tq-hk{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:10px;text-decoration-thickness:2px}
.tq-tr{text-align:center;font-size:14.5px;color:var(--mu);margin:0 0 14px}
.tq-o{display:grid;gap:8px}
.tq-o button{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:4px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);text-align:left}
.tq-o button b{font-weight:400;font-size:27px;line-height:1.7}
.tq-o button span{font-size:14px;color:var(--mu)}
.tq-o button.ok{border-color:var(--tq-ok);background:var(--tq-okb)}
.tq-o button.ok span{color:var(--tq-ok);font-weight:700}
.tq-o button.no{border-color:var(--tq-no);background:var(--tq-nob)}
.tq-o button.no span{color:var(--tq-no);font-weight:700}
.tq-s{margin-top:12px;font-size:15px;line-height:2}
.tq-ai{font-size:1.5em;line-height:1}

/* ёрлиқлар: Такрор / Луғат */
.tq-tb{display:flex;gap:2px;padding:3px;margin:0 0 12px;border-radius:14px;background:var(--tint)}
.tq-tb button{flex:1;height:44px;border:0;border-radius:11px;background:none;color:var(--mu);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.tq-tb button[aria-selected="true"]{background:var(--cd);color:var(--ac);font-weight:700;box-shadow:0 1px 3px rgba(20,30,25,.2)}
.tq-tb b{min-width:20px;height:20px;box-sizing:border-box;padding:0 6px;border-radius:10px;background:var(--tq-nob);color:var(--tq-no);font-size:12px;line-height:20px}
/* луғат: сўз базаси */
.tq-big.sm span{font-size:15px}
.lg-br{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;background:var(--tint);margin:0 0 10px}
.lg-br i{display:block;min-width:3px}
.lg-lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mu)}
.lg-lg span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.lg-lg i{width:9px;height:9px;border-radius:50%;background:var(--bd)}
.lg-lg b{color:var(--tx);font-variant-numeric:tabular-nums}
.lg-br .m,.lg-lg .m{background:#0c5e3f}.lg-br .g,.lg-lg .g{background:#2fa36f}.lg-br .o,.lg-lg .o{background:#d9a23a}.lg-br .b,.lg-lg .b{background:var(--tq-no)}.lg-br .t,.lg-lg .t{background:#8fa3b8}
.lg-q{display:block;width:100%;height:48px;box-sizing:border-box;margin:0 0 8px;padding:0 14px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit;font-size:16px}
.lg-ch{display:flex;gap:6px;margin:0 -16px 10px;padding:0 16px 2px;overflow-x:auto;scrollbar-width:none}
.lg-ch::-webkit-scrollbar{display:none}
.lg-ch button{flex-shrink:0;height:38px;padding:0 13px;border-radius:19px;border:1px solid var(--bd);background:var(--cd);color:var(--mu);font-size:14px;font-weight:600;white-space:nowrap}
.lg-ch button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--tq-act)}
.lg-d{display:flex;align-items:baseline;gap:8px;margin:16px 4px 6px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--ac)}
.lg-d span{margin-left:auto;font-weight:500;letter-spacing:0;color:var(--mu)}
.lg-l{background:var(--cd);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.lg-r{display:flex;align-items:center;gap:8px;min-height:60px;padding:4px 4px 4px 14px;border-top:1px solid var(--bd)}
.lg-r:first-child{border-top:0}
.lg-w{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:4px 0;border:0;background:none;text-align:left}
.lg-w b{font-size:24px;line-height:1.55;font-weight:400}
.lg-w span{font-size:14px;line-height:1.3;color:var(--mu)}
.lg-s{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:11.5px;color:var(--mu);white-space:nowrap}
.lg-p{display:flex;gap:2px}
.lg-p i{width:7px;height:14px;border-radius:2px;background:var(--bd)}
.lg-p.d1 i:nth-child(-n+1),.lg-p.d2 i:nth-child(-n+2){background:#d9a23a}
.lg-p.d3 i:nth-child(-n+3){background:#2fa36f}
.lg-p.d4 i{background:#0c5e3f}
.lg-r.b .lg-p.d1 i:nth-child(-n+1),.lg-r.b .lg-p.d2 i:nth-child(-n+2){background:var(--tq-no)}
.lg-bm{width:44px;height:44px;flex-shrink:0;border:0;border-radius:12px;background:none;color:var(--bd);display:flex;align-items:center;justify-content:center}
.lg-bm svg{width:22px;height:22px}
.lg-bm[aria-pressed="true"]{color:var(--tq-no)}
.lg-bm[aria-pressed="true"] svg{fill:currentColor}
.lg-e{padding:28px 16px;text-align:center;color:var(--mu)}

.tq-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.tq-bar>div{max-width:528px;margin:0 auto;display:grid;gap:10px}
.tq-bar>div.two{grid-template-columns:1fr 1fr}
.tq-er{text-align:center;padding:40px 16px;color:var(--mu)}
.tq-er button{margin-top:14px}
</style>
</head>
<body>
<div class="w" id="app"></div>
<div class="tq-bar" id="bar" hidden></div>
<audio id="au" preload="none"></audio>
<script>
/* Sinov nusxasi (sinov-takror.html): fayllar «sinov-» bilan — sw.js ularni telefonda saqlamaydi (doim yangisi). */
var SN = /\/sinov-[^\/]*$/.test(location.pathname) ? 'sinov-' : '';
document.write('<script src="' + SN + 'fsrs.js"><\/script><script src="' + SN + 'takror.js"><\/script>');
</script>
<script>
(function () {
  var SINOV = !!SN;
  var FAOL = [1];                       /* so'zlari saralangan darslar (baza: W.s); hech biri saralanmagan bo'lsa — 1-dars */
  var KB = SINOV ? 'soz-sinov' : 'soz'; /* SO'Z BAZASI belgilari (yol.html bilan umumiy): {v, b:{id:1} bilmayman, k:{id:1} «bilaman» deb aytilgan, s:{dars:vaqt}} */
  var W = null, TAB = 't', LF = 'h', LQ = '';   /* TAB: 't' такрор, 'l' луғат; LF — luğat filtri; LQ — qidiruv */
  var KJ = SINOV ? 'takror-sinov-j' : 'takror-j', KS = 'takror-sinov-kun';
  var KM = 'takror-mashgulot';         /* sahifa o'zi yangilansa (yangi versiya) mashg'ulot davom etadi */
  var app = document.getElementById('app'), bar = document.getElementById('bar'), au = document.getElementById('au');
  var E = null, D = null, cur = null, t0 = 0, jami0 = 0, tmq = null, auF = '', auT = null;

  function L(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function LS(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  function mash(v) { try { if (v == null) return sessionStorage.getItem(KM); v ? sessionStorage.setItem(KM, '1') : sessionStorage.removeItem(KM); } catch (e) {} return null; }
  function wOl() { try { W = JSON.parse(L(KB) || '{}') || {}; } catch (e) { W = {}; } W.v = 1; W.b = W.b || {}; W.k = W.k || {}; W.s = W.s || {}; }
  function wYoz() { LS(KB, JSON.stringify(W)); }
  function mano(r) { var u = r.uz.join('; '); return (u.match(/(^|[\s;,])\d+\./g) || []).length > 1 ? u : u.replace(/^\d+\.\s*/, ''); }
  function siljish() { return SINOV ? (+L(KS) || 0) : 0; }
  function hozir() { return Date.now() + siljish() * 86400000; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function plain(v) { return v.replace(/[ً-ْٰ]/g, ''); }
  function ar(s, cls) { return '<bdi class="ar' + (cls ? ' ' + cls : '') + '" lang="ar">' + esc(s) + '</bdi>'; }
  /* kirill matn ichidagi arabcha bo'laklarni ajratib o'raydi */
  function mix(s) { return esc(s).replace(/[؀-ۿ]+(?:\s+[؀-ۿ]+)*/g, function (m) { return '<bdi class="ar tq-ai" lang="ar">' + m + '</bdi>'; }); }

  /* ---- ma'lumot ---- */
  function yukla() {
    var f = function (n) { return fetch(SN ? 'sinov-' + n : 'data/' + n).then(function (r) { if (!r.ok) throw 0; return r.json(); }); };
    app.innerHTML = '';
    Promise.all([f('lugat.json'), f('mashq.json'), f('darslar.json')]).then(function (a) {
      D = { l: a[0].s, m: a[1].s, d: a[2].s };
      try { if (sessionStorage.getItem('takror-tab') === 'l') TAB = 'l'; } catch (e) {}
      qur();
      if (mash() && E.keyingi(hozir())) { document.body.classList.add('tq-ses'); keyingi(); } else bosh();
    }).catch(function () {
      app.innerHTML = '<div class="tq-er">Маълумот юкланмади. Интернетни текширинг.<br><button class="tq-b" id="qy">Қайта уриниш</button></div>';
      document.getElementById('qy').onclick = yukla;
    });
  }
  function qur() {
    var j = [];
    try { j = (JSON.parse(L(KJ) || '{}').j) || []; } catch (e) {}
    var ust = [];                                       /* «Йўл»dagi xatolar (yol.html) — yangi mashq savollari ichida birinchi */
    try { ust = JSON.parse(L(SINOV ? 'yol-sinov-xato' : 'yol-xato') || '[]') || []; } catch (e) {}
    wOl();
    var usz = [], fa = [], k;                           /* «bilmayman» so'zlar — yangi so'zlar ichida birinchi; darsi saralanmagan bo'lsa ham kiradi */
    for (k in W.b) usz.push(+k);
    for (k in W.s) fa.push(+k);
    FAOL = fa.length ? fa.sort(function (a, b) { return a - b; }) : [1];
    var yn = 0;                                        /* «Созламалар» → кунлик янги сўзлар (10 / 15 / 20) */
    try { yn = +JSON.parse(L('sozlama') || '{}').yangi || 0; } catch (e) {}
    E = Takror.yarat({ lugat: D.l, mashq: D.m, darslar: D.d, faol: FAOL, jurnal: j, ustun: ust, ustunSoz: usz, sozlama: yn ? { yangi: yn } : null });
    tozala();
  }
  /* yod bo'lgan so'z («bilgan»: takror oralig'i E.sozlama.bilgan kundan oshgan) «bilmayman»dan o'zi chiqadi */
  function tozala() {
    var o = false, id, c;
    for (id in W.b) { c = E.karta('w' + id + 'a'); if (c && c.state === FSRS.State.Review && c.stability >= E.sozlama.bilgan) { delete W.b[id]; W.k[id] = 1; o = true; } }
    if (o) wYoz();
  }
  function xul() { LS(SINOV ? 'takror-sinov-xulosa' : 'takror-xulosa', JSON.stringify(E.xulosa(hozir()))); }
  function saqla() { LS(KJ, JSON.stringify({ v: 1, j: E.jurnal })); xul(); }

  /* ---- ovoz: lug'at yo'lagidagi bo'lak ---- */
  function toxta() { if (auT) { clearInterval(auT); auT = null; } try { au.pause(); } catch (e) {} }
  function ovoz(a) {
    if (!a) return;
    toxta();
    var s = Math.max(0, a.s - 0.08), e = a.e + 0.15;
    function go() {
      try { au.currentTime = s; } catch (x) {}
      var p = au.play(); if (p && p.catch) p.catch(function () {});
      auT = setInterval(function () { if (au.currentTime >= e || au.ended) toxta(); }, 30);
    }
    if (auF !== a.f) { auF = a.f; au.src = a.f; au.load(); au.addEventListener('loadedmetadata', go, { once: true }); }
    else go();
  }

  /* ---- bosh ko'rinish ---- */
  function dnom() {
    var d = D.d.filter(function (x) { return FAOL.indexOf(x.n) > -1; });
    if (!d.length) return '';
    if (d.length > 1 && (d[0].kitob !== d[d.length - 1].kitob || d[d.length - 1].n - d[0].n !== d.length - 1)) return d.length + ' та дарс сўзлари';
    return d[0].kitob + '-китоб · ' + (d.length > 1 ? d[0].n + '–' + d[d.length - 1].n + '-дарслар' : d[0].n + '-дарс');
  }
  function tepa() {
    var bn = 0, k; for (k in W.b) bn++;
    return '<div class="top"><a href="' + (SINOV ? 'sinov-yol.html' : './') + '" aria-label="Орқага">‹</a><div><small>' + dnom() + '</small><h1>Такрорлаш</h1></div></div>' +
      '<div class="tq-tb" role="tablist"><button role="tab" data-t="t" aria-selected="' + (TAB === 't') + '">Такрор</button><button role="tab" data-t="l" aria-selected="' + (TAB === 'l') + '">Луғат' + (bn ? '<b>' + bn + '</b>' : '') + '</button></div>';
  }
  function tabUla() {
    [].forEach.call(app.querySelectorAll('.tq-tb button'), function (b) {
      b.onclick = function () { var t = b.getAttribute('data-t'); if (t === TAB) return; TAB = t; try { sessionStorage.setItem('takror-tab', t); } catch (e) {} if (t === 't') qur(); bosh(); };
    });
  }

  /* ---- «Луғат»: so'z bazasi — har so'zning holati, yod bo'lish darajasi, «Билмаганларим» ----
     Holat: m мустаҳкам / g биламан (takror oralig'i 30 / 7 kundan oshgan), b билмайман (belgilangan yoki xato qilingan, hali yod bo'lmagan),
     o ўрганилмоқда (javobi bor), t текширилмаган («bilaman» deyilgan, hali so'ralmagan), y кўрилмаган (darsi saralanmagan). */
  function sozlar() {
    var EA = Takror.yarat({ lugat: D.l, mashq: [], darslar: D.d, faol: D.d.map(function (d) { return d.n; }), jurnal: E.jurnal });
    var RV = FSRS.State.Review, sn = {};
    E.jurnal.forEach(function (e) { var m = /^w(\d+)[auo]$/.exec(e[0]); if (m) { var a = sn[m[1]] = sn[m[1]] || [0, 0]; a[e[2] === 1 ? 1 : 0]++; } });
    return D.l.filter(function (r) { return r.tk; }).map(function (r) {
      var best = 0, bor = false, st, dr;
      ['a', 'u', 'o'].forEach(function (t) { var c = EA.karta('w' + r.id + t); if (!c) return; bor = true; if (c.state === RV && c.stability > best) best = c.stability; });
      if (best >= EA.sozlama.mustahkam) { st = 'm'; dr = 4; }
      else if (best >= EA.sozlama.bilgan) { st = 'g'; dr = 3; }
      else if (W.b[r.id]) { st = 'b'; dr = best ? 2 : bor ? 1 : 0; }
      else if (bor) { st = 'o'; dr = best ? 2 : 1; }
      else { st = W.k[r.id] ? 't' : 'y'; dr = 0; }
      return { r: r, st: st, dr: dr, ok: (sn[r.id] || [0, 0])[0], no: (sn[r.id] || [0, 0])[1] };
    });
  }
  var HN = { m: 'мустаҳкам', g: 'биламан', o: 'ўрганилмоқда', b: 'билмайман', t: 'текширилмаган', y: 'кўрилмаган' };
  var BM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h11a1 1 0 0 1 1 1V21l-6.5-4.2L5.5 21V4.5a1 1 0 0 1 1-1z"/></svg>';
  function lugat() {
    clearTimeout(tmq); toxta(); cur = null; mash(0);
    document.body.classList.remove('tq-ses');
    var S = sozlar(), c = { m: 0, g: 0, o: 0, b: 0, t: 0, y: 0 }, lv = {}, nom = {};
    S.forEach(function (x) { c[x.st]++; });
    D.d.forEach(function (d) { if (d.lv) lv[d.n] = d.lv; nom[d.n] = d.uz; });
    app.innerHTML = tepa() +
      '<section class="tq-c"><div class="tq-h">Сўз базаси</div><div class="tq-big sm"><b>' + (c.m + c.g) + '</b><span>/ ' + S.length + ' сўзни биламан</span></div>' +
      '<div class="lg-br" aria-hidden="true">' + ['m', 'g', 'o', 'b', 't', 'y'].map(function (k) { return c[k] ? '<i class="' + k + '" style="flex:' + c[k] + '"></i>' : ''; }).join('') + '</div>' +
      '<div class="lg-lg">' + ['m', 'g', 'o', 'b', 't', 'y'].map(function (k) { return '<span><i class="' + k + '"></i>' + HN[k] + ' <b>' + c[k] + '</b></span>'; }).join('') + '</div></section>' +
      '<input class="lg-q" id="lq" type="search" inputmode="search" autocomplete="off" placeholder="Қидириш: арабча ёки ўзбекча" aria-label="Қидириш" value="' + esc(LQ) + '">' +
      '<div class="lg-ch" role="group" aria-label="Саралаш">' + [['h', 'Ҳаммаси', S.length], ['b', 'Билмаганларим', c.b], ['o', 'Ўрганилмоқда', c.o], ['g', 'Биламан', c.m + c.g], ['t', 'Текширилмаган', c.t]].map(function (f) {
        return '<button data-f="' + f[0] + '" aria-pressed="' + (LF === f[0]) + '">' + f[1] + ' · ' + f[2] + '</button>'; }).join('') + '</div><div id="lr"></div>';
    bar.hidden = true; bar.innerHTML = ''; tabUla();
    var lr = document.getElementById('lr');
    function royxat() {
      var q = plain(LQ.trim()).toLowerCase(), h = '', dars = 0, n = 0, qism = '';
      function yop() { if (qism) h += '<h3 class="lg-d">' + dars + '-дарс · ' + esc(nom[dars] || '') + '<span>' + n + ' сўз</span></h3><div class="lg-l">' + qism + '</div>'; qism = ''; n = 0; }
      S.forEach(function (x) {
        var r = x.r;
        if (LF !== 'h' && !(LF === 'g' ? (x.st === 'g' || x.st === 'm') : x.st === LF)) return;
        if (q && plain(r.ar).indexOf(q) < 0 && r.uz.join(' ').toLowerCase().indexOf(q) < 0) return;
        if (r.d !== dars) { yop(); dars = r.d; }
        n++;
        qism += '<div class="lg-r ' + x.st + '"><button class="lg-w"' + (r.au && lv[r.d] ? ' data-au="' + r.id + '"' : '') + '><b class="ar" lang="ar">' + esc(r.ar) + '</b><span>' + esc(mano(r)) + '</span></button>' +
          '<div class="lg-s"><span class="lg-p d' + x.dr + '" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>' + HN[x.st] + (x.ok + x.no ? ' · ✓' + x.ok + (x.no ? ' ✗' + x.no : '') : '') + '</span></div>' +
          '<button class="lg-bm" data-id="' + r.id + '" aria-pressed="' + (W.b[r.id] ? 'true' : 'false') + '" aria-label="«Билмайман» деб белгилаш">' + BM + '</button></div>';
      });
      yop();
      lr.innerHTML = h || '<div class="lg-e">' + (LF === 'b' && !q ? 'Билмаган сўз йўқ. Дарс охирида сўзларни сараланг ёки шу ерда белгиланг.' : 'Ҳеч нарса топилмади.') + '</div>';
    }
    royxat();
    document.getElementById('lq').oninput = function () { LQ = this.value; royxat(); };
    [].forEach.call(app.querySelectorAll('.lg-ch button'), function (b) {
      b.onclick = function () { LF = b.getAttribute('data-f'); [].forEach.call(app.querySelectorAll('.lg-ch button'), function (y) { y.setAttribute('aria-pressed', y === b ? 'true' : 'false'); }); royxat(); };
    });
    lr.onclick = function (e) {
      var bm = e.target.closest('.lg-bm'), w = e.target.closest('.lg-w[data-au]');
      if (bm) {                                         /* qo'lda belgilash: «bilmayman» ↔ «bilaman» */
        var id = bm.getAttribute('data-id'), y = window.pageYOffset;
        if (W.b[id]) { delete W.b[id]; W.k[id] = 1; } else { W.b[id] = 1; delete W.k[id]; }
        wYoz(); lugat(); window.scrollTo(0, y);
      } else if (w) {
        var r = D.l.filter(function (x) { return String(x.id) === w.getAttribute('data-au'); })[0];
        if (r) ovoz({ f: lv[r.d], s: r.au[0], e: r.au[1] });
      }
    };
  }
  function bosh() {
    clearTimeout(tmq); toxta(); cur = null; jami0 = 0; mash(0);
    document.body.classList.remove('tq-ses');
    if (TAB === 'l') { lugat(); return; }
    var t = hozir(), b = E.bugun(t), h = E.hisob(), dt = new Date(t), html = '';
    xul();
    html += tepa();
    if (SINOV) html += '<div class="tq-sn"><span>🧪 Синов · бугун ' + ('0' + dt.getDate()).slice(-2) + '.' + ('0' + (dt.getMonth() + 1)).slice(-2) +
      '</span><button id="s1">+1 кун</button><button id="s0">Тозалаш</button></div>';
    if (b.takror + b.yangi) html += '<section class="tq-c"><div class="tq-ns"><div><b>' + b.takror + '</b><span>такрор</span></div><div><b>' + b.yangi +
      '</b><span>янги</span></div></div><button class="tq-b tq-b1" id="go">Бошлаш</button></section>';
    else html += '<section class="tq-c tq-dn"><h2>Бугунга тамом</h2><p>Эртага ' + E.ertaga(t) + ' та</p></section>';
    html += '<section class="tq-c"><div class="tq-h">Билган сўзларим</div><div class="tq-big"><b>' + h.bilgan + '</b><span>/ ' + h.jami + '</span></div>' +
      '<div class="tq-pr"><i style="width:' + (h.jami ? Math.round(h.bilgan * 100 / h.jami) : 0) + '%"></i></div>' +
      '<div class="tq-mu">ўрганилмоқда ' + h.organilmoqda + ' · мустаҳкам ' + h.mustahkam + '</div></section>';
    app.innerHTML = html; bar.hidden = true; bar.innerHTML = ''; tabUla();
    var go = document.getElementById('go'); if (go) go.onclick = function () { mash(1); document.body.classList.add('tq-ses'); keyingi(); };
    if (SINOV) {
      document.getElementById('s1').onclick = function () { LS(KS, String(siljish() + 1)); bosh(); };
      document.getElementById('s0').onclick = function () { if (confirm('Синов натижалари ўчирилсинми?')) { LS(KJ, null); LS(KS, null); LS(KB, null); qur(); bosh(); } };
    }
    window.scrollTo(0, 0);
  }

  /* ---- mashg'ulot ---- */
  function keyingi() {
    clearTimeout(tmq); toxta();
    var x = E.keyingi(hozir());
    if (!x) { bosh(); return; }
    cur = x.k; t0 = Date.now();
    if (x.qoldi > jami0) jami0 = x.qoldi;
    var bosh_ = '<div class="tq-st"><button id="yop" aria-label="Ёпиш">✕</button><div class="tq-pr"><i style="width:' +
      Math.round((1 - x.qoldi / jami0) * 100) + '%"></i></div><span>' + x.qoldi + '</span></div>';
    if (cur.tur === 'q') savol(bosh_, x); else soz(bosh_, x);
    document.getElementById('yop').onclick = bosh;
    window.scrollTo(0, 0);
  }
  function tugma(h, two) { bar.innerHTML = '<div' + (two ? ' class="two"' : '') + '>' + h + '</div>'; bar.hidden = false; }
  function javob(bildi) {
    if (!cur) return;
    E.javob(cur.id, bildi, Date.now() - t0, hozir());
    if (cur.n) {                                        /* so'z kartasi: bilmadi → «bilmayman»ga; bildi → yod bo'lgan bo'lsa undan chiqadi */
      if (!bildi) { if (!W.b[cur.n.id]) { W.b[cur.n.id] = 1; delete W.k[cur.n.id]; wYoz(); } } else tozala();
    }
    saqla(); keyingi();
  }

  function manolar(n) {
    var a = [];
    n.m.forEach(function (r) { r.uz.forEach(function (u) { u.split(/\s(?=\d\.\s)/).forEach(function (p) { a.push(p); }); }); });
    if (a.length === 1) a[0] = a[0].replace(/^\d+\.\s*/, '');
    return '<div class="tq-m">' + a.map(function (p) { return '<div>' + esc(p.replace(/^(\d+)\.\s*/, '$1. ')) + '</div>'; }).join('') + '</div>';
  }
  function shakl(r) {
    if (r.fel) return '<div class="tq-fm ar" lang="ar">' + r.fel.map(esc).join(' – ') + '</div>';
    var p = [];
    if (r.al) p.push(ar('(' + r.al + ')'));
    if (r.jam) p.push('<span>жам ' + ar(r.jam.join('، ')) + '</span>');
    if (r.mn) p.push('<span>муаннас ' + ar(r.mn) + '</span>');
    return p.length ? '<div class="tq-fm">' + p.join('') + '</div>' : '';
  }
  function misol(n) {
    var x = [];
    n.m.forEach(function (r) { (r.x || []).forEach(function (e) { x.push(e); }); });
    return x.slice(0, 2).map(function (e) { return '<div class="tq-ex">' + ar(e[0]) + esc(e[1]) + '</div>'; }).join('');
  }
  function soz(bosh_, x) {
    var n = cur.n, r = n.r, t = cur.tur, old, orqa;
    var sorov = { a: 'Маъноси?', u: 'Арабчаси?', o: 'Эшитинг' }[t];
    var soz_ = '<div class="ar tq-w" lang="ar">' + esc(r.ar) + '</div>';
    if (t === 'a') { old = soz_; orqa = manolar(n) + shakl(r) + misol(n); }
    else if (t === 'u') { old = manolar(n); orqa = soz_ + shakl(r) + misol(n); }
    else { old = '<button class="tq-pl" id="pl" aria-label="Тинглаш">▶</button>'; orqa = soz_ + manolar(n) + shakl(r); }
    if (n.au && t !== 'o') orqa += '<button class="tq-au" id="sp" aria-label="Тинглаш">🔊</button>';
    app.innerHTML = bosh_ + '<section class="tq-c tq-k"><div class="tq-l"><span>' + sorov + '</span>' + (x.yangi ? '<em>янги</em>' : '') +
      '</div><div class="tq-f">' + old + '</div><div class="tq-r" id="rv" hidden>' + orqa + '</div></section>';
    tugma('<button class="tq-b tq-b1" id="ko">Кўрсатиш</button>');
    if (t === 'o') { document.getElementById('pl').onclick = function () { ovoz(n.au); }; ovoz(n.au); }
    document.getElementById('ko').onclick = function () {
      document.getElementById('rv').hidden = false;
      tugma('<button class="tq-b" id="j0">Билмадим</button><button class="tq-b tq-b1" id="j1">Билдим</button>', true);
      document.getElementById('j0').onclick = function () { javob(false); };
      document.getElementById('j1').onclick = function () { javob(true); };
      var sp = document.getElementById('sp');
      if (sp) { sp.onclick = function () { ovoz(n.au); }; ovoz(n.au); }
    };
  }

  /* so'z oxiri harakati — dars «Машқ»idagi savol: gap harakatsiz, uch variant; to'g'rida 1 s dan keyin o'zi o'tadi */
  function qator(ws, ti, hk, ochiq) {
    return ws.map(function (w, j) {
      var c = j === ti ? 'tq-t' : (j === hk ? 'tq-hk' : '');
      return '<span' + (c ? ' class="' + c + '"' : '') + '>' + esc(j === ti && ochiq ? w[0] : plain(w[0])) + '</span>' + esc(w[1].replace('?', '؟'));
    }).join(' ');
  }
  function savol(bosh_, x) {
    var q = cur.s, ql = +q.k.split('-')[0], togri = q.gap[q.w][0], ops = q['var'].slice(), i, j, tmp, bajarildi = false;
    for (i = ops.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); tmp = ops[i]; ops[i] = ops[j]; ops[j] = tmp; }
    function chiz(ochiq) {
      var hk = q.hk || [-1, -1], h = '';
      if (q.oldgap) h += '<div class="tq-g tq-og ar" lang="ar">' + qator(q.oldgap, -1, ochiq ? hk[1] : -1, false) + '</div>';
      h += '<div class="tq-g ar" lang="ar">' + qator(q.gap, q.w, ochiq && hk[0] === ql && hk[1] !== q.w ? hk[1] : -1, ochiq) + '</div>';
      return h;
    }
    app.innerHTML = bosh_ + '<section class="tq-c tq-k"><div class="tq-l"><span>Сўз охири?</span>' + (x.yangi ? '<em>янги</em>' : '') + '</div>' +
      '<div id="qg">' + chiz(false) + '</div>' + (q.tr ? '<div class="tq-tr">' + esc(q.tr) + '</div>' : '') +
      '<div class="tq-o">' + ops.map(function (o, n) { return '<button data-n="' + n + '">' + '<b class="ar" lang="ar">' + esc(o[0]) + '</b><span>' + esc(o[2]) + '</span></button>'; }).join('') +
      '</div><div class="tq-s" id="qs" aria-live="polite"></div></section>';
    bar.hidden = true; bar.innerHTML = '';
    [].forEach.call(app.querySelectorAll('.tq-o button'), function (b) {
      b.onclick = function () {
        if (bajarildi) return;
        bajarildi = true;
        var n = +b.getAttribute('data-n'), ok = ops[n][0] === togri;
        [].forEach.call(app.querySelectorAll('.tq-o button'), function (y) {
          var m = +y.getAttribute('data-n');
          if (ops[m][0] === togri) y.classList.add('ok'); else if (m === n) y.classList.add('no');
          y.disabled = true;
        });
        document.getElementById('qg').innerHTML = chiz(true);
        if (q.sabab) document.getElementById('qs').innerHTML = mix(q.sabab);
        E.javob(cur.id, ok, Date.now() - t0, hozir()); saqla();
        tugma('<button class="tq-b tq-b1" id="kn">Кейинги</button>');
        document.getElementById('kn').onclick = keyingi;
        if (ok) tmq = setTimeout(keyingi, 1000);
      };
    });
  }

  yukla();
})();
</script>
