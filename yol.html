<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Йўл</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c5e3f">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="shell.css">
<script>
/* Sinov nusxasi (sinov-yol.html): natija alohida kalitda (asosiy natijaga tegmaydi); ma'lumot va rasmlar asosiy `data/`, `fon/` dan. */
var SN = /\/sinov-[^\/]*$/.test(location.pathname) ? 'sinov-' : '';
/* ko'rinish (sozlamalar): yorug' / tungi */
try { var _k = JSON.parse(localStorage.getItem('sozlama') || '{}').kor; if (_k === 'yorug' || _k === 'tungi') document.documentElement.setAttribute('data-theme', _k === 'tungi' ? 'dark' : 'light'); } catch (e) {}
document.write('<script src="tg.js" data-key="' + (SN ? 'yol-sinov' : 'yol') + '" data-home=""><\/script>' + (SN ? '' : '<script src="baza.js"><\/script>') + '<script src="' + SN + 'qobiq.js"><\/script>');
</script>
<style>
@font-face{font-family:"DarsNaskh";src:url(naskh.woff)}
:root{--y-ok:#17794a;--y-okb:rgba(23,121,74,.12);--y-no:#b3261e;--y-nob:rgba(179,38,30,.10);--y-act:#fff;--y-tl:#c99434;--y-hd:#0c5e3f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--y-ok:#7ad9a8;--y-okb:rgba(122,217,168,.16);--y-no:#ff9b91;--y-nob:rgba(255,155,145,.14);--y-act:#06281d;--y-hd:#083626}
  :root:not([data-theme="light"]) .y-fn img{filter:brightness(.6) saturate(.9)}}
:root[data-theme="dark"]{--y-ok:#7ad9a8;--y-okb:rgba(122,217,168,.16);--y-no:#ff9b91;--y-nob:rgba(255,155,145,.14);--y-act:#06281d;--y-hd:#083626}
:root[data-theme="dark"] .y-fn img{filter:brightness(.6) saturate(.9)}
body{margin:0;background-color:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.y-w{max-width:560px;margin:0 auto;min-height:100vh;box-sizing:border-box}
.y-in{padding:12px 16px 56px}
body.y-ses .y-in{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
body.y-ses .y-cta{display:none}
.ar{font-family:"DarsNaskh","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;font-weight:400}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--y-tl);outline-offset:2px}

/* тепа тасма */
.y-hd{background:var(--y-hd);color:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 2px}
.y-hr{display:flex;align-items:center;gap:8px;height:48px}
.y-hr h1{margin:0;font-size:24px;line-height:1;font-weight:700}
.y-pg{background:rgba(255,255,255,.14);color:#fff;border:0;display:flex;align-items:center}
.y-sn{display:flex;align-items:center;gap:8px;margin:8px 0 0;padding:4px 4px 4px 12px;border:1px dashed rgba(255,255,255,.4);border-radius:12px;font-size:13.5px}
.y-sn span{flex:1}
.y-sn button{height:36px;padding:0 12px;border-radius:10px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:13.5px;font-weight:600}


/* боб: манзара, карта, йўл */
.y-bs{position:relative;padding:0 0 84px;background:var(--zm,var(--tint))}
.y-bs:last-child{padding-bottom:calc(200px + env(safe-area-inset-bottom,0px))}
.y-fn{position:absolute;inset:0;overflow:hidden;z-index:0}
.y-fn img{display:block;width:100%;height:auto}
.y-fn.ak img:nth-child(even){transform:scaleY(-1)}
.y-fn img.so{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 120px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 120px),transparent)}
.y-bk{position:relative;z-index:3;height:132px;margin:0 16px;background:var(--cd);color:var(--tx);border:1.5px solid rgba(224,185,90,.9);border-radius:20px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.y-bs.b1{padding-top:14px}
.y-bs:not(.b1){padding-top:48px}
/* боб чегараси: тилла ҳошияли равоқ тасма (икки манзара туташган чизиқни ёпади) */
.y-rv{position:absolute;z-index:3;left:0;right:0;top:-34px;height:70px;pointer-events:none;filter:drop-shadow(0 4px 5px rgba(0,0,0,.3))}
.y-rv>svg{display:block;width:100%;height:100%}
.y-rv i{position:absolute;left:50%;top:3px;width:40px;height:40px;margin-left:-20px;box-sizing:border-box;border-radius:50%;border:3px solid #E0B95A;background:var(--y-hd);display:flex}
.y-rv i svg{width:100%;height:100%}
.y-bk .tx{position:relative;z-index:1;width:206px;max-width:62%;height:100%;box-sizing:border-box;padding:12px 0 14px 16px;display:flex;flex-direction:column;gap:1px}
.y-bk small{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ac);display:flex;align-items:center;gap:3px}
.y-bk small svg{width:14px;height:14px}
.y-bk{cursor:pointer;-webkit-tap-highlight-color:transparent}
.y-bk:active{transform:scale(.985)}
.y-bk b{font-size:24px;line-height:1.55;text-align:left;white-space:nowrap}
.y-bk .uz{font-size:14px;color:var(--mu);white-space:nowrap;text-shadow:0 0 5px var(--cd),0 0 5px var(--cd),0 0 8px var(--cd)}
.y-sg{margin-top:auto;display:flex;gap:4px;max-width:150px}
.y-sg i{flex:1;max-width:24px;height:6px;border-radius:3px;background:var(--bd)}
.y-sg i.o{background:var(--y-ok)}
.y-sg i.h{background:var(--y-tl)}
.y-bki{position:absolute;right:0;top:0;width:196px;max-width:58%;height:100%;object-fit:cover;object-position:46% 50%;-webkit-mask-image:linear-gradient(to right,transparent,#000 36%);mask-image:linear-gradient(to right,transparent,#000 36%)}
.y-yl{position:relative;z-index:1;margin-top:10px}
/* фон (13.11, фойдаланувчи: манзара шовқин, чалғитади → 1-вариант танланди): body.fon-1 — манзара фақат боб бошида баннер, йўл тинч заминда */
.fon-1 .y-bs{background:color-mix(in srgb,var(--br,var(--zm,var(--tint))) 12%,var(--bg))}
.fon-1 .y-fn{bottom:auto;height:250px}
.fon-1 .y-fn img{width:100%;height:100%;object-fit:cover;object-position:50% 0;-webkit-mask-image:linear-gradient(to bottom,#000 45%,transparent);mask-image:linear-gradient(to bottom,#000 45%,transparent)}
.fon-1 .y-fn img+img{display:none}
.fon-1 .y-ts{--ts:color-mix(in srgb,var(--br,#8a8a8a) 30%,var(--bg));--ty:color-mix(in srgb,var(--br,#8a8a8a) 55%,transparent)}
.fon-1 .y-n{border-color:var(--br,var(--y-tl))}
.fon-1 .y-n .nr{background:var(--br,#0C5E3F)}
.fon-1 .y-n.hz{border-color:var(--y-tl)}
.fon-1 .y-bk{border-color:var(--br,rgba(224,185,90,.9))}
.fon-1 .y-bk small{color:color-mix(in srgb,var(--br,var(--ac)) 72%,#000)}
.fon-1 .y-sg i.o{background:var(--br,var(--y-ok))}
.fon-1 .y-bb{background:color-mix(in srgb,var(--bbr,var(--y-hd)) 72%,#000);transition:background .25s}
.fon-1 .y-ts.ot{background:#E9C469}

.y-ts{position:absolute;z-index:1;width:42px;height:23px;margin:-11px 0 0 -21px;border-radius:50%;background:var(--ts,#EFE8D4);box-shadow:0 5px 0 var(--ty,rgba(0,0,0,.3))}
.y-ts.k{transform:scale(.84)}
.y-ts.ot{background:#FFF3CF;box-shadow:0 0 0 2px #E0B95A,0 5px 0 var(--ty,rgba(0,0,0,.3))}
.rb .y-ts{width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:3px;transform:rotate(45deg);box-shadow:0 0 0 2px #FFF6E0,3px 3px 0 1px var(--ty,rgba(0,0,0,.3))}
.rb .y-ts.k{transform:rotate(45deg) scale(.84)}
.rb .y-ts.ot{background:#E0B95A}

.y-n{position:absolute;z-index:2;transform:translate(-50%,-50%);width:84px;height:84px;box-sizing:border-box;border-radius:50%;border:3px solid var(--y-tl);padding:0;background:#FFFDF6;color:#0C5E3F;box-shadow:0 0 0 4px #fff,0 6px 0 4px var(--ty,rgba(0,0,0,.3));display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700}
.y-n .ic{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center}
.y-n .ic svg{width:66%;height:66%}
.y-n i{position:absolute;width:28px;height:28px;box-sizing:border-box;border-radius:50%;border:2px solid #FFFDF6;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.y-n i svg{width:15px;height:15px}
.y-n .nr{left:-8px;top:-6px;background:#0C5E3F;color:#fff}
.y-n .ok{right:-8px;top:-6px;background:#0f7a4f;color:#fff}
.y-n .lk{right:-8px;bottom:-4px;background:#fff;color:#4F5650}
.y-n .lk svg{width:14px;height:14px}
.y-n.hz{width:112px;height:112px;border-width:4px;box-shadow:0 0 0 5px #fff,0 0 0 13px rgba(224,185,90,.55),0 0 30px rgba(224,185,90,.9)}
.y-n.hz .nr{width:30px;height:30px;background:var(--y-tl);color:#2B1D00;font-size:15px}
.y-n.ex{width:92px;height:104px;border:0;border-radius:0;background:none;box-shadow:none}
.y-n.ex>svg{width:92px;height:104px;filter:drop-shadow(0 5px 0 var(--ty,rgba(0,0,0,.3)))}
.y-n.ex,.y-n.ex.hz{box-shadow:none}
.y-n.ex.hz>svg{filter:drop-shadow(0 0 10px rgba(246,220,148,.95))}
.y-n.kx{width:100px;height:100px;border:4px solid #0C5E3F;background:#E9C469;color:#0C5E3F}
.y-n.kx>svg{width:50px;height:50px}
.y-n:active{transform:translate(-50%,calc(-50% + 3px))}
@media (prefers-reduced-motion:no-preference){.y-n.hz{animation:yp 1.8s ease-in-out infinite}}
@keyframes yp{50%{box-shadow:0 0 0 5px #fff,0 0 0 19px rgba(224,185,90,.22),0 0 36px rgba(224,185,90,.7)}}
.y-lb.kt.L{left:calc(29% + 72px)}
.y-lb.kt.R{right:calc(29% + 72px)}
.y-lb .hk{font-size:11px;font-weight:800;letter-spacing:.08em;color:color-mix(in srgb,var(--br,var(--ac)) 72%,#000)}

.y-lb{position:absolute;z-index:2;transform:translateY(-50%);max-width:calc(71% - 74px);box-sizing:border-box;padding:6px 12px 7px;border-radius:14px;background:var(--cd);color:var(--tx);box-shadow:0 2px 6px rgba(0,0,0,.22);display:flex;flex-direction:column;gap:2px;font-size:14px;border:0;text-align:left}
.y-lb.L{left:calc(29% + 58px)}
.y-lb.R{right:calc(29% + 58px);align-items:flex-end;text-align:right}
.y-lb b{font-weight:700;line-height:1.25}
.y-lb .s{display:flex;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums}
.y-lb .s svg{width:13px;height:13px}
.y-lb .s span{margin-right:4px}
.y-lb .m{font-size:13px;color:var(--mu)}
.y-lb.kt{padding:10px 12px 12px;border-radius:16px;gap:1px;min-width:156px;align-items:stretch;text-align:left;box-shadow:0 4px 12px rgba(0,0,0,.28)}
.y-lb.kt b{font-size:15px}
.y-lb.kt .ar{font-size:19px;line-height:1.45;color:var(--mu);text-align:left}
.y-bsh{height:44px;margin-top:6px;border-radius:12px;border:0;background:var(--y-tl);box-shadow:inset 0 -3px 0 rgba(0,0,0,.16);color:#2B1D00;font-size:16px;font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}
.y-bsh svg{width:16px;height:16px;flex-shrink:0}
button.y-bsh[data-sr]{font-size:14.5px;gap:6px;padding:0 8px;white-space:nowrap}

/* пастки тугмалар */
@media (max-width:350px){.y-bk b{font-size:21px}.y-bk .uz{font-size:12.5px}.y-bk .tx{max-width:66%}.y-bki{max-width:46%}.y-lb{font-size:13px}.y-b{font-size:16px}.y-md{width:66px;height:66px}}

/* пастдан чиқадиган ойна */
.y-sh{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.y-sh[hidden]{display:none}
.y-sb{position:relative;width:100%;max-width:560px;background:var(--bg);border-radius:26px 26px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));box-sizing:border-box;max-height:86vh;overflow:auto;overscroll-behavior:contain;box-shadow:0 -6px 24px rgba(0,0,0,.25)}
.y-sb .gr{width:44px;height:5px;border-radius:3px;background:var(--bd);margin:0 auto 10px}
.y-x{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;border:0;background:var(--tint);color:var(--mu);display:flex;align-items:center;justify-content:center}
.y-x svg{width:18px;height:18px}
.y-sb h2{font-size:20px;line-height:1.3;margin:0 0 2px}
.y-sb>h2{margin:6px 48px 10px 0;min-height:30px}
.y-sb .ar.t{display:block;font-size:24px;line-height:1.7;text-align:left}
.y-sb p{margin:8px 0 14px;color:var(--mu);font-size:14.5px;line-height:1.45}
/* ойна боши: дарс белгиси, ҳолати, номи */
.y-vh{display:flex;align-items:center;gap:14px;margin:2px 44px 10px 0}
.y-vh .m{min-width:0}
.y-vh small{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ac)}
.y-md{position:relative;width:76px;height:76px;flex-shrink:0;box-sizing:border-box;border-radius:50%;border:3px solid var(--y-tl);background:#FFFDF6;box-shadow:0 4px 0 rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;color:#0C5E3F;font-size:24px;font-weight:700}
.y-md .ic{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center}
.y-md .ic svg{width:66%;height:66%}
.y-md.ex{width:68px;height:77px;border:0;border-radius:0;background:none;box-shadow:none}
.y-md.ex>svg{width:68px;height:77px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.16))}
.y-md.kx{border:4px solid #0C5E3F;background:#E9C469}
.y-md.kx>svg{width:38px;height:38px}
.y-hl{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:700;letter-spacing:0;background:rgba(201,148,52,.2);color:var(--au)}
.y-hl svg{width:12px;height:12px}
.y-hl.qf{background:var(--bd);color:var(--mu)}
.y-hl.ok{background:var(--y-okb);color:var(--y-ok)}
/* ⓘ — oynada uzun izoh yo'q: qisqa qator, batafsili shu belgi bosilganda (13.11.2026, foydalanuvchi qarori) */
.y-ib{position:relative;width:30px;height:30px;margin:-5px 0 -5px 2px;padding:0;border:0;border-radius:50%;background:none;color:var(--mu);display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.y-ib::after{content:"";position:absolute;inset:-7px}
.y-ib svg{width:20px;height:20px}
.y-ib[aria-expanded="true"]{color:var(--ac);background:var(--tint)}
/* holat yorlig'ining o'zi ⓘ tugmasi bo'ladi (tor ekranda alohida belgi keyingi qatorga tushib qolmasin) */
.y-hb{position:relative;border:0;font-family:inherit;cursor:pointer}
.y-hb::after{content:"";position:absolute;inset:-11px -6px}
.y-hb svg:last-child{width:15px;height:15px;margin-left:1px}
.y-hb[aria-expanded="true"]{box-shadow:0 0 0 2px var(--ac)}
.y-id{margin:0 0 12px;padding:10px 12px;border-radius:12px;background:var(--tint);font-size:14px;line-height:1.5;color:var(--tx)}
/* тугмалар: ҳажмли (пастки қирраси бор), босилганда чўкади */
.y-b{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;padding:7px 16px 11px;box-sizing:border-box;border-radius:16px;border:1.5px solid var(--bd);background:var(--cd);box-shadow:inset 0 -4px 0 var(--bd);font-size:17px;font-weight:700;line-height:1.2;text-decoration:none;color:var(--tx);text-align:center;transition:transform .06s,box-shadow .06s}
.y-b svg{width:20px;height:20px;flex-shrink:0;color:var(--ac)}
.y-b .t{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.y-b small{font-size:13px;font-weight:500;color:var(--mu)}
.y-b1{background:var(--ac);border-color:transparent;color:var(--y-act);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.y-b1 svg{color:inherit}
.y-b1 small{color:inherit;opacity:.85}
.y-b:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--bd)}
.y-b1:active{box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.y-sb .y-b+.y-b{margin-top:10px}
.y-ns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 12px;text-align:center}
.y-ns>div{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px 6px}
.y-ns b{display:block;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
.y-ns span{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--mu);text-transform:uppercase}
.y-ns .st{display:flex;justify-content:center;gap:2px;margin-top:3px}
.y-ns .st svg{width:14px;height:14px}
@media (prefers-reduced-motion:no-preference){.y-sb{animation:yin .2s ease-out}}
@keyframes yin{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
/* китоб танлаш ойнаси (14.11, фойдаланувчи: «Бош саҳифа» босилса китоб танлаш сирғалиб чиқсин) */
@media (prefers-reduced-motion:no-preference){
  .y-sh.kt{animation:yko .3s ease-out}
  .y-sh.kt .y-sb{animation:ykc .42s cubic-bezier(.2,.9,.25,1.05)}
  .y-sh.kt .y-kc,.y-sh.kt .y-ks{animation:ykr .46s cubic-bezier(.2,.9,.25,1.05) both;animation-delay:calc(var(--i,0) * 70ms + 110ms)}
  .y-sh.kt.ket{animation:ykx .24s ease-in forwards}
  .y-sh.kt.ket .y-sb{animation:ykd .24s ease-in forwards}}
@keyframes yko{from{background:rgba(0,0,0,0)}}
@keyframes ykx{to{background:rgba(0,0,0,0)}}
@keyframes ykc{from{transform:translateY(100%)}to{transform:none}}
@keyframes ykd{to{transform:translateY(100%)}}
@keyframes ykr{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.y-kc{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:96px;box-sizing:border-box;margin-top:10px;padding:14px 16px;border:0;border-radius:20px;overflow:hidden;color:#fff;text-align:left;background:linear-gradient(135deg,var(--kr),var(--kh));box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 6px 16px rgba(0,0,0,.18)}
.y-kc:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 3px 10px rgba(0,0,0,.18)}
.y-kc.on{outline:3px solid #E0B95A;outline-offset:2px}
.y-kc .kb{flex-shrink:0;width:56px;height:64px;border-radius:8px 14px 14px 8px;background:rgba(255,255,255,.2);border-left:5px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
.y-kc .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;position:relative;z-index:1}
.y-kc .t b{font-size:20px;line-height:1.25}
.y-kc .t .ar{font-size:20px;line-height:1.5;opacity:.9;text-align:left}
.y-kc em{position:relative;z-index:1;flex-shrink:0;font-style:normal;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.22);display:flex;align-items:center;gap:4px}
.y-kc em svg{width:15px;height:15px}

.y-ks{margin-top:18px}

    tek = aniq.concat(tek);                              /* «аниқ биламан» deb o'zi belgilagan, hali sinalmagan so'zlar tekshiruvda birinchi */
    if (t !== 'b') return bil.concat(tek, qol).slice(0, SON.lugK);
    if (!sar) return tek.concat(qol).slice(0, SON.lug);
    return bil.concat(tek.concat(qol).slice(0, SON.tek));
  }
  function taqsim(t, dars) {                           /* [lug'at savollari, so'z oxiri savollari] soni */
    var nq = 0;
    dars.forEach(function (d) { nq += (Q[d.n] || []).length; });
    return [lugTanla(t, dars).length, Math.min(t === 'b' ? SON.bob : SON.kitob, nq)];
  }
  function savolSoni(t, kalit) { var a = taqsim(t, darslari(t, kalit)); return a[0] + a[1]; }
  function navbat(hov, son) {
    var out = [], i = 0, bor = true;
    while (out.length < son && bor) {
      bor = false;
      hov.forEach(function (a) { if (out.length < son && a.length > i) { out.push(a[i]); bor = true; } });
      i++;
    }
    return out;
  }
  function savollar(t, kalit) {
    var dars = darslari(t, kalit);
    return navbat(dars.map(function (d) { return aralash((Q[d.n] || []).slice()); }), t === 'b' ? SON.bob : SON.kitob)
      .concat(lugTanla(t, dars).map(function (r) { return lugSavol(r, dars); }));
  }

  /* ---- lug'at savoli: 'a' arabcha → ma'no, 'u' ma'no → arabcha, 'o' ovoz → ma'no (ovozi bor so'zda); 4 variant ---- */
  function mano(r) { var u = r.uz[0] || ''; return (u.match(/(^|[\s;,])\d+\./g) || []).length > 1 ? u : u.replace(/^\d+\.\s*/, ''); }   /* bitta ma'noli yozuvda tartib raqami («1.») ko'rsatilmaydi */
  /* ko'pligi va muannasi (faqat lug'atda yozilgani): ro'yxatlarda va javobdan keyin ko'rsatiladi; savolning o'zida va variantlarda — yo'q */
  function shakllar(r) {
    var p = [];
    if (r.jam && r.jam.length) p.push('жам <bdi class="ar" lang="ar">' + esc(r.jam.join('، ')) + '</bdi>');
    if (r.mn) p.push('муаннас <bdi class="ar" lang="ar">' + esc(r.mn) + '</bdi>');
    return p.join(' · ');
  }
  function yalang(x) { return plain(x).replace(/[.\sـ؟?]/g, ''); }
  function sof(x) { return x.replace(/\((мз|мн)\)/g, '').replace(/\s+/g, ' ').trim().toLowerCase(); }
  /* chalg'ituvchi variant bo'la olmaydi: o'sha so'z, uning muzakkar/muannas jufti yoki ma'nosi bir xil so'z */
  function oxshash(a, b) {
    return a.id === b.id || yalang(a.ar) === yalang(b.ar) || (a.asl || a.id) === (b.asl || b.id) || (a.mn && a.mn === b.ar) || (b.mn && b.mn === a.ar) || sof(mano(a)) === sof(mano(b));
  }
  function lugSavol(r, dars) {
    var turlar = r.au && LV[r.d] ? ['a', 'a', 'u', 'u', 'o'] : ['a', 'u'], hov = [], kit = 0, i;
    function qosh(ro, turi) {
      aralash(ro.slice()).forEach(function (x) {
        if (hov.length < 3 && (!turi || x.tur === r.tur) && !oxshash(x, r) && !hov.some(function (y) { return oxshash(x, y); })) hov.push(x);
      });
    }
    /* avval shu dars, keyin shu imtihon darslari, keyin shu kitob; turi bir xil (fe'l — fe'l bilan); yetmasa — har qanday so'z */
    var hd = [], hk = [];
    D.forEach(function (d) { if (d.n === r.d) kit = d.kitob; });
    dars.forEach(function (d) { hd = hd.concat(LG[d.n] || []); });
    D.forEach(function (d) { if (d.kitob === kit) hk = hk.concat(LG[d.n] || []); });
    qosh(LG[r.d] || [], 1); qosh(hd, 1); qosh(hk, 1); qosh(hk, 0);
    return { lug: 1, id: r.id, d: r.d, r: r, tur: turlar[Math.floor(Math.random() * turlar.length)], ops: aralash([r].concat(hov)) };
  }
  /* lug'at yo'lagidagi so'z ovozi (bo'lak); yuklanmasa — xato() */
  function toxta() { if (auT) { clearInterval(auT); auT = null; } try { au.pause(); } catch (e) {} }
  function ovoz(a, xato) {
    toxta();
    var bosh = Math.max(0, a.s - 0.08), oxir = a.e + 0.15;
    function go() {
      try { au.currentTime = bosh; } catch (x) {}
      var p = au.play(); if (p && p.catch) p.catch(function () {});
      auT = setInterval(function () { if (au.currentTime >= oxir || au.ended) toxta(); }, 30);
    }
    au.onerror = function () { auF = ''; if (xato) xato(); };
    if (auF !== a.f) { auF = a.f; au.src = a.f; au.load(); au.addEventListener('loadedmetadata', go, { once: true }); }
    else go();
  }

  /* sozlamalar → «Товуш ва тебраниш»: to'g'ri va xato javobda qisqa tovush + tebranish */
  var AC = null;
  function sado(ok) {
    if (SZ.tovush === false) return;
    try {
      var hp = window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback;
      if (hp && hp.notificationOccurred) hp.notificationOccurred(ok ? 'success' : 'error'); else if (navigator.vibrate) navigator.vibrate(ok ? 20 : [30, 40, 30]);
    } catch (e) {}
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime, u = ok ? 0.18 : 0.3;
      o.type = 'sine'; o.frequency.value = ok ? 880 : 220;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.1, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + u);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + u + 0.02);
    } catch (e) {}
  }

  /* ---- imtihon ---- */
  var IM = null, tmq = null;
  function imtihon(id) {
    var t = id[0], kalit = id.slice(1);
    if (((t === 'b' ? P.b : P.k)[kalit] || {}).tez) return;   /* ruscha rejim: «Тез орада» */
    IM = { id: id, t: t, kalit: kalit, s: aralash(savollar(t, kalit)), i: 0, n: 0, tog: 0, xato: [], t0: 0 };   /* n, tog — birinchi urinishlar; qayta so'ralgan so'z hisobga kirmaydi */
    document.body.classList.add('y-ses');
    savol();
  }
  function tugma(h) { bar.innerHTML = '<div>' + h + '</div>'; bar.hidden = false; }
  function qator(ws, ti, hk, ochiq) {
    return ws.map(function (w, j) {
      var c = j === ti ? 't' : (j === hk ? 'hk' : '');
      return '<span' + (c ? ' class="' + c + '"' : '') + '>' + esc(j === ti && ochiq ? w[0] : plain(w[0])) + '</span>' + esc(w[1].replace('?', '؟'));
    }).join(' ');
  }
  function imNom() { return IM.t === 'b' ? bobTop(IM.kalit).raq + '-боб имтиҳони' : IM.kalit + '-китоб имтиҳони'; }
  function imBosh() {
    return '<div class="y-st"><button id="yx" aria-label="Ёпиш">✕</button><div class="y-pr"><i style="width:' + Math.round(IM.i * 100 / IM.s.length) + '%"></i></div><span>' + (IM.i + 1) + ' / ' + IM.s.length + '</span></div>';
  }
  function imYop() { document.getElementById('yx').onclick = function () { if (confirm('Имтиҳон тўхтатилсинми? Натижа сақланмайди.')) { toxta(); IM = null; xarita(); } }; }
  function imJavob(ok, q) {
    if (q.lug) {                                       /* lug'at javobi bazaga: jurnal (takror hisobi) + xato so'z «bilmayman»ga; xato so'z oxirida qayta so'raladi — to'g'ri topilmaguncha */
      jurnalQosh([['w' + q.id + q.tur, hozir(), ok ? 3 : 1, Math.max(0, Math.min(60000, Date.now() - IM.t0))]]);
      if (!ok) {
        if (!W.b[q.id]) { W.b[q.id] = 1; delete W.k[q.id]; delete W.a[q.id]; wYoz(); }   /* «аниқ биламан» edi — xato topildi: «билмайман»ga */
        IM.s.push({ lug: 1, id: q.id, d: q.d, r: q.r, tur: q.tur === 'u' ? 'u' : 'a', ops: aralash(q.ops.slice()), qayta: 1 });
      }
    }
    if (!q.qayta) { IM.n++; if (ok) IM.tog++; else IM.xato.push(q); }
    sado(ok);
    IM.i++;
    tugma('<button class="y-b y-b1" id="kn">' + (IM.i >= IM.s.length ? 'Натижа' : 'Кейинги') + '</button>');
    document.getElementById('kn').onclick = savol;
    if (ok) tmq = setTimeout(savol, 1000);
  }
  function lugChiz(q) {
    var r = q.r, tur = q.tur, bajarildi = false;
    app.innerHTML = '<div class="y-in">' + imBosh() + '<section class="y-c y-k"><div class="y-l"><span>' + imNom() + '</span><em>' + r.d + '-дарс · луғат' + (q.qayta ? ' · қайта' : '') + '</em></div>' +
      (tur === 'a' ? '<div class="y-g ar y-sz" lang="ar">' + esc(r.ar) + '</div><div class="y-tr">Маъносини топинг</div>'
        : tur === 'u' ? '<div class="y-mn">' + esc(mano(r)) + '</div><div class="y-tr">Арабчасини топинг</div>'
        : '<button class="y-ov" id="pl" aria-label="Қайта тинглаш">' + IC.ovoz + '</button><div class="y-tr">Эшитинг ва маъносини топинг</div>') +
      '<div class="y-o">' + q.ops.map(function (o, n) { return '<button data-n="' + n + '">' + (tur === 'u' ? '<b class="ar" lang="ar">' + esc(o.ar) + '</b>' : '<span class="uz">' + esc(mano(o)) + '</span>') + '</button>'; }).join('') +
      '</div><div class="y-s" id="qs" aria-live="polite"></div></section></div>';
    bar.hidden = true; bar.innerHTML = ''; IM.t0 = Date.now();
    imYop();
    if (tur === 'o') {
      var a = { f: LV[r.d], s: r.au[0], e: r.au[1] }, xato = function () { if (!bajarildi) { q.tur = 'a'; lugChiz(q); } };   /* ovoz yuklanmasa — so'zning o'zi ko'rsatiladi */
      document.getElementById('pl').onclick = function () { ovoz(a, xato); };
      ovoz(a, xato);
    }
    [].forEach.call(app.querySelectorAll('.y-o button'), function (b) {
      b.onclick = function () {
        if (bajarildi) return;
        bajarildi = true;
        var n = +b.getAttribute('data-n'), ok = q.ops[n].id === r.id;
        [].forEach.call(app.querySelectorAll('.y-o button'), function (y) {
          var m = +y.getAttribute('data-n');
          if (q.ops[m].id === r.id) y.classList.add('ok'); else if (m === n) y.classList.add('no');
          y.disabled = true;
        });
        document.getElementById('qs').innerHTML = '<bdi class="ar y-ai" lang="ar">' + esc(r.ar) + '</bdi> — ' + esc(mano(r)) + (shakllar(r) ? '<small>' + shakllar(r) + '</small>' : '');
        imJavob(ok, q);
      };
    });
    window.scrollTo(0, 0);
  }
  function savol() {
    clearTimeout(tmq); toxta();
    if (IM.i >= IM.s.length) { natija(); return; }
    if (IM.s[IM.i].lug) { lugChiz(IM.s[IM.i]); return; }
    var q = IM.s[IM.i], ql = +q.k.split('-')[0], togri = q.gap[q.w][0], ops = aralash(q['var'].slice()), bajarildi = false;
    function chiz(ochiq) {
      var hk = q.hk || [-1, -1], h = '';
      if (q.oldgap) h += '<div class="y-g og ar" lang="ar">' + qator(q.oldgap, -1, ochiq ? hk[1] : -1, false) + '</div>';
      h += '<div class="y-g ar" lang="ar">' + qator(q.gap, q.w, ochiq && hk[0] === ql && hk[1] !== q.w ? hk[1] : -1, ochiq) + '</div>';
      return h;
    }
    app.innerHTML = '<div class="y-in">' + imBosh() +
      '<section class="y-c y-k"><div class="y-l"><span>' + imNom() + '</span><em>' + q.d + '-дарс</em></div>' +
      '<div id="qg">' + chiz(false) + '</div>' + (q.tr ? '<div class="y-tr">' + esc(q.tr) + '</div>' : '') +
      '<div class="y-o">' + ops.map(function (o, n) { return '<button data-n="' + n + '"><b class="ar" lang="ar">' + esc(o[0]) + '</b><span>' + esc(o[2]) + '</span></button>'; }).join('') +
      '</div><div class="y-s" id="qs" aria-live="polite"></div></section></div>';
    bar.hidden = true; bar.innerHTML = '';
    imYop();
    [].forEach.call(app.querySelectorAll('.y-o button'), function (b) {
      b.onclick = function () {
        if (bajarildi) return;
        bajarildi = true;
        var n = +b.getAttribute('data-n'), ok = ops[n][0] === togri;
        [].forEach.call(app.querySelectorAll('.y-o button'), function (y) {
          var m = +y.getAttribute('data-n');
          if (ops[m][0] === togri) y.classList.add('ok'); else if (m === n) y.classList.add('no');
          y.disabled = true;
        });
        document.getElementById('qg').innerHTML = chiz(true);
        if (q.sabab) document.getElementById('qs').innerHTML = mix(q.sabab);
        imJavob(ok, q);
      };
    });
    window.scrollTo(0, 0);
  }
  function natija() {
    var p = Math.round(IM.tog * 100 / IM.n), ok = p >= OTISH, lug = false, kl = IM.t + IM.kalit, r = R.e[kl] || {}, keyin = '';
    R.e[kl] = { b: Math.max(r.b || 0, p), s: p, t: Date.now() };
    yoz();
    xatoQosh(IM.xato.filter(function (q) { return !q.lug; }).map(function (q) { return q.id; }));
    if (ok) {
      /* imtihon orqali o'tilgan, hali saralanmagan darslar: so'zlari «bilaman deb aytilgan» bo'lib bazaga kiradi — «Такрорлаш»da tekshiriladi */
      var oz = false;
      darslari(IM.t, IM.kalit).forEach(function (d) {
        if (W.s[d.n] || !(LG[d.n] || []).length) return;
        LG[d.n].forEach(function (x) { if (!W.b[x.id] && !W.a[x.id]) W.k[x.id] = 1; });
        W.s[d.n] = Date.now(); oz = true;
      });
      if (oz) wYoz();
      keyin = IM.t === 'b' ? 'Кейинги боб очилди.' : 'Кейинги китоб очилди.';
    }
    var h = '<div class="y-in"><div class="y-top"><button id="yq" aria-label="Йўлга қайтиш">‹</button><div><small>' + (IM.t === 'b' ? bobTop(IM.kalit).raq + '-боб' : IM.kalit + '-китоб') + '</small><h1>Натижа</h1></div></div>';
    h += '<section class="y-c y-nt ' + (ok ? 'ok' : 'no') + '"><div class="bg">' + p + '%</div><h2>' + (ok ? 'Ўтдингиз' : 'Ҳали ўтмадингиз') + '</h2><p>' + IM.tog + ' / ' + IM.n + ' тўғри · ўтиш — ' + OTISH + '%</p>' +
      (keyin ? '<p>' + keyin + '</p>' : '') + '</section>';
    if (IM.xato.length) {
      h += '<section class="y-c"><div class="y-h">Хато қилинган сўзлар · «Луғат»га қўшилди</div>';
      IM.xato.forEach(function (q) {
        h += '<div class="y-xt"><span>' + (q.lug ? esc(mano(q.r)) + (shakllar(q.r) ? '<small>' + shakllar(q.r) + '</small>' : '') : mix(q.sabab || '')) + '</span><b class="ar" lang="ar">' + esc(q.lug ? q.r.ar : q.gap[q.w][0]) + '</b></div>';
      });
      h += '</section>';
    }
    app.innerHTML = h + '</div>';
    tugma(ok ? '<button class="y-b y-b1" id="yq2">Йўлга қайтиш</button>' : '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="y-b" id="yq2">Йўлга қайтиш</button><button class="y-b y-b1" id="qt">Қайта топшириш</button></div>');
    var id = IM.id;
    document.getElementById('yq').onclick = function () { IM = null; xarita(true); };
    document.getElementById('yq2').onclick = function () { IM = null; xarita(true); };
    var qt = document.getElementById('qt'); if (qt) qt.onclick = function () { imtihon(id); };
    window.scrollTo(0, 0);
  }

  /* dars yoki sozlamalardan qaytganda natija va sozlamani qayta o'qish */
  window.addEventListener('pageshow', function (e) { if (e.persisted && D && !IM) { sozOl(); yigish(); xarita(); } });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && D && !IM && sh.hidden) { sozOl(); yigish(); xarita(); } });

  yukla();
})();
</script>
