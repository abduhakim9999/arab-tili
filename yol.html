<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Йўл</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c5e3f">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="shell.css">
<script>
/* Sinov nusxasi (sinov-yol.html): natija alohida kalitda (asosiy natijaga tegmaydi); ma'lumot va rasmlar asosiy `data/`, `fon/` dan. */
var SN = /\/sinov-[^\/]*$/.test(location.pathname) ? 'sinov-' : '';
/* ko'rinish (sozlamalar): yorug' / tungi */
try { var _k = JSON.parse(localStorage.getItem('sozlama') || '{}').kor; if (_k === 'yorug' || _k === 'tungi') document.documentElement.setAttribute('data-theme', _k === 'tungi' ? 'dark' : 'light'); } catch (e) {}
document.write('<script src="tg.js" data-key="' + (SN ? 'yol-sinov' : 'yol') + '" data-home=""><\/script>' + (SN ? '' : '<script src="baza.js"><\/script>') + '<script src="' + SN + 'qobiq.js"><\/script>');
</script>
<style>
@font-face{font-family:"DarsNaskh";src:url(naskh.woff)}
:root{--y-ok:#17794a;--y-okb:rgba(23,121,74,.12);--y-no:#b3261e;--y-nob:rgba(179,38,30,.10);--y-act:#fff;--y-tl:#c99434;--y-hd:#0c5e3f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--y-ok:#7ad9a8;--y-okb:rgba(122,217,168,.16);--y-no:#ff9b91;--y-nob:rgba(255,155,145,.14);--y-act:#06281d;--y-hd:#083626}}
:root[data-theme="dark"]{--y-ok:#7ad9a8;--y-okb:rgba(122,217,168,.16);--y-no:#ff9b91;--y-nob:rgba(255,155,145,.14);--y-act:#06281d;--y-hd:#083626}
body{margin:0;background-color:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.y-w{max-width:560px;margin:0 auto;min-height:100vh;box-sizing:border-box}
.y-in{padding:12px 16px 56px}
body.y-ses .y-in{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
body.y-ses .y-cta{display:none}
.ar{font-family:"DarsNaskh","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;font-weight:400}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--y-tl);outline-offset:2px}

/* тепа тасма */
.y-hd{background:var(--y-hd);color:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 2px}
.y-hr{display:flex;align-items:center;gap:8px;height:48px}
.y-hr h1{margin:0;font-size:24px;line-height:1;font-weight:700}
.y-pg{background:rgba(255,255,255,.14);color:#fff;border:0;display:flex;align-items:center}
.y-sn{display:flex;align-items:center;gap:8px;margin:8px 0 0;padding:4px 4px 4px 12px;border:1px dashed rgba(255,255,255,.4);border-radius:12px;font-size:13.5px}
.y-sn span{flex:1}
.y-sn button{height:36px;padding:0 12px;border-radius:10px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:13.5px;font-weight:600}


/* боб картаси (рўйхатда) */
.y-bk{position:relative;z-index:3;height:132px;margin:0 16px;background:var(--cd);color:var(--tx);border:1.5px solid rgba(224,185,90,.9);border-radius:20px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.y-bk .tx{position:relative;z-index:1;width:206px;max-width:62%;height:100%;box-sizing:border-box;padding:12px 0 14px 16px;display:flex;flex-direction:column;gap:1px}
.y-bk small{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ac);display:flex;align-items:center;gap:3px}
.y-bk small svg{width:14px;height:14px}
.y-bk{cursor:pointer;-webkit-tap-highlight-color:transparent}
.y-bk:active{transform:scale(.985)}
.y-bk b{font-size:24px;line-height:1.55;text-align:left;white-space:nowrap}
.y-bk .uz{font-size:14px;color:var(--mu);white-space:nowrap;text-shadow:0 0 5px var(--cd),0 0 5px var(--cd),0 0 8px var(--cd)}
.y-sg{margin-top:auto;display:flex;gap:4px;max-width:150px}
.y-sg i{flex:1;max-width:24px;height:6px;border-radius:3px;background:var(--bd)}
.y-sg i.o{background:var(--y-ok)}
.y-sg i.h{background:var(--y-tl)}
.y-bki{position:absolute;right:0;top:0;width:196px;max-width:58%;height:100%;object-fit:cover;object-position:46% 50%;-webkit-mask-image:linear-gradient(to right,transparent,#000 36%);mask-image:linear-gradient(to right,transparent,#000 36%)}
.y-bk{border-color:var(--br,rgba(224,185,90,.9))}
.y-bk small{color:color-mix(in srgb,var(--br,var(--ac)) 72%,#000)}
.y-sg i.o{background:var(--br,var(--y-ok))}




/* пастки тугмалар */
@media (max-width:350px){.y-bk b{font-size:21px}.y-bk .uz{font-size:12.5px}.y-bk .tx{max-width:66%}.y-bki{max-width:46%}.y-b{font-size:16px}.y-md{width:66px;height:66px}}

/* пастдан чиқадиган ойна */
.y-sh{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.y-sh[hidden]{display:none}
.y-sb{position:relative;width:100%;max-width:560px;background:var(--bg);border-radius:26px 26px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));box-sizing:border-box;max-height:86vh;overflow:auto;overscroll-behavior:contain;box-shadow:0 -6px 24px rgba(0,0,0,.25)}
.y-sb .gr{width:44px;height:5px;border-radius:3px;background:var(--bd);margin:0 auto 10px}
.y-x{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;border:0;background:var(--tint);color:var(--mu);display:flex;align-items:center;justify-content:center}
.y-x svg{width:18px;height:18px}
.y-sb h2{font-size:20px;line-height:1.3;margin:0 0 2px}
.y-sb>h2{margin:6px 48px 10px 0;min-height:30px}
.y-sb .ar.t{display:block;font-size:24px;line-height:1.7;text-align:left}
.y-sb p{margin:8px 0 14px;color:var(--mu);font-size:14.5px;line-height:1.45}
/* ойна боши: дарс белгиси, ҳолати, номи */
.y-vh{display:flex;align-items:center;gap:14px;margin:2px 44px 10px 0}
.y-vh .m{min-width:0}
.y-vh small{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ac)}
.y-md{position:relative;width:76px;height:76px;flex-shrink:0;box-sizing:border-box;border-radius:50%;border:3px solid var(--y-tl);background:#FFFDF6;box-shadow:0 4px 0 rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;color:#0C5E3F;font-size:24px;font-weight:700}
.y-md .ic{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center}
.y-md .ic svg{width:66%;height:66%}
.y-md.ex{width:68px;height:77px;border:0;border-radius:0;background:none;box-shadow:none}
.y-md.ex>svg{width:68px;height:77px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.16))}
.y-md.kx{border:4px solid #0C5E3F;background:#E9C469}
.y-md.kx>svg{width:38px;height:38px}
.y-hl{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:700;letter-spacing:0;background:rgba(201,148,52,.2);color:var(--au)}
.y-hl svg{width:12px;height:12px}
.y-hl.qf{background:var(--bd);color:var(--mu)}
.y-hl.ok{background:var(--y-okb);color:var(--y-ok)}
/* ⓘ — oynada uzun izoh yo'q: qisqa qator, batafsili shu belgi bosilganda (13.11.2026, foydalanuvchi qarori) */
.y-ib{position:relative;width:30px;height:30px;margin:-5px 0 -5px 2px;padding:0;border:0;border-radius:50%;background:none;color:var(--mu);display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.y-ib::after{content:"";position:absolute;inset:-7px}
.y-ib svg{width:20px;height:20px}
.y-ib[aria-expanded="true"]{color:var(--ac);background:var(--tint)}
/* holat yorlig'ining o'zi ⓘ tugmasi bo'ladi (tor ekranda alohida belgi keyingi qatorga tushib qolmasin) */
.y-hb{position:relative;border:0;font-family:inherit;cursor:pointer}
.y-hb::after{content:"";position:absolute;inset:-11px -6px}
.y-hb svg:last-child{width:15px;height:15px;margin-left:1px}
.y-hb[aria-expanded="true"]{box-shadow:0 0 0 2px var(--ac)}
.y-id{margin:0 0 12px;padding:10px 12px;border-radius:12px;background:var(--tint);font-size:14px;line-height:1.5;color:var(--tx)}
/* тугмалар: ҳажмли (пастки қирраси бор), босилганда чўкади */
.y-b{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;padding:7px 16px 11px;box-sizing:border-box;border-radius:16px;border:1.5px solid var(--bd);background:var(--cd);box-shadow:inset 0 -4px 0 var(--bd);font-size:17px;font-weight:700;line-height:1.2;text-decoration:none;color:var(--tx);text-align:center;transition:transform .06s,box-shadow .06s}
.y-b svg{width:20px;height:20px;flex-shrink:0;color:var(--ac)}
.y-b .t{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.y-b small{font-size:13px;font-weight:500;color:var(--mu)}
.y-b1{background:var(--ac);border-color:transparent;color:var(--y-act);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.y-b1 svg{color:inherit}
.y-b1 small{color:inherit;opacity:.85}
.y-b:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 var(--bd)}
.y-b1:active{box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.y-sb .y-b+.y-b{margin-top:10px}
.y-ns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 12px;text-align:center}
.y-ns>div{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px 6px}
.y-ns b{display:block;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
.y-ns span{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--mu);text-transform:uppercase}
.y-ns .st{display:flex;justify-content:center;gap:2px;margin-top:3px}
.y-ns .st svg{width:14px;height:14px}
@media (prefers-reduced-motion:no-preference){.y-sb{animation:yin .2s ease-out}}
@keyframes yin{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
/* китоб танлаш ойнаси (14.11, фойдаланувчи: «Бош саҳифа» босилса китоб танлаш сирғалиб чиқсин) */
@media (prefers-reduced-motion:no-preference){
  .y-sh.kt{animation:yko .3s ease-out}
  .y-sh.kt .y-sb{animation:ykc .42s cubic-bezier(.2,.9,.25,1.05)}
  .y-sh.kt .y-kc{animation:ykr .46s cubic-bezier(.2,.9,.25,1.05) both;animation-delay:calc(var(--i,0) * 70ms + 110ms)}
  .y-sh.kt.ket{animation:ykx .24s ease-in forwards}
  .y-sh.kt.ket .y-sb{animation:ykd .24s ease-in forwards}}
@keyframes yko{from{background:rgba(0,0,0,0)}}
@keyframes ykx{to{background:rgba(0,0,0,0)}}
@keyframes ykc{from{transform:translateY(100%)}to{transform:none}}
@keyframes ykd{to{transform:translateY(100%)}}
@keyframes ykr{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.y-kc{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:96px;box-sizing:border-box;margin-top:10px;padding:14px 16px;border:0;border-radius:20px;overflow:hidden;color:#fff;text-align:left;background:linear-gradient(135deg,var(--kr),var(--kh));box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 6px 16px rgba(0,0,0,.18)}
.y-kc:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 3px 10px rgba(0,0,0,.18)}
.y-kc.on{outline:3px solid #E0B95A;outline-offset:2px}
.y-kc .kb{flex-shrink:0;width:56px;height:64px;border-radius:8px 14px 14px 8px;background:rgba(255,255,255,.2);border-left:5px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
.y-kc .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;position:relative;z-index:1}
.y-kc .t b{font-size:20px;line-height:1.25}
.y-kc .t .ar{font-size:20px;line-height:1.5;opacity:.9;text-align:left}
.y-kc em{position:relative;z-index:1;flex-shrink:0;font-style:normal;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.22);display:flex;align-items:center;gap:4px}
.y-kc em svg{width:15px;height:15px}
.y-kc .nq{position:absolute;right:-26px;bottom:-34px;width:130px;height:130px;opacity:.13;pointer-events:none}

/* имтиҳон (такрорлаш саволи қолипи) */
.y-top{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.y-top button{width:44px;height:44px;border-radius:12px;background:var(--cd);border:1px solid var(--bd);font-size:24px;flex-shrink:0}
.y-top small{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ac);text-transform:uppercase}
.y-top h1{font-size:22px;line-height:1.25;margin:0}
.y-c{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:0 0 12px;box-shadow:var(--sh)}
.y-h{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mu);text-transform:uppercase;margin:0 0 6px}
.y-pr{height:6px;border-radius:3px;background:var(--tint);overflow:hidden}
.y-pr i{display:block;height:100%;border-radius:3px;background:var(--ac);transition:width .25s}
.y-st{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.y-st button{width:44px;height:44px;border-radius:12px;background:var(--cd);border:1px solid var(--bd);font-size:18px;flex-shrink:0}
.y-st .y-pr{flex:1}
.y-st span{min-width:44px;text-align:right;font-size:14px;font-weight:600;color:var(--mu);font-variant-numeric:tabular-nums}
.y-k{min-height:46vh;display:flex;flex-direction:column;padding-top:14px}
.y-l{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mu);text-transform:uppercase}
.y-l em{font-style:normal;letter-spacing:.04em;color:var(--ac);background:var(--tint);border-radius:6px;padding:1px 7px}
.y-g{font-size:30px;line-height:1.9;text-align:center;margin:14px 0 2px}
.y-g.og{font-size:22px;color:var(--mu);margin:10px 0 -8px}
.y-g .t{background:var(--tint);color:var(--ac);border-radius:8px;padding:0 6px}
.y-g .hk{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:10px;text-decoration-thickness:2px}
.y-tr{text-align:center;font-size:14.5px;color:var(--mu);margin:0 0 14px}
.y-o{display:grid;gap:8px}
.y-o button{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:4px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);text-align:left}
.y-o button b{font-weight:400;font-size:27px;line-height:1.7}
.y-o button span{font-size:14px;color:var(--mu)}
.y-o button.ok{border-color:var(--y-ok);background:var(--y-okb)}
.y-o button.ok span{color:var(--y-ok);font-weight:700}
.y-o button.no{border-color:var(--y-no);background:var(--y-nob)}
.y-o button.no span{color:var(--y-no);font-weight:700}
.y-s{margin-top:12px;font-size:15px;line-height:2}
/* сўзларни саралаш: билмаганларни белгилаш */
.y-sp{margin:0 0 12px;font-size:14.5px;line-height:1.45;color:var(--mu)}
.y-sl{display:grid;gap:8px}
.y-sr{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;box-sizing:border-box;padding:6px 12px 6px 14px;border-radius:14px;border:1.5px solid var(--bd);background:var(--cd);text-align:left}
.y-sr b{flex-shrink:0;max-width:48%;font-size:25px;line-height:1.6;font-weight:400}
.y-sr span{flex:1;min-width:0;font-size:14.5px;line-height:1.3;color:var(--mu)}
.y-sr small,.y-xt small{display:block;margin-top:1px;font-size:12.5px;color:var(--mu)}
.y-sr small .ar,.y-xt small .ar,.y-s small .ar{font-size:19px;line-height:1.5;color:var(--tx)}
.y-s small{display:block;font-size:13px;line-height:1.6;color:var(--mu)}
.y-sr i{width:30px;height:30px;flex-shrink:0;box-sizing:border-box;border-radius:50%;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;color:transparent}
.y-sr i svg{width:14px;height:14px}
.y-sr[aria-pressed="true"]{border-color:var(--y-no);background:var(--y-nob)}
.y-sr[aria-pressed="true"] span{color:var(--tx)}
.y-sr[aria-pressed="true"] i{border-color:var(--y-no);background:var(--y-no);color:var(--bg)}
.y-ns small{display:block;margin-top:3px;font-size:12px;color:var(--mu)}
/* луғат саволи: сўз, маъно ёки овоз */
.y-sz{font-size:40px;line-height:1.8;margin:18px 0 0}
.y-mn{font-size:22px;font-weight:700;line-height:1.35;text-align:center;margin:26px 0 8px}
.y-ov{display:flex;align-items:center;justify-content:center;width:88px;height:88px;margin:22px auto 10px;padding:0 0 4px;border-radius:50%;border:0;background:var(--ac);color:var(--y-act);box-shadow:inset 0 -5px 0 rgba(0,0,0,.22)}
.y-ov svg{width:38px;height:38px}
.y-ov:active{transform:translateY(2px)}
.y-o button .uz{font-size:16.5px;line-height:1.35;color:var(--tx);padding:8px 0;text-align:left}
.y-ai{font-size:1.5em;line-height:1}
.y-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.y-bar>div{max-width:528px;margin:0 auto;display:grid;gap:10px}
.y-bar>div>div .y-b{padding-left:8px;padding-right:8px;font-size:16px}
.y-nt{text-align:center;padding:24px 16px}
.y-nt .bg{font-size:54px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.y-nt.ok .bg{color:var(--y-ok)}
.y-nt.no .bg{color:var(--y-no)}
.y-nt h2{font-size:21px;margin:6px 0 2px}
.y-nt p{margin:0;color:var(--mu)}
.y-xt{display:flex;align-items:center;gap:10px;justify-content:space-between;border-top:1px solid var(--bd);padding:8px 0}
.y-xt .ar{font-size:24px;line-height:1.7}
.y-xt span{font-size:13.5px;color:var(--mu);text-align:left}
.y-er{text-align:center;padding:40px 16px;color:var(--mu)}
.y-er button{margin-top:14px}
/* ҚОБИҚ (13.11.2026): tepada qisqa hisob, qotib turadigan bob tasmasi, katta «Давом этиш», ro'yxat ko'rinishi */
/* боб тасмаси (13.11, фойдаланувчи: тасманинг ўзи босилади, ‹ › керак эмас) — босилса боблар рўйхати тасма остидан тушиб келади */
.y-bb{position:sticky;top:0;z-index:6;display:block;width:100%;box-sizing:border-box;border:0;margin:0;background:color-mix(in srgb,var(--bbr,var(--y-hd)) 72%,#000);transition:background .25s;color:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 11px;font:inherit;text-align:center;cursor:pointer}
.y-bb.st{box-shadow:0 4px 12px rgba(0,0,0,.3)}
.y-bb .m{max-width:536px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;transition:opacity .1s}
.y-bb:active .m{opacity:.75}
.y-bb small{font-size:11px;line-height:1.3;font-weight:700;letter-spacing:.08em;color:#f6dc94;white-space:nowrap}

          var m = +y.getAttribute('data-n'), t = tur === 'e' ? ops[m][0] === q.gap[q.w][0] : (po ? po[m] : m) === q.to;
          if (t) { y.classList.add('ok'); if (tur === 'x') y.textContent = q.gap[q.w][0]; } else if (m === n) y.classList.add('no');
          if (y.tagName === 'BUTTON') y.disabled = true;
        });
        if (tur === 'b') { var bl = app.querySelector('.y-g .t'); if (bl) bl.textContent = q.o[q.to]; }
        if (tur === 'e') document.getElementById('qg').innerHTML = (function () { var ql = +q.k.split('-')[0], hk = q.hk || [-1, -1];
          return (q.oldgap ? '<div class="y-g og ar" lang="ar">' + qator(q.oldgap, -1, hk[1], false) + '</div>' : '') +
            '<div class="y-g ar" lang="ar">' + qator(q.gap, q.w, hk[0] === ql && hk[1] !== q.w ? hk[1] : -1, true) + '</div>'; })();
        var z = q.sabab || q.iz || '';
        document.getElementById('qs').innerHTML = (ok ? '' : '<b class="no">Хато.</b> ') + mix(z);
        yakJavob(ok, k, q, javob, b);
      };
    });
    window.scrollTo(0, 0);
  }
  function yakJavob(ok, k, q, javob, el) {
    var birinchi = !IM.qy[IM.i];
    if (birinchi) {
      IM.n++; if (ok) IM.tog++; else IM.xato.push([k, javob]);
      var r = IM.dr[q.d] = IM.dr[q.d] || [0, 0]; r[0]++; if (ok) r[1]++;
    }
    try { if (window.Ball && birinchi) Ball.yoz('xd' + q.d + ':' + q.k, ok, Date.now() - IM.t0, el); } catch (e) {}
    if (IM.yak === 'x') { if (ok) yakTuzatildi(k, IM.kalit); else { IM.s.push(k); IM.qy[IM.s.length - 1] = 1; } }   /* xato — shu mashg'ulot oxirida yana */
    sado(ok);
    IM.i++;
    yakSaqla();
    tugma('<button class="y-b y-b1" id="kn">' + (IM.i >= IM.s.length ? 'Натижа' : 'Кейинги') + '</button>');
    document.getElementById('kn').onclick = yakSavol;
    if (ok) tmq = setTimeout(yakSavol, 1500);
  }
  function yakNatija() {
    var kl = IM.kalit, b = yakTop(kl), h;
    if (IM.yak === 'x') {
      var qol = yakXato(kl).length;
      h = '<div class="y-in"><div class="y-top"><button id="yq" aria-label="Йўлга қайтиш">‹</button><div><small>' + b.raq + (b.kitob ? '-китоб' : '-боб') + '</small><h1>Хатолар устида ишлаш</h1></div></div>' +
        '<section class="y-c y-nt ok"><div class="bg">' + IC.ok + '</div><h2>' + (qol ? 'Яна ' + qol + ' та хато қолди' : 'Ҳамма хатолар тузатилди') + '</h2><p>' +
        (qol ? 'Қолганларини ҳам тўғри топсангиз, имтиҳон очилади.' : '«' + yakNom(kl) + '» очиқ.') + '</p></section></div>';
      app.innerHTML = h;
      tugma('<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="y-b" id="yq2">Йўлга қайтиш</button><button class="y-b y-b1" id="yn">' +
        (qol ? 'Давом эттириш' : 'Имтиҳонни бошлаш') + '</button></div>');
      document.getElementById('yn').onclick = function () { yakBosh(kl, qol ? 'x' : 'y'); };
    } else {
      LS(KY + '-yak', null);
      var p = IM.n ? Math.round(IM.tog * 100 / IM.n) : 0, ok = p >= YAK;
      R.y = R.y || {}; var r = R.y[kl] || {}, avval = +r.b || 0;
      R.y[kl] = { b: Math.max(r.b || 0, p), s: p, t: Date.now() };
      R.xb = R.xb || {}; R.xb[kl] = ok ? [] : IM.xato.map(function (x) { return x[0]; });
      if (ok) {                                         /* imtihon hamma savolni qayta tekshirdi; kitob — boblar imtihonlari xatolarini ham */
        b.d.forEach(function (d) { if (R.xd && R.xd[d.n]) R.xd[d.n].x = []; });
        if (b.kitob) b.b.forEach(function (x) { if (R.xb[x.k]) R.xb[x.k] = []; });
      }
      yoz();
      h = '<div class="y-in"><div class="y-top"><button id="yq" aria-label="Йўлга қайтиш">‹</button><div><small>' + yakNom(kl) + '</small><h1>Натижа</h1></div></div>' +
        '<section class="y-c y-nt ' + (ok ? 'ok' : 'no') + '"><div class="bg">' + p + '%</div><h2>' + (ok ? 'Қабул қилинди' : 'Ҳали қабул қилинмади') + '</h2><p>' +
        IM.tog + ' / ' + IM.n + ' тўғри · қабул — ' + YAK + '%</p>' + (ok ? '<div class="st">' + yulduz(p) + '</div>' : '<p>Хатоларни тўғри топсангиз, имтиҳонни қайта топширасиз.</p>') + '</section>';
      var zaif = null, zp = 101;
      h += '<section class="y-c"><div class="y-h">Дарслар бўйича</div>';
      b.d.forEach(function (d) {
        var x = IM.dr[d.n]; if (!x) return;
        var pp = Math.round(x[1] * 100 / x[0]); if (pp < zp) { zp = pp; zaif = d; }
        h += '<div class="y-dr' + (pp < YAK ? ' zf' : '') + '"><span>' + d.n + '-дарс</span><i><b style="width:' + pp + '%"></b></i><span>' + x[1] + '/' + x[0] + '</span></div>';
      });
      if (zaif && zp < YAK) h += '<p class="y-sp">' + zaif.n + '-дарс заифроқ — <a href="' + sahifa(zaif) + '">Қайта ўтиш</a></p>';
      h += '</section>';
      if (IM.xato.length) {
        var m = qmap();   /* harakat savolida ham «t» bor (harakat kodi) — turi kalitdan: 's…' harakat, 't…' turli */
        h += '<section class="y-c"><div class="y-h">Хатолар (' + IM.xato.length + ')</div>';
        IM.xato.forEach(function (x) {
          var q = m[x[0]]; if (!q) return;
          var tu = x[0][0] === 't' ? q.t : '', tj = tu && tu !== 'x' ? q.o[q.to] : q.gap[q.w][0], ar = !tu || !!TAPT[tu] || (/[\u0600-\u06FF]/.test(tj) && !/[\u0400-\u04FF]/.test(tj));
          h += '<div class="y-yx"><em>' + q.d + '-дарс · ' + (tu ? TURN[tu] : 'Ҳаракати?') + '</em><div class="ar" lang="ar">' + qatorT(q.gap, q.w, null, true) + '</div>' +
            '<span class="no">Сиз: ' + (ar ? '<bdi class="ar" lang="ar">' + esc(x[1]) + '</bdi>' : mix(x[1])) + '</span> · <span class="ok">Тўғриси: ' + (ar ? '<bdi class="ar" lang="ar">' + esc(tj) + '</bdi>' : mix(tj)) + '</span>' +
            '<div class="iz">' + mix(q.sabab || q.iz || '') + '</div></div>';
        });
        h += '</section>';
      }
      app.innerHTML = h + '</div>';
      /* BALL (28.11.2026, foydalanuvchi: «Боб якуни» +200, «Китоб якуни» +500 — birinchi marta qabul bo'lganda; takror.js REY, server — api/_rey.js yakOt) */
      if (ok && avval < YAK && window.Ball && Ball.bonus) setTimeout(function () {
        try { Ball.bonus('xy' + kl, b.kitob ? 500 : 200, null, { i: b.kitob ? 'kitob' : 'bob', t: b.kitob ? '«Китоб якуни» қабул қилинди!' : '«Боб якуни» қабул қилинди!', s: p + '% тўғри' }); } catch (e) {}
      }, 450);
      tugma(ok ? '<button class="y-b y-b1" id="yq2">Йўлга қайтиш</button>' : '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="y-b" id="yq2">Йўлга қайтиш</button><button class="y-b y-b1" id="yn">Хатоларни тузатиш · ' + IM.xato.length + '</button></div>');
      var yn = document.getElementById('yn'); if (yn) yn.onclick = function () { yakBosh(kl, 'x'); };
    }
    document.getElementById('yq').onclick = function () { IM = null; xarita(true); };
    document.getElementById('yq2').onclick = function () { IM = null; xarita(true); };
    window.scrollTo(0, 0);
  }

  /* dars yoki sozlamalardan qaytganda natija va sozlamani qayta o'qish */
  window.addEventListener('pageshow', function (e) { if (e.persisted && D && !IM) { sozOl(); yigish(); xarita(); } });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && D && !IM && sh.hidden) { sozOl(); yigish(); xarita(); } });

  yukla();
})();
</script>
