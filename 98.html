var QT={"MUBXAB":["Мубтадо ва хабар",["Исмий гап икки қисмдан иборат: мубтадо (кимдан/нимадан гап кетяпти) ва хабар (у ҳақида нима дейиляпти). Иккаласи ҳам раф қилинади: الْمَالُ كَثِيرٌ.","**1. Хабар турлари.** Муфрад: كَثِيرٌ; жумла: بِلَادُنَا تَحْتَاجُ إِلَيْنَا; шибҳи жумла (жар ва мажрур ёки зарф): فِي الْفَصْلِ. Шибҳи жумла аслида маҳзуф хабар бўлмиш كَائِنٌ га мутааллиқ.","**2. Шарти.** Мубтадо одатда маърифа бўлади (اَلْ билан, алам, замир ёки изофада), хабар кўпинча накра. Савол гапда хабар маърифа бўлиши мумкин: مَنْ هَذَا؟","**3. Мослик.** Муфрад хабар мубтадога сон ва жинсда мос келади: الطَّالِبُ مُجْتَهِدٌ، الطَّالِبَةُ مُجْتَهِدَةٌ. Жумла хабарда мубтадога қайтадиган замир бўлади: بِلَادُنَا تَحْتَاجُ — тагидаги هِيَ.","**4. Тартиб.** Шибҳи жумла хабар олдинга ўтиши мумкин (хабари муқаддам), бу «фақат» маъносини беради: وَإِلَيْهِ النُّشُورُ. Мубтадо накра бўлса, олдинга ўтиши вожиб: فِي الْبَيْتِ رَجُلٌ.","**5. Ҳазф.** Мубтадо ёки хабар тушиб қолиши мумкин; сарлавҳалар шундай таркиб қилинади: (هَذَا) الدَّرْسُ الثَّانِي.","**6. Иккинчи хабар.** Битта мубтадонинг икки хабари бўлиши мумкин: سَعْدٌ فِي الْحَمَّامِ يَتَوَضَّأُ — жумла иккинчи хабар, раф ўринда."]],"LAYSA":["لَيْسَ — كَانَ нинг синглиси",["لَيْسَ — كَانَ нинг синглиси, «эмас» маъносида: мубтадо унинг исми бўлиб раф, хабар унинг хабари бўлиб насб қилинади: السَّفَرُ حَرَامٌ → لَيْسَ السَّفَرُ حَرَامًا.","**1. Маъноси.** Инкор; кўпинча ҳозирги замонни инкор қилади.","**2. Жомид феъл.** Фақат мозий шакли бор — музорий ва амри йўқ.","**3. Хабарида зоида بِ.** لَيْسَ السَّفَرُ بِحَرَامٍ — حَرَامٍ лафзан мажрур, насб ўринда."]],"LAKINNA":["لَكِنَّ — إِنَّ нинг синглиси",["لَكِنَّ — إِنَّ нинг синглиси, истидрок учун («лекин»: олдинги гапдан келиб чиқадиган фикрни тўғрилайди): исмини насб, хабарини раф қилади: الْبَيْتُ صَغِيرٌ لَكِنَّهُ جَمِيلٌ.","**1. Исми замир бўлса.** Ҳарфга уланади: لَكِنَّكَ، لَكِنَّهُ.","**2. Ташдидсиз لَكِنْ.** Амал қилмайди, ундан кейин оддий гап келади: وَلَكِنْ هَلْ فَكَّرْتَ…","**3. Синглилари.** إِنَّ، أَنَّ (таъкид)، كَأَنَّ (ўхшатиш)، لَيْتَ (орзу)، لَعَلَّ (умид)."]],"NASB":["Музорийни насб қилувчи ҳарфлар",["Музорийни насб қилувчи ҳарфлар: أَنْ، لَنْ، كَيْ، إِذَنْ; насб аломати — фатҳа: لَنْ أَذْهَبَ.","**1. لَنْ.** Келаси замонни инкор қилади: لَنْ أَذْهَبَ «бормайман».","**2. أَنْ.** Масдарий ҳарф — феъл билан бирга масдар ҳосил қилади: أَرْجُو أَنْ تَعُودَ = أَرْجُو عَوْدَتَكَ.","**3. Афъоли хамса.** Насб аломати — ن нинг ҳазфи: لَنْ تَذْهَبُوا.","**4. Маҳзуф أَنْ.** لِ (сабаб)، حَتَّى ва сабабият فَ сидан кейин ҳам насб қилинади: جِئْتُ لِأَتَعَلَّمَ."]],"MUDRAF":["Музорийнинг рафи",["Музорий феъли уни насб ёки жазм қилувчи сўз бўлмаса раф қилинади; аломати — замма: أَعُودُ، تَعْمَلُ.","**1. Амсилатул хомса.** Раф аломати — нуннинг жойида туриши: تَعْمَلُونَ، تَعْمَلِينَ.","**2. Тақдирий замма.** Охири و ёки ي бўлса, замма оғир бўлгани учун айтилмайди (сақл): أَرْجُو، أَمْشِي; охири алиф бўлса — айтиб бўлмайди (таъаззур): يَسْعَى. Насбда و ва ي да фатҳа кўринади: لَنْ أَرْجُوَ.","**3. Нозик жой.** Муаннаслик нуни уланса — мабний бўлади, раф қилинмайди: يَكْتُبْنَ."]],"SIN":["سَ ва سَوْفَ",["سَ ва سَوْفَ — истиқбол ҳарфлари: музорийни келаси замонга хослайди; амал қилмайди — феъл раф қилинганича қолади: سَأَغْتَرِبُ.","**1. Фарқи.** سَ — яқин келажак, سَوْفَ — узоқроқ келажак учун: سَأُسَافِرُ، سَوْفَ أُسَافِرُ."]],"AMR":["Амр феълининг биноси",["Амр феъли доим мабний; музорийсининг жазмдаги аломатига мабний бўлади:\n• охири саҳиҳ бўлса — сукунга: اُكْتُبْ\n• охири иллат ҳарфи бўлса — иллат ҳарфининг ҳазфига: اِمْشِ، اُدْعُ، اِسْعَ\n• амсилатул хомсадан бўлса — ن нинг ҳазф бўлишига: اِمْشُوا، اُكْتُبِي","**1. Фоили.** Доим замир. Бир эркакка — тагида вожиб ҳолдаги أَنْتَ мустатир: اُكْتُبْ. Бошқаларида — бориз замир: اُكْتُبِي، اُكْتُبَا، اُكْتُبُوا، اُكْتُبْنَ.","**2. Амсилатул хомса.** يَفْعَلَانِ، تَفْعَلَانِ، يَفْعَلُونَ، تَفْعَلُونَ، تَفْعَلِينَ — рафда ن туради, насб ва жазмда тушади; амрда ҳам тушади: تَكْتُبُونَ → اُكْتُبُوا.","**3. Муаннаслик нуни.** Уланса — сукунга мабний: اُكْتُبْنَ (ن — фоил).","**4. Фарқлаш алифи.** Жам вовидан кейин ёзиладиган ا ўқилмайди, эъробдан ўрни йўқ: اِمْشُوا."]],"FASIHA":["Фасиҳа фа си",["Фасиҳа фа си — яширин шартга далолат қилади: «шундай экан»; олдинги гапдан келиб чиқадиган натижани билдиради: فَامْشُوا فِي مَنَاكِبِهَا.","**1. Тақдири.** إِذَا كَانَ الْأَمْرُ كَذَلِكَ فَامْشُوا — шарт ҳазф қилинган, فَ унинг жавобига киради.","**2. Эъроби.** Ҳарф, фатҳага мабний, эъробдан унга ўрин йўқ."]],"MOZI":["Мозий феълнинг биноси",["Мозий феъл доим мабний; асли — фатҳага: فَكَّرَ، قَالَ.","**1. Сукунга.** Ҳаракатли фоил замири (تُ، تَ، تِ، نَا، نَ) уланса: فَكَّرْتُ، فَكَّرْنَا.","**2. Заммага.** Жам вови уланса: اِغْتَرَبُوا.","**3. Тақдирий фатҳа.** Охири алиф бўлса: تَعَالَى، سَعَى."]],"TAALA":["تَعَالَى",["تَعَالَى — мозий феъл, фатҳага мабний; фатҳа алиф устида кўринмайди (тақдирий), сабаби — таъаззур (талаффуз имконсиз).","**1. Сақл.** Охири و ёки ي бўлса, сабаби — оғирлик (сақл): أَرْجُو، الثَّانِي.","**2. Ҳурмат сўзлари.** Аллоҳ номидан кейин ҳурмат учун айтилади: تَعَالَى، عَزَّ وَجَلَّ، سُبْحَانَهُ."]],"MANQUS":["Исм манқус",["Охири ي бўлиб, олдидаги ҳарф касрали исм: الثَّانِي، الْقَاضِي. Раф ва жарда ҳаракат тақдирий (сақл — оғирлик учун), насбда фатҳа кўринади: رَأَيْتُ الْقَاضِيَ.","**1. Накра бўлса.** Раф ва жарда ي тушиб, танвин олади: ثَانٍ، قَاضٍ; насбда ي қолади: قَاضِيًا."]],"SIFAT":["Сифат (наът)",["Сифат мавсуфига тўрт нарсада эргашади: эъроб, маърифа/накра, жинс ва сон: الدَّرْسُ الثَّانِي، اللَّهُ الْعَظِيمُ.","**1. Ақлсиз кўплик.** Сифат муаннас бирликда келади: بِلَادٍ غَرِيبَةٍ.","**2. Жумла сифат.** Накра мавсуфдан кейинги жумла унинг сифати бўлади: رَجُلٌ يَقْرَأُ."]],"MULHAQ":["Жам музаккар солимга мулҳақ сўзлар",["Жамъ музаккар солимдек турланадиган сўзлар: ўнликлар (عِشْرُونَ … تِسْعُونَ)، أُولُو، أَهْلُونَ، سِنُونَ، بَنُونَ — рафда و، насб ва жарда ي: جَاءَ عِشْرُونَ، رَأَيْتُ عِشْرِينَ.","**1. Тартиб сонлари.** الْحَادِي وَالْعِشْرُونَ … الثَّانِي وَالتِّسْعُونَ — бирлик فَاعِلٍ вазнида, ўнлик و билан атф қилинади."]],"ATF":["Атф ҳарфлари",["Маътуф ўзидан олдинги сўзга (маътуфун алайҳ) эъробда эргашади: عَلَى دِينِهِمْ وَثَقَافَتِهِمْ.","**1. Ҳарфлари ва маъноси.** وَ — жамлаш («ва»); فَ — кетма-кет, тез; ثُمَّ — кетма-кет, орада вақт бор; أَوْ — «ёки» (танлаш); أَمْ — «ёки» (саволда); بَلْ — «балки»; لَا — «эмас».","**2. Нималар атф қилинади.** Исм исмга, феъл феълга, жумла жумлага: يَأْكُلُ وَيَشْرَبُ.","**3. Эъроби.** Мабний сўзга атф қилинса — унинг ўрнига эргашади. Жумла атф қилинса, олдинги жумланинг ўрнини олади (масалан, хабарга маътуф — раф ўринда); олдинги жумланинг ўрни бўлмаса, униники ҳам бўлмайди.","**4. Нозик жой.** Ҳар وَ атф ҳарфи эмас: гап бошидаги وَ — истеъноф (ибтидо) ҳарфи, ҳол жумласи олдидагиси — ҳол вови."]],"MUTANNA":["Тасния",["Иккилик (тасния): рафда ا، насб ва жарда ي: مَرَّتَانِ — مَرَّتَيْنِ.","**1. Нуни.** Охиридаги ن касрали, эъроб аломати эмас; изофада тушади: كِتَابَا الطَّالِبِ.","**2. Мулҳақлари.** اِثْنَانِ، اِثْنَتَانِ; كِلَا ва كِلْتَا замирга музоф бўлса: كِلَاهُمَا، كِلَيْهِمَا."]],"MUTLAQ":["Мафъулун мутлақ",["Феълнинг ўз масдари: феълни таъкидлайди, турини ёки сонини билдиради; насб қилинади: شَكَرْتُهُ شُكْرًا.","**1. Турлари.** Таъкид: شَكَرْتُهُ شُكْرًا; тур (сифати ёки изофаси билан): شَكَرْتُهُ شُكْرًا كَثِيرًا; сон: ضَرَبْتُهُ ضَرْبَتَيْنِ.","**2. Ўрнига ўтадиганлар (наиб).** Сон (مَرَّتَيْنِ), كُلٌّ ва بَعْضٌ (كُلَّ الشُّكْرِ), сифати.","**3. Ҳазф.** Феъли кўпинча ҳазф қилинади: شُكْرًا، عَفْوًا، صَبْرًا، حَمْدًا; гап феълийя бўлади: (اُعْفُ عَنِّي) عَفْوًا."]],"GHAYR":["Ғайри мунсариф исм",["Танвин олмайди ва жарда касра ўрнига фатҳа олади («аломати касрага ўринбосар фатҳа»): مَرَرْتُ بِمَسَاجِدَ.","**1. Сабаблари.** Мунтаҳал жумуъ вазни (مَفَاعِلُ، مَفَاعِيلُ), أَفْعَلُ вазнидаги сифат, муаннас алифи (صَحْرَاءُ، أَشْيَاءُ), فَعْلَانُ сифат (عَطْشَانُ) ва кўп атоқли отлар (فَاطِمَةُ، إِبْرَاهِيمُ).","**2. Эъроб аломати.** Рафда замма, насб ва жарда фатҳа, танвинсиз: جَاءَتْ زَيْنَبُ، رَأَيْتُ زَيْنَبَ، مَعَ زَيْنَبَ.","**3. Касра оладиган ҳолатлар.** اَلْ билан келса (فِي الْمَسَاجِدِ) ёки музоф бўлса (فِي مَنَاكِبِهَا).","**4. Нозик жой.** Қўшма (мазжий) атоқли от ҳам ғайри мунсариф: إِسْلَامَ آبَادَ."]],"YA":["Мутакаллим ي си",["ي — «менинг» маъносидаги муттасил замир: وَطَنِي «ватаним».","Ундан олдинги ҳарф доим касра олади (мослик учун), шунинг учун сўзнинг эъроб ҳаракати кўринмайди — тақдирий:","هَذَا وَطَنِي (раф)، أُحِبُّ وَطَنِي (насб)، مِنْ وَطَنِي (жар) — учаласи бир хил ўқилади.","ي нинг ўзи сукунга (баъзан фатҳага: وَطَنِيَ) мабний, жар ўринда — музофун илайҳ."]],"PRON":["Муттасил замирлар",["Замирлар доим мабний; ўрни қаерга уланганига қараб:\n• исмга — музофун илайҳ, жар ўринда: رَاتِبُكَ\n• феълга — мафъулун биҳ, насб ўринда: أَزُورُهُمْ\n• жар ҳарфига — мажрур, жар ўринда: إِلَيْنَا، فِيكَ\n• إِنَّ синглисига — унинг исми, насб ўринда: لَكِنَّكَ","**1. Фоил замирлари.** Феълга уланган تُ، تَ، تِ، نَا، و، ا، ي، نَ — фоил, раф ўринда: فَكَّرْتُ، اغْتَرَبُوا.","**2. Нунул виқоя.** Феълга ي уланса, орасига ن киради: يُعْجِبُنِي.","**3. Талаффуз.** هُ، هُمْ، هُمَا، هُنَّ — касра ёки ي дан кейин касра олади: رِزْقِهِ، دِينِهِمْ، فِيهِمْ."]],"IDAFA":["Изофа",["Икки исм боғланади: биринчиси — музоф, иккинчиси — музофун илайҳ. Музофун илайҳ доим жар қилинади; музоф танвин ва اَلْ олмайди: خَارِجَ وَطَنِي، خَمْسَ سَنَوَاتٍ.","**1. Музофнинг эъроби.** Гапдаги ўрнига қараб: мубтадо, фоил, зарф…: خَارِجَ وَطَنِي — зарф, насб.","**2. Музофун илайҳ.** Исм, замир (رَاتِبُكَ — жар ўринда) ёки жумла бўлади; حَيْثُ ва шартли إِذَا доим кейинги жумлага музоф.","**3. Тасния ва жамда.** Музоф тасния ёки жам музаккар солим бўлса, ن тушади: كِتَابَا الطَّالِبِ، مُعَلِّمُو الْمَدْرَسَةِ.","**4. Маърифалик.** Маърифага изофа қилинган музоф маърифа бўлади, накрага изофа қилингани — накра.","**5. Нозик жой.** Музоф билан музофун илайҳ орасига сўз кирмайди; музофнинг сифати музофун илайҳдан кейин келади: كِتَابُ الطَّالِبِ الْجَدِيدُ."]],"ZARF":["Зарф (мафъулун фийҳ)",["Иш-ҳаракатнинг вақти ёки жойини билдиради, «-да» маъносини беради; насб қилинади: خَارِجَ وَطَنِي.","**1. Турлари.** Зарф замон: يَوْمَ، لَيْلَةَ، صَبَاحًا; зарф макон: خَارِجَ، أَمَامَ، فَوْقَ، عِنْدَ، مَعَ.","**2. Мабний зарфлар.** هُنَا، هُنَاكَ، إِذَا، حَيْثُ — насб ўринда.","**3. Мутааллиқ.** Зарф феълга ёки феълдек амал қиладиган сўзга боғланади; бундай сўз бўлмаса — маҳзуф хабар (كَائِنٌ) га: الْكِتَابُ هُنَا.","**4. Зарф ўрнига ўтадиганлар.** Сон (خَمْسَ سَنَوَاتٍ), зарфнинг сифати (طَوِيلًا — асли زَمَنًا طَوِيلًا), كُلٌّ ва بَعْضٌ.","**5. Нозик жой.** Шартли إِذَا — зарф замон, жавоб феълига мутааллиқ; حَيْثُ доим кейинги жумлага музоф.","**6. Бошқа фикр.** اَلْآنَ ни китобимиз (65-дарс) насб қилинган, аломати фатҳа деб беради; кўп наҳв китобларида у фатҳага мабний."]],"ISHARA":["Исм ишоралар",["Нарсага ишора қиладиган исм. Яқин учун: هَذَا، هَذِهِ، هَذَانِ، هَاتَانِ، هَؤُلَاءِ; узоқ учун: ذَلِكَ، تِلْكَ، أُولَئِكَ.","**1. Жой учун.** هُنَا (бу ерда), هُنَاكَ / هُنَالِكَ (у ерда) — зарф макон.","**2. Эъроби.** Мабний — «… ўринда» дейилади; фақат هَذَانِ ва هَاتَانِ тасниядек турланади: рафда ا, насб ва жарда ي (هَذَيْنِ).","**3. Таркиби.** ذَلِكَ = ذَا + لِ (узоқлик ломи) + كَ (хитоб ҳарфи); هَذَا даги هَا — танбеҳ ҳарфи."]],"FAIL":["Фоил",["Ишни бажарувчи; доим раф қилинади ва феълдан кейин келади: جَاءَ الطُّلَّابُ.","**1. Турлари.** Зоҳир (алоҳида исм), бориз муттасил замир (فَكَّرْتُ) ёки мустатир замир (هُوَ، أَنَا).","**2. Мустатир — жоиз ва вожиб.** Жоиз — кетидан зоҳир фоил ҳам кела оладиган 3-шахс сиғалари: ضَرَبَ (هُوَ). Вожиб — зоҳир фоил келмайдиганлар: музорийнинг 2-шахс муфрад музаккари ва 1-шахслари, амр: أَجْتَهِدُ (أَنَا).","**3. Эъроб аломати.** Замма; таснияда ا, жам музаккар солимда و. Мабний бўлса — раф ўринда.","**4. Феълнинг мослиги.** Фоил кўплик бўлса ҳам феъл бирликда қолади: جَاءَ الطُّلَّابُ. Фоил муаннас бўлса, феълга ت қўшилади: جَاءَتْ زَيْنَبُ.","**5. Тартиб.** Фоил феълдан олдин келмайди; олдин келса — мубтадо бўлади, фоил эса феълдаги замир: زَيْنَبُ جَاءَتْ (фоил — тагидаги هِيَ).","**6. Нозик жой.** اللَّهُ сўзи таркибда ҳурмат учун «лафзи жалола» (لَفْظُ الْجَلَالَةِ) деб аталади."]],"MAFUL":["Мафъулун биҳ",["Иш ўтадиган нарса; насб қилинади: تَصْحَبَ أَوْلَادَكَ.","**1. Саволи.** Кўпроқ «кимни? нимани?», баъзан «кимга? нимага?», кам ҳолларда «кимдан? нимадан?» саволига жавоб беради.","**2. Турлари.** Зоҳир исм, муттасил замир (أَزُورُهُمْ — насб ўринда), мунфасил замир (إِيَّاكَ) ёки أَنْ ва феълдан изоҳланган масдар: أَرْجُو أَنْ تَعُودَ.","**3. Эъроб аломати.** Фатҳа; таснияда ва жам музаккар солимда ي; жам муаннас солимда — фатҳага ўринбосар касра.","**4. Икки мафъулли феъллар.** «Бермоқ» маъносидаги أَعْطَى، مَنَحَ; «гумон қилмоқ» маъносидаги ظَنَّ، حَسِبَ; «айлантирмоқ» маъносидаги جَعَلَ، صَيَّرَ، اتَّخَذَ — мафъуллари асли мубтадо ва хабар: الْأَرْضُ ذَلُولٌ → جَعَلَ الْأَرْضَ ذَلُولًا.","**5. Тартиб.** Феълдан олдин ҳам келиши мумкин (таъкид ёки «фақат» маъноси учун): إِيَّاكَ نَعْبُدُ."]],"JARR":["Жар ҳарфлари",["Ўзидан кейинги исмни жар қилади: مِنْ، إِلَى، عَنْ، عَلَى، فِي، بِ، لِ، كَ، حَتَّى، رُبَّ، مُنْذُ. Жар ҳарфи ва мажрур — шибҳи жумла.","**1. Эъроб аломати.** Мажрурда — касра; ғайри мунсарифда — касрага ўринбосар фатҳа; тасния ва жам музаккар солимда — ي. Мабний сўз (замир, ишора, мавсул) — жар ўринда: إِلَيْنَا.","**2. Мутааллиқ.** Жар ва мажрур феълга ёки феълдек амал қиладиган сўзга (исм фоил, масдар) боғланади. Бундай сўз бўлмаса — маҳзуф сўзга: хабар (كَائِنٌ), сифат ёки ҳол бўлиб.","**3. Тартиб.** Шибҳи жумла мутааллиқидан олдин келиши мумкин: إِلَى أَيْنَ أَنْتَ مُسَافِرٌ؟","**4. Замир уланганда.** إِلَى ва عَلَى нинг алифи ي га айланади: إِلَيْهِ، عَلَيْكَ. لِ фатҳа олади: لَكَ، لَهُ، لَكُمْ; фақат ي билан — لِي.","**5. لِ ва اَلْ.** Алиф ёзилмайди: لِلْعَمَلِ."]],"MIM":["Жам мими",["كُمْ ва هُمْ даги жам мими сукунли; кейинги сўз ال билан бошланса, икки сукун учрашмаслиги учун замма олади: لَكُمُ الْأَرْضَ، عَلَيْهِمُ الْقِتَالُ.","**1. Эъроби.** Бу замма эъроб аломати эмас — замир сукунга мабнийлигича қолади."]],"HAL":["Ҳол",["Иш пайтидаги ҳолатни билдиради, «қандай ҳолда?» саволига жавоб беради; насб қилинади: تَعُودَ سَالِمًا.","**1. Турлари.** Муфрад: سَالِمًا; жумла: جَاءَ وَهُوَ يَضْحَكُ — насб ўринда.","**2. Шарти.** Ҳол кўпинча накра, зул ҳол эса маърифа бўлади.","**3. Ҳол жумласи.** Олдида ҳол вови келиши мумкин: جَاءَ وَهُوَ يَضْحَكُ.","**4. Бир нечта ҳол.** Битта зул ҳолга бир нечта ҳол келиши мумкин: تَعُودَ سَالِمًا غَانِمًا.","**5. Нозик жой.** كَيْفَ — тўлиқ феълдан олдин келса ҳол (كَيْفَ تُحَافِظُ؟), мубтадодан олдин келса хабар (كَيْفَ حَالُكَ؟)."]],"SHART":["Шарт гапи",["Шарт гапи уч қисмдан иборат: шарт сўзи + шарт феъли + жавоб: إِنْ تَدْرُسْ تَنْجَحْ — жазм қилувчи шарт сўзи иккала феълни ҳам жазм қилади.","**1. Турлари.** Жазм қилувчилар: إِنْ، مَنْ، مَا، مَهْمَا، مَتَى، أَيْنَ، حَيْثُمَا; жазм қилмайдиганлар: إِذَا، لَوْ، لَوْلَا.","**2. Эъроби.** Шарт феъли мозий бўлса, жазм ўринда бўлади: إِنْ شَاءَ اللَّهُ.","**3. إِذَا.** Келаси замон зарфи: шартига музоф, жавобига мутааллиқ.","**4. Жавобга فَ.** Вожиб бўлади: исмий гап, амр, наҳй, савол, жомид феъл ёки قَدْ، مَا، لَنْ، سَ، سَوْفَ билан келса.","**5. Ҳазф.** Жавоб олдинги гапдан тушунилса, ҳазф қилинади: أَعُودُ إِنْ شَاءَ اللَّهُ.","**6. Нозик жой.** إِلَّا = إِنْ + لَا: «акс ҳолда»."]],"ISTIF":["Савол сўзлари",["Савол сўзлари икки хил: ҳарфлар (هَلْ ва ҳамза أَ) ва исмлар (مَنْ، مَا، مَتَى، أَيْنَ، كَيْفَ، كَمْ، أَيُّ).","**1. Ҳарфлари.** هَلْ ва أَ — эъробдан ўрни йўқ. هَلْ нинг жавоби — نَعَمْ ёки لَا.","**2. Исмлари.** Гапда ўрни бор: мубтадо (مَنْ ضَرَبَ الطَّالِبَ؟), хабар, зарф (أَيْنَ، مَتَى), ҳол (كَيْفَ), мафъулун биҳ, мажрур (إِلَى أَيْنَ).","**3. Эъроби.** Ҳаммаси мабний — «… ўринда» дейилади; фақат أَيُّ мўъроб.","**4. Тартиб.** Савол сўзи гап бошида келади; жар ҳарфи бўлса — ундан кейин: إِلَى أَيْنَ؟","**5. Нозик жой.** أَيْنَ X؟ да أَيْنَ — маҳзуф хабари муқаддам (كَائِنٌ) га мутааллиқ, X — мубтадо муаххар."]],"MAWSUL":["Исм мавсул",["Ўзидан кейинги жумла (сила) билан бирга маъно берадиган исм: الَّذِي، الَّتِي، اللَّذَانِ، اللَّتَانِ، الَّذِينَ، اللَّاتِي; умумий: مَنْ، مَا.","**1. Турлари.** Хос — сон ва жинсга қараб (الَّذِي، الَّتِي…); умумий — مَنْ (ақллилар учун), مَا (ақлсизлар учун).","**2. Эъроби.** Мабний — «… ўринда» дейилади; фақат اللَّذَانِ ва اللَّتَانِ тасниядек мўъроб.","**3. Сила.** Кейинги жумла — сила, эъробдан унга ўрин йўқ. Силада мавсулга қайтувчи замир (оид) бўлади: هُوَ الَّذِي جَعَلَ — جَعَلَ даги мустатир هُوَ.","**4. Сифат бўлиб.** Маърифадан кейин келса, кўпинча унинг сифати бўлади: لُغَةَ تِلْكَ الْحَضَارَةِ الَّتِي تُرْجِمَتْ إِلَيْهَا."]],"DAMIR":["Мунфасил замирлар",["Алоҳида ёзиладиган замирлар: أَنَا، نَحْنُ، أَنْتَ، أَنْتِ، أَنْتُمَا، أَنْتُمْ، أَنْتُنَّ، هُوَ، هِيَ، هُمَا، هُمْ، هُنَّ.","**1. Эъроби.** Ҳаммаси мабний; гапда раф ўринда келади (мубтадо, хабар…).","**2. Насб замирлари.** إِيَّا билан: إِيَّاكَ نَعْبُدُ — мафъулун биҳ, насб ўринда.","**3. Фасл замири.** Мубтадо билан хабар орасида келса — ажратиш (фасл) замири, эъробдан ўрни йўқ: هَذَا هُوَ الْمِعْطَفُ."]],"QAT":["فَقَطْ",["فَقَطْ — «фақат»: قَطْ — «етарли, бас» маъносидаги исм (حَسْبُ каби), فَ — зоида.","**1. Нозик жой.** Ташдидли قَطُّ — бошқа сўз: «ҳеч қачон», ўтган замон инкори билан келади: مَا رَأَيْتُهُ قَطُّ."]],"DUA":["Дуо маъносидаги мозий",["Мозий феъл дуо маъносида келади — ўтган замонни эмас, тилакни билдиради: بَارَكَ اللَّهُ فِيكَ — «Аллоҳ сенга барака берсин».","**1. Эъроби.** Бундай жумла — жумлатун дуоийя, эъробдан унга ўрин йўқ: رَحِمَهُ اللَّهُ.","**2. Кўп учрайдиганлари.** رَضِيَ اللَّهُ عَنْهُ، جَزَاكَ اللَّهُ خَيْرًا."]],"JMS":["Жам муаннас солим",["ـَاتٌ қўшимчали кўплик: рафда замма, насб ва жарда касра: سَنَوَاتٌ — رَأَيْتُ السَّنَوَاتِ.","**1. Насб аломати.** Касра фатҳа ўрнига келади: رَأَيْتُ مُعَلِّمَاتٍ.","**2. Нозик жой.** ت си ўзакдан бўлган кўплик (أَمْوَاتٌ، أَبْيَاتٌ) жам муаннас солим эмас — насбда фатҳа олади: رَأَيْتُ أَمْوَاتًا."]],"AF5":["Афъоли хамса",["Музорий феълнинг охирига ا، و ёки ي фоил замири уланган 5 шакли: يَفْعَلَانِ، تَفْعَلَانِ، يَفْعَلُونَ، تَفْعَلُونَ، تَفْعَلِينَ. Рафда охиридаги ن сақланади, насб ва жазмда тушади.","**1. Фоили.** ا (икки киши), و (кўпчилик), ي (бир аёл) — фоил бўлган муттасил замир, раф ўринда: تَدْرُسَانِ.","**2. Раф аломати.** ن нинг сақланиши: تَسْكُنَانِ، تَخْتَلِفُونَ.","**3. Насб аломати.** ن нинг ҳазфи: لَنْ تَسْكُنَا، أَنْ تَذْهَبُوا.","**4. Жазм аломати.** ن нинг ҳазфи: لَمْ تَدْرُسَا، لَا تُسْرِفُوا.","**5. Нозик жой.** ن тушгандан кейин жамъ вовидан сўнг ёзувда алиф қўшилади (алифи фориқа): لَمْ يَذْهَبُوا."]],"KANA":["كَانَ ва синглилари",["كَانَ ва синглилари мубтадо ва хабарга киради: мубтадо раф қилинган ҳолда унинг исми, хабар эса насб қилиниб унинг хабари бўлади: زَيْنَبُ نَحِيفَةٌ — ظَلَّتْ زَيْنَبُ نَحِيفَةً.","**1. Синглилари.** كَانَ، أَصْبَحَ، أَضْحَى، أَمْسَى، ظَلَّ، بَاتَ، صَارَ، لَيْسَ، مَا زَالَ، مَا بَرِحَ، مَا فَتِئَ، مَا انْفَكَّ، مَا دَامَ. Маънолари: ظَلَّ — «…лигича қолди», صَارَ — «бўлиб қолди», لَيْسَ — «эмас».","**2. Нима учун ноқис.** Фоил билан тугамайди — исм ва хабар талаб қилади.","**3. Хабари турлари.** Муфрад (نَحِيفَةً), жумла (насб ўринда) ёки шибҳи жумла — маҳзуф хабар бўлмиш كَائِنًا га мутааллиқ.","**4. Шакллари.** Музорий ва амри ҳам шундай амал қилади: أَنْ تَكُونَ سَمِينَةً — исми яширин هِيَ, хабари سَمِينَةً; كُنْ.","**5. Тартиб.** Хабари исмидан олдин келиши мумкин (хабари муқаддам, исми муаххар): فَكَانَتْ هُنَاكَ لَهْجَةٌ.","**6. Нозик жой.** كَانَ баъзан том феъл бўлади («бор бўлди, юз берди») — унда фоил олади."]],"SHURU":["Бошлаш феъллари",["أَخَذَ، بَدَأَ، شَرَعَ، جَعَلَ «… а бошлади» маъносида келса, бошлаш феъли (афъолуш шуруъ) бўлиб, كَانَ каби амал қилади: исмини раф қилади, хабари насб ўринда: أَخَذَتْ زَيْنَبُ تَتَنَاوَلُ…","**1. Хабари.** Фақат музорий феъл билан бошланадиган жумла (أَنْ сиз), насб ўринда; феълнинг ўзи раф ҳолида қолади: تَتَنَاوَلُ.","**2. Нозик жой.** أَخَذَ «олди» маъносида бўлса — оддий феъл: أَخَذَهُ «уни олди»."]],"JAZM":["لَمْ ва жазм",["لَمْ музорий феълни жазм қилади ва маъносини ўтган замон инкорига айлантиради: لَمْ تَنْجَحْ — «муваффақ бўлмади».","**1. Соғлом феълда.** Жазм аломати — сукун: تَنْجَحْ، يَنْقُصْ، تُمَارِسْ.","**2. Ўртаси иллатли феъл.** Икки сукун йўлиқмаслиги учун иллат ҳарфи тушади: تَسْتَطِيعُ → لَمْ تَسْتَطِعْ.","**3. Охири иллатли феъл.** Иллат ҳарфи тушади: يَمْشِي → لَمْ يَمْشِ.","**4. Афъоли хамса.** Жазм аломати — ن нинг тушиши: لَمْ تَدْرُسَا.","**5. Нозик жой.** Нафий لَا музорийни ўзгартирмайди: لَا تَسْتَطِيعُ — раф."]],"ADAD":["Сонлар (21–99)",["21 дан 99 гача бўлган сонлар бирлик ва ўнликдан тузилади: бирлик олдин, ўнлик кейин, орасида وَ — ўнлик бирликка маътуф: خَمْسَةٌ وَخَمْسُونَ.","**1. Ўнликлар.** عِشْرُونَ … تِسْعُونَ жамъ музаккар солимга мулҳақ: рафда و, насб ва жарда ي: وَزْنُهَا تِسْعُونَ، إِلَى سَبْعِينَ.","**2. Бирликнинг жинси.** 3–9 санаб ўтилган нарсага жинсда тескари бўлади: خَمْسَةُ كُتُبٍ، خَمْسُ سَنَوَاتٍ; 1 ва 2 эса мос келади: إِحْدَى وَعِشْرُونَ سَنَةً.","**3. Тамйиз.** 11–99 дан кейинги санаб ўтилган нарса бирлик ва насб бўлади: خَمْسَةٌ وَخَمْسُونَ كَيْلًا.","**4. Эъроби.** Бирлик гапдаги ўрнига қараб турланади, ўнлик унга атф билан эргашади: رَأَيْتُ خَمْسَةً وَخَمْسِينَ."]],"TAMYIZ":["Тамйиз",["Ноаниқ қолган сўзнинг нимани назарда тутганини аниқлаб берадиган накра, мансуб исм: خَمْسَةٌ وَخَمْسُونَ كَيْلًا — «55 (нима?) кило».","**1. Турлари.** Зот тамйизи — сон, ўлчов, вазндан кейин: خَمْسُونَ كَيْلًا; нисбат тамйизи — гапнинг маъносини аниқлайди: طَابَ زَيْدٌ نَفْسًا.","**2. Сондан кейин.** 3–10 дан кейин — жам ва мажрур (музофун илайҳ): ثَلَاثَةُ كُتُبٍ; 11–99 дан кейин — бирлик ва мансуб: خَمْسُونَ كَيْلًا; 100 ва 1000 дан кейин — бирлик ва мажрур: مِئَةُ كِتَابٍ."]],"MASDARM":["أَنْ + феъл = масдар",["أَنْ ва ундан кейинги музорий бирга масдар маъносини беради: أَنْ تَكُونَ = اَلْكَوْنُ «бўлиш», أَنْ يَصِلَ = اَلْوُصُولُ «етиш».","**1. Эъроби.** Масдар гапда исм каби ўрин олади: تُرِيدُ أَنْ تَكُونَ … — мафъулун биҳ; يَجِبُ أَنْ يَصِلَ … — фоил.","**2. Феълнинг ўзи.** أَنْ музорийни насб қилади: أَنْ يَصِلَ."]],"FA":["فَ ҳарфи",["Кетма-кетлик ва сабаб-натижани билдиради: فَزَادَ وَزْنُهَا — «натижада вазни ошди».","Олдинги гапнинг сабабини тушунтириш учун ҳам келади: فَهُمَا تَسْكُنَانِ … — «чунки иккови … яшайди»."]],"WAWHAL":["Ҳол вови",["Ҳол жумласи олдидан келадиган وَ — «… ҳолда»: فَزَادَ وَزْنُهَا وَلَمْ يَنْقُصْ — «камаймаган ҳолда ошди».","**1. Эъроби.** وَ — ҳарф, эъробдан ўрни йўқ; кейинги жумла ҳол бўлиб, насб ўринда."]],"BADAL":["Бадал",["Бадал олдинги сўз (мубдалун минҳ) ўрнига туради — ҳукм аслида унга қаратилган; эъробда ундан эргашади: جَاءَ زَيْدٌ أَخُوكَ.","**1. Турлари.** Бутундан бутун: جَاءَ زَيْدٌ أَخُوكَ; бутундан бўлак: أَكَلْتُ الرَّغِيفَ ثُلُثَهُ; иштимол: نَفَعَنِي زَيْدٌ عِلْمُهُ.","**2. Тафсил.** Олдин сон ёки умумий сўз келиб, кейин бирма-бир саналса — биринчиси бадал, кейингилари унга маътуф: ثَلَاثِ فِرَقٍ: فَرِيقٍ … وَفَرِيقٍ … — ҳаммаси мажрур.","**3. Мослик.** Бадал мубдалун минҳга эъробда эргашади; маърифа-накра ва жинсда мос келиши шарт эмас.","**4. Нозик жой.** Бутундан бўлак ва иштимол бадалида мубдалун минҳга қайтадиган замир бўлади: ثُلُثَهُ، عِلْمُهُ."]],"LANAFI":["Зотни инкор қилувчи لَا",["لَا النَّافِيَةُ لِلْجِنْسِ — бир турдаги нарсанинг умуман йўқлигини билдиради ва إِنَّ каби амал қилади: исмини насб, хабарини раф: لَا بُدَّ — «чора йўқ».","**1. Шарти.** Исми ва хабари накра бўлади, исми ундан кейин дарҳол келади.","**2. Исмининг эъроби.** Музоф бўлмаса — фатҳага мабний, насб ўринда: لَا بُدَّ; музоф бўлса — насб: لَا طَالِبَ عِلْمٍ مَحْرُومٌ.","**3. Хабари ҳазфи.** Кўпинча ҳазф қилинади: لَا بُدَّ مِنَ الْحِمْيَةِ — مِنَ الْحِمْيَةِ маҳзуф хабарга (مَوْجُودٌ) мутааллиқ.","**4. Нозик жой.** لَا بُدَّ مِنْ … — «… зарур, … шарт»."]],"ANNA":["أَنَّ ва масдар",["أَنَّ — إِنَّ нинг синглиси: исмини насб, хабарини раф қилади ва исми, хабари билан бирга масдар ўрнида туради: أَعْتَقِدُ أَنَّكَ لَمْ تَتَّبِعِ الْحِمْيَةَ = أَعْتَقِدُ عَدَمَ اتِّبَاعِكَ الْحِمْيَةَ.","**1. Ўрни.** Гап ўртасида келади; гап бошида ва قَالَ дан кейин — إِنَّ: قَالَ: إِنَّ…","**2. Масдарнинг эъроби.** Масдар гапда исм каби ўрин олади: يَرَى أَنَّ الْعَمَلَ حَقٌّ — мафъулун биҳ ўрнида.","**3. Хабари.** Муфрад ёки жумла бўлади: أَنَّكَ لَمْ تَتَّبِعْ … — жумла раф ўринда.","**4. Исми замир бўлса.** Ҳарфга уланади: أَنَّكَ، أَنَّهُ."]],"JAZMK":["Жазм ва 2 сукун",["Мажзум феълдан кейин ال билан бошланган сўз келса, икки сукун йўлиқмаслиги учун сукун касрага алмашади: لَمْ تَتَّبِعِ الْحِمْيَةَ، لَمْ تُمَارِسِ الرِّيَاضَةَ.","**1. Эъроби.** Бу касра эъроб аломати эмас — феъл барибир мажзум, жазм аломати сукун.","**2. Ўртаси иллатли феъл.** Иллат ҳарфи тушади: أَسْتَطِيعُ → لَمْ أَسْتَطِعْ.","**3. Амр феълида ҳам.** اِتَّبِعْ → اِتَّبِعِ الْحِمْيَةَ."]],"MUQ":["Муқаддар замма",["Охири ي бўлган музорий феълда (يَكْفِي، يَمْشِي) раф аломати — муқаддар (кўринмас) замма, чунки ي да замма оғир (сақл).","**1. Насбда.** Фатҳа кўринади: لَنْ يَكْفِيَ.","**2. Жазмда.** ي тушади: لَمْ يَكْفِ.","**3. Охири و ёки ا бўлса.** و да ҳам замма тақдирий (сақл): يَدْعُو; ا да — таъаззур (талаффуз имконсиз): يَسْعَى."]],"WAHD":["وَحْدَ",["وَحْدَ — «ёлғиз, бир ўзи» маъносидаги исм; доим насб қилинади ва замирга музоф бўлади: وَحْدَهُ، وَحْدَكَ، وَحْدِي.","**1. Эъроби.** Гапда ҳол бўлади: اَلدَّوَاءُ وَحْدَهُ لَا يَكْفِي — «дорининг ўзи (ёлғиз) кифоя қилмайди»."]],"NIDA":["Нидо (мунодо)",["يَا — нидо ҳарфи («эй»); ундан кейинги исм — мунодо.","**1. Мабний мунодо.** Алам ёки аниқ шахсга қаратилган накра бўлса — танвинсиз заммага мабний, насб ўринда: يَا مُحَمَّدُ، يَا دُكْتُورُ.","**2. Мансуб мунодо.** Музоф бўлса насб қилинади: يَا طَالِبَ الْعِلْمِ.","**3. Нозик жой.** ال ли исмга يَا бевосита кирмайди — орага أَيُّهَا тушади: يَا أَيُّهَا النَّاسُ."]],"WIQ":["Виқоя нуни",["Мутакаллим ي си феълга уланганда, феъл охирини касрадан сақлаш учун орага نِ қўшилади: قَابِلْنِي، يُقَابِلُنِي.","**1. Эъроби.** نِ — виқоя нуни, ҳарф, эъробдан ўрни йўқ; ي — мафъулун биҳ, насб ўринда."]],"FASL":["Фасл замири",["Мубтадо ва маърифа хабар орасида келган мунфасил замир (هُوَ، هِيَ، هُمْ …) хабарни сифатдан ажратади ва таъкидлайди: الْإِنْسَانُ السَّمِينُ هُوَ الصَّحِيحُ.","**1. Шарти.** Икки маърифа орасида келади ва олдингисига жинс ва сонда мос бўлади.","**2. Эъроби.** Эъробдан ўрни йўқ; таржимада «айнан …» маъносини беради.","**3. Бошқа фикр.** Баъзилар уни иккинчи мубтадо, кейингисини унинг хабари дейди; бу жумла биринчи мубтадонинг хабари бўлади."]],"NAHY":["Наҳий لَا си",["لَا النَّاهِيَةُ — тақиқ ҳарфи, музорий феълни жазм қилади: لَا تَأْكُلْ «ема».","**1. Нафий لَا дан фарқи.** لَا تَأْكُلُ (раф) — «емайсан»; لَا تَأْكُلْ (жазм) — «ема!».","**2. Икки сукун.** Кейинги сўз ال билан бошланса, сукун касрага алмашади: لَا تَأْكُلِ الْخُبْزَ.","**3. Афъоли хамса.** Жазм аломати — ن нинг тушиши: تُسْرِفُونَ → لَا تُسْرِفُوا."]],"ZAID":["Зоида بِ",["بِ баъзан таъкид учун ортиқча (зоида) келади: بِحَسْبِ ابْنِ آدَمَ = حَسْبُ ابْنِ آدَمَ.","**1. Эъроби.** Кейинги сўз лафзан мажрур, гапдаги ўрни бўйича (маҳаллан) марфуъ ёки мансуб.","**2. Кўп учрайдиган жойи.** لَيْسَ нинг хабарида: لَيْسَ السَّفَرُ بِحَرَامٍ — حَرَامٍ насб ўринда."]],"JMSM":["Жамъ музаккар солим",["ـُونَ / ـِينَ қўшимчали кўплик: рафда و، насб ва жарда ي: الْمُسْرِفُونَ — الْمُسْرِفِينَ.","**1. Нуни.** Охиридаги ن фатҳали, бирликдаги танвин ўрнига келади; изофада тушади: مُعَلِّمُو الْمَدْرَسَةِ.","**2. Мулҳақлари.** عِشْرُونَ … تِسْعُونَ، أُولُو، أَهْلُونَ ҳам шундай турланади."]],"QASAM":["Қасам ва унинг жавоби",["Қасам — гапни таъкидлаш учун Аллоҳнинг номи ёки улуғ нарса билан онт ичиш: وَاللَّهِ — «Аллоҳга қасамки». Қасамдан кейинги гап — унинг жавоби, эъробдан унга ўрин йўқ.","**1. Қасам ҳарфлари.** وَ، بِ، تَ — кейинги исмни жар қилади: وَاللَّهِ، بِاللَّهِ، تَاللَّهِ.","**2. Жавобдаги لَ.** Жавоб мусбат мозий феъл бўлса, кўпинча бошига لَ ва قَدْ киради: وَاللَّهِ لَقَدْ نَجَحْتَ — «Аллоҳга қасамки, муваффақ бўлдинг».","**3. Ҳазф.** Қасамнинг ўзи кўп ҳазф қилинади, жавобдаги لَقَدْ унга далил бўлади: لَقَدْ رَفَعْتَ رَأْسَنَا = (وَاللَّهِ) لَقَدْ رَفَعْتَ رَأْسَنَا.","**4. Эъроби.** لَ — ҳарф, фатҳага мабний, эъробдан унга ўрин йўқ; жавоб жумласининг ҳам эъробдан ўрни йўқ."]],"ITIRAZ":["Эътирозий жумла",["Эътирозий жумла — икки боғлиқ гап орасига қўшимча маъно (ҳамд, дуо, таъкид) учун киритилган жумла; олиб ташланса ҳам гап бузилмайди: فَالْخَيْرُ كَثِيرٌ، وَالْحَمْدُ لِلَّهِ، لَكِنَّنِي أُرِيدُ …","**1. Эъроби.** Эъробдан унга ўрин йўқ; олдидаги وَ — эътироз ҳарфи.","**2. Кўп учрайдиганлари.** وَالْحَمْدُ لِلَّهِ، رَحِمَهُ اللَّهُ، تَعَالَى — гап ўртасида келганда.","**3. Бошқа фикр.** Баъзан олдинги жумлага маътуф (وَ — атф ҳарфи) деб ҳам эъроб қилинади; маъно ўзгармайди."]]};

function catOf(o){
  var ty=o.ty||"",r=o.role||"";
  if(/[Фф]еъл/.test(ty))return "f";
  if(/[Мм]афъул мутлақ/.test(r))return "-";
  if(/^Ҳарф \(жарр ҳарфи\)/.test(ty))return ">";
  if(/^(Сифат|Мудоф илайҳ|Атф|Бадал|Ишоранинг)/.test(r))return "^";
  if(/^Ҳарф/.test(ty))return "";
  if(/^Хабар|нинг хабари/.test(r))return "x";
  if(/^Мубтадо|^Сарлавҳа: мубтадо|мубтадо$|нинг исми/.test(r))return "m";
  if(/^Фоил/.test(r))return "o";
  if(/^Мафъул биҳ/.test(r))return "b";
  if(/^Жар-мажрур/.test(ty)||/жарр ҳарфидан кейин/i.test(r))return "j";
  if(/^Зарф|^Ҳол|[Ҳҳ]ол ўрнида/.test(r)||/зарф/.test(ty))return "h";
  return "";
}
